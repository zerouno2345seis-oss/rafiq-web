function parseMed(it){
  const f=it.frequency||''; if(!f.startsWith('MED|')) return null;
  const desc=(it.description||'').split('|');
  const g=k=>{ const p=desc.find(x=>x.startsWith(k+'=')); return p? p.slice(k.length+1):''; };
  return {item:it, schedule:f.slice(4),
    start:g('start'), end:g('end'), ongoing:g('ongoing')==='1', patient:g('patient'),
    perDay:Math.max(1,Math.round((it.target_value||1))),
    scheduleAr(){ if(this.schedule.endsWith('x')) return this.schedule.slice(0,-1)+' مرات يوميًا';
      if(this.schedule.startsWith('weekly:')) return 'أيام: '+this.schedule.slice(7); return this.schedule; },
    statusAr(){ if(this.ongoing) return 'مستمر مدى الحياة';
      if(!this.end) return ''; const d=Math.ceil((new Date(this.end)-new Date())/86400000);
      return d<0?'انتهى':(d===0?'آخر يوم':('ينتهي بعد '+d+' يومًا')); },
    activeToday(){ const t=new Date().toISOString().slice(0,10);
      if(this.start&&t<this.start) return false;
      if(!this.ongoing&&this.end&&t>this.end) return false; return true; } };
}
let medsTable=false;
function ytThumb(u){ if(!u) return null; u=String(u).trim();
  let id=null;
  if(u.indexOf('youtu.be/')>=0) id=u.split('youtu.be/')[1];
  else if(u.indexOf('shorts/')>=0) id=u.split('shorts/')[1];
  else if(u.indexOf('v=')>=0) id=u.split('v=')[1];
  else if(u.indexOf('embed/')>=0) id=u.split('embed/')[1];
  if(id){ id=id.split('&')[0].split('?')[0].slice(0,11); if(id.length>=11) return 'https://img.youtube.com/vi/'+id+'/mqdefault.jpg'; }
  if(u.includes('twitter.com') || u.includes('x.com') || u.includes('fxtwitter.com') || u.includes('vxtwitter.com')){
    const m = u.match(/(?:status|statuses)\/(\d+)/);
    if(m) return 'https://d.fxtwitter.com/i/status/' + m[1] + '.jpg';
  }
  if(u.includes('vimeo.com/')){
    const m = u.match(/vimeo\.com\/(?:channels\/(?:\w+\/)?|groups\/[^\/]*\/videos\/|album\/(?:\d+\/)?video\/|video\/|)(\d+)/);
    if(m) return 'https://vumbnail.com/' + m[1] + '.jpg';
  }
  return null;
}

/* --- مساعدات مصفوفة الأسبوع والجرعات (Meds Matrix Helpers) --- */
const WEEK_DAYS_SHORT = ['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'];
const WEEK_DAYS_FULL = ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
window._medsWeekOffset = 0;

function getWeekSaturday(refDate, offset){
  const d = new Date(refDate);
  d.setDate(d.getDate() + (offset * 7));
  const daysSinceSat = (d.getDay() + 1) % 7;
  d.setDate(d.getDate() - daysSinceSat);
  d.setHours(0,0,0,0);
  return d;
}

function getWeekDays(refDate, offset){
  const sat = getWeekSaturday(refDate, offset);
  const days = [];
  for(let i = 0; i < 7; i++){
    const day = new Date(sat);
    day.setDate(sat.getDate() + i);
    days.push(day);
  }
  return days;
}

function parseDosesForMed(itemId, entries){
  return (entries || []).filter(e => e.item_id === itemId).map(e => {
    try {
      const dt = new Date(e.recorded_at);
      const isoDate = dt.toISOString().slice(0, 10);
      const h = dt.getHours(), m = dt.getMinutes();
      const ampm = h < 12 ? 'ص' : 'م';
      const h12 = (h % 12) || 12;
      const timeStr = h12 + ':' + String(m).padStart(2, '0') + ' ' + ampm;
      return { id: e.id, date: isoDate, timeStr, dt };
    } catch(ex){ return null; }
  }).filter(Boolean).sort((a,b) => a.dt - b.dt);
}

function lastDoseFormatted(doses, todayIso){
  if(!doses.length) return 'لم يُسجّل هذا الأسبوع';
  const last = doses[doses.length - 1];
  if(last.date === todayIso) return 'اليوم • ' + last.timeStr;
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  if(last.date === yest.toISOString().slice(0, 10)) return 'أمس • ' + last.timeStr;
  return last.date + ' • ' + last.timeStr;
}

async function undoLastDose(itemId){
  try {
    const todayIso = new Date().toISOString().slice(0, 10);
    const myEntries = (data.entries || []).filter(e => e.item_id === itemId && (e.recorded_at || '').startsWith(todayIso) && e.user_id === meId());
    if(!myEntries.length){ toast('لا توجد جرعة مسجلة اليوم للتراجع عنها'); return; }
    myEntries.sort((a,b) => (b.recorded_at||'').localeCompare(a.recorded_at||''));
    await rest('DELETE', 'progress_entries', 'id=eq.' + myEntries[0].id);
    await refreshAll();

  } catch(e) {
    toast('تعذر التراجع: ' + (e && e.message ? e.message : ''));
  }
}

function recurrenceOf(t){ try{ const m=(t.description||'').match(/RECUR:([a-z:0-9]+)/); return m?m[1]:null; }catch(e){ return null; } }
function cleanDesc(t){ try{ return (t.description||'').replace(/\s*\|?RECUR:[a-z:0-9]+/,'').trim()||null; }catch(e){ return t.description; } }
function recurrenceAr(r){ if(r==='daily') return 'يوميًا';
  if(r.startsWith('weekly:')) return 'كل '+['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'][+r.slice(7)];
  if(r.startsWith('monthly:')) return 'يوم '+r.slice(8)+' من كل شهر'; return r; }
function nextOccurrence(iso,recur){ try{
  let d=new Date(iso||Date.now()); const today=new Date(); today.setHours(0,0,0,0); let g=0;
  while(d<=today && g<400){ if(recur==='daily') d.setDate(d.getDate()+1);
    else if(recur.startsWith('weekly:')) d.setDate(d.getDate()+7);
    else if(recur.startsWith('monthly:')) d.setMonth(d.getMonth()+1); else d.setDate(d.getDate()+1); g++; }
  d.setHours(9,0,0,0); return d.toISOString(); }catch(e){ return null; } }
function overdueTasks(){ const now=Date.now();
  return visibleTasks().filter(t=>t.priority!=='EVENT'&&t.status!=='DONE'&&t.due_at&&new Date(t.due_at).getTime()<now); }
async function completeRecurring(t){
  try{ const recur=recurrenceOf(t); if(!recur) return; const next=nextOccurrence(t.due_at,recur);
    await rest('PATCH','tasks',{status:'DONE',completed_at:new Date().toISOString(),completed_by:meId()},'id=eq.'+t.id);
    const copy=Object.assign({},t,{id:uuid(),status:'TODO',started_at:null,completed_at:null,completed_by:null,due_at:next,created_at:new Date().toISOString()});
    await rest('POST','tasks',copy,'return=minimal');
    try{ await rest('POST','activity_events',{id:uuid(),circle_id:t.circle_id,user_id:meId(),kind:'TASK_DONE',payload:t.title}); }catch(e){}
    await refreshAll(); renderApp(); toast('أُنجزت الدورة — وجهّزت التالية 🔁');
  }catch(e){ toast('تعذر: '+(e&&e.message?e.message:'')); } }

function spaceRingSVG(pct, spaceKey){
  const r = 24, c = +(2 * Math.PI * r).toFixed(1);
  const safePct = Math.min(100, Math.max(0, Math.round(pct || 0)));
  const off = +(c * (1 - safePct / 100)).toFixed(1);
  let strokeColor = 'var(--space-me)';
  let trackColor = 'var(--space-me-soft)';
  if(spaceKey === 'shared'){
    strokeColor = 'var(--space-shared)';
    trackColor = 'var(--space-shared-soft)';
  } else if(spaceKey === 'companion'){
    strokeColor = 'var(--space-comp)';
    trackColor = 'var(--space-comp-soft)';
  }
  const isHundred = safePct >= 100;
  return `<div class="space-ring-wrap" title="نسبة الإنجاز: ${safePct}%">
    <svg width="58" height="58" viewBox="0 0 58 58">
      <circle cx="29" cy="29" r="${r}" fill="none" stroke="${trackColor}" stroke-width="5"/>
      <circle cx="29" cy="29" r="${r}" fill="none" stroke="${strokeColor}" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    </svg>
    <div class="space-ring-lbl">
      <span style="font-size:${isHundred ? '12.5px' : '14px'};font-weight:800;color:${strokeColor}">${safePct}%</span>
      <small>إنجاز</small>
    </div>
  </div>`;
}

function spaceMetricChip(icon, count, label, spaceKey){

  } else if(spaceKey === 'companion'){

  }
  return `<span class="space-stat-chip" style="background:${bg};color:${color};border-color:${border}">
    <span class="chip-ic">${icon}</span>
    <span class="chip-val">${count}</span>
    <span>${label}</span>
  </span>`;
}

window._activeMoreCategory = null;

function playNotificationSound(type){
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if(type === 'urgent'){
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.setValueAtTime(1320, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      osc.start();
      osc.stop(ctx.currentTime + 0.4);
    } else {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
      osc.start();
      osc.stop(ctx.currentTime + 0.35);
    }
  } catch(e){}
}

        </p>
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="font-size:12.5px;color:var(--accent);font-weight:700;display:inline-block;margin-bottom:8px">
          🔑 احصل على مفتاح مجاني من Google AI Studio ↗
        </a>
        <div style="display:inline-block;padding:3px 9px;border-radius:8px;background:rgba(66,133,244,0.12);color:#4285F4;font-size:11px;font-weight:700">

                <div style="display:flex;gap:6px">
                  <input type="password" id="geminiKeyInput_${idx}" value="${esc(keyVal)}" placeholder="AIza... أو AQ..."
                    style="flex:1;height:38px;border-radius:10px;border:1.5px solid var(--border);padding:0 10px;background:var(--surface);color:var(--text-1);font-family:monospace;font-size:12px">
                  <button type="button" class="mini" onclick="togglePasswordVis('geminiKeyInput_${idx}')" style="padding:0 8px" title="إظهار/إخفاء">👁</button>

  }

  const catTitles = {

    circles: '👥 الدوائر والشريك',
    data: '💾 البيانات والمحذوفات',
    appearance: '🎨 المظهر والتخصيص',
    notifications: '🔔 الإشعارات والإنذار',
    system: '⚡ النظام والاتصال',
    timeline: '🕐 خط نشاط الرفيق'
  };

  $('#view').innerHTML = `
    <div class="screen">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <button class="mini" data-act="backToMoreCategories" style="font-size:12.5px;padding:6px 12px;background:var(--surface);border:1px solid var(--border);cursor:pointer">
          ← رجوع للإعدادات
        </button>
        <h2 style="margin:0;font-size:17px;font-weight:700">${catTitles[cat] || 'الإعدادات'}</h2>
      </div>

</script>
<script>
'use strict';
/* ---------- النوافذ ---------- */
function setDisplay(id,val){ const el=document.getElementById(id); if(el&&el.style) el.style.display=val; }
function openSheet(html){ $('#sheet-root').innerHTML=`<div class="overlay" data-ov="1"><div class="sheet">${html}</div></div>`;
  $('#sheet-root .overlay').addEventListener('click',e=>{ if(e.target.dataset.ov) closeSheet(); }); }
function closeSheet(){ $('#sheet-root').innerHTML=''; }
function openPopup(html){
  $('#popup-root').innerHTML=`<div class="popup-backdrop" data-pclose="1"><div class="popup-box">${html}</div></div>`;
  const bd=$('#popup-root .popup-backdrop');
  if(bd) bd.addEventListener('click',e=>{ if(e.target.dataset.pclose) closePopup(); });
}
function closePopup(){ $('#popup-root').innerHTML=''; }

function openModal(title, html){
  openPopup(`
    <div style="padding:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;border-bottom:1px solid var(--divider);padding-bottom:8px">
        <h3 style="margin:0;font-size:16px;font-weight:700;color:var(--text-1)">${esc(title)}</h3>
        <button class="mini ghost" onclick="closePopup()" style="font-size:16px;padding:2px 8px;border-radius:50%;cursor:pointer">✕</button>
      </div>
      <div>${html}</div>
    </div>
  `);
}
function closeModal(){ closePopup(); }

function openTimePickerModal(initTime, onPick){
  let [hStr, mStr] = (initTime || '17:00').split(':');
  let selHour = parseInt(hStr || '17', 10);
  let selMin  = parseInt(mStr  || '0',  10);
  if(isNaN(selHour)) selHour = 17;
  if(isNaN(selMin))  selMin  = 0;
  selMin = Math.round(selMin / 5) * 5;
  if(selMin >= 60) selMin = 55;

  const renderContent = () => {
    const formatted = `${String(selHour).padStart(2,'0')}:${String(selMin).padStart(2,'0')}`;
    const isPM = selHour >= 12;
    const periodAr = isPM ? 'مساءً' : 'صباحاً';

    openModal('⏰ تحديد الوقت', `
      <div style="max-width:300px;margin:0 auto;text-align:center">
        <!-- عداد الوقت بنظام الصناديق: الأرقام داخل المربع ومصغر بنسبة 50% -->
        <div class="tp-wrap">
          <!-- الفترة: صباحاً / مساءً -->
          <div class="tp-period-col">
            <button class="tp-period-btn ${!isPM ? 'on' : ''}" onclick="window._tpSetPeriod(false)">صباحاً</button>
            <button class="tp-period-btn ${isPM  ? 'on' : ''}" onclick="window._tpSetPeriod(true)">مساءً</button>
          </div>

          <!-- عمود الساعة -->
          <div class="tp-col">
            <div class="tp-label">الساعة</div>
            <button class="tp-btn" onclick="window._tpAdjHour(1)">▲</button>
            <div class="tp-box" id="tpHourBox" title="مرر العجلة لتغيير الساعة">
              <span class="tp-num" id="tpHourVal">${String(selHour).padStart(2,'0')}</span>
            </div>
            <button class="tp-btn" onclick="window._tpAdjHour(-1)">▼</button>
          </div>

          <!-- نقطتا الفصل -->
          <div class="tp-colon">:</div>

          <!-- عمود الدقائق -->
          <div class="tp-col">
            <div class="tp-label">الدقيقة</div>
            <button class="tp-btn" onclick="window._tpAdjMin(5)">▲</button>
            <div class="tp-box" id="tpMinBox" title="مرر العجلة لتغيير الدقائق">
              <span class="tp-num" id="tpMinVal">${String(selMin).padStart(2,'0')}</span>
            </div>
            <button class="tp-btn" onclick="window._tpAdjMin(-5)">▼</button>
          </div>
        </div>

        <!-- أزرار سريعة للأوقات الشائعة -->
        <div class="tp-quick-row">
          <button class="tp-quick-btn" onclick="window._tpQuick('now')">الآن ⏱️</button>
          <button class="tp-quick-btn" onclick="window._tpQuick('08:00')">08:00 ص</button>
          <button class="tp-quick-btn" onclick="window._tpQuick('12:00')">12:00 م</button>
          <button class="tp-quick-btn" onclick="window._tpQuick('17:00')">05:00 م</button>
          <button class="tp-quick-btn" onclick="window._tpQuick('21:00')">09:00 م</button>
        </div>

        <!-- زرا التأكيد والإلغاء -->
        <div style="display:flex;gap:6px">
          <button class="btn full" id="tpConfirmBtn" style="padding:10px 0;font-size:13.5px;font-weight:700">تحديد (${formatted} ${periodAr}) ✓</button>
          <button class="btn ghost" onclick="closeModal()" style="padding:10px 14px">إلغاء</button>
        </div>
      </div>
    `);

    // دوال التعديل
    window._tpAdjHour = (delta) => {
      selHour = (selHour + delta + 24) % 24;
      renderContent();
    };

    window._tpAdjMin = (delta) => {
      selMin = (selMin + delta + 60) % 60;
      renderContent();
    };

    window._tpSetPeriod = (toPM) => {
      const curH = selHour % 12;
      selHour = toPM ? (curH === 0 ? 12 : curH + 12) : (curH === 0 ? 0 : curH);
      renderContent();
    };

    window._tpQuick = (timeStr) => {
      if(timeStr === 'now'){
        const n = new Date();
        selHour = n.getHours();
        selMin = Math.round(n.getMinutes() / 5) * 5;
        if(selMin >= 60) selMin = 55;
      } else {
        const parts = timeStr.split(':');
        selHour = parseInt(parts[0], 10) || 0;
        selMin = parseInt(parts[1], 10) || 0;
      }
      renderContent();
    };

    // دعم تمرير العجلة (Wheel) على الصناديق
    setTimeout(() => {
      const hBox = document.getElementById('tpHourBox');
      const mBox = document.getElementById('tpMinBox');
      if(hBox){
        hBox.onwheel = (e) => { e.preventDefault(); window._tpAdjHour(e.deltaY > 0 ? -1 : 1); };
      }
      if(mBox){
        mBox.onwheel = (e) => { e.preventDefault(); window._tpAdjMin(e.deltaY > 0 ? -5 : 5); };
      }
    }, 50);

    const confBtn = document.getElementById('tpConfirmBtn');
    if(confBtn){
      confBtn.onclick = () => {
        const finalVal = `${String(selHour).padStart(2,'0')}:${String(selMin).padStart(2,'0')}`;
        closeModal();
        if(onPick) onPick(finalVal);
      };
    }
  };

  renderContent();
}
function openDatePickerModal(initDate, onPick){
  let d = initDate ? new Date(initDate + (initDate.length === 10 ? 'T12:00:00' : '')) : new Date();
  if(isNaN(d.getTime())) d = new Date();
  let selYear = d.getFullYear();
  let selMonth = d.getMonth();
  let selDay = d.getDate();

  const monthNames = [
    'يناير (1)', 'فبراير (2)', 'مارس (3)', 'أبريل (4)', 'مايو (5)', 'يونيو (6)',
    'يوليو (7)', 'أغسطس (8)', 'سبتمبر (9)', 'أكتوبر (10)', 'نوفمبر (11)', 'ديسمبر (12)'
  ];

  const renderContent = () => {
    const firstDayIndex = new Date(selYear, selMonth, 1).getDay();
    const daysInMonth = new Date(selYear, selMonth + 1, 0).getDate();
    if(selDay > daysInMonth) selDay = daysInMonth;
    const formattedIso = `${selYear}-${String(selMonth + 1).padStart(2, '0')}-${String(selDay).padStart(2, '0')}`;
    let formattedArabic = formattedIso;
    try {
      formattedArabic = new Date(selYear, selMonth, selDay, 12).toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    } catch(e){}

    openModal('📅 اختيار الشهر واليوم', `
      <div style="text-align:center;margin-bottom:12px;background:var(--accent-verysoft);padding:10px;border-radius:12px;border:1px solid var(--accent-2)">
        <div style="font-size:15px;font-weight:800;color:var(--accent)">${formattedArabic}</div>
        <div style="font-size:11px;color:var(--text-2);margin-top:2px">${formattedIso} — اضغط لاختيار اليوم والشهر مباشرة دون كتابة</div>
      </div>

      <div style="display:flex;gap:6px;margin-bottom:12px">
        <button type="button" class="mini ghost" onclick="window._pickQuickDate(0)" style="flex:1;padding:6px 0;font-size:11.5px;border-radius:8px">اليوم</button>
        <button type="button" class="mini ghost" onclick="window._pickQuickDate(1)" style="flex:1;padding:6px 0;font-size:11.5px;border-radius:8px">غداً</button>
        <button type="button" class="mini ghost" onclick="window._pickQuickDate(7)" style="flex:1;padding:6px 0;font-size:11.5px;border-radius:8px">بعد أسبوع</button>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;background:var(--surface-2);padding:6px 10px;border-radius:10px">
        <button type="button" class="mini ghost" onclick="window._changeMonth(-1)" style="font-size:16px;font-weight:bold;padding:4px 10px;cursor:pointer">◀</button>
        <span style="font-size:13.5px;font-weight:700;color:var(--text-1)">${monthNames[selMonth]} ${selYear}</span>
        <button type="button" class="mini ghost" onclick="window._changeMonth(1)" style="font-size:16px;font-weight:bold;padding:4px 10px;cursor:pointer">▶</button>
      </div>

      <div style="display:grid;grid-template-columns:repeat(7, 1fr);gap:4px;text-align:center;margin-bottom:6px;font-size:11px;color:var(--text-3);font-weight:700">
        <div>أحد</div><div>إثنين</div><div>ثلاثاء</div><div>أربعاء</div><div>خميس</div><div>جمعة</div><div>سبت</div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(7, 1fr);gap:4px;text-align:center;margin-bottom:14px">
        ${Array.from({length: firstDayIndex}, () => `<div style="padding:6px 0"></div>`).join('')}
        ${Array.from({length: daysInMonth}, (_, i) => {
          const dayNum = i + 1;
          const isSelected = (dayNum === selDay);
          return `<button type="button" class="mini ${isSelected ? 'primary' : 'ghost'}" onclick="window._pickDay(${dayNum})" style="padding:7px 0;font-size:12px;font-weight:${isSelected?'800':'500'};border-radius:8px;background:${isSelected?'var(--accent)':'var(--surface-1)'};color:${isSelected?'#fff':'var(--text-1)'};border:1px solid ${isSelected?'var(--accent)':'var(--border)'}">${dayNum}</button>`;
        }).join('')}
      </div>

      <div style="display:flex;gap:8px">
        <button class="btn full" onclick="window._confirmDateSelection()" style="font-weight:700">تحديد التاريخ (${formattedIso}) ✓</button>
        <button class="btn ghost" onclick="closeModal()">إلغاء</button>
      </div>
    `);

    window._changeMonth = (delta) => {
      selMonth += delta;
      if(selMonth < 0){ selMonth = 11; selYear--; }
      else if(selMonth > 11){ selMonth = 0; selYear++; }
      const maxDays = new Date(selYear, selMonth + 1, 0).getDate();
      if(selDay > maxDays) selDay = maxDays;
      renderContent();
    };

    window._pickDay = (dayNum) => {
      selDay = dayNum;
      renderContent();
    };

    window._pickQuickDate = (daysFromNow) => {
      const target = new Date();
      target.setDate(target.getDate() + daysFromNow);
      selYear = target.getFullYear();
      selMonth = target.getMonth();
      selDay = target.getDate();
      renderContent();
    };

    window._confirmDateSelection = () => {
      const finalIso = `${selYear}-${String(selMonth + 1).padStart(2, '0')}-${String(selDay).padStart(2, '0')}`;
      closeModal();
      if(onPick) onPick(finalIso);
    };
  };

  renderContent();
}

document.addEventListener('click', (e) => {
  const timeInp = e.target.closest('input[type="time"]');
  if(timeInp){
    e.preventDefault();
    timeInp.blur();
    openTimePickerModal(timeInp.value, (val) => {
      timeInp.value = val;
      timeInp.dispatchEvent(new Event('input', { bubbles: true }));
      timeInp.dispatchEvent(new Event('change', { bubbles: true }));
    });
    return;
  }
  const dateInp = e.target.closest('input[type="date"]');
  if(dateInp && !dateInp.classList.contains('native-date')){
    e.preventDefault();
    dateInp.blur();
    openDatePickerModal(dateInp.value, (val) => {
      dateInp.value = val;
      dateInp.dispatchEvent(new Event('input', { bubbles: true }));
      dateInp.dispatchEvent(new Event('change', { bubbles: true }));
    });
    return;
  }
});

/* ---------- المنبه الداخلي للتطبيق (Web In-App Alarm & Chime) ---------- */
function getWebInAppAlarm(){
  try {
    const raw = localStorage.getItem('rafiq_web_inapp_alarm');
    if(!raw) return { time: '17:00', label: 'تذكير داخلي مهم ⏰', enabled: false };
    return JSON.parse(raw);
  } catch(e){
    return { time: '17:00', label: 'تذكير داخلي مهم ⏰', enabled: false };
  }
}

function saveWebInAppAlarm(obj){
  try {
    localStorage.setItem('rafiq_web_inapp_alarm', JSON.stringify(obj));
  } catch(e){}
}

let lastWebAlarmFiredTime = null;
function checkWebInAppAlarm(){
  const alarm = getWebInAppAlarm();
  if(!alarm || !alarm.enabled) return;
  const now = new Date();
  const curTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  if(curTime === alarm.time && lastWebAlarmFiredTime !== curTime){
    lastWebAlarmFiredTime = curTime;
    triggerWebInAppAlarm(alarm);
  }
}

function triggerWebInAppAlarm(alarm){
  try {
    const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    audio.play().catch(()=>{});
  } catch(e){}
  if(navigator.vibrate) try { navigator.vibrate([300, 100, 300, 100, 300]); } catch(e){}

  openPopup(`
    <div style="padding:16px;text-align:center">
      <div style="font-size:42px;margin-bottom:8px">⏰</div>
      <h3 style="font-size:18px;font-weight:800;color:var(--text-1);margin:0 0 6px">المنبه الداخلي للتطبيق</h3>
      <p style="font-size:13.5px;color:var(--text-2);margin:0 0 12px">حان وقت المنبه المحدد (${esc(alarm.time)})</p>
      <div style="background:var(--accent-verysoft);border:1px solid var(--accent);border-radius:12px;padding:10px;font-size:14px;font-weight:700;color:var(--accent);margin-bottom:14px">
        ${esc(alarm.label || 'تذكير داخلي')}
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn full" onclick="closePopup();toast('تم إيقاف المنبه ✓');" style="font-weight:700">إيقاف المنبه ✓</button>
        <button class="btn ghost" onclick="snoozeWebInAppAlarm()" style="flex-shrink:0">تأجيل 5 د ⏳</button>
      </div>
    </div>
  `);
}

function snoozeWebInAppAlarm(){
  closePopup();
  const alarm = getWebInAppAlarm();
  const d = new Date(Date.now() + 5 * 60000);
  const newTime = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  alarm.time = newTime;
  saveWebInAppAlarm(alarm);
  toast(`تم تأجيل المنبه إلى ${newTime} ⏳`);
}

setInterval(checkWebInAppAlarm, 5000);
function sheetHead(t){ return `<div class="sheet-head"><h3>${esc(t)}</h3><button class="sheet-x" data-act="closeSheet">✕</button></div>`; }
function visWrap(id, sel, circle){
  return `<div id="${id}">${visOptions(sel, circle)}</div>`;
}
function visOptions(sel,circle){
  const opts=[['PRIVATE','🔒 خاص بي','يراه صاحبه فقط'],['CIRCLE','👥 كل الدائرة',circle?'يراه جميع أعضاء «'+circle.circle.name+'»':'يراه الجميع في دائرتك'],['SELECTED_MEMBERS','@ أشخاص محددون','يراه من تختاره فقط']];
  return opts.map(([v,t,d])=>`<button class="vis-opt ${sel===v?'on':''}" data-act="pickVis" data-v="${v}">
    <span style="flex:1"><span class="vt">${t}</span><br><span class="vd">${d}</span></span>${sel===v?'<span style="color:var(--accent)">✓</span>':''}</button>`).join('');
}

function openItemSpaceMenu(type, itemId){
  let rawItem = null, title = '', curSpace = 'shared';
  const me = meId();
  const comps = allCompanions();
  const compName = comps.length ? (comps[0].display_name || 'رفيقي') : 'رفيقي';

  if(type === 'task'){
    rawItem = (data.tasks||[]).find(t => t.id === itemId);
    if(rawItem){ title = rawItem.title; curSpace = getItemSpace('task', rawItem); }
  } else if(type === 'habit' || type === 'item'){
    rawItem = (data.items||[]).find(i => i.id === itemId);
    if(rawItem){ title = rawItem.title; curSpace = getItemSpace('habit', rawItem); }
  } else if(type === 'med'){
    const m = (medsOf()||[]).find(x => x.item.id === itemId);
    if(m){ rawItem = m.item; title = m.item.title; curSpace = getItemSpace('med', m); }
  } else {
    rawItem = (data.shopping||[]).find(s => s.id === itemId);
    if(rawItem){ title = rawItem.title; curSpace = getItemSpace(type, rawItem); }

async function setItemSpaceAction(type, id, space, chosenCompId){
  try{
    const me = meId();
    const comps = allCompanions();
    const targetCompId = chosenCompId || (comps[0] ? comps[0].id : null);
    const sh = sharedFirst();
    const pers = circlesOf().find(c => c.circle.type === 'PERSONAL');

    if(type === 'task'){
      if(space === 'me'){
        const pCid = pers ? pers.circle.id : (data.tasks.find(t=>t.id===id)||{}).circle_id;
        await rest('PATCH', 'tasks', { visibility: 'PRIVATE', assigned_to: me, circle_id: pCid || undefined, updated_at: nowIso() }, 'id=eq.' + id);
      } else if(space === 'shared'){
        const sCid = sh ? sh.circle.id : (data.tasks.find(t=>t.id===id)||{}).circle_id;
        await rest('PATCH', 'tasks', { visibility: 'CIRCLE', assigned_to: null, circle_id: sCid || undefined, updated_at: nowIso() }, 'id=eq.' + id);
      } else if(space === 'companion'){
        const sCid = sh ? sh.circle.id : (data.tasks.find(t=>t.id===id)||{}).circle_id;
        await rest('PATCH', 'tasks', { visibility: 'CIRCLE', assigned_to: targetCompId, circle_id: sCid || undefined, updated_at: nowIso() }, 'id=eq.' + id);
      }
    } else if(type === 'habit' || type === 'item'){
      if(space === 'me'){
        const pCid = pers ? pers.circle.id : (data.items.find(i=>i.id===id)||{}).circle_id;
        await rest('PATCH', 'items', { visibility: 'PRIVATE', circle_id: pCid || undefined }, 'id=eq.' + id);
      } else if(space === 'shared'){
        const sCid = sh ? sh.circle.id : (data.items.find(i=>i.id===id)||{}).circle_id;
        await rest('PATCH', 'items', { visibility: 'CIRCLE', circle_id: sCid || undefined }, 'id=eq.' + id);
      } else if(space === 'companion'){
        const sCid = sh ? sh.circle.id : (data.items.find(i=>i.id===id)||{}).circle_id;
        await rest('PATCH', 'items', { visibility: 'SELECTED_MEMBERS', circle_id: sCid || undefined }, 'id=eq.' + id);
        if(targetCompId){
          try{ await rest('POST', 'item_recipients', { id: uuid(), item_id: id, user_id: targetCompId }, 'return=minimal'); }catch(e){}
        }
      }
    } else if(type === 'med'){
      const m = (medsOf()||[]).find(x => x.item.id === id);
      const raw = m ? m.item : (data.items||[]).find(i=>i.id===id);
      if(raw){
        let desc = raw.description || '';
        const patVal = space === 'companion' ? 'companion' : (space === 'shared' ? 'both' : 'me');
        if(desc.includes('patient=')){
          desc = desc.replace(/patient=[a-zA-Z0-9_]+/g, 'patient=' + patVal);
        } else {
          desc = desc ? (desc + '|patient=' + patVal) : ('patient=' + patVal);
        }
        const visVal = space === 'me' ? 'PRIVATE' : 'CIRCLE';
        await rest('PATCH', 'items', { description: desc, visibility: visVal }, 'id=eq.' + id);
      }
    } else {
      // shopping, food, dish, place, media, shared_list_item
      const raw = (data.shopping||[]).find(s => s.id === id);
      let note = (raw && raw.note) || '';
      note = note.replace(/\|?SPACE:(me|shared|companion(:[a-zA-Z0-9_-]+)?)/g, '').trim();

      if(space === 'me'){
        const newNote = note ? (note + '|SPACE:me') : 'SPACE:me';
        await rest('PATCH', 'shared_list_items', { assigned_to: me, note: newNote }, 'id=eq.' + id);
      } else if(space === 'shared'){
        const newNote = note ? (note + '|SPACE:shared') : 'SPACE:shared';
        await rest('PATCH', 'shared_list_items', { assigned_to: null, note: newNote }, 'id=eq.' + id);
      } else if(space === 'companion'){
        const newNote = note ? (note + '|SPACE:companion' + (targetCompId ? (':' + targetCompId) : '')) : ('SPACE:companion' + (targetCompId ? (':' + targetCompId) : ''));
        await rest('PATCH', 'shared_list_items', { assigned_to: targetCompId, note: newNote }, 'id=eq.' + id);
      }
    }

    closeSheet();
    await refreshAll();
    renderApp();
    const lbl = space === 'me' ? 'خاص بي 🟢' : (space === 'shared' ? 'مشترك بيننا 🔵' : 'خاص برفيقي 🟠');
    toast('تم تعيين العنصر: ' + lbl);
  } catch(e) {
    toast('تعذر تحديث المساحة: ' + (e && e.message ? e.message : ''));
  }
}

async function quickAddTask(){
  const inp = $('#quickTaskIn');
  const title = ((inp && inp.value) || '').trim();
  if(!title){ toast('اكتب عنوان المهمة'); return; }
  try {
    const me = meId();
    const pers = circlesOf().find(c => c.circle.type === 'PERSONAL');
    const sh = sharedFirst();
    const cid = pers ? pers.circle.id : (sh ? sh.circle.id : null);
    if(!cid){ toast('تحتاج دائرة أولاً'); return; }
    const spF = window._homeSpaceFilter || 'all';
    let vis = 'PRIVATE', assigned = me;
    if(spF === 'shared'){ vis = 'CIRCLE'; assigned = null; }
    else if(spF === 'companion'){
      vis = 'CIRCLE';
      const comps = allCompanions();
      assigned = comps.length ? comps[0].id : null;
    }
    await rest('POST', 'tasks', {
      id: uuid(),
      owner_id: me,
      circle_id: (vis === 'CIRCLE' && sh) ? sh.circle.id : cid,
      title: title,
      visibility: vis,
      assigned_to: assigned,
      status: 'TODO',
      created_at: nowIso(),
      updated_at: nowIso()
    }, 'return=minimal');
    inp.value = '';
    await refreshAll();
    renderApp();
    toast('أُضيفت المهمة بنجاح ✓');
  } catch(e) {
    toast('تعذر الإضافة: ' + (e && e.message ? e.message : ''));
  }
}

async function saveTask(){
  const title=$('#tTitle').value.trim(); if(!title){ toast('اكتب العنوان'); return; }
  try{
    const recips=[...document.querySelectorAll('.memcb:checked')].map(c=>c.value);
    const due=$('#tDue').value?new Date($('#tDue').value+'T12:00:00').toISOString():null;
    const me=meId();
    let circleId=window._taskCircle;
    if(circleId==='personal'){ const p=circlesOf().find(c=>c.circle.type==='PERSONAL'); circleId=p?p.circle.id:null; }
    if(!circleId){ toast('لا توجد دائرة متاحة'); return; }
    const row={id:uuid(),owner_id:me,circle_id:circleId,title,description:$('#tDesc').value.trim()||null,
      visibility:window._visSel,assigned_to:$('#tAssign')?($('#tAssign').value||null):null,status:'TODO',due_at:due,
      recipients:window._visSel==='SELECTED_MEMBERS'?(recips.length?recips:[otherId()]):null,created_at:nowIso(),updated_at:nowIso()};
    await rest('POST','tasks',row,'return=minimal');
    closeSheet(); await refreshAll(); renderApp(); toast('أُضيفت المهمة ✓');
  }catch(e){ toast(friendly(e)); }
}

function openAddHabit(){

  const targetSpace = window._addMenuTargetSpace || 'me';
  let initCircle = 'personal';
  let initVis = 'PRIVATE';
  if(targetSpace === 'shared' && s){
    initCircle = s.circle.id;
    initVis = 'CIRCLE';
  }

  let catKey = 'QURAN';
  let curCat = HABIT_CATEGORIES[catKey];
  let curMode = curCat.defaultMode;
  let curTarget = curCat.defaultTarget;
  let curUnit = curCat.defaultUnit;

  window._hCat = catKey;
  window._hType = curCat.type;
  window._hMode = curMode;
  window._hCircle = initCircle;
  window._visSel = initVis;

  function renderSheetContent(){
    curCat = HABIT_CATEGORIES[window._hCat] || HABIT_CATEGORIES.CUSTOM;
    const isBin = window._hMode === 'BINARY';
    const isTime = window._hMode === 'TIME';
    const isQuant = window._hMode === 'QUANTITY';
    const titleVal = ($('#hTitle') ? $('#hTitle').value : '') || '';
    const sp = (window._hCircle === 'personal' || window._visSel === 'PRIVATE') ? 'me' : 'shared';
    const sm = spaceMeta(sp);

    const modeGoalText = isBin ? 'إنجاز يومي مباشر (تم / لم يتم)' : (isTime ? `${curTarget} دقيقة يوميًا` : `${curTarget} ${curUnit||'مرات'} يوميًا`);

    return `
      <!-- 1. بطاقة المعاينة الحية -->
      <div class="card" style="background:${sm.bg};border:1.5px solid ${sm.color}60;padding:12px;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:42px;height:42px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid var(--border)">
            ${curCat.emoji}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:15px;font-weight:700;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
              ${esc(titleVal || 'اسم العادة / الهدف')}
            </div>
            <div style="display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11.5px;color:var(--text-2)">
              ${spaceBadgeDot(sp)}
              <span>•</span>
              <span style="font-weight:600;color:var(--accent-dark)">${modeGoalText}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 2. فئات العادات الـ 7 -->
      <div class="field">
        <label>اختر القسم المناسب</label>
        <div class="chips" id="hCatChips" style="overflow-x:auto;padding-bottom:4px;scrollbar-width:none">
          ${Object.values(HABIT_CATEGORIES).map(c => `
            <button type="button" class="chip ${window._hCat===c.id?'on':''}" data-cat="${c.id}" style="white-space:nowrap;padding:6px 12px">
              ${c.emoji} ${c.title}
            </button>
          `).join('')}
        </div>
      </div>

      <!-- 3. النماذج السريعة المقترحة -->
      ${curCat.presets && curCat.presets.length ? `
        <div style="margin-bottom:12px">
          <div style="font-size:11.5px;font-weight:700;color:var(--text-3);margin-bottom:5px">💡 نماذج شائعة بنقرة واحدة:</div>
          <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none">
            ${curCat.presets.map((pr, idx) => `
              <button type="button" class="chip" data-preset="${idx}" style="font-size:11px;padding:4px 10px;background:var(--surface-2);border-color:var(--border)">
                ${esc(pr.t)}
              </button>
            `).join('')}
          </div>
        </div>
      ` : ''}

      <!-- 4. حقل الاسم -->
      <div class="field">
        <label>اسم العادة أو الهدف</label>
        <input id="hTitle" value="${esc(titleVal)}" placeholder="${curCat.hint}">
      </div>

      <!-- 5. نمط التتبع (3 أنماط) -->
      <div class="field">
        <label>طريقة التتبع</label>
        <div style="display:flex;gap:8px">
          <button type="button" class="chip ${isBin?'on':''}" data-mode="BINARY" style="flex:1;text-align:center;padding:8px 4px;font-size:12px;font-weight:600">
            ✅ إنجاز مباشر
          </button>
          <button type="button" class="chip ${isQuant?'on':''}" data-mode="QUANTITY" style="flex:1;text-align:center;padding:8px 4px;font-size:12px;font-weight:600">
            🔢 عدّاد كمي
          </button>
          <button type="button" class="chip ${isTime?'on':''}" data-mode="TIME" style="flex:1;text-align:center;padding:8px 4px;font-size:12px;font-weight:600">
            ⏱️ مدة زمنية
          </button>
        </div>
      </div>

      <!-- 6. تفاصيل الهدف والوحدة حسب النمط -->
      ${!isBin ? `
        <div style="background:var(--surface-2);padding:10px 12px;border-radius:12px;border:1px solid var(--border);margin-bottom:12px">
          ${isTime ? `
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
              <span style="font-size:12.5px;font-weight:700">المدة اليومية بالدقائق:</span>
              <div style="display:flex;align-items:center;gap:8px">
                <button type="button" class="mini" data-time-step="-5" style="width:30px;height:30px;font-weight:bold">-5</button>
                <b id="timeValDisplay" style="font-size:16px;color:var(--accent-dark);min-width:40px;text-align:center">${curTarget} د</b>
                <button type="button" class="mini" data-time-step="+5" style="width:30px;height:30px;font-weight:bold">+5</button>
              </div>
            </div>
            <div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none">
              ${[10,15,20,30,45,60].map(m => `
                <button type="button" class="mini ghost ${curTarget===m?'on':''}" data-set-time="${m}" style="flex:1;padding:4px 0;font-size:11px">${m} د</button>
              `).join('')}
            </div>
          ` : `
            <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
              <div style="flex:1">
                <label style="font-size:11px;color:var(--text-3);display:block;margin-bottom:2px">الهدف اليومي</label>
                <div style="display:flex;align-items:center;gap:6px">
                  <button type="button" class="mini" data-quant-step="-1" style="width:28px;height:28px;font-weight:bold">-</button>
                  <input id="hTarget" type="number" value="${curTarget}" min="1" style="flex:1;text-align:center;font-weight:700;height:36px">
                  <button type="button" class="mini" data-quant-step="+1" style="width:28px;height:28px;font-weight:bold">+</button>
                </div>
              </div>
              <div style="flex:1">
                <label style="font-size:11px;color:var(--text-3);display:block;margin-bottom:2px">الوحدة</label>
                <input id="hUnit" value="${esc(curUnit)}" placeholder="مثال: صفحات" style="height:36px">
              </div>
            </div>
            <div style="display:flex;gap:5px;flex-wrap:wrap">
              ${['صفحة', 'كوب', 'خطوة', 'مرة', 'حزب', 'جزء'].map(u => `
                <button type="button" class="chip mini" data-set-unit="${u}" style="font-size:10.5px;padding:2px 8px">${u}</button>
              `).join('')}
            </div>
          `}

      <!-- 7. الدائرة ومن يراها -->
      <div class="field"><label>الدائرة</label><div class="chips" id="hCircle">
        <button class="chip ${window._hCircle==='personal'?'on':''}" data-c="personal">مساحتي الخاصة</button>
        ${s?`<button class="chip ${window._hCircle===s.circle.id?'on':''}" data-c="${s.circle.id}">${esc(s.circle.name)}</button>`:''}</div></div>
      <div class="field"><label>من يراها؟</label>${visWrap('hVis',window._visSel,window._hCircle==='personal'?null:s)}</div>

      <button class="btn" data-act="saveHabit" style="margin-top:10px">إضافة العادة</button>
    `;
  }

  openSheet(sheetHead('🌱 عادة / هدف جديد') + `<div id="habitSheetBody">${renderSheetContent()}</div>`);

  function bindEvents(){
    const body = $('#habitSheetBody');
    if(!body) return;

    body.addEventListener('click', e => {
      // تغيير القسم
      const catBtn = e.target.closest('[data-cat]');
      if(catBtn){
        window._hCat = catBtn.dataset.cat;
        const nc = HABIT_CATEGORIES[window._hCat] || HABIT_CATEGORIES.CUSTOM;
        window._hType = nc.type;
        window._hMode = nc.defaultMode;
        curTarget = nc.defaultTarget;
        curUnit = nc.defaultUnit;
        body.innerHTML = renderSheetContent();
        bindEvents();
        return;
      }

      // اختيار نموذج سريع
      const prBtn = e.target.closest('[data-preset]');
      if(prBtn){
        const pr = curCat.presets[parseInt(prBtn.dataset.preset, 10)];
        if(pr){
          const titleInp = $('#hTitle');
          if(titleInp) titleInp.value = pr.t;
          window._hMode = pr.m;
          curTarget = pr.v;
          curUnit = pr.u;
          body.innerHTML = renderSheetContent();
          bindEvents();
        }
        return;
      }

      // نمط التتبع
      const modeBtn = e.target.closest('[data-mode]');
      if(modeBtn){
        window._hMode = modeBtn.dataset.mode;
        if(window._hMode === 'TIME'){ curUnit = 'دقيقة'; if(!curTarget || curTarget < 5) curTarget = 15; }
        else if(window._hMode === 'BINARY'){ curTarget = 1; curUnit = ''; }
        else if(window._hMode === 'QUANTITY'){ if(!curTarget || curTarget === 1) curTarget = curCat.defaultTarget || 10; if(!curUnit) curUnit = curCat.defaultUnit || 'مرة'; }
        body.innerHTML = renderSheetContent();
        bindEvents();
        return;
      }

      // Stepper الوقت
      const timeStep = e.target.closest('[data-time-step]');
      if(timeStep){
        const step = parseInt(timeStep.dataset.timeStep, 10);
        curTarget = Math.max(5, (curTarget || 15) + step);
        const td = $('#timeValDisplay');
        if(td) td.textContent = curTarget + ' د';
        return;
      }
      const setTimeBtn = e.target.closest('[data-set-time]');
      if(setTimeBtn){
        curTarget = parseInt(setTimeBtn.dataset.setTime, 10);
        body.innerHTML = renderSheetContent();
        bindEvents();
        return;
      }

      // Stepper الكمية
      const quantStep = e.target.closest('[data-quant-step]');
      if(quantStep){
        const step = parseInt(quantStep.dataset.quantStep, 10);
        const inp = $('#hTarget');
        if(inp){
          curTarget = Math.max(1, (parseInt(inp.value, 10) || 1) + step);
          inp.value = curTarget;
        }
        return;
      }
      const setUnitBtn = e.target.closest('[data-set-unit]');
      if(setUnitBtn){
        curUnit = setUnitBtn.dataset.setUnit;
        const inp = $('#hUnit');
        if(inp) inp.value = curUnit;
        return;
      }

      // الدائرة
      const circBtn = e.target.closest('[data-c]');
      if(circBtn && circBtn.closest('#hCircle')){
        window._hCircle = circBtn.dataset.c;
        $('#hCircle').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === circBtn));
        $('#hVis').innerHTML = visOptions(window._visSel, window._hCircle === 'personal' ? null : s);
        return;
      }

      // الرؤية
      const visBtn = e.target.closest('[data-act=pickVis]');
      if(visBtn && visBtn.closest('#hVis')){
        window._visSel = visBtn.dataset.v;
        $('#hVis').innerHTML = visOptions(window._visSel, window._hCircle === 'personal' ? null : s);
        return;
      }
    });

    const titleInp = $('#hTitle');
    if(titleInp){
      titleInp.addEventListener('input', () => {
        // live preview title
      });
    }
  }

  bindEvents();
}

async function saveHabit(){
  const title = ($('#hTitle') ? $('#hTitle').value : '').trim();
  if(!title){ toast('اكتب اسم العادة أو الهدف أولاً'); return; }
  try{
    const me = meId();
    let circleId = window._hCircle;
    if(circleId === 'personal'){ const p = circlesOf().find(c => c.circle.type === 'PERSONAL'); circleId = p ? p.circle.id : null; }
    if(!circleId){ toast('لا توجد دائرة متاحة'); return; }
    const recips = [...document.querySelectorAll('.memcb:checked')].map(c => c.value);
    const isBin = window._hMode === 'BINARY';
    const isTime = window._hMode === 'TIME';
    const targetVal = isBin ? 1 : Math.max(1, parseFloat($('#hTarget') ? $('#hTarget').value : (isTime ? '15' : '10')) || 1);
    const unitVal = isBin ? null : (isTime ? 'دقيقة' : (($('#hUnit') ? $('#hUnit').value.trim() : '') || 'مرات'));

    const row = {
      id: uuid(),
      owner_id: me,
      circle_id: circleId,
      type: window._hType || 'HABIT',
      title: title,
      visibility: window._visSel,
      unit: unitVal,
      target_value: targetVal,
      frequency: 'DAILY',
      status: 'ACTIVE',
      created_at: nowIso()
    };
    await rest('POST', 'items', row, 'return=minimal');
    if(window._visSel === 'SELECTED_MEMBERS' && recips.length){
      for(const r of recips){
        await rest('POST', 'item_recipients', { id: uuid(), item_id: row.id, user_id: r }, 'return=minimal');
      }
    }
    closeSheet();
    await refreshAll();
    renderApp();
    toast('أُضيفت بنجاح ✓');
  } catch(e){ toast(friendly(e)); }
}
async function incHabit(id){
  const item=data.items.find(i=>i.id===id); if(!item) return;
  const amount=prompt('كم تريد إضافة إلى «'+item.title+'»؟ (الوحدة: '+(item.unit||'')+')','1');
  if(amount==null) return; const n=parseFloat(amount); if(!n||n<=0) return;
  try{ await rest('POST','progress_entries',{id:uuid(),item_id:id,user_id:meId(),value:n,unit:item.unit,recorded_at:nowIso()},'return=minimal');
    if(item.target_value&&n>=(+item.target_value)){ logAct(item.circle_id,'ITEM_COMPLETED',item.title); await logHabitInTracker(item); }
    await refreshAll(); renderApp(); toast('سُجل التقدم ✓');
  }catch(e){ toast(friendly(e)); }
}
async function binHabit(id,on){
  const item=data.items.find(i=>i.id===id); if(!item) return;
  try{
    if(on) await rest('POST','progress_entries',{id:uuid(),item_id:id,user_id:meId(),value:item.target_value||1,unit:item.unit,recorded_at:nowIso()},'return=minimal');
    else await rest('DELETE','progress_entries',null,null).catch(()=>{});
    if(on){ logAct(item.circle_id,'ITEM_COMPLETED',item.title); await logHabitInTracker(item); }
    await refreshAll(); renderApp();
  }catch(e){ toast(friendly(e)); }
}

/* ── تسجيل إتمام العادة في متتبع الأنشطة تلقائياً ── */
async function logHabitInTracker(item) {
  try {
    if (!item) return;
    const trk = getTrackerData();
    // تحقق: لا تُسجَّل مرتين في اليوم الواحد
    const today = new Date().toISOString().slice(0, 10);
    const alreadyLogged = (trk.entries || []).some(e =>
      e.note && e.note.includes('habit:' + item.id) &&
      (e.loggedAt || '').startsWith(today)
    );
    if (alreadyLogged) return;
    // أضف فئة للعادة في المتتبع إذا لم تكن موجودة
    let catId = (trk.categories || []).find(c => c.id === ('habit_' + item.id))?.id;
    if (!catId) {
      catId = 'habit_' + item.id;
      const cat = {
        id: catId,
        name: item.title,
        color: '#22c55e',
        icon: '🌱',
        unit: item.unit || 'مرة',
        goal: item.target_value || 1
      };
      trk.categories = trk.categories || [];
      trk.categories.push(cat);
    }
    // سجّل النشاط
    const now = new Date();
    const entry = {
      id: uuid(),
      categoryId: catId,
      loggedAt: now.toISOString(),
      startTime: String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0'),
      endTime: null,
      value: item.target_value || 1,
      note: 'habit:' + item.id,
      mood: null
    };
    trk.entries = trk.entries || [];
    trk.entries.push(entry);
    saveTrackerData(trk);
    // مزامنة مع السحابة
    try {
      await rest('POST', 'tracker_entries', _entryToRow(entry), 'return=minimal');
    } catch(e) { /* سيُزامن لاحقاً */ }
  } catch(e) { console.warn('[habitTracker]', e); }
}

  {id:uuid(),circle_id:circleId,user_id:meId(),kind,payload:payload||'',created_at:nowIso()},'return=minimal'); }catch(e){} }
async function addShop(){
  const inp=$('#shopIn'); if(!inp) return;
  const v=inp.value.trim(); if(!v) return;
  try{
    let targetListId = inp.dataset.list;
    if(!targetListId || targetListId === 'undefined'){
      const stores = getStoreLists();
      targetListId = (window._activeStoreTab && window._activeStoreTab !== 'ALL') ? window._activeStoreTab : (stores[0] ? stores[0].id : null);
      if(!targetListId){
        const sh = sharedFirst();
        const cid = sh ? sh.circle.id : ((data.circles||[]).find(c=>c.circle.type==='PERSONAL')||{}).circle?.id;
        const nl = await ensureList('عام', cid);
        targetListId = nl.id;
      }
    }
    await rest('POST','shared_list_items',{id:uuid(),list_id:targetListId,title:v,completed:false},'return=minimal');
    const list=data.sharedLists.find(l=>l.id===targetListId);
    if(list) logAct(list.circle_id,'SHOP_ADDED',v);
    inp.value='';
    await refreshAll(); renderApp(); toast('أُضيف ✓'); }catch(e){ toast(friendly(e)); }
}
async function toggleShop(id){
  const it=data.shopping.find(i=>i.id===id); if(!it) return;
  try{
    if(it.completed) await rest('PATCH','shared_list_items',{completed:false,completed_by:null,completed_at:null},'id=eq.'+id);
    else await rest('PATCH','shared_list_items',{completed:true,completed_by:meId(),completed_at:nowIso()},'id=eq.'+id);
    await refreshAll(); renderApp();
  }catch(e){ toast(friendly(e)); }
}
/* ---------- الدوائر + الدعوة (رمز + رابط + QR) ---------- */
function joinUrl(code){
  try{ if(location.protocol.startsWith('http')) return location.origin+location.pathname+'?join='+encodeURIComponent(code); }catch(e){}
  return code;
}
function openCreateCircle(){
  openSheet(sheetHead('إنشاء دائرة مشتركة')+`
    <div class="field"><label>اسم الدائرة</label><input id="cName" placeholder="مثال: بيتنا"></div>
    <p style="font-size:13px;color:var(--text-2);margin-bottom:12px">بعد الإنشاء ستحصل على رمز دعوة صالح 7 أيام مع رابط وQR — شاركهما مع من تحب.</p>
    <button class="btn" data-act="doCreateCircle">إنشاء</button>`);
}
async function doCreateCircle(){
  const name=$('#cName').value.trim(); if(!name){ toast('اكتب الاسم'); return; }
  try{
    const me=meId(); const cid=uuid();
    await rest('POST','circles',{id:cid,owner_id:me,name,type:'SHARED'},'return=minimal');
    await rest('POST','circle_members',{id:uuid(),circle_id:cid,user_id:me,role:'OWNER'},'return=minimal');
    await rest('POST','shared_lists',{id:uuid(),owner_id:me,circle_id:cid,title:'مشتريات البيت',visibility:'CIRCLE'},'return=minimal');
    const inv=await rest('POST','circle_invites',{id:uuid(),circle_id:cid,code:genCode(),created_by:me,expires_at:daysAgoIso(-7),revoked:false},'return=representation');
    await logAct(cid,'CIRCLE_CREATED',name);
    await refreshAll(); closeSheet(); view='more'; renderApp();
    showInvite(name,inv[0].code);
  }catch(e){ toast(friendly(e)); }
}
function genCode(){ return (''+Math.floor(Math.random()*1000000)).padStart(6,'0'); }
function showInvite(name,code){
  const url=joinUrl(code);
  let qr=''; try{ qr=QR.build(url.startsWith('http')?url:'https://rafiq.app/join/'+code); }catch(e){ try{ qr=QR.build(code); }catch(e2){} }
  openSheet(sheetHead('دعوة إلى «'+name+'»')+`
    <div style="text-align:center">${qr?`<div class="qr">${qr}</div>`:''}
    <div style="font-size:26px;font-weight:800;letter-spacing:3px;margin:10px 0;direction:ltr">${esc(code)}</div>
    <div style="font-size:12px;color:var(--text-3);margin-bottom:6px">صالح 7 أيام • قابل للإبطال</div>
    <div style="margin-bottom:10px;word-break:break-all"><a href="${esc(url)}" target="_blank">${esc(url)}</a></div>
    <button class="btn ghost" data-act="copyLink" data-v="${esc(url)}">📋 نسخ رابط الدعوة</button>
    <div style="height:8px"></div>
    <p style="font-size:12.5px;color:var(--text-2)">يمكن لرفيقك مسح QR من كاميرا الهاتف، أو فتح الرابط، أو إدخال الرمز يدويًا — كلها تنضم لنفس الدائرة.</p></div>`);
}

  catch(e){ toast('انسخ يدويًا: '+url); }
}
function openJoinSheet(prefill){
  const pre=(prefill||'').replace(/[^0-9]/g,'').slice(0,6);
  openSheet(sheetHead('الانضمام برمز أو رابط أو QR')+`
    <p style="font-size:13px;color:var(--text-2);margin-bottom:10px">أدخل رمز الدعوة المكوَّن من 6 أرقام:</p>
    <div class="otp" id="otp" style="direction:ltr">${[0,1,2,3,4,5].map(i=>`<input class="otp-b" id="ob${i}" maxlength="1" inputmode="numeric" autocomplete="one-time-code" value="${pre[i]||''}">`).join('')}</div>
    <button class="btn" data-act="doJoin" style="margin-top:14px">انضمام</button>
    <p style="font-size:12.5px;color:var(--text-2);margin-top:10px">أو امسح رمز QR من كاميرا هاتفك، أو افتح رابط الدعوة — كلها تنضم لنفس الدائرة.</p>`);
  setupOtp();
  if(pre.length===6) setTimeout(()=>doJoin(),300);

function setupOtp(){
  const boxes=[...document.querySelectorAll('.otp-b')];
  boxes.forEach((b,i)=>{
    b.addEventListener('input',()=>{ b.value=b.value.replace(/[^0-9]/g,'').slice(-1);
      if(b.value&&i<5) boxes[i+1].focus();
      if(boxes.every(x=>x.value)) doJoin(); });
    b.addEventListener('keydown',e=>{ if(e.key==='Backspace'&&!b.value&&i>0) boxes[i-1].focus(); });
    b.addEventListener('paste',e=>{ e.preventDefault();
      const d=(e.clipboardData.getData('text')||'').replace(/[^0-9]/g,'').slice(0,6);
      d.split('').forEach((ch,j)=>{ if(boxes[j]) boxes[j].value=ch; });
      boxes[Math.min(d.length,5)].focus();
      if(d.length===6) doJoin(); });
  });
  boxes[0].focus();
}

async function doJoin(){
  const legacy=$('#jCode');
  const code=(otpValue() || (legacy?legacy.value:'') || '').replace(/[^0-9]/g,'').slice(0,6);
  if(code.length<6){ toast('أكمل الرمز المكوَّن من 6 أرقام'); return; }
  // المسار الأول: دالة خادمية
  try{
    const rows=await rest('POST','rpc/join_circle_by_code',{p_code:code});
    const row=(rows&&rows[0])||null;
    if(row){ pendingJoin=null; try{ history.replaceState(null,'',location.pathname); }catch(e){}
      await refreshAll(); closeSheet(); view='home'; renderApp();
      toast('أصبحت عضوًا في «'+(row.circle_name||'الدائرة')+'» 🎉'); return; }
    toast('رمز الدعوة غير صحيح'); return;
  }catch(e){
    if((e&&e.message||'').includes('does not exist')||(e&&e.message||'').includes('Could not find')){ /* نكمل للمسار الاحتياطي */ }
    else if((e&&e.message||'').includes('AUTH_REQUIRED')){ toast('سجّل الدخول أولًا'); return; }

    pendingJoin=null; try{ history.replaceState(null,'',location.pathname); }catch(e){}
    await refreshAll(); closeSheet(); view='home'; renderApp();
    toast('أصبحت عضوًا في «'+(c&&c.name?c.name:'الدائرة')+'» 🎉');
  }catch(e){ toast('تعذر الانضمام: '+(e&&e.message?e.message:'خطأ غير معروف')); }

async function restoreBackup(text){
  try{
    const b=JSON.parse(text); if(!b||b.app!=='rafiq'){ toast('ملف غير صالح'); return; }
    let ok=0,fail=0;
    async function up(table,rows){
      for(const r of (rows||[])){
        try{ await rest('POST',table,r,'resolution=merge-duplicates,return=minimal'); ok++; }catch(e){ fail++; }
      }
    }
    await up('profiles', b.profile?[b.profile]:[]);
    await up('circles', b.circles); await up('circle_members', b.members);
    await up('items', b.items); await up('item_recipients', b.recipients);
    await up('progress_entries', b.entries); await up('tasks', b.tasks);
    await up('shared_lists', b.sharedLists); await up('shared_list_items', b.shopping);
    await up('activity_events', b.activity);
    await refreshAll(); closeSheet(); renderApp();
    toast('استُرد: '+ok+' عنصرًا'+(fail?(' • فشل '+fail):''));
  }catch(e){ toast('تعذر الاسترداد: '+(e&&e.message?e.message:'')); }
}

function smartLinkName(url){
  const u=(url||'').toLowerCase();
  if(u.indexOf('instagram.com/')>=0){ const seg=url.substringAfter? '':''; }
  try{
    if(u.includes('instagram.com/')){
      let seg=url.split('instagram.com/')[1].split('/')[0].split('?')[0];
      if(seg && !['p','reel','reels','tv','stories','explore'].includes(seg)) return 'إنستغرام — '+seg;
      return 'مقطع إنستغرام';
    }
  }catch(e){}
  if(u.includes('whatsapp.com')||u.includes('wa.me')||u.includes('whatsapp')) return 'مقطع واتساب';
  if(u.includes('youtube')||u.includes('youtu.be')) return 'مقطع يوتيوب';
  if(u.includes('tiktok.com')) return 'مقطع تيك توك';
  if(u.includes('twitter.com')||u.includes('x.com')) return 'منشور من X';
  if(u.includes('facebook.com')) return 'منشور فيسبوك';
  if(u.includes('spotify.com')) return 'مقطع صوتي — سبوتيفاي';
  if(u.includes('soundcloud.com')) return 'مقطع صوتي — ساوندكلاود';
  if(u.endsWith('.mp4')||u.endsWith('.mov')||u.endsWith('.webm')) return 'مقطع فيديو';
  try{ const h=url.split('://')[1].split('/')[0].replace('www.',''); if(h) return 'رابط من '+h; }catch(e){}
  return 'رابط';
}
function smartPlaceName(link, fallback){
  try{ const q=(link.split('q=')[1]||'').split('&')[0]; if(!q) return fallback;
    const dec=decodeURIComponent(q.replace(/\+/g,' ')).trim();
    if(!dec || /^-?\d+\.\d+,-?\d+\.\d+$/.test(dec)) return fallback; return dec;
  }catch(e){ return fallback; }
}

/* ---------- نافذة إضافة رابط الذكية (SmartAddLinkSheet) ---------- */
window._salKind = 'MEDIA';
window._salCategory = 'عامة';

function isMapsUrl(u){
  const s = (u||'').toLowerCase();
  return ['google.com/maps', 'maps.app.goo.gl', 'goo.gl/maps', 'maps.google', 'geo:', 'osm.org', 'waze.com'].some(x => s.includes(x));
}
function isVideoUrl(u){
  const s = (u||'').toLowerCase();
  return ['youtube.com', 'youtu.be', 'tiktok.com', 'instagram.com/reel', 'instagram.com/p', 'facebook.com/reel', 'twitter.com', 'x.com'].some(x => s.includes(x));
}
function smartAutoName(u){
  if(isMapsUrl(u)) return 'موقع على الخريطة';
  if(isVideoUrl(u)) return smartLinkName(u);
  try{
    const clean = u.replace(/^https?:\/\//i, '').replace(/^www\./i, '');
    const host = clean.split('/')[0].split('?')[0];
    if(host) return host.charAt(0).toUpperCase() + host.slice(1);
  }catch(e){}
  return 'رابط محفوظ';
}

async function openSmartAddLink(initialKind, initialUrl, initialTitle){
  let url = (initialUrl || '').trim();
  let title = (initialTitle || '').trim();
  let kind = initialKind || 'MEDIA';
  let fromClip = false;

  if(!url){
    try{
      if(navigator.clipboard && navigator.clipboard.readText){
        const clip = (await navigator.clipboard.readText()) || '';
        const detected = extractWebUrl(clip);
        if(detected){
          url = detected;
          fromClip = true;
          if(!title) title = smartAutoName(url);
          if(!initialKind){
            if(isMapsUrl(url)) kind = 'PLACE';
            else if(isVideoUrl(url)) kind = 'MEDIA';
            else kind = 'BOOKMARK';
          }
        }
      }
    }catch(e){}
  } else if(!title){
    title = smartAutoName(url);
  }

  window._salKind = kind;
  window._salCategory = 'عامة';

  const renderSheetHtml = () => {
    const k = window._salKind;
    const isBookmark = k === 'BOOKMARK';
    const categories = ['عامة', 'تقنية', 'تسوق', 'أخبار', 'تعليم', 'ترفيه', 'طبخ', 'عمل'];
    const curCat = window._salCategory || 'عامة';

    return sheetHead(k === 'PLACE' ? '📍 إضافة موقع / مكان' : (k === 'BOOKMARK' ? '🔖 إضافة إشارة مرجعية' : '🎬 إضافة مقطع / فيديو')) + `
      ${fromClip ? `
        <div style="background:var(--accent-verysoft);border:1px solid var(--accent-2);border-radius:10px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px">
          <span style="font-size:16px">📋</span>
          <span style="font-size:12px;font-weight:600;color:var(--accent-dark)">تم التعرف تلقائيًا على الرابط من الحافظة!</span>
        </div>` : ''}

      <!-- أزرار التبديل الثلاثية: مقاطعنا / إشاراتنا / أماكننا -->
      <div style="display:flex;gap:6px;margin-bottom:14px">
        ${[
          ['MEDIA', '🎬 مقاطعنا'],
          ['BOOKMARK', '🔖 إشاراتنا'],
          ['PLACE', '📍 أماكننا']
        ].map(([val, lbl]) => `
          <button type="button" class="sal-kind-btn" data-k="${val}" style="flex:1;padding:10px 4px;border-radius:12px;font-size:13px;font-weight:${k===val?'700':'500'};background:${k===val?'var(--accent-soft)':'var(--surface-2)'};color:${k===val?'var(--accent-dark)':'var(--text-2)'};border:1.5px solid ${k===val?'var(--accent)':'transparent'};cursor:pointer;font-family:inherit;text-align:center;transition:all .15s">
            ${lbl}
          </button>
        `).join('')}
      </div>

      <div class="field">
        <label>رابط المحتوى (URL)</label>
        <input id="salUrl" value="${esc(url)}" placeholder="الصق الرابط (يوتيوب، إنستغرام، موقع ويب، خريطة...)" style="direction:ltr">
      </div>

      <div class="field">
        <label>اسم الرابط أو المقطع (يمكنك تعديله كما تحب)</label>
        <input id="salTitle" value="${esc(title)}" placeholder="اكتب اسمًا معبرًا...">
      </div>

      ${isBookmark ? `
        <div class="field" style="margin-top:6px">
          <label>اختر التصنيف:</label>
          <div id="salCatChips" style="display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none">
            ${categories.map(cat => `
              <button type="button" class="sal-cat-btn" data-cat="${cat}" style="flex-shrink:0;padding:5px 12px;border-radius:18px;border:1px solid ${curCat===cat?'var(--accent)':'var(--border)'};background:${curCat===cat?'var(--accent)':'var(--surface-2)'};color:${curCat===cat?'#fff':'var(--text-2)'};font-size:12px;font-weight:${curCat===cat?'700':'500'};cursor:pointer;font-family:inherit">${esc(cat)}</button>
            `).join('')}
          </div>
          <input id="salCustomCat" value="${categories.includes(curCat)?'':curCat}" placeholder="أو تصنيف مخصص..." style="margin-top:4px">
        </div>
      ` : ''}

      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn" data-act="saveSmartAddLink" style="flex:1.5;font-weight:700">حفظ في رفيق ✓</button>
        <button class="btn ghost" data-act="shareSmartAddLink" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px">
          <span style="font-size:16px">↗</span><span>مشاركة</span>
        </button>
      </div>
    `;
  };

  openSheet(renderSheetHtml());

  const bindEvents = () => {
    const sheetEl = $('#sheet');
    if(!sheetEl) return;

    sheetEl.querySelectorAll('.sal-kind-btn').forEach(btn => {
      btn.onclick = () => {
        window._salKind = btn.dataset.k;
        const uEl = $('#salUrl'), tEl = $('#salTitle');
        if(uEl) url = uEl.value;
        if(tEl) title = tEl.value;
        openSheet(renderSheetHtml());
        bindEvents();
      };
    });

    sheetEl.querySelectorAll('.sal-cat-btn').forEach(btn => {
      btn.onclick = () => {
        window._salCategory = btn.dataset.cat;
        const custEl = $('#salCustomCat');
        if(custEl) custEl.value = '';
        sheetEl.querySelectorAll('.sal-cat-btn').forEach(b => {
          const isSel = b.dataset.cat === window._salCategory;
          b.style.background = isSel ? 'var(--accent)' : 'var(--surface-2)';

          titleInput.value = smartAutoName(val);
        }
        url = val;
      };
    }
  };

  bindEvents();
}

async function saveSmartAddLink(){
  const urlEl = $('#salUrl');
  const titleEl = $('#salTitle');
  const rawUrl = (urlEl ? urlEl.value : '').trim();
  let cleanUrl = rawUrl;
  if(!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')){
    cleanUrl = 'https://' + cleanUrl;
  }
  if(!/^https?:\/\/[^\s]+$/i.test(cleanUrl)){
    toast('يرجى إدخال أو لصق رابط صالح يبدأ بـ http');
    return;
  }
  const cleanTitle = (titleEl && titleEl.value.trim()) ? titleEl.value.trim() : smartAutoName(cleanUrl);
  const kind = window._salKind || 'MEDIA';

  try{
    if(kind === 'PLACE'){
      await addPlace(cleanTitle, cleanUrl);
      toast('حُفظ في أماكننا المحفوظة ✓');
    } else if(kind === 'BOOKMARK'){
      const customCat = ($('#salCustomCat') ? $('#salCustomCat').value : '').trim();
      const cat = customCat || window._salCategory || 'عامة';
      await addBookmarkItem(cleanTitle, cleanUrl, cat);
      toast('حُفظ في الإشارات المرجعية (' + cat + ') ✓');
    } else {
      const sh = sharedFirst();
      const cid = sh ? sh.circle.id : ((data.circles||[]).find(c=>c.circle.type==='PERSONAL')||{}).circle?.id;
      if(!cid){ toast('لا توجد دائرة متاحة'); return; }
      const l = await ensureList(MEDIA_TITLE, cid);
      await rest('POST', 'shared_list_items', {
        id: uuid(),
        list_id: l.id,
        title: cleanTitle,
        note: cleanUrl,
        completed: false,
        position: 0
      }, 'return=minimal');
      logAct(cid, 'MEDIA_ADDED', cleanTitle);
      await refreshAll();
      toast('حُفظ في مقاطعنا الجميلة ✓');
    }
    closeSheet();
    renderApp();
  }catch(e){
    toast('تعذر الحفظ: ' + (e && e.message ? e.message : ''));
  }
}

async function shareSmartAddLink(){
  const urlEl = $('#salUrl');
  const titleEl = $('#salTitle');
  const cleanUrl = (urlEl ? urlEl.value : '').trim();
  if(!cleanUrl){
    toast('الصق الرابط أولاً لمشاركته');
    return;
  }
  const cleanTitle = (titleEl && titleEl.value.trim()) ? titleEl.value.trim() : smartAutoName(cleanUrl);
  if(navigator.share){
    try{
      await navigator.share({ title: cleanTitle, text: cleanTitle + '\n' + cleanUrl, url: cleanUrl });
    }catch(err){}
  } else if(navigator.clipboard && navigator.clipboard.writeText){
    await navigator.clipboard.writeText(cleanTitle + '\n' + cleanUrl);
    toast('تم نسخ الرابط للمشاركة 📋');
  } else {
    toast('المشاركة غير مدعومة في هذا المتصفح');
  }
}

    comments = await rest('GET', 'comments', 'parent_id=eq.' + itemId + '&order=created_at.asc&select=*');

    comments = [];

          <div style="background:${isMe ? 'var(--accent-verysoft)' : 'var(--surface-2)'};border:1px solid ${isMe ? 'var(--accent-2)' : 'var(--border)'};border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px">

              <span style="font-size:12px;font-weight:700;color:${isMe ? 'var(--accent-dark)' : 'var(--text-1)'}">${esc(authorName)}</span>
              <span style="font-size:10.5px;color:var(--text-3)">${relAr(cm.created_at)}</span>

            <div style="font-size:13.5px;color:var(--text-1);line-height:1.4;word-break:break-word">${esc(cm.body || cm.content || '')}</div>

      <button type="button" class="btn" id="sendCommentBtn" style="width:auto;min-width:76px;min-height:44px;padding:0 14px;font-size:13px;font-weight:700;border-radius:12px;flex-shrink:0">إرسال</button>
    </div>
  `;

  // Focus input and bind send button
  const input = $('#newCommentInput');

    sendBtn.onclick = async () => {

/* ---------- الإشارات المرجعية ---------- */
const BOOKMARKS_TITLE = 'الإشارات المرجعية';

function getBookmarkCategory(b){
  if(!b) return '';
  return ((b.unit || b.assigned_to) || '').trim();
}

function bookmarksOf(){
  if(!data||!data.sharedLists) return { list:null, items:[] };
  const matching = data.sharedLists.filter(x=>x.title===BOOKMARKS_TITLE);
  const mIds = new Set(matching.map(x=>x.id));
  const items = (data.shopping||[]).filter(i=>mIds.has(i.list_id));
  return { list: matching[0] || null, items };
}

async function ensureBookmarksList(){
  const sh=sharedFirst(); if(!sh) return null;
  const existing = (data && data.sharedLists || []).find(x => x.title === BOOKMARKS_TITLE && x.circle_id === sh.circle.id)
                || (data && data.sharedLists || []).find(x => x.title === BOOKMARKS_TITLE);
  if(existing) return existing;
  return ensureList(BOOKMARKS_TITLE, sh.circle.id);
}

function extractWebUrl(text){
  const t = (text || '').trim();
  if(!t) return null;
  const m = t.match(/(https?:\/\/[^\s]+|www\.[^\s]+|[a-zA-Z0-9-]+\.[a-zA-Z]{2,}(\/[^\s]*)?)/);
  if(!m) return null;
  let url = m[0].replace(/[\)\]\.,;'"\>]+$/, '');
  if(!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
  try {
    const u = new URL(url);
    if(u.hostname && u.hostname.includes('.')) return url;
  } catch(e){}
  return null;
}

function getWebDomain(url){
  try {
    const u = new URL(url.startsWith('http') ? url : ('https://' + url));
    return u.hostname.replace(/^www\./, '') || url.slice(0, 25);
  } catch(e){
    return url.replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0].slice(0, 25);
  }
}

function getWebDomainGrad(d){
  const colors = [
    ['#2563EB','#1D4ED8'],['#7C3AED','#6D28D9'],['#DB2777','#BE185D'],
    ['#059669','#047857'],['#D97706','#B45309'],['#0891B2','#0E7490'],
    ['#4F46E5','#4338CA'],['#0D9488','#0F766E'],['#DC2626','#B91C1C'],['#EA580C','#C2410C']
  ];
  let h=0; for(let i=0;i<d.length;i++) h=(h*31+d.charCodeAt(i))&0xfffffff;
  return colors[Math.abs(h)%colors.length];
}

async function addBookmarkItem(title, link, category){
  try {
    const l = await ensureBookmarksList();
    if(!l){ toast('أنشئ دائرة مشتركة أولًا'); return; }
    let rawUrl = (link || '').trim();
    if(!rawUrl.startsWith('http://') && !rawUrl.startsWith('https://')) rawUrl = 'https://' + rawUrl;
    const domain = getWebDomain(rawUrl);
    const finalTitle = (title || '').trim() || (domain.charAt(0).toUpperCase() + domain.slice(1));
    const body = { id: uuid(), list_id: l.id, title: finalTitle, note: rawUrl, completed: false, position: 0 };
    if(category && category.trim()) body.unit = category.trim();
    await rest('POST', 'shared_list_items', body, 'return=minimal');
    const sh=sharedFirst();
    if(sh && sh.circle) logAct(sh.circle.id, 'BOOKMARK_ADDED', finalTitle);
    await refreshAll(); renderApp();
  } catch(e){
    toast('تعذر الحفظ: ' + (e && e.message ? e.message : ''));
  }
}

async function smartAddBookmark(){
  let clip = '';
  try {
    if(navigator.clipboard && navigator.clipboard.readText){
      clip = await navigator.clipboard.readText();
    }
  } catch(e){}
  const detected = extractWebUrl(clip);
  if(detected){
    const d = getWebDomain(detected);
    const t = d.charAt(0).toUpperCase() + d.slice(1);
    await addBookmarkItem(t, detected, '');
    toast('تم حفظ الرابط من الحافظة تلقائيًا: ' + d + ' 🔖');
  } else {
    openAddBookmarkModal();
  }
}

const BM_CAT_SUGGESTED = ['أعمال','تقنية','ترفيه','أخبار','تعليم','صحة','تسوق','أخرى'];

function bmCatChips(selCat, inputId){
  const bm = bookmarksOf();
  const existing = [...new Set(bm.items.map(b=>getBookmarkCategory(b)).filter(c=>c.trim()))];

/* ---------- المقاطع والروابط (Media Screen) ---------- */
function mediaOf(){
  if(!data || !data.sharedLists) return { list:null, items:[] };
  const matching = data.sharedLists.filter(x => x.title === MEDIA_TITLE);
  const mIds = new Set(matching.map(x => x.id));
  const items = (data.shopping || []).filter(i => mIds.has(i.list_id));
  return { list: matching[0] || null, items };
}

function detectMediaPlatform(url){
  const u = (url || '').toLowerCase();
  if(u.includes('youtube.com') || u.includes('youtu.be')) return { id:'youtube', name:'يوتيوب', icon:'▶️', color:'#EF4444' };
  if(u.includes('twitter.com') || u.includes('x.com') || u.includes('fxtwitter.com') || u.includes('vxtwitter.com')) return { id:'twitter', name:'إكس 𝕏', icon:'𝕏', color:'var(--text-1)' };
  if(u.includes('instagram.com')) return { id:'instagram', name:'إنستغرام', icon:'📸', color:'#E1306C' };
  if(u.includes('tiktok.com')) return { id:'tiktok', name:'تيك توك', icon:'🎵', color:'#00F2FE' };
  if(u.includes('facebook.com') || u.includes('fb.watch')) return { id:'facebook', name:'فيسبوك', icon:'👤', color:'#1877F2' };
  if(u.includes('spotify.com')) return { id:'spotify', name:'سبوتيفاي', icon:'🎧', color:'#1DB954' };
  if(u.includes('soundcloud.com')) return { id:'soundcloud', name:'ساوندكلاود', icon:'☁️', color:'#FF5500' };
  return { id:'other', name:'أخرى', icon:'🔗', color:'var(--accent)' };
}

/* ---------- قسم الأماكن المحفوظة (Places Screen) ---------- */
function parsePlace(p){
  const raw = p.note || '';
  const parts = raw.split('|');
  if(parts.length >= 3){
    return { addr: parts[0], link: parts[1], cat: parts[2] || 'عام' };
  } else if(parts.length === 2){
    return { addr: parts[0], link: parts[1], cat: 'عام' };
  } else {
    return { addr: '', link: raw || ('https://maps.google.com/?q=' + encodeURIComponent(p.title)), cat: 'عام' };
  }
}

function sharePlaceLink(title, addr, url){
  const msg = '📍 ' + title + (addr ? ('\n🏢 العنوان: ' + addr) : '') + '\n🔗 الخريطة: ' + url;
  if(navigator.share){
    navigator.share({ title: title, text: msg, url: url }).catch(()=>{});
  } else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(msg);
    toast('تم نسخ تفاصيل المكان للمشاركة 📋');
  } else {
    toast(url);
  }
}

/* ==========================================================================
   الملاحظات والتدوين الحي والذكاء الاصطناعي (Notes, Live Dictation, Gemini)
   مطابقة بنسبة 100% مع أندرويد v1.4.21 وتطبيق مصب
   ========================================================================== */

const NOTES_LIGHT_COLORS = [
  'transparent', '#FAAFA8', '#F39F76', '#FFF8B8', '#E2F6D3', '#B4DDD3',
  '#D4E4ED', '#AECCDC', '#D3BFDB', '#F6E2DD', '#E9E3D4', '#EFEFF1'
];
const NOTES_DARK_COLORS = [
  'transparent', '#77172E', '#692B17', '#7C4A03', '#264D3B', '#0C625D',
  '#256377', '#284255', '#472E5B', '#6C394F', '#4B443A', '#232427'
];

function autoColorIndex(id){
  if(!id) return 1;
  let h = 0;
  for(let i = 0; i < id.length; i++){
    h = ((h << 5) - h) + id.charCodeAt(i) | 0;
  }
  return 1 + (Math.abs(h) % (NOTES_LIGHT_COLORS.length - 1));
}

function noteBgColor(index, isDark, noteId){
  const table = isDark ? NOTES_DARK_COLORS : NOTES_LIGHT_COLORS;
  const i = (!index || index === 0) ? autoColorIndex(noteId || '') : Math.max(1, Math.min(index, table.length - 1));
  return table[i] || table[1];
}

function noteStampWeb(timestamp){
  let d;
  if(typeof timestamp === 'number'){
    d = new Date(timestamp);
  } else if(typeof timestamp === 'string'){
    d = new Date(timestamp);
  } else {
    d = new Date();
  }
  if(isNaN(d.getTime())) d = new Date();
  const day = d.getDate();
  const month = d.getMonth() + 1;
  const year = d.getFullYear();
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2, '0');
  const period = h < 12 ? 'ص' : 'م';
  h = (h % 12) || 12;
  return `${day}/${month}/${year} • ${h}:${m} ${period}`;
}

/* --- Storage & Supabase Sync (Latest-Wins) --- */
function getNotesList(){
  try {
    const raw = localStorage.getItem('rafiq_notes');
    return raw ? JSON.parse(raw) : [];
  } catch(e){
    return [];
  }
}

function saveNotesLocal(arr){
  localStorage.setItem('rafiq_notes', JSON.stringify(arr || []));
}

function parseNoteTime(v){
  if(!v) return 0;
  if(typeof v === 'number') return v;
  const ms = new Date(v).getTime();
  return isNaN(ms) ? 0 : ms;
}

function mergeNotesWeb(localList, cloudList){
  const localMap = new Map();
  (localList || []).forEach(n => { if(n && n.id) localMap.set(n.id, n); });
  const cloudMap = new Map();
  (cloudList || []).forEach(n => { if(n && n.id) cloudMap.set(n.id, n); });

  const allIds = new Set([...localMap.keys(), ...cloudMap.keys()]);
  const merged = [];
  const toPush = [];

  for(const id of allIds){
    const l = localMap.get(id);
    const c = cloudMap.get(id);
    if(l && !c){
      merged.push(l);
      toPush.push(l);
    } else if(!l && c){
      merged.push({
        id: c.id,
        user_id: c.user_id,
        title: c.title || '',
        body: c.body || '',
        color_index: c.color_index || 0,
        pinned: !!c.pinned,
        deleted: !!c.deleted,
        created_at: c.created_at || new Date().toISOString(),
        updated_at: c.updated_at || new Date().toISOString()
      });
    } else if(l && c){
      const lTime = parseNoteTime(l.updated_at);
      const cTime = parseNoteTime(c.updated_at);
      if(lTime > cTime){
        merged.push(l);
        toPush.push(l);
      } else {
        merged.push({
          id: c.id,
          user_id: c.user_id,
          title: c.title || '',
          body: c.body || '',
          color_index: c.color_index || 0,
          pinned: !!c.pinned,
          deleted: !!c.deleted,
          created_at: c.created_at || l.created_at,
          updated_at: c.updated_at || l.updated_at
        });
      }
    }
  }
  return { merged, toPush };
}

async function syncNotes(showToast = false){
  const user = meId();
  if(!user){
    if(showToast) toast('يرجى تسجيل الدخول لمزامنة الملاحظات');
    return;
  }
  try {
    const cloudRaw = await rest('GET', 'notes', null, 'order=updated_at.desc');
    const cloudNotes = Array.isArray(cloudRaw) ? cloudRaw : [];
    const localNotes = getNotesList();
    const { merged, toPush } = mergeNotesWeb(localNotes, cloudNotes);

    saveNotesLocal(merged);

    if(toPush.length > 0){
      for(const note of toPush){
        const dto = {
          id: note.id,
          user_id: user,
          title: note.title || '',
          body: note.body || '',
          color_index: note.color_index || 0,
          pinned: !!note.pinned,
          deleted: !!note.deleted,
          created_at: typeof note.created_at === 'number' ? new Date(note.created_at).toISOString() : (note.created_at || new Date().toISOString()),
          updated_at: typeof note.updated_at === 'number' ? new Date(note.updated_at).toISOString() : (note.updated_at || new Date().toISOString())
        };
        await rest('POST', 'notes', dto, 'resolution=merge-duplicates').catch(async () => {
          await rest('PATCH', 'notes', dto, 'id=eq.' + note.id).catch(() => {});
        });
      }
    }

    if(view === 'notes') renderNotes();
    if(showToast) toast('تمت مزامنة الملاحظات مع السحابة بنجاح ✓');
  } catch(err){
    console.warn('Note sync failed:', err);
    if(showToast) toast('الملاحظات محفوظة محلياً (تعذّر الاتصال بالسحابة)');
  }
}
