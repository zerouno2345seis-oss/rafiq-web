/* --- Spoken Arabic Punctuation & Voice Editing --- */
function normArabicKey(w){
  if(!w) return '';
  return w
    .replace(/[\u064B-\u0652\u0640]/g, '')
    .replace(/[أإآ]/g, 'ا')
    .replace(/ة/g, 'ه')
    .replace(/ى/g, 'ي')
    .toLowerCase()
    .replace(/^[،.؟!:؛]+|[،.؟!:؛]+$/g, '');
}

const PUNCT_PHRASES = [
  [['فاصله', 'منقوطه'], '؛'],
  [['علامه', 'استفهام'], '؟'],
  [['اشاره', 'استفهام'], '؟'],
  [['استفهام'], '؟'],
  [['علامه', 'تعجب'], '!'],
  [['اشاره', 'تعجب'], '!'],
  [['تعجب'], '!'],
  [['نقطتين', 'فوق', 'بعض'], ':'],
  [['نقطتان', 'راسيتان'], ':'],
  [['نقطتان'], ':'],
  [['نقطتين'], ':'],
  [['سطر', 'جديد'], '\n'],
  [['اسطر', 'جديد'], '\n'],
  [['انزل', 'سطر'], '\n'],
  [['انزل', 'للسطر'], '\n'],
  [['السطر', 'الجديد'], '\n'],
  [['السطر', 'التالي'], '\n'],
  [['للسطر', 'التالي'], '\n'],
  [['سطر', 'تالي'], '\n'],
  [['فقره', 'جديده'], '\n'],
  [['الفقره', 'الجديده'], '\n'],
  [['افتح', 'قوسين'], '('],
  [['اغلق', 'قوسين'], ')'],
  [['فتح', 'قوسين'], '('],
  [['غلق', 'قوسين'], ')'],
  [['بين', 'قوسين'], '()'],
  [['افتح', 'القوس'], '('],
  [['اغلق', 'القوس'], ')'],
  [['افتح', 'قوس'], '('],
  [['اغلق', 'قوس'], ')'],
  [['افتح', 'علامه', 'تنصيص'], '«'],
  [['اغلق', 'علامه', 'تنصيص'], '»'],
  [['افتح', 'تنصيص'], '«'],
  [['اغلق', 'تنصيص'], '»'],
  [['فاصله'], '،'],
  [['نقطه'], '.'],
  [['شرطه'], '—'],
  [['داش'], '—']
];

function localTypographyFormat(text){
  if(!text) return '';
  return text
    .replace(/\s+([،.؟!:؛)»])/g, '$1')
    .replace(/([،.؟!:؛])([^\s\n،.؟!:؛)»])/g, '$1 $2')
    .replace(/([(«])\s+/g, '$1')
    .replace(/[ \t]+/g, ' ')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

const OP_PHRASES = [
  [['امسح', 'الكل'], 'CLEAR'],
  [['مسح', 'الكل'], 'CLEAR'],
  [['احذف', 'الكل'], 'CLEAR'],
  [['احذف', 'الجمله'], 'DELETE_SENTENCE'],
  [['حذف', 'الجمله'], 'DELETE_SENTENCE'],
  [['احذف', 'السطر'], 'DELETE_SENTENCE'],
  [['احذف', 'كلمه'], 'DELETE_WORD'],
  [['حذف', 'كلمه'], 'DELETE_WORD'],
  [['امسح', 'كلمه'], 'DELETE_WORD'],
  [['امسح'], 'CLEAR'],
  [['مسح'], 'CLEAR'],
  [['احذف'], 'DELETE_WORD'],
  [['حذف'], 'DELETE_WORD'],
  [['تراجع'], 'UNDO'],
  [['تعداد', 'نقطي'], 'LIST_BULLET'],
  [['قائمه', 'نقطيه'], 'LIST_BULLET'],
  [['تعداد', 'رقمي'], 'LIST_NUMBER'],
  [['قائمه', 'رقميه'], 'LIST_NUMBER'],
  [['انهاء', 'التعداد'], 'LIST_END'],
  [['نهايه', 'التعداد'], 'LIST_END']
];

function matchAtArr(keys, at, phrase){
  if(at + phrase.length > keys.length) return false;
  for(let k = 0; k < phrase.length; k++){
    const key = keys[at + k];
    const target = phrase[k];
    const ok = (key === target) || (k === 0 && key.length > 3 && key.startsWith('و') && key.substring(1) === target);
    if(!ok) return false;
  }
  return true;
}

function parseSpokenUtterance(raw){
  const words = raw.trim().split(/\s+/).filter(Boolean);
  if(!words.length) return { text: '', op: null };
  const keys = words.map(w => normArabicKey(w));

  let op = null;
  let end = words.length;
  for(const [phrase, o] of OP_PHRASES){
    const at = end - phrase.length;
    if(at >= 0 && matchAtArr(keys, at, phrase)){
      op = o;
      end = at;
      break;
    }
  }

  const pieces = [];
  let i = 0;
  while(i < end){
    let matchedPunct = null;
    let matchLen = 0;
    for(const [phrase, punct] of PUNCT_PHRASES){
      if(matchAtArr(keys, i, phrase)){
        matchedPunct = punct;
        matchLen = phrase.length;
        break;
      }
    }
    if(matchedPunct){
      pieces.push(matchedPunct);
      i += matchLen;
    } else {
      pieces.push(words[i]);
      i++;
    }
  }

  let out = '';
  for(let j = 0; j < pieces.length; j++){
    const p = pieces[j];
    if(!out){
      out = p;
    } else if(p === '\n'){
      out += '\n';
    } else if(out.endsWith('\n') || out.endsWith('(') || out.endsWith('«') || out.endsWith('—')){
      out += p;
    } else if(['،', '.', '؟', '!', '؛', ':', ')', '»'].includes(p)){
      out += p;
    } else {
      out += ' ' + p;
    }
  }
  return { text: out, op };
}

function appendWithoutOverlap(base, addition){
  const b = (base || '').trimEnd();
  const a = (addition || '').trim();
  if(!b) return a.replace(/^\n+/, '');
  if(!a) return b;
  if(b.endsWith('\n') || a.startsWith('\n')){
    return b.replace(/[\n\s]+$/, '') + '\n' + a.replace(/^[\n\s]+/, '');
  }
  if(b.endsWith('(') || b.endsWith('«')) return b + a;
  if(b === a || b.endsWith(a)) return b;
  if(a.startsWith(b)) return a;

  const bw = b.split(/[\s\t]+/);
  const aw = a.split(/[\s\t]+/);
  const maxK = Math.min(bw.length, aw.length);
  for(let k = maxK; k >= 1; k--){
    const bSlice = bw.slice(-k).map(normArabicKey).join(' ');
    const aSlice = aw.slice(0, k).map(normArabicKey).join(' ');
    if(bSlice === aSlice){
      return b + ' ' + aw.slice(k).join(' ');
    }
  }
  const sep = (['(', '«', '—'].includes(b.slice(-1)) || ['،', '.', '؟', '!', '؛', ':', ')', '»'].includes(a.charAt(0))) ? '' : ' ';
  return b + sep + a;
}

function deleteLastWordText(t){
  const s = (t || '').trimEnd();
  if(s.endsWith('\n')) return s.slice(0, -1);
  const cut = Math.max(s.lastIndexOf(' '), s.lastIndexOf('\n'));
  return cut < 0 ? '' : s.substring(0, cut + 1).trimEnd();
}

function deleteLastSentenceText(t){
  const s = (t || '').trimEnd();
  if(!s) return '';
  const body = s.slice(0, -1);
  let cut = -1;
  for(let i = body.length - 1; i >= 0; i--){
    if('.؟!؛\n'.includes(body[i])){
      cut = i;
      break;
    }
  }
  return cut < 0 ? '' : s.substring(0, cut + 1).trimEnd();
}

async function callGeminiApiOnce(apiKey, model, systemPrompt, userText){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const body = {
    contents: [
      { role: 'user', parts: [{ text: userText }] }
    ],
    systemInstruction: {
      parts: [{ text: systemPrompt }]
    },
    generationConfig: {
      temperature: 0.3,
      maxOutputTokens: 2048,
      ...(model.includes('2.5-flash') ? { thinkingConfig: { thinkingBudget: 0 } } : {})
    }
  };
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if(!resp.ok){
    const errText = await resp.text().catch(() => '');
    let msg = `HTTP ${resp.status}`;
    if(resp.status === 429 || errText.includes('RESOURCE_EXHAUSTED')) msg = 'نفدت الحصة المجانية لهذا المفتاح (429)';
    else if(resp.status === 400 || resp.status === 403) msg = 'المفتاح غير صالح أو صلاحياته مقيدة';
    throw new Error(msg);
  }
  const data = await resp.json();
  const candidate = data.candidates?.[0]?.content?.parts?.[0]?.text;
  return (candidate || '').trim();
}

async function smoothArabicTextWithGemini(rawText){
  if(!rawText || !rawText.trim()) return rawText;
  const keys = getGeminiKeys();
  if(!keys.length) throw new Error('لم تُضف مفاتيح Gemini بعد. أضفها من الإعدادات.');

  const model = getGeminiModel();
  const modelsToTry = (model === 'gemini-flash-lite-latest') 
    ? ['gemini-flash-lite-latest', 'gemini-2.5-flash', 'gemini-1.5-flash']
    : [model, 'gemini-flash-lite-latest'];

  const system = 'أنت مدقق ومحرر نصوص عربية وإملاء صوتي. قم بتصحيح الأخطاء الإملائية والنحوية الناتجة عن التعرّف الصوتي، وضع علامات الترقيم الصحيحة، ونظّم الأسطر والفقرات دون تغيير المعنى الأصلي للنص. أعد النص المصحح فقط بدون أي مقدمات أو شروحات.';

  let lastErr = null;
  for(const m of modelsToTry){
    for(const key of keys){

        const res = await callGeminiApiOnce(key, m, system, rawText);
        if(res) return res;
      } catch(err){
        lastErr = err;
      }
    }
  }
  throw lastErr || new Error('تعذّر الاتصال بـ Gemini');
}

/* --- Live Ruled Dictation Notebook Engine --- */
let dictationAudioStream = null;
let dictationAudioCtx = null;
let dictationAnalyser = null;
let dictationAnimId = null;

async function startDictationAudioMeter(onLevel){
  try {
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return null;
    dictationAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if(!AudioContextClass) return dictationAudioStream;
    dictationAudioCtx = new AudioContextClass();
    const source = dictationAudioCtx.createMediaStreamSource(dictationAudioStream);
    dictationAnalyser = dictationAudioCtx.createAnalyser();
    dictationAnalyser.fftSize = 128;
    source.connect(dictationAnalyser);

    const buffer = new Uint8Array(dictationAnalyser.frequencyBinCount);
    function loop(){
      if(!dictationAnalyser) return;
      dictationAnalyser.getByteFrequencyData(buffer);
      let sum = 0;
      for(let i=0; i<buffer.length; i++) sum += buffer[i];
      const avg = sum / buffer.length;
      const pct = Math.min(100, Math.round((avg / 64) * 100));
      onLevel(pct);
      dictationAnimId = requestAnimationFrame(loop);
    }
    loop();
    return dictationAudioStream;
  } catch(err){
    console.warn('Audio meter init error:', err);
    return null;
  }
}

function stopDictationAudioMeter(){
  if(dictationAnimId) cancelAnimationFrame(dictationAnimId);
  dictationAnimId = null;
  if(dictationAudioStream){
    dictationAudioStream.getTracks().forEach(t => t.stop());
    dictationAudioStream = null;
  }
  if(dictationAudioCtx){
    dictationAudioCtx.close().catch(()=>{});
    dictationAudioCtx = null;
  }
  dictationAnalyser = null;
}

        <button type="button" class="chip" id="dictationUndoBtn" style="background:#E0F2FE;color:#0369A1;font-weight:700;border:1px solid #BAE6FD" title="تراجع">↩ تراجع</button>
        <button type="button" class="chip" id="dictationDelWordBtn" style="background:#FEE2E2;color:#B91C1C;font-weight:700;border:1px solid #FECACA" title="حذف كلمة">⌫ كلمة</button>
        ${['،', '.', '؟', '!', ':', '—', '«', '»', '↵'].map(sym => `
          <button type="button" class="chip dictation-sym-chip" data-sym="${sym}" style="background:#FFFDF8;border:1px solid #E9DFC6;color:#4B443A;font-weight:700;padding:3px 10px">${sym}</button>
        `).join('')}
      </div>

      <!-- Bottom Actions Bar -->
      <div class="dictation-bottom-bar">
        <button type="button" id="dictationCancelBtn" class="dictation-btn-circle dictation-btn-cancel" title="إلغاء">✕</button>
        <button type="button" id="dictationMicBtn" class="dictation-btn-circle dictation-btn-mic" title="ميكروفون (بدء / إيقاف)">🎙️</button>
        <button type="button" id="dictationSaveBtn" class="dictation-btn-save" title="حفظ">
          <span id="dictationSaveSpinner" style="display:none">⏳</span>
          <span>حفظ ✓</span>
        </button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);

  const ta = document.getElementById('dictationTextarea');
  const dot = document.getElementById('dictationDot');
  const st = document.getElementById('dictationStatus');
  const micBtn = document.getElementById('dictationMicBtn');
  const saveBtn = document.getElementById('dictationSaveBtn');
  const cancelBtn = document.getElementById('dictationCancelBtn');
  const smoothBtn = document.getElementById('dictationSmoothBtn');
  const undoBtn = document.getElementById('dictationUndoBtn');
  const delWordBtn = document.getElementById('dictationDelWordBtn');
  const clearBtn = document.getElementById('dictationClearBtn');
  const copyBtn = document.getElementById('dictationCopyBtn');
  const langSel = document.getElementById('dictationLangSelect');
  const interimBox = document.getElementById('dictationInterimBox');
  const interimText = document.getElementById('dictationInterimText');

  function pushUndo(){
    activeDictationState.undoStack.push(ta.value);
    if(activeDictationState.undoStack.length > 20) activeDictationState.undoStack.shift();
  }

  function updateMicUi(listening){
    activeDictationState.isListening = listening;
    if(listening){
      dot.classList.remove('paused');
      micBtn.classList.add('listening');
      st.textContent = '🎙️ يستمع الآن... تكلّم';
      st.style.color = '#EF4444';
    } else {
      dot.classList.add('paused');
      micBtn.classList.remove('listening');
      st.textContent = 'متوقف مؤقتاً (اضغط المايك للمتابعة)';
      st.style.color = '#8A8372';
      dot.style.transform = '';
      micBtn.style.transform = '';
      if(interimBox) interimBox.style.display = 'none';
    }
  }

  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let wantsListen = true;
  let isRestarting = false;
  let restartTimer = null;

  function safeRestart(){
    if(!wantsListen || !recognition || !document.getElementById('dictationOverlay')) return;
    if(isRestarting) return;
    isRestarting = true;
    clearTimeout(restartTimer);
    restartTimer = setTimeout(() => {
      try {
        recognition.start();
      } catch(err){
        if(err.name !== 'InvalidStateError'){
          console.warn('SpeechRecognition restart error:', err);
        }
      } finally {
        isRestarting = false;
      }
    }, 180);
  }

  if(!SpeechRec){
    st.textContent = 'التعرّف الصوتي غير مدعوم في هذا المتصفح — يمكنك الكتابة يدوياً';
    micBtn.style.opacity = '0.5';
  } else {
    recognition = new SpeechRec();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = speechLang;

    recognition.onstart = () => {
      isRestarting = false;
      updateMicUi(true);
    };

    recognition.onresult = (e) => {
      let interimStr = '';
      let newFinalStr = '';
      for(let i = e.resultIndex; i < e.results.length; i++){
        const item = e.results[i];
        const transcript = item[0] ? item[0].transcript : '';
        if(item.isFinal){
          newFinalStr += transcript + ' ';
        } else {
          interimStr += transcript;
        }
      }

      // If we have final results: lock into committed text
      if(newFinalStr.trim()){
        pushUndo();
        const parsed = parseSpokenUtterance(newFinalStr);
        if(parsed.op === 'CLEAR'){
          activeDictationState.committedText = '';
          ta.value = '';
        } else if(parsed.op === 'DELETE_WORD'){
          activeDictationState.committedText = deleteLastWordText(activeDictationState.committedText);
          ta.value = activeDictationState.committedText;
        } else if(parsed.op === 'DELETE_SENTENCE'){
          activeDictationState.committedText = deleteLastSentenceText(activeDictationState.committedText);
          ta.value = activeDictationState.committedText;
        } else if(parsed.op === 'UNDO'){
          if(activeDictationState.undoStack.length){
            activeDictationState.committedText = activeDictationState.undoStack.pop();
            ta.value = activeDictationState.committedText;
          }
        } else if(parsed.op === 'LIST_BULLET'){
          const b = activeDictationState.committedText.trimEnd();
          activeDictationState.committedText = b + (b ? '\n' : '') + '• ';
          ta.value = activeDictationState.committedText;
        } else if(parsed.op === 'LIST_NUMBER'){
          const b = activeDictationState.committedText.trimEnd();
          activeDictationState.committedText = b + (b ? '\n' : '') + '1. ';
          ta.value = activeDictationState.committedText;
        } else if(parsed.text){
          activeDictationState.committedText = appendWithoutOverlap(activeDictationState.committedText, parsed.text);
          ta.value = activeDictationState.committedText;
        }
        if(interimBox) interimBox.style.display = 'none';
        ta.scrollTop = ta.scrollHeight;
      }

      // If we have interim results: display in real time with zero latency
      if(interimStr.trim()){
        const fullLive = activeDictationState.committedText
          ? (activeDictationState.committedText + (activeDictationState.committedText.endsWith('\n') ? '' : ' ') + interimStr)
          : interimStr;
        ta.value = fullLive;
        if(interimBox && interimText){
          interimText.textContent = interimStr.trim();
          interimBox.style.display = 'flex';
        }
        ta.scrollTop = ta.scrollHeight;
      }
    };

    recognition.onerror = (e) => {
      console.log('SpeechRecognition notice:', e.error);
      if(e.error === 'no-speech' || e.error === 'audio-capture' || e.error === 'network'){
        // Normal pause or transient network glitch: KEEP LISTENING!
        return;
      }
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        wantsListen = false;
        updateMicUi(false);
        st.textContent = '❌ إذن الميكروفون مطلوب — اضغط للتشغيل';
        st.style.color = 'var(--error)';
        toast('يرجى منح إذن الميكروفون للمتابعة');
        return;
      }
      if(e.error === 'aborted'){
        return;
      }
    };

    recognition.onend = () => {
      if(wantsListen && document.getElementById('dictationOverlay')){
        safeRestart();
      } else {
        updateMicUi(false);
      }
    };
  }

  async function startListening(){
    if(!SpeechRec) return;
    wantsListen = true;
    updateMicUi(true);

    await startDictationAudioMeter((vol) => {
      if(activeDictationState.isListening){
        dot.style.transform = 'scale(' + (1 + (vol / 100) * 0.45) + ')';
        micBtn.style.transform = 'scale(' + (1 + (vol / 100) * 0.18) + ')';
      }
    });

    safeRestart();
  }

  function stopListening(){
    wantsListen = false;
    isRestarting = false;
    clearTimeout(restartTimer);
    if(recognition){
      try { recognition.stop(); } catch(e){}
      try { recognition.abort(); } catch(e){}
    }
    stopDictationAudioMeter();
    updateMicUi(false);
  }

  function toggleListening(){
    if(activeDictationState.isListening){
      stopListening();
    } else {
      startListening();
    }
  }

  dot.onclick = toggleListening;
  micBtn.onclick = toggleListening;

  if(langSel){
    langSel.onchange = () => {
      speechLang = langSel.value;
      localStorage.setItem('rafiq_speech_lang', speechLang);
      if(recognition){
        recognition.lang = speechLang;
        try { recognition.abort(); } catch(e){}
        safeRestart();
      }
      toast('تم تغيير اللهجة إلى ' + langSel.options[langSel.selectedIndex].text + ' ✓');
    };
  }

  overlay.querySelectorAll('.dictation-sym-chip').forEach(btn => {
    btn.onclick = () => {
      pushUndo();
      const sym = btn.dataset.sym;
      const b = (activeDictationState.committedText || ta.value).trimEnd();
      if(sym === '↵'){
        activeDictationState.committedText = b + '\n';
      } else if(['(', '«', '—'].includes(sym)){
        activeDictationState.committedText = (!b || b.endsWith('\n')) ? (b + sym) : (b + ' ' + sym);
      } else {
        activeDictationState.committedText = b + sym + ' ';
      }
      ta.value = activeDictationState.committedText;
      ta.focus();
      ta.scrollTop = ta.scrollHeight;
    };
  });

  delWordBtn.onclick = () => {
    pushUndo();
    activeDictationState.committedText = deleteLastWordText(activeDictationState.committedText || ta.value);
    ta.value = activeDictationState.committedText;
    ta.focus();
  };

  undoBtn.onclick = () => {
    if(activeDictationState.undoStack.length){
      activeDictationState.committedText = activeDictationState.undoStack.pop();
      ta.value = activeDictationState.committedText;
      ta.focus();
    } else {
      toast('لا يوجد تراجع');
    }
  };

  clearBtn.onclick = () => {
    if(!ta.value.trim() || confirm('مسح النص بالكامل؟')){
      pushUndo();
      activeDictationState.committedText = '';
      ta.value = '';
      ta.focus();
    }
  };

  copyBtn.onclick = async () => {
    const txt = ta.value.trim();
    if(!txt){ toast('النص فارغ'); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(txt);
      toast('تم نسخ النص 📋');
    } else {
      toast(txt);
    }
  };

  smoothBtn.onclick = async () => {
    const orig = ta.value.trim();
    if(!orig){ toast('لا يوجد نص لتنعيمه'); return; }
    const keys = getGeminiKeys();
    pushUndo();
    smoothBtn.disabled = true;
    smoothBtn.textContent = '⏳ ينعّم...';
    try {
      if(keys.length > 0){
        const smoothed = await smoothArabicTextWithGemini(orig);
        if(smoothed){
          activeDictationState.committedText = smoothed;
          ta.value = smoothed;
          toast('تم تنعيم وصياغة النص عبر Gemini بنجاح ✨');
        }
      } else {
        const formatted = localTypographyFormat(orig);
        activeDictationState.committedText = formatted;
        ta.value = formatted;
        toast('تم تنسيق وترتيب النص العربي بنجاح ✓');
      }
    } catch(e){
      const formatted = localTypographyFormat(orig);
      activeDictationState.committedText = formatted;
      ta.value = formatted;
      toast('تم تنسيق النص محلياً ✓');
    } finally {
      smoothBtn.disabled = false;
      smoothBtn.textContent = '✨ تنعيم';
    }
  };

  function closeNotebook(){
    stopListening();
    overlay.remove();
  }

  cancelBtn.onclick = closeNotebook;
  overlay.onclick = (e) => {
    if(e.target === overlay) closeNotebook();
  };

  saveBtn.onclick = async () => {
    const raw = ta.value.trim();
    if(!raw){
      toast('النص فارغ');
      return;
    }

    let finalText = raw;
    const keys = getGeminiKeys();
    if(keys.length > 0 && raw.length > 10){
      const sp = document.getElementById('dictationSaveSpinner');
      if(sp) sp.style.display = 'inline-block';
      saveBtn.disabled = true;
      try {
        finalText = await smoothArabicTextWithGemini(raw);
      } catch(e){
        finalText = localTypographyFormat(raw);
      } finally {
        if(sp) sp.style.display = 'none';
        saveBtn.disabled = false;
      }
    } else {
      finalText = localTypographyFormat(raw);
    }

    closeNotebook();

    if(onSaveCallback){
      onSaveCallback(finalText);
      return;
    }

    if(mode === 'tracker'){
      await appendTrackerEntryDirect(finalText);
    } else {
      createNoteFromText(finalText);
      if(view === 'notes') renderNotes();
      toast('تم حفظ الملاحظة بنجاح 📝 ✓');
    }
  };

  // Launch listening on open
  startListening();
  setTimeout(() => { ta.focus(); }, 150);
}

async function appendTrackerEntryDirect(text){
  try {
    const trk = getTrackerData();
    const entry = {
      id: (crypto.randomUUID ? crypto.randomUUID() : ('act_' + Date.now())),
      text: text,
      loggedAt: new Date().toISOString()
    };
    trk.entries = trk.entries || [];
    trk.entries.unshift(entry);
    saveTrackerData(trk);
    if(typeof renderLifeTracker === 'function' && view === 'lifetracker') renderLifeTracker();
    toast('تم تدوين النشاط بنجاح 📈 ✓');
  } catch(e){
    toast('تم حفظ النص بنجاح');
  }
}

        style="flex:1;height:42px;border-radius:12px;border:1.5px solid var(--border);padding:0 12px;background:var(--surface);color:var(--text-1);font-family:inherit;font-size:13px;box-sizing:border-box"
        oninput="window._notesSearchQuery=this.value;renderNotes();const el=document.getElementById('notesSearchInput');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}">
      <button class="mini" data-act="openLiveDictationForNote" style="height:42px;padding:0 12px;border-radius:12px;white-space:nowrap;font-weight:700;display:flex;align-items:center;gap:4px;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D">
        <span>🎙️</span><span>تدوين حي</span>

        <span>＋</span><span>جديدة</span>
      </button>
    </div>

    ${!allNotes.length ? `
      <div class="card" style="padding:40px 16px;text-align:center">
        <div style="font-size:48px;margin-bottom:12px">📝</div>
        <b style="font-size:16px;color:var(--text-1)">لا توجد ملاحظات بعد</b>
        <p style="font-size:13px;color:var(--text-3);margin:8px 0 16px">دوّن خواطرك، أفكارك، وقوائمك صوتياً أو كتابياً لتصل إليها من جميع أجهزتك.</p>
        <div style="display:flex;justify-content:center;gap:8px">
          <button class="btn" data-act="openLiveDictationForNote" style="background:#FEF3C7;color:#92400E;border:1.5px solid #FCD34D">🎙️ ابدأ تدوين صوتي حي</button>

    ` : !filtered.length ? `
      <div class="card" style="padding:28px;text-align:center">

        <b style="font-size:15px;color:var(--text-1)">لم يتم العثور على نتائج</b>
        <p style="font-size:12.5px;color:var(--text-3);margin-top:4px">لا توجد ملاحظات تطابق «${esc(q)}»</p>

function renderNoteCardHtml(n, isDark){
  const bg = noteBgColor(n.color_index, isDark, n.id);
  const stamp = noteStampWeb(n.updated_at);
  const isPinned = !!n.pinned;
  const textColor = isDark ? '#F3F4F6' : '#1F2937';

  return `
    <div class="note-card" style="background:${bg};color:${textColor}" onclick="openNoteModal('${n.id}')">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:6px">
        ${n.title ? `<div class="note-card-title">${esc(n.title)}</div>` : '<div style="flex:1"></div>'}
        <button type="button" class="note-card-pin ${isPinned ? 'pinned' : ''}" onclick="event.stopPropagation();togglePinNote('${n.id}')" title="${isPinned ? 'إلغاء التثبيت' : 'تثبيت'}">
          ${isPinned ? '📌' : '📍'}
        </button>
      </div>

      ${n.body ? `<div class="note-card-body">${esc(n.body)}</div>` : ''}

      <div class="note-card-foot">
        <span>${stamp}</span>
        <div style="display:flex;align-items:center;gap:4px" onclick="event.stopPropagation()">
          <button type="button" class="link" onclick="copyNoteText('${n.id}')" title="نسخ" style="padding:2px;font-size:12px">📋</button>
          <button type="button" class="link" onclick="deleteNotePrompt('${n.id}')" title="حذف" style="padding:2px;font-size:12px;color:var(--error)">🗑️</button>
        </div>
      </div>
    </div>
  `;
}

  let currentTitle = existing ? existing.title : '';
  let currentBody = existing ? existing.body : '';
  let currentColorIndex = existing ? (existing.color_index || 0) : 0;
  let isPinned = existing ? !!existing.pinned : false;

  const modal = document.createElement('div');
  modal.id = 'noteEditModal';
  modal.className = 'dictation-modal-overlay';

  function renderModalContent(){
    const bg = noteBgColor(currentColorIndex, isDark, noteId || 'temp');

            </button>
            <button type="button" class="mini" id="noteModalMicBtn" style="font-size:13px;padding:4px 8px;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D" title="تدوين صوتي">
              🎙️ صوت
            </button>
            <button type="button" class="mini" id="noteModalSmoothBtn" style="font-size:13px;padding:4px 8px" title="تنعيم بـ Gemini">

          </div>

    modal.querySelector('#noteModalBackBtn').onclick = () => modal.remove();
    modal.querySelector('#noteModalCancelBtn').onclick = () => modal.remove();

    if(modal.querySelector('#noteModalDelBtn')){

          modal.remove();
          await deleteNotePrompt(existing.id);
        }
      };
    }

    modal.querySelector('#noteModalMicBtn').onclick = () => {
      openDictationNotebook({
        initialText: bodyInp.value,
        mode: 'custom',
        onSave: (spoken) => {
          currentBody = appendWithoutOverlap(currentBody, spoken);
          renderModalContent();
        }
      });
    };

    modal.querySelector('#noteModalSmoothBtn').onclick = async () => {
      const bText = bodyInp.value.trim();
      if(!bText){ toast('لا يوجد نص لتنعيمه'); return; }
      const btn = modal.querySelector('#noteModalSmoothBtn');
      btn.textContent = '⏳ ينعّم...';
      try {
        const smoothed = await smoothArabicTextWithGemini(bText);
        if(smoothed){
          currentBody = smoothed;
          renderModalContent();
          toast('تم تنعيم النص ✨');
        }
      } catch(e){
        toast('تعذّر التنعيم: ' + (e.message || 'خطأ'));
        btn.textContent = '✨ تنعيم';
      }
    };

    modal.querySelector('#noteModalSaveBtn').onclick = () => {
      const t = currentTitle.trim();
      const b = currentBody.trim();
      if(!t && !b){ toast('يرجى كتابة عنوان أو نص للملاحظة'); return; }
      if(existing){
        updateNoteItem(existing.id, {
          title: t,
          body: b,
          color_index: currentColorIndex,
          pinned: isPinned
        });
        toast('تم تحديث الملاحظة ✓');
      } else {
        const n = createNoteFromText(b, t, currentColorIndex);
        if(isPinned) updateNoteItem(n.id, { pinned: true });
        toast('تمت إضافة الملاحظة بنجاح ✓');
      }
      modal.remove();
      renderNotes();
    };
  }

  renderModalContent();
  document.body.appendChild(modal);
  modal.onclick = (e) => { if(e.target === modal) modal.remove(); };
  setTimeout(() => {
    const el = modal.querySelector(currentTitle ? '#noteEditBody' : '#noteEditTitle');
    if(el) el.focus();
  }, 100);
}

  ];
  const pop=document.createElement('div'); pop.id='addPop'; pop.className='add-pop';
  pop.innerHTML=items.map(it=>`<button class="add-row" data-act="${it[2]}" ${it[3]?`data-day="${it[3]}"`:''}><span class="add-ic">${it[0]}</span><span>${it[1]}</span></button>`).join('');
  document.body.appendChild(pop);
  
  const btn = anchorBtn || document.querySelector('[data-act="addMenu"]');
  if(btn){
    const r=btn.getBoundingClientRect();
    const popW = 210;
    let left = r.left;
    if(left + popW > window.innerWidth - 12){
      left = window.innerWidth - popW - 12;
    }
    if(left < 12) left = 12;
    pop.style.position = 'fixed';
    pop.style.left = left + 'px';
    pop.style.right = 'auto';
    const fitsBelow = (r.bottom + 420 <= window.innerHeight);
    if(fitsBelow){
      pop.style.top = (r.bottom + 6) + 'px';
    } else {
      pop.style.top = Math.max(12, r.top - 420) + 'px';
    }
  }
  pop.addEventListener('click',()=>setTimeout(()=>{const p=document.getElementById('addPop'); if(p) p.remove();},60));
  setTimeout(()=>{
    document.addEventListener('click',function h(ev){
      const p=document.getElementById('addPop');
      if(p && !p.contains(ev.target) && (!btn || !btn.contains(ev.target))){
        p.remove();
        document.removeEventListener('click',h);
      }
    },true);
  },60);
}

      due_at:due||null,recipients:null};
    await rest('POST','tasks',row,'return=minimal');
    try{ await rest('POST','activity_events',{id:uuid(),circle_id:sh.circle.id,user_id:meId(),kind:'REMINDER',payload:text}); }catch(e){}
    await refreshAll(); renderApp();
    const otherName = (sh.members.find(x=>x.m.user_id!==meId())||{}).p?.display_name || 'رفيقك';
    toast(mode === 'ask_him' ? `أُرسل طلب التذكير لـ ${otherName} 🙋‍♂️` : `أُرسل التذكير لـ ${otherName} 🔔`);
  }catch(e){ toast('تعذر الإرسال: '+(e&&e.message?e.message:'')); }
}

function openRemind(){

}

function friendly(e){ const m=String(e.message||e);
  if(m==='NO_SESSION') return 'انتهت الجلسة — سجّل الدخول من جديد';
  if(m.includes('Failed to fetch')||m.includes('NetworkError')) return 'تعذر الاتصال — تحقق من الإنترنت';
  if(m.includes('row-level security')||m.includes('42501')) return 'لا تملك صلاحية لهذه العملية';
  if(m.includes('JWT')||m.includes('401')) return 'انتهت الجلسة — حدّث الصفحة وسجّل الدخول';
  if(!/Cannot read|undefined|null|is not a function|TypeError/i.test(m)) return 'تعذرت العملية: '+m;
  return 'تعذر إتمام العملية — سنحاول مجددًا';
}

<script>
'use strict';
/* ---------- الأحداث + الإقلاع ---------- */
document.addEventListener('click', async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, v=el.dataset.v;
  try{
    switch(act){
      case 'tab':
        if(v === 'more' && view === 'more'){
          window._navRevealed = !window._navRevealed;
          renderNav();
          break;
        }
        view = v;
        window._navRevealed = false;
        renderApp();
        break;
      case 'revealNav':
        e.stopPropagation();
        window._navRevealed = true;
        renderNav();
        break;
      case 'closeNavReveal':
        window._navRevealed = false;
        renderNav();
        break;
      case 'openSecFromNav':
        window._navRevealed = false;
        pickSec(el.dataset.sec);
        break;
      case 'homeSpaceFilter': window._homeSpaceFilter=el.dataset.f; renderHome(); break;
      case 'activitySubTab': window._activitySubTab=el.dataset.tab; renderActivity(); break;
      case 'openSpaceMenu': openItemSpaceMenu(el.dataset.type, el.dataset.id); break;
      case 'setItemSpace': await setItemSpaceAction(el.dataset.type, el.dataset.id, el.dataset.space, el.dataset.compid); break;
      case 'openCompPicker': openCompanionPickerSheet(el.dataset.type, el.dataset.id); break;
      case 'setSpaceDrilldown': window._activeSpaceDrilldown=el.dataset.space; renderSpaces(); break;
      case 'clearSpaceDrilldown': window._activeSpaceDrilldown=null; renderSpaces(); break;
      case 'toggleSpaceSec': {
        const sec = el.dataset.sec;
        window._spacesCollapsed = window._spacesCollapsed || {};
        window._spacesCollapsed[sec] = !window._spacesCollapsed[sec];
        renderSpaces();
        break;
      }
      case 'toggleAllSpaceSecs': {
        window._spacesCollapsed = window._spacesCollapsed || {};
        const secs = ['tasks', 'habits', 'meds', 'shopping', 'food', 'bookmarks', 'places', 'media'];
        const allCol = secs.every(s => !!window._spacesCollapsed[s]);
        secs.forEach(s => { window._spacesCollapsed[s] = !allCol; });
        renderSpaces();
        break;
      }
      case 'toggleCompIntegration': toggleCompIntegration(); break;
      case 'quickAddTask': await quickAddTask(); break;
      case 'editItemFromSpace': {
        closeSheet();
        const t=el.dataset.type, id=el.dataset.id;
        if(t==='med') openEditMedSheet(id);
        else if(t==='bookmark'){
          const raw=(data.shopping||[]).find(x=>x.id===id);
          if(raw) openEditBookmarkModal(raw.id, raw.title, raw.note, raw.assigned_to);
        }
        else if(t==='shopping'||t==='food'||t==='dish'||t==='place'||t==='media'){
          const raw=(data.shopping||[]).find(x=>x.id===id);
          if(raw) openRename(id, raw.title);
        } else if(t==='task'){
          const raw=(data.tasks||[]).find(x=>x.id===id);
          if(raw){
            const nt=prompt('تعديل عنوان المهمة:', raw.title);
            if(nt && nt.trim() && nt.trim()!==raw.title){
              await rest('PATCH','tasks',{title:nt.trim(),updated_at:nowIso()},'id=eq.'+id);
              await refreshAll(); renderApp(); toast('تم تعديل المهمة ✓');
            }
          }
        } else if(t==='habit'){
          const raw=(data.items||[]).find(x=>x.id===id);
          if(raw){
            const nt=prompt('تعديل عنوان العادة:', raw.title);
            if(nt && nt.trim() && nt.trim()!==raw.title){
              await rest('PATCH','items',{title:nt.trim()},'id=eq.'+id);
              await refreshAll(); renderApp(); toast('تم تعديل العادة ✓');
            }
          }
        }
        break;
      }
      case 'delItemFromSpace': {
        if(!confirm('هل أنت متأكد من حذف هذا العنصر نهائياً؟')) break;
        const t=el.dataset.type, id=el.dataset.id;
        if(t==='task') await rest('DELETE','tasks','id=eq.'+id);
        else if(t==='habit'||t==='med') await rest('DELETE','items','id=eq.'+id);
        else await rest('DELETE','shared_list_items','id=eq.'+id);
        await refreshAll(); closeSheet(); renderApp(); toast('تم الحذف ✓');
        break;
      }
      case 'authMode': window._authMode=parseInt(v,10); window._authErr=''; renderAuthForms(); break;
      case 'acc': window._acc=v; renderAuthForms(); break;
      case 'openAddTask': openAddTask(); break;
      case 'openAddHabit': openAddHabit(); break;
      case 'saveTask': await saveTask(); break;
      case 'saveHabit': await saveHabit(); break;
      case 'incHabit': await incHabit(el.dataset.id); break;
      case 'binHabit': {
        const on=el.dataset.on==='1';
        if(on){ await (async()=>{ const item=data.items.find(i=>i.id===el.dataset.id);
          await rest('POST','progress_entries',{id:uuid(),item_id:el.dataset.id,user_id:meId(),value:item.target_value||1,unit:item.unit,recorded_at:nowIso()},'return=minimal');
          logAct(item.circle_id,'ITEM_COMPLETED',item.title); })(); }
        else await deleteTodayEntries(el.dataset.id);
        await refreshAll(); renderApp(); break; }
      case 'delItem': if(confirm('حذف هذا العنصر؟')){ await rest('DELETE','items','id=eq.'+el.dataset.id); await refreshAll(); renderApp(); } break;
      case 'shopAll': openShopAllSheet(); break;
      case 'addShop': await addShop(); break;

let __bootOk=false, __bootFailShown=false;
function bootFailed(msg, src){
  try{
    // نتجاهل أخطاء الإضافات أو أي مصدر خارجي، وأي خطأ بعد نجاح الإقلاع
    if(__bootOk) { console.warn('تجاهل خطأ خارجي:', msg); return; }
    if(src && src.indexOf('chrome-extension')>=0) return;
    if(src && /^https?:/.test(src) && location.host && src.indexOf(location.host)<0) return;
    if(src==='' && __bootOk) return;
    if(__bootFailShown) return; __bootFailShown=true;
    const v=document.getElementById('view'); if(!v) return;
    v.innerHTML='<div class="screen" style="padding-top:60px;text-align:center"><span style="font-size:38px">🌱</span>'+
      '<h1 style="margin:10px 0">تعذر فتح التطبيق</h1>'+
      '<p style="font-size:13px;color:var(--text-2);margin-bottom:14px">حدث خطأ غير متوقع — أعد التحميل وسيعمل.</p>'+
      '<button class="btn" style="max-width:240px;margin:0 auto" onclick="location.reload()">إعادة التحميل</button>'+
      '<p style="font-size:11px;color:var(--text-3);margin-top:12px">تفصيل: '+String(msg||'').slice(0,120)+'</p></div>';
  }catch(e){}
}

  ['urgent','🚨','مستعجلة']
];
function secSummary(k){
  try{
    const today=new Date().toISOString().slice(0,10), me=meId();
    const lc=t=>{
      const matching = (data&&data.sharedLists||[]).filter(x=>x.title===t);
      const mIds = new Set(matching.map(x=>x.id));
      return (data.shopping||[]).filter(i=>mIds.has(i.list_id)).length;
    };
    if(k==='lifetracker'){ const trk=getTrackerData(); const n=(trk.entries||[]).filter(e=>(e.loggedAt||'').startsWith(today)).length; return n? n+' نشاط اليوم':'سجل الأنشطة والعادات'; }
    if(k==='food'){ const l=(data&&data.sharedLists||[]).find(x=>x.title==='طعامنا اليومي'); const n=l? (data.shopping||[]).filter(i=>i.list_id===l.id&&(i.note||'').startsWith(today)).length:0; return n? n+' وجبة اليوم':'لا وجبات اليوم'; }
    if(k==='schedule'){ const n=(data&&data.tasks||[]).filter(t=>t.priority==='EVENT'&&(t.due_at||'')>=today).length; return n? n+' موعد قادم':'لا مواعيد'; }
    if(k==='notes'){ const n=getNotesList().filter(x=>!x.deleted).length; return n? n+' ملاحظة':'دفتر الخواطر والتدوين'; }
    if(k==='remind') return 'أرسل تذكيرًا';
    if(k==='habits'){ const n=habitsFor(me).length; return n? n+' عادة':'لا عادات'; }
    if(k==='proactive'){
      const h=new Date().getHours()+new Date().getMinutes()/60;
      if(h<10.5) return '🌅 الفجر والبكور';
      if(h<12.5) return '☀️ الضحى والصباح';
      if(h<15.5) return '☀️ الظهيرة والمنتصف';
      if(h<17.75) return '⛅ العصر والمساء';
      if(h<21.5) return '🌆 المغرب والعشاء';
      return '🌙 الليل والوتر';
    }
    if(k==='overdue'){ const n=(overdueTasks()||[]).length; return n? n+' متأخرة':'لا متأخرات'; }
    if(k==='reminders'){ const n=(data&&data.tasks||[]).filter(t=>t.priority==='REMINDER'&&t.assigned_to===me&&t.status!=='DONE').length; return n? n+' تذكير':'لا تذكيرات'; }
    if(k==='shopping'){
      const stores = getStoreLists();
      const totalUnc = stores.reduce((sum, s) => sum + getStoreUncompletedCount(s.id), 0);
      return totalUnc ? (totalUnc + ' عنصر مطلوب') : 'مكتملة';
    }
    if(k==='review') return 'ملخّص الأسبوع';
    if(k==='mood'){ const n=moodsOf().length; return n? n+' تسجيل':'لم يُسجّل'; }
    if(k==='meds'){
      const a = medsOf().filter(m => m.activeToday());
      return a.length ? (a.length + ' دواء نشط اليوم') : 'لا أدوية نشطة';
    }
    if(k==='places'){ const n=lc('أماكننا المحفوظة'); return n? n+' مكان':'لا أماكن'; }
    if(k==='media'){ const n=lc('مقاطعنا الجميلة'); return n? n+' مقطع':'لا مقاطع'; }
    if(k==='bookmarks'){ const n=lc('الإشارات المرجعية'); return n? n+' إشارة محفوظة':'لا إشارات'; }
    if(k==='urgent'){ const n=(data&&data.tasks||[]).filter(t=>isUrgentActive(t)).length; return n? n+' مستعجلة':'لا رسائل'; }
  }catch(e){}
  return '';
}
let activeSec=null;
function pickSec(k){
  if(k==='lifetracker'){ view='lifetracker'; renderApp(); return; }
  if(k==='shopping'){ view='shopping'; renderApp(); return; }
  if(k==='food'){ view='food'; renderApp(); return; }
  if(k==='meds'){ view='meds'; renderApp(); return; }
  if(k==='schedule'){ view='schedule'; renderApp(); return; }
  if(k==='notes'){ view='notes'; renderApp(); return; }
  if(k==='media'){ view='media'; renderApp(); return; }
  if(k==='places'){ view='places'; renderApp(); return; }
  if(k==='bookmarks' || k==='bookmark'){ view='bookmarks'; renderApp(); return; }
  if(k==='voice_urgent' || k==='urgent_partner'){ pickSec('urgent'); return; }
  const wasOn=activeSec===k;
  activeSec = wasOn ? null : k;
  applyCollapse();
  if(activeSec){
    const el=document.querySelector('[data-sec="'+activeSec+'"]');
    if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),60);
  }
}
function applyCollapse(){
  try{
    const viewEl=document.getElementById('view'); if(!viewEl) return;
    const isFiltered=Boolean(activeSec);
    const dash=document.getElementById('homeDashGrid');
    if(dash) dash.style.display=isFiltered?'none':'grid';
    const set=isFiltered? new Set(SEC_META.map(m=>m[0]).filter(k=>k!==activeSec)) : collapsedSet();
    const secs=[...viewEl.querySelectorAll('[data-sec]')];
    secs.forEach(el=>{
      const k=el.dataset.sec, isCol=set.has(k), isCard=el.classList.contains('card');
      if(isCard){ el.style.display=isCol?'none':''; }
      else {
        el.style.display=isCol?'none':'';
        let n=el.nextElementSibling;
        while(n && !n.hasAttribute('data-sec')){ n.style.display=isCol?'none':''; n=n.nextElementSibling; }
      }
      const host=isCard? el.firstElementChild : el;
      if(!host) return;
      let ch=host.querySelector('.rafiq-chev');
      if(!ch){
        ch=document.createElement('span');
        ch.className='rafiq-chev';
        ch.onclick=(e)=>{e.stopPropagation();toggleSec(k);};
        host.appendChild(ch);
      }
      ch.textContent=isCol?'▸':'▾';
      ch.title=isCol?'توسيع':'طي';
    });
    // شريط الأقسام: صف واحد أفقي أنيق مع التمرير الأفقي وأيقونة واضحة وكلمة واحدة
    const pills=document.getElementById('secPills');
    if(pills){
      const meta=SEC_META;
      const total=meta.length;
      pills.className='sec-pills-scroll' + (total <= 4 ? ' stretch' : '');
      pills.innerHTML=meta.map(m=>{
        const singleWord=(m[2]||'').trim().split(' ')[0];
        return `<button class="pill ${activeSec===m[0]?'on':''}" data-pill="${m[0]}" type="button">
          <span style="font-size:22px;line-height:1.2">${m[1]}</span>
          <span style="font-size:11.5px;font-weight:700;margin-top:3px">${singleWord}</span>
        </button>`;
      }).join('');
      pills.querySelectorAll('[data-pill]').forEach(b=>b.onclick=()=>{
        pickSec(b.dataset.pill);
        b.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      });
      if(activeSec){
        const onBtn=pills.querySelector('.pill.on');
        if(onBtn) onBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
      const note=document.getElementById('secNote');
      if(note){
        const m=SEC_META.find(x=>x[0]===activeSec);
        note.textContent = m? (m[1]+' '+m[2]+' — '+secSummary(m[0])) : 'اسحب أفقياً لتصفح كافة الأقسام ⇠⇢';
        note.style.display = 'block';
      }
    }
    // لوحة الأيقونات (الداشبورد)
    const grid=document.getElementById('collapseGrid');
    if(grid){
      grid.innerHTML=''; grid.style.display='none';
    }
    // شريط التحكم
    const bar=document.getElementById('collapseBar');
    if(bar){
      const any=[...secs].some(el=>!set.has(el.dataset.sec));
      bar.textContent=any?'طي الكل ▴':'توسيع الكل ▾';
      bar.onclick=()=>{ if(any) collapseAllSec(); else expandAllSec(); };
    }
  }catch(err){
    console.error('applyCollapse error:', err);
  }
}
(new MutationObserver(()=>applyCollapse())).observe(document.getElementById('view')||document.body,{childList:true});


/* ================= مشغّل المقاطع المنبثق (50%) ================= */
const RMP={el:null,video:null,id:null,url:null,title:null,openedAt:0,lastFocus:null,scrollY:0};
function rmpLog(e){ try{ const a=JSON.parse(localStorage.getItem('rafiq_play_log')||'[]'); a.unshift(e); localStorage.setItem('rafiq_play_log',JSON.stringify(a.slice(0,200))); }catch(x){} }
function rmpLast(id){ try{ const a=JSON.parse(localStorage.getItem('rafiq_play_log')||'[]'); return a.filter(x=>x.id===id)[0]||null; }catch(x){ return null; } }
function ytIdOf(u){ try{ if(u.includes('youtu.be/')) return u.split('youtu.be/')[1].split(/[?&]/)[0].slice(0,11);
  if(u.includes('shorts/')) return u.split('shorts/')[1].split(/[?&]/)[0].slice(0,11);
  if(u.includes('v=')) return u.split('v=')[1].split('&')[0].slice(0,11);
  if(u.includes('embed/')) return u.split('embed/')[1].split(/[?&]/)[0].slice(0,11); }catch(e){} return null; }
function twIdOf(u){
  try{
    if(!u) return null;
    const s = String(u).trim();
    if(!s.includes('twitter.com') && !s.includes('x.com') && !s.includes('fxtwitter.com') && !s.includes('vxtwitter.com')) return null;
    const m = s.match(/(?:status|statuses)\/(\d+)/);
    return m ? m[1] : null;
  }catch(e){ return null; }
}
function vimeoIdOf(u){
  try{
    if(!u || !u.includes('vimeo.com/')) return null;
    const m = String(u).match(/vimeo\.com\/(?:channels\/(?:\w+\/)?|groups\/[^\/]*\/videos\/|album\/(?:\d+\/)?video\/|video\/|)(\d+)/);
    return m ? m[1] : null;
  }catch(e){ return null; }
}
function isDirectMedia(u){ return /\.(mp4|webm|mov|m4v|mkv|ogv|ogg|mp3|m4a|wav|aac|flac)(\?|#|$)/i.test(u||''); }
function rmpFmt(s){ s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

function openPlayer(url,title,id){
  if(RMP.el) closePlayer(true);
  RMP.url=url||''; RMP.title=title||'مقطع'; RMP.id=id||String(Date.now()); RMP.openedAt=Date.now();
  RMP.lastFocus=document.activeElement; RMP.scrollY=window.scrollY;
  const prev=rmpLast(RMP.id); const startAt=(prev&&prev.position>3)?Math.floor(prev.position):0;
  const yt=ytIdOf(url), tw=twIdOf(url), vm=vimeoIdOf(url), direct=isDirectMedia(url);
  const isAudio=/\.(mp3|m4a|wav|aac|ogg|flac)(\?|#|$)/i.test(url);
  const back=document.createElement('div'); back.className='rmp-backdrop';
  back.setAttribute('role','dialog'); back.setAttribute('aria-modal','true');
  back.setAttribute('aria-label','مشغّل المقطع: '+(title||'مقطع'));

  let stage = '';
  let noteText = '';
  if (yt) {
    stage = `<iframe src="https://www.youtube-nocookie.com/embed/${yt}?autoplay=1&enablejsapi=1&start=${startAt}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="${esc(title||'مقطع')}"></iframe>`;
    noteText = 'تحكّم يوتيوب • الإغلاق: ✕ / Esc / النقر خارجها';
  } else if (tw) {
    stage = `<iframe src="https://platform.twitter.com/embed/Tweet.html?id=${tw}&theme=dark" allowfullscreen style="width:100%;height:100%;border:none;background:#000" title="${esc(title||'مقطع')}"></iframe>`;
    noteText = 'مقطع من X (تويتر) • الإغلاق: ✕ / Esc / النقر خارجها';
  } else if (vm) {
    stage = `<iframe src="https://player.vimeo.com/video/${vm}?autoplay=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="width:100%;height:100%;border:none;background:#000" title="${esc(title||'مقطع')}"></iframe>`;
    noteText = 'تحكّم فيميو • الإغلاق: ✕ / Esc / النقر خارجها';
  } else if (direct && !isAudio) {
    stage = `<video src="${esc(url)}" playsinline preload="metadata" data-start="${startAt}"></video>`;
    noteText = 'النافذة ٦٠٪ من مساحة العرض • الإغلاق: ✕ / Esc / النقر خارجها';
  } else if (direct && isAudio) {
    stage = `<div style="display:flex;align-items:center;justify-content:center;height:100%;background:#0B0C0D;padding:24px;flex-direction:column;gap:16px"><span style="font-size:46px">🎧</span><div style="font-weight:600;font-size:15px">${esc(title||'ملف صوتي')}</div><audio src="${esc(url)}" controls autoplay style="width:90%;max-width:440px"></audio></div>`;
    noteText = 'مشغّل صوتي • الإغلاق: ✕ / Esc / النقر خارجها';
  } else {
    stage = `<div class="rmp-err">
      <div style="font-size:38px;margin-bottom:4px">🎬</div>
      <b style="font-size:16px;color:#F2F2F0">${esc(title||'مقطع محفوظ')}</b>
      <span style="color:#A1A1AA;font-size:12.5px;max-width:85%;word-break:break-all;direction:ltr;unicode-bidi:embed">${esc((url||'').slice(0,100))}</span>
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center">
        <a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="rmp-btn" style="text-decoration:none;background:var(--accent);color:#0F172A;font-weight:700;padding:10px 20px;border-radius:10px;display:inline-flex;align-items:center;gap:6px">
          <span>🌐</span> فتح الرابط في نافذة جديدة
        </a>
        <button class="rmp-btn" data-rmp="copy" style="padding:10px 16px;border-radius:10px">📋 نسخ الرابط</button>
      </div>
    </div>`;
    noteText = 'رابط خارجي • يمكنك فتحه في نافذة جديدة أو نسخه';
  }

  const hasControls = direct && !isAudio;
  back.innerHTML=`<div class="rmp-panel">
    <div class="rmp-head">
      <span class="rmp-title">🎬 ${esc(title||'مقطع')}</span>
      <a href="${esc(url)}" target="_blank" rel="noopener noreferrer" title="فتح الرابط في نافذة جديدة" style="color:#A1A1AA;text-decoration:none;font-size:12px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.06);display:inline-flex;align-items:center;gap:4px"><span>↗</span> فتح أصلي</a>
      <button class="rmp-x" data-rmp="close" aria-label="إغلاق المشغّل (Esc)">✕</button>
    </div>
    <div class="rmp-stage">${stage}</div>
    ${hasControls?`<div class="rmp-controls">
      <button class="rmp-btn" data-rmp="play" aria-label="تشغيل/إيقاف (مسافة)">▶︎</button>
      <input class="rmp-seek" type="range" min="0" max="1000" value="0" data-rmp="seek" aria-label="شريط التقدم">
      <span class="rmp-time" data-rmp="time" aria-live="off">0:00 / 0:00</span>

    <div class="rmp-note">${noteText}</div></div>`;
  document.body.appendChild(back); document.body.style.overflow='hidden'; RMP.el=back;
  rmpLog({id:RMP.id,url:RMP.url,title:RMP.title,opened:new Date().toISOString(),position:startAt,event:'open'});
  if(hasControls) rmpWire(back.querySelector('video'), back);
  else if(yt||tw||vm){
    RMP.video=null;
  }
  back.addEventListener('click',ev=>{ if(ev.target===back) closePlayer(); });
  back.addEventListener('click',ev=>{ const b=ev.target.closest('[data-rmp]'); if(!b) return;
    const act=b.getAttribute('data-rmp');
    if(act==='close') closePlayer();
    else if(act==='play'||act==='mute'||act==='fs'||act==='retry'||act==='copy') rmpAct(act,b);
  });
  const focusables=back.querySelectorAll('button,input,iframe,a');
  if(focusables.length) focusables[0].focus();
  setTimeout(()=>{ if(RMP.video){ const v=RMP.video; v.play().catch(()=>{}); } },60);
}

function rmpAct(act,btn){
  const v=RMP.video;
  if(act==='copy'){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(RMP.url).then(()=>{ toast('تم نسخ الرابط ✓'); }).catch(()=>{ toast('الرابط: '+RMP.url); });
    } else {
      toast('الرابط: '+RMP.url);
    }
    return;
  }
  if(!v && act!=='retry') { if(act==='retry') openPlayer(RMP.url,RMP.title,RMP.id); return; }
  if(act==='play'){ if(v.paused){ v.play().catch(()=>{}); } else { v.pause(); } }
  if(act==='mute'){ v.muted=!v.muted; btn.setAttribute('aria-pressed', v.muted?'true':'false'); btn.textContent = v.muted?'🔇':'🔊'; }
  if(act==='fs'){ const p=RMP.el.querySelector('.rmp-panel'); if(document.fullscreenElement){ document.exitFullscreen(); } else if(p.requestFullscreen){ p.requestFullscreen().catch(()=>{}); } }
  if(act==='retry'){ openPlayer(RMP.url,RMP.title,RMP.id); }
}

function rmpWire(v,panel){
  RMP.video=v;
  const play=panel.querySelector('[data-rmp="play"]'), seek=panel.querySelector('[data-rmp="seek"]'),
        time=panel.querySelector('[data-rmp="time"]'), vol=panel.querySelector('[data-rmp="vol"]'), mute=panel.querySelector('[data-rmp="mute"]');
  const sync=()=>{ if(v.duration){ seek.value=String(Math.round(v.currentTime/v.duration*1000)); time.textContent=rmpFmt(v.currentTime)+' / '+rmpFmt(v.duration); } };
  v.addEventListener('loadedmetadata',()=>{ const st=parseInt(v.getAttribute('data-start')||'0',10); if(st>0) v.currentTime=st; sync(); });
  v.addEventListener('timeupdate',sync);
  v.addEventListener('play',()=>{ play.textContent='⏸'; });
  v.addEventListener('pause',()=>{ play.textContent='▶︎'; });
  v.addEventListener('error',()=>{ const st=panel.querySelector('.rmp-stage'); st.innerHTML='<div class="rmp-err"><b>تعذّر تحميل المقطع</b><span>تحقق من الرابط أو الاتصال ثم أعد المحاولة.</span><button class="rmp-btn" data-rmp="retry">إعادة المحاولة</button></div>'; });
  seek.addEventListener('input',()=>{ if(v.duration) v.currentTime=(+seek.value/1000)*v.duration; });
  vol && vol.addEventListener('input',()=>{ v.volume=(+vol.value)/100; v.muted=(+vol.value===0); if(mute){ mute.setAttribute('aria-pressed', v.muted?'true':'false'); mute.textContent=v.muted?'🔇':'🔊'; } });
}

function closePlayer(silent){
  const v=RMP.video;
  if(v){ v.pause(); try{ v.removeAttribute('src'); v.load(); }catch(e){} }
  if(RMP.el){ RMP.el.remove(); RMP.el=null; RMP.video=null; document.body.style.overflow=''; }
  if(!silent){
    rmpLog({id:RMP.id,url:RMP.url,title:RMP.title,opened:new Date(RMP.openedAt).toISOString(),closed:new Date().toISOString(),position:(v&&v.currentTime)||0,event:'close'});
    window.scrollTo(0,RMP.scrollY||0);
    try{ if(RMP.lastFocus&&RMP.lastFocus.focus) RMP.lastFocus.focus(); }catch(e){}
  }
}

document.addEventListener('keydown',ev=>{
  if(!RMP.el) return;
  if(ev.key==='Escape'){ ev.preventDefault(); closePlayer(); return; }
  const v=RMP.video;
  if(ev.key===' '||ev.code==='Space'){ ev.preventDefault(); if(v){ v.paused? v.play().catch(()=>{}) : v.pause(); } return; }
  if(v && (ev.key==='ArrowRight'||ev.key==='ArrowLeft')){ ev.preventDefault(); v.currentTime=Math.max(0,v.currentTime+(ev.key==='ArrowRight'?5:-5)); return; }
  if(v && (ev.key==='m'||ev.key==='M')){ const b=RMP.el.querySelector('[data-rmp="mute"]'); rmpAct('mute',b); return; }
  if(ev.key==='Tab'){ // حصر التركيز داخل النافذة
    const f=[...RMP.el.querySelectorAll('button,input,iframe,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled);
    if(!f.length) return; const first=f[0],last=f[f.length-1];
    if(ev.shiftKey && document.activeElement===first){ ev.preventDefault(); last.focus(); }
    else if(!ev.shiftKey && document.activeElement===last){ ev.preventDefault(); first.focus(); }
  }
});

// تسجيل عامل الخدمة Service Worker مع الكشف الفوري عن التحديثات
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then((reg) => {
      console.log('[PWA] Service Worker registered:', reg.scope);
      // فحص أحدث إصدار دورياً
      if (reg.update) reg.update();
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if (newWorker) {
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              console.log('[PWA] New version ready! Reloading...');
              window.location.reload();
            }
          });
        }
      });
    }).catch((err) => {
      console.warn('[PWA] Service Worker registration failed:', err);
    });

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });
  });
}

(async function boot(){
  if(!session){ renderAuth(); return; }
  try{
    // 1) عرض فوري من آخر لقطة (بلا أي انتظار شبكة)
    const snap=loadSnap();
    if(snap && snap.profile){ data=snap; renderApp(); __bootOk=true; }
    // 2) الشبكة في الخلفية
    if(session.expires_at&&session.expires_at-Date.now()<120000) await refreshSession().catch(()=>{});
    await ensureProfile().catch(()=>{});
    await refreshAll().catch(()=>{});
    renderApp(); __bootOk=true; startPolling();
    if(pendingJoin){ setTimeout(()=>openJoinSheet(pendingJoin),400); }
  }catch(e){
    console.error('[boot error]', e);
    if(e && (e.message==='NO_SESSION' || e.status===401 || (e.message||'').includes('401'))){
      session=null; saveSession(); renderAuth();
      window._authErr='انتهت الجلسة — سجّل الدخول من جديد';
      renderAuthForms();
    } else {
      renderApp();
    }
  }
})();
