<script>
'use strict';
const TABS=[['home','الرئيسية','🏠'],['activity','النشاط','⚡'],['lifetracker','متتبع العادات','📈'],['spaces','المساحات','🌐'],['more','الإعدادات','⚙️']];

function allCompanions(){
  const me=meId();
  const comps=[];
  const seen=new Set();
  (circlesOf()||[]).forEach(ci=>{
    (ci.members||[]).forEach(m=>{
      if(m&&m.m&&m.m.user_id!==me&&!seen.has(m.m.user_id)){
        seen.add(m.m.user_id);
        if(m.p) comps.push(m.p);
      }
    });
  });
  return comps;
}

function getItemSpace(type, item){
  if(!item) return 'shared';
  const me=meId();

  if(type==='task'){
    if(item.assigned_to && item.assigned_to!==me) return 'companion';
    if(item.visibility==='PRIVATE' || (item.assigned_to===me && item.visibility!=='CIRCLE')) return 'me';
    if(item.recipients && item.recipients.length===1 && item.recipients[0]!==me) return 'companion';
    return 'shared';
  }

  if(type==='habit' || type==='item'){
    const f=item.frequency||'';
    if(f.startsWith('MED|')){
      const p=(typeof parseMed==='function')?parseMed(item):null;
      if(p){
        if(p.patient==='companion') return 'companion';
        if(p.patient==='both') return 'shared';
        return 'me';
      }
    }
    if(item.visibility==='PRIVATE'){
      return (item.owner_id && item.owner_id!==me)? 'companion' : 'me';
    }
    if(item.recipients && Array.isArray(item.recipients) && item.recipients.length===1 && item.recipients[0]!==me){
      return 'companion';
    }
    return 'shared';
  }

  if(type==='med'){
    const pat=item.patient || ((typeof parseMed==='function')?(parseMed(item.item||item)||{}).patient:'');
    if(pat==='companion') return 'companion';
    if(pat==='both') return 'shared';
    return 'me';
  }

  if(type==='shopping' || type==='food' || type==='dish' || type==='place' || type==='media' || type==='bookmark' || type==='shared_list_item'){
    if(type!=='bookmark' && item.assigned_to){
      return item.assigned_to===me? 'me' : 'companion';
    }
    const note=item.note||'';
    if(note.includes('SPACE:me') || note.includes('SPACE|me')) return 'me';
    if(note.includes('SPACE:companion') || note.includes('SPACE:comp') || note.includes('SPACE|comp')) return 'companion';
    if(note.includes('SPACE:shared') || note.includes('SPACE|shared')) return 'shared';
    return 'shared';
  }

  return 'shared';
}

function spaceMeta(sp){
  if(sp==='me') return { key:'me', label:'خاص بي', shortLabel:'أنا', emoji:'🟢', color:'var(--space-me)', bg:'var(--space-me-soft)', stripe:'space-stripe-me', badgeCls:'space-badge-me' };
  if(sp==='companion') return { key:'companion', label:'خاص برفيقي', shortLabel:'رفيقي', emoji:'🟠', color:'var(--space-comp)', bg:'var(--space-comp-soft)', stripe:'space-stripe-comp', badgeCls:'space-badge-comp' };
  return { key:'shared', label:'مشترك بيننا', shortLabel:'كلانا', emoji:'🔵', color:'var(--space-shared)', bg:'var(--space-shared-soft)', stripe:'space-stripe-shared', badgeCls:'space-badge-shared' };
}

function spaceDot(sp, size=8){

function renderNav(){

  if(window._navRevealed){
    const colSet = typeof collapsedSet === 'function' ? collapsedSet() : new Set();

function renderApp(){
  const p=meProfile();
  document.documentElement.dataset.accent=(p&&p.accent_theme==='rose')?'rose':'green';
  document.documentElement.dataset.theme=(localStorage.getItem('rafiq_web_dark')==='on')?'dark':'light';
  applyAppFont(localStorage.getItem('rafiq_web_font') || 'system');
  renderNav();
  const routes = {
    home: renderHome,
    activity: renderActivity,
    spaces: renderSpaces,
    lifetracker: renderLifeTracker,
    habits: renderHabits,
    stats: renderStats,
    tasks: renderTasks,
    more: renderMore,
    schedule: renderSchedule,
    food: renderFood,
    shopping: renderShopping,
    meds: renderMeds,
    media: renderMedia,
    places: renderPlaces,
    bookmarks: renderBookmarks,
    notes: renderNotes
  };
  (routes[view] || renderHome)();
}
function ringSVG(pct,cls){
  const r=34,c=(2*Math.PI*r).toFixed(1),off=(c*(1-Math.min(100,Math.max(0,pct))/100)).toFixed(1);
  return `<div class="ring"><svg width="80" height="80" viewBox="0 0 80 80">
    <circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--ring-track)" stroke-width="7"/>
    <circle class="${cls}" cx="40" cy="40" r="${r}" fill="none" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" ${cls==='own'?`stroke="var(--accent)"`:`stroke="var(--companion)"`}/>
  </svg><div class="lbl">${pct}%</div></div>`;
}

function getCustomProactiveCards(){
  try {
    const raw = localStorage.getItem('rafiq_proactive_custom_cards');
    if(!raw) return [];
    return JSON.parse(raw);
  } catch(e) {
    return [];
  }
}
function saveCustomProactiveCards(cards){
  try {
    localStorage.setItem('rafiq_proactive_custom_cards', JSON.stringify(cards));
  } catch(e){}
}
function addCustomProactiveCard(c){
  const cards = getCustomProactiveCards();
  cards.push(c);
  saveCustomProactiveCards(cards);
  if(view === 'home') renderHome();
  toast('تمت إضافة البطاقة المخصصة بنجاح ✓');
}
function removeCustomProactiveCard(id){
  const cards = getCustomProactiveCards().filter(c => c.id !== id);
  saveCustomProactiveCards(cards);
  if(view === 'home') renderHome();
  toast('تم حذف البطاقة المخصصة');
}

  const newCard = {

    isCustom: true
  };
  addCustomProactiveCard(newCard);
  closeModal();
  openCustomizeProactiveSheet();
}

let proactiveCycleIndex = 0;
function resolveProactiveInfo(){
  const h = new Date().getHours() + new Date().getMinutes()/60;
  let phaseKey = 'dawn';
  let phaseTitle = 'الفجر والبكور';
  let phaseEmoji = '🌅';
  if(h >= 10.5 && h < 12.5){
    phaseKey = 'forenoon';
    phaseTitle = 'الضحى والصباح';
    phaseEmoji = '☀️';
  } else if(h >= 12.5 && h < 15.5){
    phaseKey = 'noon';
    phaseTitle = 'الظهيرة والمنتصف';
    phaseEmoji = '☀️';
  } else if(h >= 15.5 && h < 17.75){
    phaseKey = 'afternoon';
    phaseTitle = 'العصر وبداية المساء';
    phaseEmoji = '⛅';
  } else if(h >= 17.75 && h < 21.5){
    phaseKey = 'evening';
    phaseTitle = 'المساء والمغرب والعشاء';
    phaseEmoji = '🌆';
  } else if(h >= 21.5 || h < 4){
    phaseKey = 'night';
    phaseTitle = 'الليل والوتر والنوم';
    phaseEmoji = '🌙';
  }
  const baseList = PROACTIVE_PHASE_SUGGESTIONS[phaseKey] || PROACTIVE_PHASE_SUGGESTIONS.dawn;
  const customList = getCustomProactiveCards().filter(c => !c.phase || c.phase === phaseKey || c.phase === 'all');
  const list = [...baseList, ...customList];
  const total = Math.max(1, list.length);
  const idx = ((proactiveCycleIndex % total) + total) % total;
  return {
    phaseKey,
    phaseTitle,
    phaseEmoji,
    suggestion: list[idx] || baseList[0],
    currentIndex: idx,
    total
  };
}

function proactiveCycle(dir, ev){
  if(ev) ev.stopPropagation();
  proactiveCycleIndex += dir;
  if(view === 'home') renderHome();
}

let proactiveTouchStartX = 0;
function onProactiveTouchStart(ev){
  if(ev.touches && ev.touches[0]){
    proactiveTouchStartX = ev.touches[0].clientX;
  }
}
function onProactiveTouchEnd(ev){
  if(ev.changedTouches && ev.changedTouches[0]){
    const deltaX = ev.changedTouches[0].clientX - proactiveTouchStartX;
    if(deltaX > 35){
      proactiveCycle(-1);
    } else if(deltaX < -35){
      proactiveCycle(1);
    }
  }
}

function normalizeDashboardKeys(list){
  const valid = (list||[]).filter(k => DASH_TILES[k]);
  const hasProactive = valid.includes('proactive');
  const others = valid.filter(k => k !== 'proactive');
  return hasProactive ? ['proactive', ...others] : (others.length ? others : ['food', 'schedule', 'habits', 'urgent']);
}

function getDashboardKeys(){
  try {
    const raw = localStorage.getItem('rafiq_dashboard_keys');
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length > 0){
        return normalizeDashboardKeys(parsed);
      }
    }
  }catch(e){}
  return ['food', 'schedule', 'habits', 'urgent'];
}

function setDashboardKeys(keys){
  const finalKeys = normalizeDashboardKeys(keys);
  localStorage.setItem('rafiq_dashboard_keys', JSON.stringify(finalKeys));
  if(view === 'home') renderHome();
}

function unpinFromDashboard(key, ev){
  if(ev) ev.stopPropagation();
  const keys = getDashboardKeys();
  if(keys.length <= 1){
    toast('يجب إبقاء بطاقة واحدة على الأقل');
    return;
  }
  const next = keys.filter(k => k !== key);
  setDashboardKeys(next);
  const meta = DASH_TILES[key];
  toast(`أُزيلت «${meta ? meta.title : key}» من لوحتك ✓`);
}

let isDashReorderMode = false;
function toggleDashReorderMode(){
  isDashReorderMode = !isDashReorderMode;
  if(view === 'home') renderHome();
}

function reorderDashboardCards(fromKey, toKey){
  if(fromKey === 'proactive' || toKey === 'proactive' || fromKey === toKey) return;
  const keys = [...getDashboardKeys()];
  const hasProactive = keys[0] === 'proactive';
  const others = keys.filter(k => k !== 'proactive');
  const fromIdx = others.indexOf(fromKey);
  const toIdx = others.indexOf(toKey);
  if(fromIdx >= 0 && toIdx >= 0){
    const item = others.splice(fromIdx, 1)[0];
    others.splice(toIdx, 0, item);
    const result = hasProactive ? ['proactive', ...others] : others;
    setDashboardKeys(result);
  }
}

let dashDraggedKey = null;
function handleDashDragStart(ev, key){
  if(key === 'proactive') { ev.preventDefault(); return; }
  dashDraggedKey = key;
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', key);
  setTimeout(() => { if(ev.target) ev.target.classList.add('dash-dragging'); }, 0);
}
function handleDashDragOver(ev, key){
  if(dashDraggedKey && dashDraggedKey !== key && key !== 'proactive'){
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'move';
  }
}
function handleDashDrop(ev, targetKey){
  ev.preventDefault();
  if(dashDraggedKey && dashDraggedKey !== targetKey && targetKey !== 'proactive'){
    reorderDashboardCards(dashDraggedKey, targetKey);
  }
  dashDraggedKey = null;
}
function handleDashDragEnd(ev){
  if(ev.target) ev.target.classList.remove('dash-dragging');
  dashDraggedKey = null;
}

let touchDragCardKey = null;
let touchDragTargetKey = null;
function handleDashTouchStart(ev, key){
  if(!isDashReorderMode || key === 'proactive') return;
  touchDragCardKey = key;
}
function handleDashTouchMove(ev, key){
  if(!touchDragCardKey) return;
  const touch = ev.touches[0];
  const elUnder = document.elementFromPoint(touch.clientX, touch.clientY);
  const cardUnder = elUnder ? elUnder.closest('[data-dash-card]') : null;
  if(cardUnder){
    const targetKey = cardUnder.getAttribute('data-dash-card');
    if(targetKey && targetKey !== touchDragCardKey && targetKey !== 'proactive'){
      touchDragTargetKey = targetKey;
    }
  }
}
function handleDashTouchEnd(ev, key){
  if(touchDragCardKey && touchDragTargetKey && touchDragCardKey !== touchDragTargetKey){
    reorderDashboardCards(touchDragCardKey, touchDragTargetKey);
  }
  touchDragCardKey = null;
  touchDragTargetKey = null;
}

  const keys = getDashboardKeys();

  if(idx >= 0){
    if(keys.length <= 1){

    keys.splice(idx, 1);

function onDashboardCardClick(key){
  if(isDashReorderMode) return;
  if(key === 'food') { view = 'food'; renderApp(); }
  else if(key === 'schedule') { view = 'schedule'; renderApp(); }
  else if(key === 'habits') { view = 'habits'; renderApp(); }
  else if(key === 'shopping') { view = 'shopping'; renderApp(); }
  else if(key === 'meds') { view = 'meds'; renderApp(); }
  else if(key === 'lifetracker') { view = 'lifetracker'; renderApp(); }
  else if(key === 'media') { view = 'media'; renderApp(); }
  else if(key === 'places') { view = 'places'; renderApp(); }
  else if(key === 'bookmarks' || key === 'bookmark') { view = 'bookmarks'; renderApp(); }
  else if(key === 'proactive') { openProactiveCard(); }
  else { pickSec(key); }
}

function onDashboardCardAction(key, ev){
  if(ev) ev.stopPropagation();
  const item = DASH_TILES[key];
  if(!item) return;
  switch(item.actionAct){
    case 'openProactiveCard': openProactiveCard(); break;
    case 'openMealSheet': openMealSheet(); break;
    case 'openAddEvent': openAddEvent(); break;
    case 'gotoHabits': view = 'habits'; renderApp(); break;
    case 'openUrgentSheet': openUrgentSheet(); break;
    case 'openQuickAddShopping': openQuickAddShopping(); break;
    case 'openRemindSheet': openRemind(); break;
    case 'openSmartAddLink': openSmartAddLink(); break;
    case 'gotoMeds': view = 'meds'; renderApp(); break;
    case 'openAddMood': openAddMood(); break;
    case 'openAddPlace': openAddPlace(); break;
    case 'openAddMedia': openAddMedia(); break;
    case 'openAddBookmarkModal': openAddBookmarkModal(); break;
    case 'pickSecOverdue': pickSec('overdue'); break;
    case 'openReviewSheet': openReview(); break;
    case 'openLifeTracker': openLifeTracker(); break;
    default: pickSec(key); break;
  }
}

/* ---------- قوائم التسوق والمتاجر (Shopping & Stores) ---------- */
const RESERVED_SHOPPING_TITLES = ['طعامنا اليومي', 'أطباق نحبها', 'أماكننا المحفوظة', 'مقاطعنا الجميلة', 'الإشارات المرجعية', '__سلة المحذوفات__'];
window._activeStoreTab = 'ALL';

function getStoreLists(){
  if(!data || !data.sharedLists) return [];
  return data.sharedLists.filter(l => !RESERVED_SHOPPING_TITLES.includes(l.title) && !l.title.includes('سلة المحذوفات'));
}

function getPastBoughtItems(){
  const storeIds = new Set(getStoreLists().map(s => s.id));
  const past = (data.shopping || []).filter(i => storeIds.has(i.list_id) && i.completed).map(i => i.title);
  return [...new Set(past)].slice(0, 15);
}

function getStoreUncompletedCount(listId){
  return (data.shopping || []).filter(i => i.list_id === listId && !i.completed).length;
}

function shoppingFor(){
  const stores = getStoreLists();
  if(!stores.length) return null;
  const allStoreIds = new Set(stores.map(s => s.id));
  const items = (data.shopping || []).filter(i => allStoreIds.has(i.list_id)).sort((a,b)=>(a.completed-b.completed)||(a.position-b.position));
  return {
    stores,
    items,
    done: items.filter(i => i.completed).length,
    pending: items.filter(i => !i.completed)
  };
}

function shopRow(si){
  const by = si.completed && si.completed_by ? nameOf(si.completed_by) : null;
  const store = getStoreLists().find(s => s.id === si.list_id);
  const sp = getItemSpace('shopping', si);
  const sm = spaceMeta(sp);
  return `<div class="row ${sm.stripe}"><button class="check ${si.completed?'on':''}" data-act="toggleShop" data-id="${si.id}">✓</button>
    <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:center;gap:6px">
        ${spaceDot(sp)}
        <div class="htitle" style="${si.completed?'color:var(--text-3);text-decoration:line-through':''}">${esc(si.title)}</div>
        <span class="${sm.badgeCls}">${sm.emoji}</span>
      </div>
      <div class="shop-meta">${store?`<span style="color:var(--accent-dark);font-weight:600">📍 ${esc(store.title)}</span> • `:''}${si.completed&&by?`أنجزها ${esc(by)} • ${relAr(si.completed_at)}`:''}</div>
    </div>
    <button class="link" style="padding:0 6px" data-act="renameItem" data-id="${si.id}" data-t="${esc(si.title)}">تسمية</button>
    ${spaceMenuBtn('shopping', si.id)}
    <button class="link" style="color:var(--error);padding:0 6px;font-size:16px" data-act="delShop" data-id="${si.id}">✕</button></div>`;
}

async function quickReaddShopping(title){
  const stores = getStoreLists();
  let targetListId = (window._activeStoreTab && window._activeStoreTab !== 'ALL') ? window._activeStoreTab : (stores[0] ? stores[0].id : null);
  if(!targetListId){
    const sh = sharedFirst();
    const cid = sh ? sh.circle.id : ((data.circles || []).find(c => c.circle.type === 'PERSONAL') || {}).circle?.id;
    if(!cid){ toast('تحتاج دائرة أولاً'); return; }
    const nl = await ensureList('عام', cid);
    targetListId = nl.id;
  }
  try {
    await rest('POST', 'shared_list_items', { id: uuid(), list_id: targetListId, title: title, completed: false }, 'return=minimal');
    await refreshAll();
    renderApp();
    toast('أُضيف: ' + title + ' ✓');
  } catch(e) {
    toast(friendly(e));
  }
}

  openSheet(sheetHead('🛒 متجر / قائمة تسوق جديدة') + `

    <p style="font-size:12px;color:var(--text-3);margin-bottom:12px">تُشارك هذه القائمة تلقائيًا مع رفيقك في الدائرة المشتركة.</p>
    <button class="btn" data-act="saveNewStore">إنشاء المتجر</button>`);

}

async function saveNewStore(){
  const inp = $('#newStoreTitle');
  const title = ((inp && inp.value) || '').trim();
  if(!title){ toast('اكتب اسم المتجر'); return; }
  try {
    const sh = sharedFirst();
    const cid = sh ? sh.circle.id : ((data.circles || []).find(c => c.circle.type === 'PERSONAL') || {}).circle?.id;

/* ---------- جدولي (تقويم) ---------- */
function eventsOf(){
  const me=meId(); if(!data) return [];
  const myCircleIds=(data.circles||[]).map(c=>c.circle.id);
  return (data.tasks||[]).filter(t=>t.priority==='EVENT' && myCircleIds.includes(t.circle_id) && (
    t.owner_id===me || t.visibility==='CIRCLE' ||
    (t.visibility==='SELECTED_MEMBERS' && (t.recipients||[]).includes(me))));
}
function evDate(t){ try{ return t.due_at? new Date(t.due_at) : null; }catch(e){ return null; } }
function evTimeText(t){ const d=evDate(t); if(!d) return ''; return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
const AR_MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
let schedMonth=null;
function renderSchedule(){
  if(typeof renderNav === "function") renderNav();
  const evs=eventsOf();
  if(!schedMonth){ const n=new Date(); schedMonth=new Date(n.getFullYear(), n.getMonth(), 1); }
  const y=schedMonth.getFullYear(), m=schedMonth.getMonth();
  const first=new Date(y,m,1);
  const lead=(first.getDay()+1)%7;
  const days=new Date(y,m+1,0).getDate();
  const cells=[]; for(let i=0;i<lead;i++) cells.push(null);
  for(let d=1;d<=days;d++) cells.push(d);
  while(cells.length%7) cells.push(null);
  const today=new Date();
  const upcoming=evs.filter(t=>evDate(t) && evDate(t)>=new Date(today.getFullYear(),today.getMonth(),today.getDate()))
    .sort((a,b)=>new Date(a.due_at)-new Date(b.due_at)).slice(0,6);
  const iso=(d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  $('#view').innerHTML=`<div class="screen">
    <div class="row" style="min-height:44px;border-top:none">
      <button class="link" data-act="goHome">➜ رجوع</button>
      <b style="flex:1;text-align:center;font-size:18px">📅 جدولي</b>
      <button class="link" data-act="addEvent" data-day="${iso(today.getDate())}">+ موعد</button>
    </div>
    <p style="font-size:12px;color:var(--text-3);margin-bottom:10px">تقويمك أنت — خصّص كل موعد: خاصًا، أو للدائرة، أو لأشخاص محددين.</p>
    <div class="card">
      <div class="row" style="min-height:36px;border-top:none">
        <button class="link" data-act="prevMonth">◀</button>
        <b style="flex:1;text-align:center">${AR_MONTHS[m]} ${y}</b>
        <button class="link" data-act="nextMonth">▶</button>
      </div>
      <div style="display:flex">${['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'].map(d=>`<div style="flex:1;text-align:center;font-size:10px;color:var(--text-3)">${d}</div>`).join('')}</div>
      ${cells.reduce((acc,_,i)=>{ if(i%7===0) acc.push([]); acc[acc.length-1].push(cells[i]); return acc; },[])
        .map(week=>`<div style="display:flex;gap:4px;margin-top:4px">${week.map(d=>{
          if(d===null) return '<div style="flex:1;height:42px"></div>';
          const dt=new Date(y,m,d); const isToday=dt.toDateString()===today.toDateString();
          const n=evs.filter(t=>evDate(t)&&evDate(t).toDateString()===dt.toDateString()).length;
          return `<div data-act="schedDay" data-day="${iso(d)}" style="flex:1;height:42px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:${isToday?'var(--accent-soft)':'transparent'}">
            <span style="font-size:13px;color:${isToday?'var(--accent-dark)':'var(--text-1)'};font-weight:${n?'700':'400'}">${d}</span>
            <span style="display:flex;gap:2px;height:6px">${'<i style="width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block"></i>'.repeat(Math.min(n,3))}</span></div>`;
        }).join('')}</div>`).join('')}
    </div>
    <div class="sec"><h2>مواعيد قادمة</h2></div>
    <div class="card">${upcoming.length? upcoming.map(t=>`<div class="row">
      <div style="text-align:center;min-width:52px"><div style="font-size:12px;font-weight:700;color:var(--accent-dark)">${evTimeText(t)}</div>
      <div style="font-size:10px;color:var(--text-3)">${new Date(t.due_at).toLocaleDateString('ar')}</div></div>
      <div style="flex:1;min-width:0"><div class="htitle">${spaceDot(getItemSpace('task', t))}${esc(t.title)}</div>
      <div class="badges"><span class="badge">${esc(nameOf(t.owner_id))}</span>
      <span class="badge">${t.visibility==='PRIVATE'?'🔒 خاص':t.visibility==='CIRCLE'?'👥 الدائرة':'@ محددون'}</span></div></div>
      ${t.owner_id===meId()?`<button class="link" style="color:var(--error)" data-act="delEvent" data-id="${t.id}">حذف</button>`:''}
    </div>`).join('') : '<div class="empty"><span class="e">📅</span>لا مواعيد بعد.<br>أضف موعدًا واختر من يراه.</div>'}</div>
    <div class="foot">المواعيد الخاصة 🔒 تظهر لك وحدك.</div></div>`;
}

function getTrackerData(){
  try{
    const raw = localStorage.getItem('rafiq_life_tracker');
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.categories) && parsed.categories.length > 0){
        if(!Array.isArray(parsed.entries)) parsed.entries = [];
        // ضمان عدم ضياع أي فئة افتراضية
        const existingMap = new Map(parsed.categories.map(c => [c.id, c]));
        let modified = false;
        DEFAULT_TRACKER_CATEGORIES.forEach(defCat => {
          if(!existingMap.has(defCat.id)){
            parsed.categories.push(defCat);
            modified = true;
          } else {
            const cur = existingMap.get(defCat.id);
            if(!cur.trackingType){
              cur.trackingType = defCat.trackingType;
              modified = true;
            }
          }
        });
        if(modified){
          parsed.categories.sort((a,b) => (a.sortOrder||0) - (b.sortOrder||0));
          saveTrackerData(parsed);
        }
        return parsed;
      }
    }
  }catch(e){}
  const seeded = { categories: DEFAULT_TRACKER_CATEGORIES, entries: [] };
  saveTrackerData(seeded);
  return seeded;
}

function saveTrackerData(d){
  try{
    localStorage.setItem('rafiq_life_tracker', JSON.stringify(d));
  }catch(e){}
}

async function syncTrackerFromCloud(){
  if(!meId()) return;
  try{
    const migrated = localStorage.getItem('rafiq_tracker_migrated_'+meId());
    if(!migrated){
      await migrateLocalToCloud();
      localStorage.setItem('rafiq_tracker_migrated_'+meId(), '1');
    }
    const [cloudCats, cloudEntries] = await Promise.all([
      rest('GET','tracker_categories','order=sort_order.asc&select=*'),
      rest('GET','tracker_entries','order=logged_at.desc&select=*')
    ]);

    const localData = getTrackerData();
    const defMap = new Map(DEFAULT_TRACKER_CATEGORIES.map(c => [c.id, c]));
    const localMap = new Map((localData.categories || []).map(c => [c.id, c]));
    const cloudMap = new Map((cloudCats || []).map(_rowToCat).map(c => [c.id, c]));

    // دمج ثلاثي آمن لضمان بقاء كافة الفئات الافتراضية
    const allCatIds = Array.from(new Set([...localMap.keys(), ...cloudMap.keys(), ...defMap.keys()]));
    const mergedCats = allCatIds.map(id => cloudMap.get(id) || localMap.get(id) || defMap.get(id))
      .sort((a,b) => (a.sortOrder||0) - (b.sortOrder||0));

    const localEntMap = new Map((localData.entries || []).map(e => [e.id, e]));
    const cloudEntMap = new Map((cloudEntries || []).map(_rowToEntry).map(e => [e.id, e]));
    const allEntIds = Array.from(new Set([...localEntMap.keys(), ...cloudEntMap.keys()]));
    const mergedEntries = allEntIds.map(id => cloudEntMap.get(id) || localEntMap.get(id))
      .sort((a,b) => (b.loggedAt||'').localeCompare(a.loggedAt||''));

    saveTrackerData({ categories: mergedCats, entries: mergedEntries });

    // رفع الفئات الأساسية أو المفقودة للسحابة
    for(const cat of mergedCats){
      if(!cloudMap.has(cat.id)){
        upsertTrackerCategoryCloud(cat);
      }
    }

    if(view === 'lifetracker') renderLifeTracker();
  }catch(e){ console.warn('tracker cloud sync err:', e.message); }
}

async function migrateLocalToCloud(){
  if(!meId()) return;
  try{
    const local = getTrackerData();
    if(!local.categories || local.categories.length === 0) return;
    const existing = await rest('GET','tracker_categories','user_id=eq.'+meId()+'&select=id');
    const existingIds = new Set((existing||[]).map(r=>r.id));
    const newCats = local.categories.filter(c => !existingIds.has(c.id));
    if(newCats.length > 0){
      const rows = newCats.map(c => _catToRow(c));
      await rest('POST','tracker_categories', rows, 'return=minimal');
    }
    if(local.entries && local.entries.length > 0){
      const existingEntries = await rest('GET','tracker_entries','user_id=eq.'+meId()+'&select=id');
      const existingEntIds = new Set((existingEntries||[]).map(r=>r.id));
      const catIds = new Set(local.categories.map(c=>c.id));
      const newEntries = local.entries.filter(e => !existingEntIds.has(e.id) && catIds.has(e.categoryId));
      if(newEntries.length > 0){
        const entRows = newEntries.map(e => _entryToRow(e));
        for(let i=0; i<entRows.length; i+=50){
          await rest('POST','tracker_entries', entRows.slice(i, i+50), 'return=minimal');
        }
      }
    }
  }catch(e){ console.warn('tracker migration err:', e.message); }
}

function formatMinutesToArabic(minutes){
  if(!minutes || minutes <= 0) return '';
  const hours = Math.floor(minutes / 60);
  const remM = minutes % 60;
  if(hours === 0) return `${remM} دقيقة`;
  if(hours === 1 && remM === 0) return 'ساعة واحدة';
  if(hours === 2 && remM === 0) return 'ساعتان';
  if(remM === 0) return `${hours} ساعات`;
  if(hours === 1) return `ساعة و${remM} دقيقة`;
  if(hours === 2) return `ساعتان و${remM} دقيقة`;
  return `${hours} ساعات و${remM} دقيقة`;
}

function formatArabicTime(isoStr){
  if(!isoStr) return '';
  try{
    let d;
    if(isoStr.includes('T') || isoStr.includes('-')) d = new Date(isoStr);
    else {
      const parts = isoStr.split(':');
      d = new Date();
      d.setHours(parseInt(parts[0],10), parseInt(parts[1],10), 0);
    }
    if(isNaN(d.getTime())) return isoStr;
    let h = d.getHours();
    const m = d.getMinutes();
    const ampm = h >= 12 ? 'م' : 'ص';
    h = h % 12;
    if(h === 0) h = 12;
    const mStr = m < 10 ? '0' + m : m;
    return `${h}:${mStr} ${ampm}`;
  }catch(e){ return isoStr; }
}

function formatArabicDate(dStr){
  try{
    const d = new Date(dStr + 'T12:00:00');
    return d.toLocaleDateString('ar-EG', { weekday:'long', day:'numeric', month:'long' });
  }catch(e){ return dStr; }
}

function parseIsoToMinutes(isoStr){
  if(!isoStr) return 0;
  try{
    if(isoStr.includes('T')){
      const timePart = isoStr.split('T')[1];
      const parts = timePart.split(':');
      return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
    }
    if(isoStr.includes(':')){
      const parts = isoStr.split(':');
      return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
    }
  }catch(e){}
  return 0;
}

function hexToPastelRgba(hex, alpha = 0.65){
  if(!hex || hex[0] !== '#') return `rgba(59, 130, 246, ${alpha})`;
  let r = 0, g = 0, b = 0;
  if(hex.length === 4){
    r = parseInt(hex[1] + hex[1], 16);
    g = parseInt(hex[2] + hex[2], 16);
    b = parseInt(hex[3] + hex[3], 16);
  } else if(hex.length >= 7){
    r = parseInt(hex.substring(1, 3), 16);
    g = parseInt(hex.substring(3, 5), 16);
    b = parseInt(hex.substring(5, 7), 16);
  }
  const pr = Math.round(r * 0.65 + 255 * 0.35);
  const pg = Math.round(g * 0.65 + 255 * 0.35);
  const pb = Math.round(b * 0.65 + 255 * 0.35);
  return `rgba(${pr}, ${pg}, ${pb}, ${alpha})`;
}

function renderTrackerMonthCalendar(selDate, entries){
  const cur = new Date(selDate + 'T12:00:00');
  const year = cur.getFullYear();
  const month = cur.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const totalDays = lastDay.getDate();
  const startDayIndex = (firstDay.getDay() + 1) % 7;
  const todayIso = new Date().toISOString().slice(0, 10);
  const monthStr = cur.toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' });
  const countsByDay = {};
  (entries || []).forEach(e => {
    const d = (e.loggedAt || '').slice(0, 10);
    if(d.startsWith(selDate.slice(0, 7))){
      countsByDay[d] = (countsByDay[d] || 0) + 1;
    }
  });
  const weekHeaders = ['سبت', 'أحد', 'اثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة'];
  let daysHtml = '';
  for(let i = 0; i < startDayIndex; i++){
    daysHtml += `<div class="trk-cal-day empty"></div>`;
  }
  for(let day = 1; day <= totalDays; day++){
    const dayStr = String(day).padStart(2, '0');
    const iso = `${year}-${String(month + 1).padStart(2, '0')}-${dayStr}`;
    const count = countsByDay[iso] || 0;
    const isToday = iso === todayIso;
    const isSelected = iso === selDate;
    daysHtml += `
      <button class="trk-cal-day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''} ${count > 0 ? 'has-data' : ''}" data-act="setTrackerDayAndSwitch" data-d="${iso}" title="${iso}">
        <span class="day-num">${day}</span>
        ${count > 0 ? `<span class="trk-day-badge">${count}</span>` : '<span class="day-dot"></span>'}
      </button>
    `;
  }
  return `
    <div class="trk-month-cal">
      <div class="trk-cal-nav">
        <button class="hicon-btn sm" data-act="trackerNextMonth" aria-label="الشهر التالي">◀</button>
        <div style="font-size:15px;font-weight:700">🗓️ تقويم ${monthStr}</div>
        <div style="display:flex;align-items:center;gap:6px">
          ${selDate.slice(0,7) !== todayIso.slice(0,7) ? `<button class="mini" data-act="trackerSetToday" style="padding:3px 8px;font-size:11px">هذا الشهر</button>` : ''}
          <button class="hicon-btn sm" data-act="trackerPrevMonth" aria-label="الشهر السابق">▶</button>
        </div>
      </div>
      <div class="trk-cal-grid">
        <div class="trk-cal-weekhead">
          ${weekHeaders.map(w => `<div class="trk-cal-th">${w}</div>`).join('')}
        </div>
        <div class="trk-cal-days">
          ${daysHtml}
        </div>
      </div>
    </div>
  `;
}

function renderTrackerWeekTimeline(selDate, entries, catMap){
  const cur = new Date(selDate + 'T12:00:00');
  const diffToSat = (cur.getDay() + 1) % 7;
  const startOfWeek = new Date(cur);
  startOfWeek.setDate(cur.getDate() - diffToSat);
  const endOfWeek = new Date(startOfWeek);
  endOfWeek.setDate(startOfWeek.getDate() + 6);
  const todayIso = new Date().toISOString().slice(0, 10);
  const weekDays = [];
  for(let i = 0; i < 7; i++){
    const d = new Date(startOfWeek);
    d.setDate(startOfWeek.getDate() + i);
    const iso = d.toISOString().slice(0, 10);
    const count = (entries || []).filter(e => (e.loggedAt || '').startsWith(iso)).length;
    weekDays.push({
      iso,
      count,
      dayName: d.toLocaleDateString('ar-EG', { weekday: 'short' }),
      dayNum: d.getDate(),
      isToday: iso === todayIso,
      isSelected: iso === selDate
    });
  }
  const weekRangeLabel = `${startOfWeek.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' })} — ${endOfWeek.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' })}`;

  const startHour = getTimelineStartHour();
  const endHour = getTimelineEndHour();
  const spanHours = Math.max(1, endHour - startHour);
  const totalSpanMin = spanHours * 60;
  const rowStartMin = startHour * 60;
  const rowEndMin = endHour * 60;

  const step = spanHours <= 8 ? 2 : (spanHours <= 16 ? 3 : 4);
  const labelHours = [];
  for(let h = startHour; h <= endHour; h += step){
    labelHours.push(h);
  }
  if(labelHours[labelHours.length - 1] !== endHour) labelHours.push(endHour);
  const labelsHtml = labelHours.map(h => `<span>${String(h).padStart(2, '0')}:00</span>`).join('');

  return `
    <div class="card" style="margin-bottom:12px;padding:12px">
      <div class="trk-cal-nav" style="margin-bottom:12px">
        <button class="hicon-btn sm" data-act="trackerNextWeek" aria-label="الأسبوع التالي">◀</button>
        <div style="font-size:14.5px;font-weight:700">📊 خط زمني أسبوعي (${weekRangeLabel})</div>
        <div style="display:flex;align-items:center;gap:6px">
          <button class="mini" data-act="trackerSetToday" style="padding:3px 8px;font-size:11px">اليوم</button>
          <button class="hicon-btn sm" data-act="trackerPrevWeek" aria-label="الأسبوع السابق">▶</button>
        </div>
      </div>
      <div class="trk-week-timeline-rows">
        ${weekDays.map(w => {
          const dEntries = (entries || []).filter(e => (e.loggedAt || '').startsWith(w.iso));
          return `
            <div class="trk-week-timeline-row ${w.isToday ? 'today' : ''} ${w.isSelected ? 'selected' : ''}" data-act="setTrackerDayAndSwitch" data-d="${w.iso}">
              <div class="trk-week-timeline-meta">
                <span class="trk-week-timeline-dayname">${w.dayName}</span>
                <span class="trk-week-timeline-daydate">${w.dayNum} (${dEntries.length})</span>
              </div>
              <div class="trk-week-timeline-bar">
                <div class="trk-week-timeline-spine"></div>
                ${(() => {
                  const sortedD = [...dEntries].sort((a,b) => (a.startedAt || a.loggedAt || '').localeCompare(b.startedAt || b.loggedAt || ''));
                  let wLane0End = -1, wLane1End = -1, wPref = 0;
                  return sortedD.map(e => {
                    const cat = catMap[e.categoryId] || { icon:'📌', colorHex:'#3B82F6', name:'' };
                    const hasRange = !!(e.startedAt && e.endedAt);
                    let sMin, dur, isInstant;
                    if(hasRange){
                      sMin = parseIsoToMinutes(e.startedAt);
                      const eMin = parseIsoToMinutes(e.endedAt);
                      dur = eMin > sMin ? eMin - sMin : 30;
                      isInstant = false;
                    } else {
                      const lMin = parseIsoToMinutes(e.loggedAt);
                      sMin = Math.max(0, lMin - 7);
                      dur = 15;
                      isInstant = true;
                    }

                    const segStart = Math.max(rowStartMin, Math.min(rowEndMin, sMin));
                    const segEnd = Math.max(rowStartMin, Math.min(rowEndMin, sMin + dur));

                    if(segEnd > segStart || (isInstant && sMin >= rowStartMin && sMin <= rowEndMin)){
                      const segStartInRow = segStart - rowStartMin;
                      const segDurInRow = isInstant ? 15 : Math.max(10, segEnd - segStart);
                      const endInRow = segStartInRow + segDurInRow;

                      const overlaps0 = segStartInRow < wLane0End;
                      const overlaps1 = segStartInRow < wLane1End;
                      let lane = 0;
                      if(overlaps0 && !overlaps1) lane = 1;
                      else if(!overlaps0 && overlaps1) lane = 0;
                      else if(overlaps0 && overlaps1) lane = (wLane0End <= wLane1End) ? 0 : 1;
                      else { lane = wPref; wPref = 1 - wPref; }

                      if(lane === 0) wLane0End = Math.max(wLane0End, endInRow);
                      else wLane1End = Math.max(wLane1End, endInRow);

                      const leftPct = (segStartInRow / totalSpanMin) * 100;
                      const widthPct = Math.max(1.8, (segDurInRow / totalSpanMin) * 100);
                      const pastelBg = hexToPastelRgba(cat.colorHex, isInstant ? 0.85 : 0.65);
                      const laneClass = lane === 0 ? 'lane-top' : 'lane-bottom';

                      return `
                        <div class="trk-week-timeline-slice ${laneClass}" 
                             style="left:${leftPct}%;width:${widthPct}%;background:${pastelBg};border:0.5px solid ${cat.colorHex}55" 
                             title="${esc(cat.name)}">
                          ${cat.icon}
                        </div>
                      `;
                    }
                    return '';
                  }).join('');
                })()}
              </div>
            </div>
          `;
        }).join('')}
      </div>
      <div class="trk-timeline-labels" style="margin-top:8px">
        ${labelsHtml}
      </div>
    </div>
  `;
}

  const todayIso = new Date().toISOString().slice(0, 10);

  for(let i = 0; i < 7; i++){
    const d = new Date(startOfWeek);
    d.setDate(startOfWeek.getDate() + i);
    const iso = d.toISOString().slice(0, 10);
    const count = (entries || []).filter(e => (e.loggedAt || '').startsWith(iso)).length;
    weekDays.push({
      iso,
      count,
      dayName: d.toLocaleDateString('ar-EG', { weekday: 'short' }),
      dayNum: d.getDate(),
      isToday: iso === todayIso,
      isSelected: iso === selDate
    });
  }
  const weekRangeLabel = `${startOfWeek.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' })} — ${endOfWeek.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' })}`;
  return `
    <div class="trk-week-wrap">
      <div class="trk-cal-nav" style="margin-bottom:10px">
        <button class="hicon-btn sm" data-act="trackerNextWeek" aria-label="الأسبوع التالي">◀</button>
        <div style="font-size:14.5px;font-weight:700">📅 أسبوع ${weekRangeLabel}</div>
        <div style="display:flex;align-items:center;gap:6px">
          <button class="mini" data-act="trackerSetToday" style="padding:3px 8px;font-size:11px">اليوم</button>
          <button class="hicon-btn sm" data-act="trackerPrevWeek" aria-label="الأسبوع السابق">▶</button>
        </div>
      </div>
      <div class="trk-week-grid">
        ${weekDays.map(w => `
          <button class="trk-week-day-btn ${w.isToday ? 'today' : ''} ${w.isSelected ? 'selected' : ''}" data-act="setTrackerDayAndSwitch" data-d="${w.iso}">
            <span class="w-name">${w.dayName}</span>
            <span class="w-num">${w.dayNum}</span>
            <span class="w-badge ${w.count > 0 ? 'active' : ''}">${w.count > 0 ? `${w.count} نشاط` : '—'}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

window._trackerDate = new Date().toISOString().slice(0,10);
window._trackerMode = 'daily';
window._trackerLayoutStyle = localStorage.getItem('rafiq_tracker_layout_style') || 'blocks';

function getTimelineStartHour() {
  const trk = getTrackerData();
  if (typeof trk.timelineStartHour === 'number' && trk.timelineStartHour >= 0 && trk.timelineStartHour <= 23) {
    return trk.timelineStartHour;
  }
  const v = parseInt(localStorage.getItem('rafiq_timeline_start_hour'), 10);
  return (!isNaN(v) && v >= 0 && v <= 23) ? v : 0;
}

function getTimelineEndHour() {
  const trk = getTrackerData();
  const s = getTimelineStartHour();
  if (typeof trk.timelineEndHour === 'number' && trk.timelineEndHour > s && trk.timelineEndHour <= 24) {
    return trk.timelineEndHour;
  }
  const v = parseInt(localStorage.getItem('rafiq_timeline_end_hour'), 10);
  return (!isNaN(v) && v > s && v <= 24) ? v : 24;
}

function setTimelineHours(startH, endH) {
  const s = Math.max(0, Math.min(23, parseInt(startH, 10) || 0));
  const e = Math.max(s + 1, Math.min(24, parseInt(endH, 10) || 24));
  try {
    localStorage.setItem('rafiq_timeline_start_hour', s);
    localStorage.setItem('rafiq_timeline_end_hour', e);
  } catch(e){}
  const trk = getTrackerData();
  trk.timelineStartHour = s;
  trk.timelineEndHour = e;
  saveTrackerData(trk);
}

function renderLifeTracker(){
  const trk = getTrackerData();
  const cats = trk.categories.slice().sort((a,b) => (a.sortOrder||0) - (b.sortOrder||0));
  const selDate = window._trackerDate || new Date().toISOString().slice(0,10);
  const mode = window._trackerMode || 'daily';
  const layoutStyle = window._trackerLayoutStyle || 'blocks';
  const todayIso = new Date().toISOString().slice(0,10);

  const dayEntries = trk.entries.filter(e => (e.loggedAt||'').startsWith(selDate))
    .sort((a,b) => (a.loggedAt||'').localeCompare(b.loggedAt||''));

  const catMap = {};
  cats.forEach(c => { catMap[c.id] = c; });

  const countsByCat = {};
  dayEntries.forEach(e => {
    countsByCat[e.categoryId] = (countsByCat[e.categoryId] || 0) + 1;
  });

  // تجميع الأنشطة بالصفوف: كل صف يتناول نشاطًا واحدًا وينقسم حسب عدد تسجيلاته
  const catGroups = [];
  const seenCats = new Set();
  dayEntries.forEach(entry => {
    if (!seenCats.has(entry.categoryId)) {
      seenCats.add(entry.categoryId);
      const cat = catMap[entry.categoryId] || { id: entry.categoryId, name: 'نشاط', icon: '📌', colorHex: '#3B82F6' };
      const entries = dayEntries.filter(e => e.categoryId === entry.categoryId);
      catGroups.push({ cat, entries });
    }
  });

  function formatSub(sub, isDense, catName){
    if(!sub) return '';
    let s = String(sub).trim();
    s = s.replace(/^\(+|\)+$/g, '').trim();
    if(catName){
      const re = new RegExp(catName, 'g');
      s = s.replace(re, '').replace(/\s+/g, ' ').trim();
    }
    s = s.replace(/^\(+|\)+$/g, '').trim();
    if(isDense){
      if(s.includes('كوب')) s = 'كوب';
      else if(s.includes('قارورة')) s = 'قارورة';
      else if(s.length > 8) s = s.slice(0, 7) + '..';
    } else {
      if(s.length > 14) s = s.slice(0, 13) + '..';
    }
    return s;
  }

        <button class="hicon-btn" data-act="openCategorySettings" aria-label="إعدادات الفئات" style="font-size:17px">⚙️</button>
      </div>

      <div class="trk-cats-bar">
        ${cats.map(cat => {
          const cnt = countsByCat[cat.id] || 0;

              <span style="color:${cat.colorHex}">${esc(cat.name)}</span>
              ${cat.visibility==='CIRCLE' ? '<span style="font-size:10px;opacity:.75" title="مشترك مع رفيقي">👥</span>' : ''}
              ${cnt > 0 ? `<span class="cnt" style="background:${cat.colorHex}25;color:${cat.colorHex}">${cnt}</span>` : ''}
            </button>
          `;
        }).join('')}
        <button class="trk-cat-pill" data-act="openCategoryEditor" data-id="" style="border-style:dashed;color:var(--accent)">
          <span>➕</span>
          <span>فئة جديدة</span>
        </button>
      </div>

      <div class="trk-mode-switch">
        <div class="trk-mode-btn ${mode==='daily'?'on':''}" data-act="setTrackerMode" data-m="daily">📅 يومي</div>

      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div class="trk-layout-switch">
          <button type="button" class="trk-layout-btn ${layoutStyle==='blocks'?'on':''}" data-act="setTrackerLayoutStyle" data-s="blocks">🔲 بلوكات</button>
          <button type="button" class="trk-layout-btn ${layoutStyle==='timeline'?'on':''}" data-act="setTrackerLayoutStyle" data-s="timeline">📊 خط زمني 24 ساعة</button>
        </div>
        <span style="font-size:11.5px;color:var(--text-3)">${layoutStyle==='timeline' ? 'تمثيل نسبي لـ 24 ساعة ⏱️' : 'عرض البطاقات المنفصلة 🗂️'}</span>
      </div>

      ${mode === 'daily' ? `
        <div class="card" style="padding:10px 14px;margin-bottom:12px">

        ${layoutStyle === 'timeline' ? (() => {
          const startHour = getTimelineStartHour();
          const endHour = getTimelineEndHour();
          const spanHours = Math.max(1, endHour - startHour);
          const totalSpanMin = spanHours * 60;
          const rowStartMin = startHour * 60;
          const rowEndMin = endHour * 60;

          const step = spanHours <= 8 ? 1 : (spanHours <= 16 ? 2 : 3);
          const labelHours = [];
          for (let h = startHour; h <= endHour; h += step) {
            labelHours.push(h);
          }
          if (labelHours[labelHours.length - 1] !== endHour) {
            labelHours.push(endHour);
          }

          // فرز وتوزيع الأنشطة على مسارين (Lane 0 / Lane 1) للتداخل الرأسي والتراكب اللوني
          const sortedEntries = [...dayEntries].sort((a,b) => {
            const ta = a.startedAt || a.loggedAt || '';
            const tb = b.startedAt || b.loggedAt || '';
            return ta.localeCompare(tb);
          });

          let lastLane0End = -1, lastLane1End = -1, preferLane = 0;

          const slicesHtml = sortedEntries.map(entry => {
            const cat = catMap[entry.categoryId] || { icon:'📌', colorHex:'#3B82F6', name:'' };
            const hasRange = !!(entry.startedAt && entry.endedAt);
            let sMin, durMin, isInstant;
            if(hasRange){
              sMin = parseIsoToMinutes(entry.startedAt);
              const eMin = parseIsoToMinutes(entry.endedAt);
              durMin = eMin > sMin ? eMin - sMin : 30;
              isInstant = false;
            } else {
              const lMin = parseIsoToMinutes(entry.loggedAt);
              sMin = Math.max(0, lMin - 7);
              durMin = 15;
              isInstant = true;
            }

            const segStart = Math.max(rowStartMin, Math.min(rowEndMin, sMin));
            const segEnd = Math.max(rowStartMin, Math.min(rowEndMin, sMin + durMin));

            if(segEnd > segStart || (isInstant && sMin >= rowStartMin && sMin <= rowEndMin)){
              const segStartInRow = segStart - rowStartMin;
              const segDurInRow = isInstant ? 15 : Math.max(10, segEnd - segStart);
              const endInRow = segStartInRow + segDurInRow;

              const overlaps0 = segStartInRow < lastLane0End;
              const overlaps1 = segStartInRow < lastLane1End;

              let lane = 0;
              if(overlaps0 && !overlaps1) lane = 1;
              else if(!overlaps0 && overlaps1) lane = 0;
              else if(overlaps0 && overlaps1) lane = (lastLane0End <= lastLane1End) ? 0 : 1;
              else {
                lane = preferLane;
                preferLane = 1 - preferLane;
              }

              if(lane === 0) lastLane0End = Math.max(lastLane0End, endInRow);
              else lastLane1End = Math.max(lastLane1End, endInRow);

              const zoom = window._trackerTimelineZoom || 1;
              const leftPct = (segStartInRow / totalSpanMin) * 100;
              const widthPct = Math.max(isInstant ? 2.5 : 2, (segDurInRow / totalSpanMin) * 100);
              const timeDesc = hasRange
                ? `${formatArabicTime(entry.startedAt)} - ${formatArabicTime(entry.endedAt)} (${Math.round(segDurInRow)}د)`
                : `${formatArabicTime(entry.loggedAt)} (تسجيل فوري)`;

              const pastelBg = hexToPastelRgba(cat.colorHex, isInstant ? 0.85 : 0.65);
              const laneClass = lane === 0 ? 'lane-top' : 'lane-bottom';
              const showTitle = (widthPct * zoom) >= 8;
              const showTime = (widthPct * zoom) >= 16;

              return `
                <div class="trk-timeline-slice ${laneClass}" 
                     data-act="openEntryDetails" data-id="${entry.id}" 
                     style="left:${leftPct}%;width:${widthPct}%;background:${pastelBg};border:1px solid ${cat.colorHex}55;min-width:${isInstant ? '26px' : '22px'}" 
                     title="${esc(cat.name)}: ${timeDesc}">
                  <span class="trk-timeline-slice-icon">${cat.icon}</span>
                  ${showTitle ? `<span class="trk-timeline-slice-title" style="max-width:${showTime?'80px':'50px'};overflow:hidden;text-overflow:ellipsis">${esc(entry.note || cat.name).slice(0, 10)}</span>` : ''}
                  ${showTime ? `<span style="font-size:7.5px;color:var(--text-2);margin-inline-start:3px;white-space:nowrap">${hasRange ? `${Math.round(segDurInRow)}د` : ''}</span>` : ''}
                </div>
              `;
            }
            return '';
          }).join('');

          const zoom = window._trackerTimelineZoom || 1;
          const barWidthPct = zoom * 100;
          const activeTicksHours = (zoom >= 1.6 && spanHours <= 24)
            ? Array.from({length: spanHours + 1}, (_, i) => startHour + i)
            : labelHours;

          const ticksHtml = activeTicksHours.map(h => {
            const pct = ((h - startHour) / spanHours) * 100;
            return `
              <div class="trk-timeline-tick" style="left:${pct}%"></div>
              <span class="trk-timeline-hour-badge" style="left:${pct}%">${String(h).padStart(2,'0')}:00</span>

                  <div style="font-size:11px;color:var(--text-3);margin-top:2px">${spanHours} ساعة • اضغط على أي شريحة للتعديل ✍️</div>

                    <button type="button" class="mini" data-act="setTimelineZoom" data-z="1.8" style="border:none;border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer;${zoom === 1.8 ? 'background:var(--surface);color:var(--accent-dark);font-weight:700' : 'background:transparent;color:var(--text-2)'}">1.8x</button>
                    <button type="button" class="mini" data-act="setTimelineZoom" data-z="2.8" style="border:none;border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer;${zoom === 2.8 ? 'background:var(--surface);color:var(--accent-dark);font-weight:700' : 'background:transparent;color:var(--text-2)'}">2.8x</button>

                <div class="trk-timeline-bar-24" style="width:${barWidthPct}%;min-width:100%">
                  <div class="trk-timeline-spine"></div>
                  <!-- شرائح الأنشطة والكبسولات الباستيلية -->
                  ${slicesHtml}
                  <!-- خطوط وتسميات الساعات في المنتصف -->
                  <div class="trk-timeline-ticks">
                    ${ticksHtml}

            <!-- قائمة تفاصيل سجلات اليوم أسفل الخط الزمني -->
            <div class="card" style="min-height:140px;padding:12px">
              <b style="font-size:13.5px;color:var(--text-1);display:block;margin-bottom:10px">سجلات اليوم (${dayEntries.length})</b>
              ${dayEntries.length ? `

                      <div class="row" style="cursor:pointer;padding:8px 10px;background:var(--surface-2);border-radius:10px;border-inline-start:4px solid ${cat.colorHex}" data-act="openEntryDetails" data-id="${entry.id}">

                          </div>

              </div>

      ` : mode === 'weekly' ? `
        ${layoutStyle === 'timeline' ? renderTrackerWeekTimeline(selDate, trk.entries, catMap) : `

            <b style="font-size:15px;display:block;margin-bottom:10px">📊 ملخص الأيام السبعة الماضية</b>

              const past7 = [];
              for(let i=6; i>=0; i--){
                const d = new Date(selDate + 'T12:00:00');
                d.setDate(d.getDate() - i);
                const iso = d.toISOString().slice(0,10);
                const count = trk.entries.filter(e => (e.loggedAt||'').startsWith(iso)).length;
                past7.push({ iso, count, label: d.toLocaleDateString('ar-EG', { weekday:'short', day:'numeric' }) });
              }
              return `
                <div style="display:flex;flex-direction:column;gap:8px">
                  ${past7.map(day => `
                    <div class="row" style="cursor:pointer;padding:4px 0" data-act="setTrackerDayAndSwitch" data-d="${day.iso}">
                      <span style="width:90px;font-size:13px;font-weight:600">${day.label}</span>
                      <div class="bar"><i style="width:${Math.min(100, day.count * 16)}%"></i></div>
                      <span class="badge" style="min-width:40px;text-align:center">${day.count} نشاط</span>
                    </div>
                  `).join('')}
                </div>
              `;
            })()}
          </div>
        `}
      ` : `
        ${renderTrackerMonthCalendar(selDate, trk.entries)}
        <div class="card">
          <b style="font-size:15px;display:block;margin-bottom:10px">🗓️ إحصائيات الشهر (${selDate.slice(0,7)})</b>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            ${cats.map(cat => {
              const count = trk.entries.filter(e => (e.loggedAt||'').startsWith(selDate.slice(0,7)) && e.categoryId === cat.id).length;
              return `
                <div class="mini-stat" style="border-right:3px solid ${cat.colorHex}">
                  <div style="display:flex;align-items:center;gap:6px">
                    <span style="font-size:18px">${cat.icon}</span>
                    <span style="font-size:12px;font-weight:600;flex:1">${esc(cat.name)}</span>
                  </div>
                  <b style="font-size:18px;margin-top:4px;color:${cat.colorHex}">${count} مرة</b>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `}

      <button class="fab-voice-tracker" id="trkVoiceMicBtn" data-act="startTrackerVoiceInput" title="تسجيل صوتي ذكي 🎙️" aria-label="تسجيل صوتي">
        🎙️
      </button>

      <button class="fab-pdf" data-act="openPdfExport">
        <span>📄</span>
        <span>تصدير PDF</span>
      </button>
    </div>
  `;

  const dateInp = document.getElementById('trkDirectDate');
  if(dateInp){
    dateInp.onchange = () => {
      if(dateInp.value){
        window._trackerDate = dateInp.value;
        renderLifeTracker();
      }
    };
  }
}

  });

async function saveSmartLog(){
  const trk = getTrackerData();
  const cat = trk.categories.find(c => c.id === window._smartLogCatId);
  if(!cat){ toast('تعذر العثور على الفئة'); return; }

  const isRange = window._smartLogMode === 'range';
  const isQuick = window._smartLogMode === 'quick';
  let startedAt = null;
  let endedAt = null;
  let quantity = null;
  let loggedAt = new Date().toISOString();

  if(isRange){
    const sDate = ($('#slStartDate')||{}).value || window._trackerDate;
    const sTime = ($('#slStartTime')||{}).value || '08:00';
    const eDate = ($('#slEndDate')||{}).value || window._trackerDate;
    const eTime = ($('#slEndTime')||{}).value || '08:30';
    startedAt = `${sDate}T${sTime}:00`;
    endedAt = `${eDate}T${eTime}:00`;
    loggedAt = startedAt;
    const s = new Date(startedAt);
    const e = new Date(endedAt);
    const diffMin = Math.round((e - s) / 60000);
    if(diffMin > 0) quantity = formatMinutesToArabic(diffMin);
  } else if(isQuick){
    const actTime = ($('#slActivityTime')||{}).value || '12:00';
    loggedAt = `${window._trackerDate}T${actTime}:00`;
    quantity = ($('#slCustomQty')||{}).value || null;
  } else {
    // Instant
    const iDate = ($('#slInstantDate')||{}).value || window._trackerDate;
    const iTime = ($('#slInstantTime')||{}).value || '12:00';
    loggedAt = `${iDate}T${iTime}:00`;
    quantity = ($('#slInstantQty')||{}).value || null;
  }

  const note = ($('#slNote')||{}).value || null;
  const subcat = window._slSelectedSubcat || null;

  const entry = {
    id: 'ent_' + (crypto.randomUUID ? crypto.randomUUID().slice(0,10) : String(Date.now())),
    categoryId: cat.id,
    subcategory: subcat && subcat.trim() ? subcat.trim() : null,
    quantity: quantity && quantity.trim() ? quantity.trim() : null,
    startedAt: startedAt,
    endedAt: endedAt,
    loggedAt: loggedAt,
    note: note && note.trim() ? note.trim() : null,
    syncIntent: 'local_only'
  };

  trk.entries.push(entry);
  saveTrackerData(trk);
  closeSheet();
  renderLifeTracker();
  toast(`تم تسجيل ${cat.name} ${cat.icon} ✓`);
  insertTrackerEntryCloud(entry);
}

function saveTrackerCategory(){
  const nameInp = $('#ceName');
  const name = ((nameInp && nameInp.value) || '').trim();
  if(!name){ toast('يرجى كتابة اسم الفئة'); return; }

  const trk = getTrackerData();
  const subcatsText = ($('#ceSubcats')||{}).value || '';
  const subcats = subcatsText.split(/[,،]/).map(s => s.trim()).filter(Boolean);
  const goal = parseInt(($('#ceGoal')||{}).value, 10) || null;
  const remTime = ($('#ceReminderTime')||{}).value || '08:00';
  const parts = remTime.split(':');
  const rHour = parseInt(parts[0], 10) || 8;
  const rMin = parseInt(parts[1], 10) || 0;

  let savedCat = null;
  if(window._catEditId){
    const idx = trk.categories.findIndex(c => c.id === window._catEditId);
    if(idx >= 0){
      savedCat = Object.assign({}, trk.categories[idx], {
        name,
        icon: window._catIcon || '💊',
        colorHex: window._catColor || '#3B82F6',
        subcategories: subcats,
        dailyGoal: goal,
        reminderEnabled: window._catReminderEnabled,
        reminderHour: rHour,
        reminderMinute: rMin,
        reminderFrequency: window._catReminderFreq || 'DAILY',
        visibility: window._catVisibility || 'PRIVATE',
        trackingType: window._catTrackingType || 'TIME_RANGE'
      });
      trk.categories[idx] = savedCat;
    }
  } else {
    savedCat = {
      id: 'cat_' + (crypto.randomUUID ? crypto.randomUUID().slice(0,8) : String(Date.now())),
      name,
      icon: window._catIcon || '💊',
      colorHex: window._catColor || '#3B82F6',
      sortOrder: trk.categories.length + 1,
      subcategories: subcats,
      dailyGoal: goal,
      reminderEnabled: window._catReminderEnabled,
      reminderHour: rHour,
      reminderMinute: rMin,
      reminderFrequency: window._catReminderFreq || 'DAILY',
      visibility: window._catVisibility || 'PRIVATE',
      trackingType: window._catTrackingType || 'TIME_RANGE'
    };
    trk.categories.push(savedCat);
  }

  saveTrackerData(trk);
  closeSheet();
  renderLifeTracker();
  toast('حُفظت الفئة ✓');
  if(savedCat) upsertTrackerCategoryCloud(savedCat);
}

}

async function saveFullEntryEdit(entryId){
  const trk = getTrackerData();
  const idx = trk.entries.findIndex(e => e.id === entryId);
  if(idx < 0){ toast('لم يتم العثور على السجل'); return; }

  const entry = trk.entries[idx];
  const hasRange = !!(entry.startedAt && entry.endedAt);
  const edDate = ($('#edDate')||{}).value || window._trackerDate || new Date().toISOString().slice(0, 10);
  const qty = ($('#edQuantity')||{}).value || null;
  const note = ($('#edNote')||{}).value || null;
  const subcatInp = ($('#edSubcatInput')||{}).value;
  const subcat = (subcatInp !== undefined && subcatInp !== null) ? subcatInp : (window._editEntrySubcat || null);

  let startedAt = null;
  let endedAt = null;
  let loggedAt = `${edDate}T12:00:00`;

  if(hasRange){
    const sTime = ($('#edStartTime')||{}).value || '08:00';
    const eTime = ($('#edEndTime')||{}).value || '08:30';
    startedAt = `${edDate}T${sTime}:00`;
    endedAt = `${edDate}T${eTime}:00`;
    loggedAt = startedAt;
  } else {
    const prevTime = (entry.loggedAt && entry.loggedAt.length >= 16) ? entry.loggedAt.slice(11, 16) : '12:00';
    loggedAt = `${edDate}T${prevTime}:00`;
  }

  trk.entries[idx] = Object.assign({}, trk.entries[idx], {
    subcategory: subcat && subcat.trim() ? subcat.trim() : null,
    quantity: qty && qty.trim() ? qty.trim() : null,
    startedAt: startedAt,
    endedAt: endedAt,
    loggedAt: loggedAt,
    note: note && note.trim() ? note.trim() : null
  });

  saveTrackerData(trk);
  closeSheet();
  renderLifeTracker();
  toast('تم حفظ التعديلات بنجاح ✓');
  updateTrackerEntryCloud(trk.entries[idx]);
}

function normalizeArabicDigitsJs(str){
  const map = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
  return String(str||'').replace(/[٠-٩]/g, d => map[d] || d);
}

function normalizeArabicTextJs(input){
  let text = normalizeArabicDigitsJs(String(input||''));
  text = text.replace(/\bالساعه\b/g, 'الساعة')
             .replace(/\bساعه\b/g, 'ساعة')
             .replace(/\bالى\b/g, 'إلى')
             .replace(/\bلمده\b/g, 'لمدة');
  return text;
}

function parseTimeTokenJs(token){
  let clean = String(token||'').replace(/(?:الساعة|الساعه)/g, '').replace(/[،,]/g, '').trim();

  const isAm = /صباح|فجر/.test(clean);
  const isPm = /مساء|عصر|ليل/.test(clean);

  const hasHalf = /ونصف|ونص/.test(clean);
  const hasQuarter = /وربع/.test(clean);
  const hasThird = /وثلث/.test(clean);
  const isMinusQuarter = /إلا\s+ربع|الا\s+ربع/.test(clean);

  clean = clean.replace(/صباحاً|صباحا|مساءً|مساء|عصراً|عصر|ظهراً|ظهر|ليلاً|ليلا/g, '')
               .replace(/ونصف|ونص|وربع|وثلث|إلا\s+ربع|الا\s+ربع/g, '')
               .replace(/دقيقة|دقائق/g, '')
               .trim();

  // نمط مركب مثل "11 و 45"
  const compMatch = clean.match(/^(\d{1,2})\s*و\s*(\d{1,2})$/);
  if(compMatch){
    let h = parseInt(compMatch[1], 10);
    let m = parseInt(compMatch[2], 10) || 0;
    if(!isNaN(h) && h >= 0 && h <= 24 && m >= 0 && m <= 59){
      let adjH = (h === 24) ? 0 : h;
      if(isPm && adjH < 12) adjH += 12;
      if(isAm && adjH === 12) adjH = 0;
      return { hour: adjH, minute: m };
    }
  }

  // نمط رقمي مباشر "11:45" أو "11.45"
  const colonOrDot = clean.split(/[:.]/).filter(Boolean);
  if(colonOrDot.length === 2){
    let h = parseInt(colonOrDot[0].trim(), 10);
    let m = parseInt(colonOrDot[1].trim(), 10);
    if(!isNaN(h) && !isNaN(m) && h >= 0 && h <= 24 && m >= 0 && m <= 59){
      let adjH = (h === 24) ? 0 : h;
      if(isPm && adjH < 12) adjH += 12;
      if(isAm && adjH === 12) adjH = 0;
      return { hour: adjH, minute: m };
    }
  }

  const directNum = parseInt(clean, 10);
  let hour = !isNaN(directNum) ? directNum : (ARABIC_WORD_HOURS_JS[clean] || null);
  if(hour === null || hour > 24) return null;
  if(hour === 24) hour = 0;

  let minute = 0;
  if(hasHalf) minute = 30;
  else if(hasQuarter) minute = 15;
  else if(hasThird) minute = 20;
  else if(isMinusQuarter){
    hour = (hour === 0) ? 23 : (hour - 1);
    minute = 45;
  }

  if(isPm && hour < 12) hour += 12;
  if(isAm && hour === 12) hour = 0;

  return { hour, minute };
}

function parseVoiceActivityText(rawText, categories){
  const normalized = normalizeArabicTextJs(rawText.trim());
  let remaining = normalized;

  // 1. فحص الفترات الزمنية: من [X] إلى [Y]
  let startedAt = null;
  let endedAt = null;
  let isTimeRange = false;

  const timeTokenRegex = /(?:\d{1,2}(?:[:.]\d{2})?(?:\s*و\s*\d{1,2}(?:\s*دقيقة)?)?|(?:ال)?(?:حادية\s+عشر(?:ة)?|ثانية\s+عشر(?:ة)?|إحدى\s+عشر(?:ة)?|احدى\s+عشر(?:ة)?|اثنا\s+عشر|واحدة|ثانية|ثالثة|رابعة|خامسة|سادسة|سابعة|ثامنة|تاسعة|عاشرة|واحد|اثنين|اثنتين|ثلاث|ثلاثة|أربع|أربعة|اربع|اربعة|خمس|خمسة|ست|ستة|سبع|سبعة|ثمان|ثمانية|تسع|تسعة|عشر|عشرة))(?:\s+(?:ونصف|ونص|وربع|وثلث|إلا\s+ربع|الا\s+ربع))?(?:\s*(?:صباحاً|صباحا|مساءً|مساء|عصراً|عصر|ظهراً|ظهر|ليلاً|ليلا))?/;

  const rangeRegex = new RegExp('من\\s+(?:(?:الساعة|الساعه)\\s+)?(' + timeTokenRegex.source + ')\\s+(?:إلى|الى|حتى|وحتى|لغاية|لـ|ل)\\s+(?:(?:الساعة|الساعه)\\s+)?(' + timeTokenRegex.source + ')', 'i');
  const match = remaining.match(rangeRegex);
  if(match){
    const tStart = parseTimeTokenJs(match[1].trim());
    const tEnd = parseTimeTokenJs(match[2].trim());
    if(tStart && tEnd){
      let sH = tStart.hour;
      const sM = tStart.minute;
      let eH = tEnd.hour;
      const eM = tEnd.minute;

      const isExplicitPm = /مساء|عصر|ليلا|ليلاً|عشاء/.test(normalized);
      const isExplicitAm = /صباح|فجر/.test(normalized);

      if(isExplicitPm){
        if(sH < 12) sH += 12;
        if(eH < 12) eH += 12;
      } else if(!isExplicitAm){
        if(eH < sH && eH >= 1 && eH <= 6){
          eH += 12;
        } else if(sH >= 1 && sH <= 6 && eH >= 1 && eH <= 7 && new Date().getHours() >= 12){
          sH += 12;
          eH += 12;
        }
      }

      const now = new Date();
      const sDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), sH % 24, sM, 0);
      let eDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), eH % 24, eM, 0);
      if(eDate <= sDate){
        eDate.setDate(eDate.getDate() + 1);
      }
      startedAt = sDate;
      endedAt = eDate;
      isTimeRange = true;
      remaining = remaining.replace(match[0], ' ').trim();
    }
  }

  // 2. استخراج الكميات أو الشدة أو المدة
  let extractedQty = null;
  let durationMins = null;
  const phrases = [
    ["ساعتان", "ساعتان", 120], ["ساعتين", "ساعتان", 120],
    ["ساعة ونصف", "ساعة ونصف", 90], ["ساعة ونص", "ساعة ونصف", 90],
    ["ساعة وربع", "ساعة وربع", 75], ["ساعة", "1 ساعة", 60],
    ["نصف ساعة", "30 دقيقة", 30], ["نص ساعة", "30 دقيقة", 30],
    ["ثلث ساعة", "20 دقيقة", 20], ["ربع ساعة", "15 دقيقة", 15],
    ["كوبين", "2 كوب", null], ["كأسين", "2 كأس", null],
    ["حبتين", "2 حبة", null], ["حبة واحدة", "1 حبة", null],
    ["جرعة واحدة", "جرعة واحدة", null], ["وجبة كاملة", "وجبة كاملة", null],
    ["خفيف", "خفيف", null], ["متوسط", "متوسط", null], ["شديد", "شديد", null]
  ];

  for(const [phrase, std, mins] of phrases){
    if(remaining.includes(phrase)){
      extractedQty = std;
      durationMins = mins;
      remaining = remaining.replace(phrase, ' ').trim();
      break;
    }
  }

  if(!extractedQty){
    const numUnitMatch = remaining.match(/(?:لمدة\s+)?(\d+)\s*(دقيقة|دقائق|ساعة|ساعات|كم|كيلو|صفحة|صفحات|كوب|أكواب|حبة|حبات|جرعة)/);
    if(numUnitMatch){
      extractedQty = numUnitMatch[1] + ' ' + numUnitMatch[2];
      const val = parseInt(numUnitMatch[1], 10) || 0;
      if(numUnitMatch[2].startsWith('دقيق')) durationMins = val;
      else if(numUnitMatch[2].startsWith('ساع')) durationMins = val * 60;
      remaining = remaining.replace(numUnitMatch[0], ' ').trim();
    }
  }

  // إذا تم نطق مدة (مثل: "30 دقيقة") دون تحديد نطاق من.. إلى
  if(!isTimeRange && durationMins && durationMins > 0){
    const now = new Date();
    endedAt = now;
    startedAt = new Date(now.getTime() - durationMins * 60000);
    isTimeRange = true;
  }

  // 3. استخراج العنوان النظيف والملاحظات
  const stopWords = new Set([
    "سجل", "تسجيل", "أضف", "اضف", "حط", "تم", "عملت", "سويت",
    "أخذت", "اخذت", "شربت", "أكلت", "اكلت", "اليوم", "أمس",
    "من", "إلى", "الى", "حتى", "الساعة", "الساعه", "ساعة", "ساعه",
    "في", "على", "مع", "كان", "كانت", "لمدة", "لمده"
  ]);

  const cleanWords = remaining.split(/[\s,،.]+/).filter(w => w && !stopWords.has(w));
  const cleanActivity = cleanWords.join(' ').trim();

  // 4. مطابقة الفئة والفئة الفرعية بشكل ذكي
  let matchedCat = null;
  let matchedSubcat = null;

  for(const cat of categories){
    for(const sub of (cat.subcategories || [])){
      if(cleanActivity.toLowerCase().includes(sub.toLowerCase()) || sub.toLowerCase().includes(cleanActivity.toLowerCase())){
        matchedCat = cat;
        matchedSubcat = sub;
        break;
      }
    }
    if(matchedCat) break;
  }

  if(!matchedCat){
    for(const cat of categories){
      if(cleanActivity.toLowerCase().includes(cat.name.toLowerCase()) || cat.name.toLowerCase().includes(cleanActivity.toLowerCase())){
        matchedCat = cat;
        break;
      }
    }
  }

  if(!matchedCat){
    for(const cat of categories){
      for(const [groupKey, synList] of Object.entries(CONCEPT_SYNONYMS_JS)){
        const actHas = synList.some(s => cleanActivity.toLowerCase().includes(s.toLowerCase()));
        const catHas = synList.some(s => cat.name.toLowerCase().includes(s.toLowerCase()) || (cat.id||'').toLowerCase().includes(s.toLowerCase()));
        if(actHas && catHas){
          matchedCat = cat;
          if(cleanActivity && cleanActivity !== cat.name){
            matchedSubcat = cleanActivity;
          }
          break;
        }
      }
      if(matchedCat) break;
    }
  }

  // 5. هل هذه فئة جديدة غير موجودة؟
  const isNewCategory = !matchedCat;
  const suggestedCategoryName = isNewCategory ? (cleanActivity || 'نشاط جديد') : null;
  const suggestedIcon = suggestTrackerIconJs(cleanActivity);
  const suggestedColor = suggestTrackerColorJs(cleanActivity);
  const finalTitle = cleanActivity || (matchedSubcat || (matchedCat ? matchedCat.name : 'نشاط'));

  let finalQty = extractedQty;
  if(isTimeRange && startedAt && endedAt){
    const diffMins = Math.round((endedAt - startedAt) / 60000);
    if(diffMins > 0) finalQty = formatMinutesToArabic(diffMins);
  }

  const isSeverity = ['خفيف', 'متوسط', 'شديد'].includes(extractedQty);
  let combinedNote = isSeverity ? extractedQty : null;

  return {
    rawText,
    activityTitle: finalTitle,
    category: matchedCat,
    isNewCategory,
    suggestedCategoryName,
    suggestedIcon,
    suggestedColor,
    subcategory: matchedSubcat || (!isNewCategory && matchedCat && finalTitle !== matchedCat.name ? finalTitle : null),
    quantityOrDuration: finalQty,
    note: combinedNote,
    startedAt,
    endedAt,
    isTimeRange
  };
}

function openVoiceReviewSheet(parsed){

  const isRange = !!parsed.isTimeRange;

  window._vrParsed = parsed;
  window._vrIsNewCat = isNew;
  window._vrNewCatName = parsed.suggestedCategoryName || parsed.activityTitle;

async function saveVoiceReview(){
  const trk = getTrackerData();
  const isNew = !!window._vrIsNewCat;
  let catId = window._vrCatId;
  let catName = '';

  const isRange = window._vrIsRange;
  const todayIso = window._trackerDate || new Date().toISOString().slice(0, 10);
  let startedAt = null;
  let endedAt = null;
  let loggedAt = `${todayIso}T12:00:00`;
  let quantity = ($('#vrQuantity')||{}).value || null;

  if(isRange){
    const sTime = ($('#vrStartTime')||{}).value || '08:00';
    const eTime = ($('#vrEndTime')||{}).value || '09:00';
    startedAt = `${todayIso}T${sTime}:00`;
    endedAt = `${todayIso}T${eTime}:00`;
    loggedAt = startedAt;
    const s = new Date(startedAt);
    const e = new Date(endedAt);
    const diffMin = Math.round((e - s) / 60000);
    if(diffMin > 0 && !quantity) quantity = formatMinutesToArabic(diffMin);
  } else {
    const iTime = ($('#vrInstantTime')||{}).value || '12:00';
    loggedAt = `${todayIso}T${iTime}:00`;
  }

  const nameIn = document.getElementById('vrNewCatNameInput');
  if(nameIn && nameIn.value.trim()) window._vrNewCatName = nameIn.value.trim();

  if(isNew && window._vrNewCatName){
    catName = window._vrNewCatName.trim();
    const newCat = {
      id: 'cat_' + Date.now(),
      name: catName,
      icon: window._vrNewCatIcon || '⭐',
      colorHex: window._vrNewCatColor || '#F59E0B',
      sortOrder: trk.categories.length + 1,
      subcategories: [],
      dailyGoal: null,
      reminderEnabled: false,
      trackingType: isRange ? 'TIME_RANGE' : 'POINT_IN_TIME',
      syncIntent: 'local_only'
    };
    trk.categories.push(newCat);
    catId = newCat.id;
    upsertTrackerCategoryCloud(newCat);
  } else {
    const existing = trk.categories.find(c => c.id === catId) || trk.categories[0];
    if(!existing){ toast('تعذر العثور على الفئة'); return; }
    catId = existing.id;
    catName = existing.name;
  }

  const subcat = isNew ? null : (($('#vrSubcat')||{}).value || null);
  const note = ($('#vrNote')||{}).value || null;

  const entry = {
    id: 'ent_' + (crypto.randomUUID ? crypto.randomUUID().slice(0,10) : String(Date.now())),
    categoryId: catId,
    subcategory: subcat && subcat.trim() ? subcat.trim() : null,
    quantity: quantity && quantity.trim() ? quantity.trim() : null,
    startedAt: startedAt,
    endedAt: endedAt,
    loggedAt: loggedAt,
    note: note && note.trim() ? note.trim() : null,
    syncIntent: 'local_only'
  };

  trk.entries.push(entry);
  saveTrackerData(trk);
  closeSheet();
  renderLifeTracker();
  toast(`تم حفظ النشاط: ${catName} ✓`);
  insertTrackerEntryCloud(entry);
}

function generateTrackerReportHtml(startDate, endDate, selectedCategoryIds, includeNotes, periodTitle, exportMode = (window._pdfExportMode || 'BOTH')){
  const trk = getTrackerData();
  const catMap = {};
  trk.categories.forEach(c => { catMap[c.id] = c; });
  
  const entries = trk.entries.filter(e => {
    const catOk = !selectedCategoryIds.length || selectedCategoryIds.includes(e.categoryId);
    const dateStr = (e.loggedAt || '').slice(0,10);
    const dateOk = dateStr >= startDate && dateStr <= endDate;
    return catOk && dateOk;
  }).sort((a,b) => (b.loggedAt||'').localeCompare(a.loggedAt||''));

  const counts = {};
  let totalMinutes = 0;
  const catMinutes = {};
  entries.forEach(e => {
    counts[e.categoryId] = (counts[e.categoryId] || 0) + 1;
    let dur = 15;
    if(e.startedAt && e.endedAt){
      const diff = Math.round((new Date(e.endedAt) - new Date(e.startedAt))/60000);
      if(diff > 0) dur = diff;
    } else if(e.quantity) {
      const m = e.quantity.match(/\d+/);
      if(m && (e.quantity.includes('ساعة') || e.quantity.includes('ساعات'))) dur = parseInt(m[0],10)*60;
      else if(m && (e.quantity.includes('دقيقة') || e.quantity.includes('دقائق'))) dur = parseInt(m[0],10);
    }
    catMinutes[e.categoryId] = (catMinutes[e.categoryId] || 0) + dur;
    totalMinutes += dur;
  });

  const periodText = startDate === endDate ? formatArabicDate(startDate) : (startDate + ' إلى ' + endDate);

  let statsHtml = '';
  trk.categories.forEach(cat => {
    if(!selectedCategoryIds.length || selectedCategoryIds.includes(cat.id)){
      const count = counts[cat.id] || 0;
      statsHtml += `
        <div style="background:#F9FAFB;border:1px solid #E5E7EB;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;border-right:4px solid ${cat.colorHex}">
          <div style="font-size:20px">${cat.icon}</div>
          <div style="display:flex;flex-direction:column">
            <span style="font-size:12px;color:#6B7280;font-weight:500">${esc(cat.name)}</span>
            <span style="font-size:14px;font-weight:700;color:#111827">${count} مرة</span>
          </div>
        </div>
      `;
    }
  });

  const showTimeline = exportMode === 'BOTH' || exportMode === 'TIMELINE';
  const showActivities = exportMode === 'BOTH' || exportMode === 'ACTIVITIES';

  // الخط الزمني البصري لليوم وتوزيع الأوقات
  let timelineHtml = '';
  if (showTimeline) {
    const isSingleDay = startDate === endDate;
    const startHour = getTimelineStartHour();
    const endHour = getTimelineEndHour();
    const spanHours = Math.max(1, endHour - startHour);
    const totalSpanMin = spanHours * 60;
    const rowStartMin = startHour * 60;
    const rowEndMin = endHour * 60;

    if (isSingleDay) {
      const sortedDayEntries = [...entries].sort((a,b) => (a.startedAt||a.loggedAt||'').localeCompare(b.startedAt||b.loggedAt||''));
      let slicesHtml = '';
      let rLane0End = -1, rLane1End = -1, rPref = 0;
      sortedDayEntries.forEach(entry => {
        const cat = catMap[entry.categoryId] || { icon:'📌', colorHex:'#3B82F6', name:'' };
        const hasRange = !!(entry.startedAt && entry.endedAt);
        let sMin, durMin;
        if (hasRange) {
          sMin = parseIsoToMinutes(entry.startedAt);
          const eMin = parseIsoToMinutes(entry.endedAt);
          durMin = eMin > sMin ? eMin - sMin : 30;
        } else {
          const lMin = parseIsoToMinutes(entry.loggedAt);
          sMin = Math.max(0, lMin - 7);
          durMin = 15;
        }
        const segStart = Math.max(rowStartMin, Math.min(rowEndMin, sMin));
        const segEnd = Math.max(rowStartMin, Math.min(rowEndMin, sMin + durMin));
        if (segEnd > segStart || (!hasRange && sMin >= rowStartMin && sMin <= rowEndMin)) {
          const startInRow = segStart - rowStartMin;
          const durInRow = Math.max(10, segEnd - segStart);
          const endInRow = startInRow + durInRow;

          const overlaps0 = startInRow < rLane0End;
          const overlaps1 = startInRow < rLane1End;
          let lane = 0;
          if(overlaps0 && !overlaps1) lane = 1;
          else if(!overlaps0 && overlaps1) lane = 0;
          else if(overlaps0 && overlaps1) lane = (rLane0End <= rLane1End) ? 0 : 1;
          else { lane = rPref; rPref = 1 - rPref; }

          if(lane === 0) rLane0End = Math.max(rLane0End, endInRow);
          else rLane1End = Math.max(rLane1End, endInRow);

          const leftPct = (startInRow / totalSpanMin) * 100;
          const widthPct = Math.max(2.5, (durInRow / totalSpanMin) * 100);
          const pastelBg = hexToPastelRgba(cat.colorHex, 0.65);
          const isTop = lane === 0;
          const topCss = isTop ? 'top:4px;height:40px;border-radius:4px 4px 1px 1px;align-items:flex-start;padding-top:3px' : 'top:30px;height:40px;border-radius:1px 1px 4px 4px;align-items:flex-end;padding-bottom:3px';

          slicesHtml += `<div style="position:absolute;${topCss};left:${leftPct.toFixed(2)}%;width:${widthPct.toFixed(2)}%;background:${pastelBg};border:1px solid ${cat.colorHex}55;display:flex;justify-content:center;color:#111;font-size:11px;box-sizing:border-box;z-index:2" title="${esc(cat.name)}">${cat.icon}</div>`;
        }
      });

      let ticksHtml = '';
      const step = spanHours <= 8 ? 1 : (spanHours <= 16 ? 2 : 3);
      for (let h = startHour; h <= endHour; h += step) {
        const pct = ((h - startHour) / spanHours) * 100;
        ticksHtml += `<div style="position:absolute;top:33px;height:9px;left:${pct.toFixed(2)}%;width:1px;background:#9CA3AF"></div>`;
        ticksHtml += `<span style="position:absolute;top:28px;left:${pct.toFixed(2)}%;transform:translateX(-50%);font-size:8.5px;font-weight:bold;color:#4B5563;background:rgba(255,255,255,0.9);padding:1px 3px;border-radius:3px;border:1px solid #E5E7EB;white-space:nowrap">${String(h).padStart(2,'0')}:00</span>`;
      }

      timelineHtml += `
        <div style="border:1px solid #E5E7EB;border-radius:12px;padding:14px;background:#fff;margin-bottom:20px;page-break-inside:avoid">
          <h3 style="font-size:15px;margin:0 0 10px 0;color:#111827">📊 التمثيل البصري للخط الزمني (${String(startHour).padStart(2,'0')}:00 - ${String(endHour).padStart(2,'0')}:00)</h3>
          <div style="direction:ltr;width:100%;position:relative">

  const reportSubtitle = exportMode === 'TIMELINE' ? 'تقرير الخط الزمني وتوزيع الأوقات' : (exportMode === 'ACTIVITIES' ? 'تقرير سجل الأنشطة والتفاصيل' : 'التقرير الشامل • خط زمني وسجل الأنشطة');

function printTrackerPdf(html){
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:999;background:#fff';
  document.body.appendChild(f);
  const close = document.createElement('button');
  close.textContent = '✕ إغلاق التقرير';
  close.style.cssText = 'position:fixed;top:14px;inset-inline-end:14px;z-index:1000;background:#1D1D1F;color:#fff;border:0;border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer';
  close.onclick = () => { f.remove(); close.remove(); };
  document.body.appendChild(close);

      f.contentWindow.focus();

    }
  }, 500);
}
