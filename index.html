<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF1E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>رفيق — الويب</title>
<style>
:root{
  --bg-app:#FAF1E8; --surface:#FFFFFF; --surface-2:#F9F9F9; --surface-warm:#FBF5EE;
  --divider:#F2EEEA; --border:#E8E3DE; --nav-border:#EEEAE6;
  --text-1:#1D1D1F; --text-2:#7F7F78; --text-3:#A2A19C;
  --accent-dark:#245045; --accent:#308A65; --accent-2:#6AB597; --accent-progress:#7BAD4B;
  --accent-soft:#E8F4EE; --accent-verysoft:#F2F8F5;
  --companion:#E7A261; --companion-light:#F0C691;
  --success:#308A65; --warning:#E7A261; --error:#D94A4A; --info:#4C82B8;
  --ring-track:#EDF0EC; --shadow:0 2px 12px rgba(0,0,0,.055);
  --r-card:18px; --r-chip:12px; --r-btn:14px; --nav-h:64px;
  --field-bg:#F3EBE1; --field-border:#CFC7BC;
}
html[data-accent="rose"]{
  --accent-dark:#AE3C60; --accent:#E05789; --accent-2:#E896B5;
  --accent-progress:#E05789; --accent-soft:#FDEAF1; --accent-verysoft:#FFF4F7;
}
html[data-theme="dark"]{
  --bg-app:#121312; --surface:#1B1C1B; --surface-2:#1F201F; --surface-warm:#202220;
  --divider:#2A2C2A; --border:#30322F; --nav-border:#30322F;
  --text-1:#F6F6F4; --text-2:#AAA9A5; --text-3:#8A8984;
  --ring-track:#2C2E2C; --shadow:0 2px 12px rgba(0,0,0,.45);
  --field-bg:#232523; --field-border:#4A4C4A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'SF Arabic','Segoe UI','Geeza Pro','Noto Kufi Arabic',Tahoma,sans-serif;
  background:#EDE7E0;color:var(--text-1);touch-action:manipulation}
html[data-theme="dark"] body{background:#0C0D0C}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;font-size:14px}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text-1)}
a{color:var(--accent)}
.hidden{display:none!important}
#shell{max-width:520px;margin:0 auto;min-height:100dvh;background:var(--bg-app);position:relative}
@media(min-width:800px){#shell{max-width:760px;box-shadow:0 0 0 1px var(--border)}}
.screen{padding:14px 16px calc(var(--nav-h) + 26px);animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:.35}to{opacity:1}}
h1{font-size:21px;font-weight:700}
h2{font-size:16px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--nav-border);border-radius:var(--r-card);
  box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-head h2{flex:1}
.link{font-size:13px;font-weight:500;color:var(--accent);min-height:32px;padding:0 4px}
.sec{display:flex;align-items:center;gap:8px;margin:18px 2px 10px}
.sec h2{font-size:18px;font-weight:700;flex:1}
.greet{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.greet .g{flex:1}
.greet .g p{font-size:13px;color:var(--text-2)}
.hicon-btn{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto;background:none}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--accent-dark);flex:0 0 auto}
.avatar.comp{background:var(--companion-light);color:#7A4A1E}
.avatar.sm{width:28px;height:28px;font-size:12px}
.week{display:flex;gap:6px;margin-bottom:16px}
.day{flex:1;height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-2)}
.day.today{background:var(--accent-soft);color:var(--accent-dark)}
.day .dn{font-size:11px}.day .dd{font-size:14px;font-weight:600}
.progress-row{display:flex;gap:12px;margin-bottom:16px}
@media(min-width:640px){.progress-row{max-width:520px}}
.pcard{flex:1;background:var(--surface);border:1px solid var(--nav-border);border-radius:var(--r-card);
  box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pcard .who{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text-2);align-self:flex-start}
.ring{position:relative;width:80px;height:80px}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.bar{height:7px;border-radius:8px;background:var(--ring-track);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:8px;background:var(--accent-progress);transition:width .35s ease}
.bar.solo{width:80px;flex:0 0 auto}
.row{display:flex;align-items:center;gap:10px;min-height:48px}
.row+.row{border-top:1px solid var(--divider)}
.hicon{width:34px;height:34px;border-radius:var(--r-chip);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.htitle{flex:1;min-width:0;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hval{font-size:12px;color:var(--text-2);font-weight:500;white-space:nowrap}
.hval.ok{color:var(--accent);font-weight:600}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:transparent;background:transparent;transition:all .18s ease}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rafiq-chev{cursor:pointer;color:var(--text-3);font-size:13px;padding:2px 6px;user-select:none}
.mini{font-size:13px;font-weight:700;color:var(--accent-dark);background:var(--accent-soft);border-radius:10px;padding:6px 12px}
.shop-meta{font-size:11px;color:var(--text-3)}
.done-t{font-size:12px;font-weight:600;color:var(--text-3);padding:10px 0 2px}
.add-item{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--divider)}
.add-item input{flex:1;min-height:44px;border:1px solid var(--field-border);border-radius:var(--r-btn);background:var(--field-bg);padding:0 14px;outline:none}
.add-item input:focus{border-color:var(--accent-2)}
.add-item button{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-size:22px;flex:0 0 auto}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:55;display:flex;justify-content:center;pointer-events:none}
#nav .in{pointer-events:auto;width:100%;max-width:520px;height:var(--nav-h);background:var(--surface);
  border-top:1px solid var(--nav-border);display:flex}
@media(min-width:800px){#nav .in{max-width:760px}}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#777873;font-size:11px;font-weight:500}
#nav button.on{color:var(--accent)}
#nav .ic{font-size:19px;line-height:1}
.overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s ease}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:20px 20px 0 0;
  padding:16px 16px calc(22px + env(safe-area-inset-bottom));max-height:86dvh;overflow-y:auto;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(40px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sheet-head h3{flex:1;font-size:17px;font-weight:700}
.sheet-x{width:36px;height:36px;border-radius:12px;background:var(--surface-2);font-size:15px;color:var(--text-2)}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;min-height:48px;border:1.5px solid var(--field-border);
  border-radius:var(--r-btn);background:var(--field-bg);padding:10px 14px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent-2);background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:40px;display:inline-flex;align-items:center;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);padding:0 12px;font-size:13px;font-weight:500;color:var(--text-2)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-2);color:var(--accent-dark);font-weight:600}
.vis-opt{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border:1px solid var(--border);
  border-radius:var(--r-btn);margin-bottom:8px;width:100%;text-align:start}
.vis-opt.on{border-color:var(--accent);background:var(--accent-verysoft)}
.vis-opt .vt{font-size:14px;font-weight:600}
.vis-opt .vd{font-size:12px;color:var(--text-3)}
.btn{width:100%;min-height:48px;border-radius:var(--r-btn);background:var(--accent);color:#fff;font-size:15px;font-weight:600}
.btn:active{opacity:.85}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--text-2);font-weight:500;font-size:14px;min-height:44px}
.btn.danger{color:var(--error);background:none;border:1px solid var(--border)}
.badge{font-size:11px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--divider);border-radius:999px;padding:2px 8px;display:inline-block}
.status{min-width:60px;height:28px;border-radius:999px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.s-TODO{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.s-IN_PROGRESS{background:#E7F0F9;color:var(--info)}
.s-DONE{background:var(--accent-soft);color:var(--accent-dark)}
.empty{padding:26px 12px;text-align:center;color:var(--text-2);font-size:14px}
.empty .e{font-size:28px;display:block;margin-bottom:8px}
.foot{text-align:center;color:var(--text-3);font-size:11px;padding:16px 0 6px}
#toast{position:fixed;bottom:calc(var(--nav-h) + 24px);left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text-1);color:var(--bg-app);font-size:13px;font-weight:500;padding:10px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:all .2s ease;z-index:90;white-space:nowrap;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bcol .be{width:100%;max-width:26px;border-radius:8px 8px 4px 4px;background:var(--accent-2);opacity:.55}
.bcol.t .be{background:var(--accent);opacity:1}
.bcol .bl{font-size:10px;color:var(--text-3)}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini-stat{background:var(--surface-2);border-radius:var(--r-chip);padding:10px}
.mini-stat b{display:block;font-size:16px;font-weight:700}
.mini-stat span{font-size:11px;color:var(--text-3)}
.qr{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;display:inline-block}
.switch{width:46px;height:28px;border-radius:999px;background:var(--ring-track);position:relative;flex:0 0 auto}
.switch i{position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .18s ease}
.switch.on{background:var(--accent)}
html[dir="rtl"] .switch.on i{transform:translateX(-18px)}
.setrow{display:flex;align-items:center;gap:10px;min-height:52px}
.setrow+.setrow{border-top:1px solid var(--divider)}
.setrow .st{flex:1;font-size:15px;font-weight:500}
.circlerow{display:flex;align-items:center;gap:12px;min-height:58px;width:100%;text-align:start}
.circlerow+.circlerow{border-top:1px solid var(--divider)}
.cico{width:40px;height:40px;border-radius:var(--r-chip);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;background:var(--companion-light)}
.cico.personal{background:var(--accent-soft)}
.notif-row{display:flex;align-items:center;gap:10px;min-height:54px}
.notif-row+.notif-row{border-top:1px solid var(--divider)}
.nico{width:36px;height:36px;border-radius:50%;background:var(--accent-verysoft);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.task-title{font-size:15px;font-weight:500;flex:1;min-width:0}
.task-title.dn{color:var(--text-3);text-decoration:line-through}
.task-row{display:flex;gap:10px;padding:10px 0;align-items:flex-start}
.task-row+.task-row{border-top:1px solid var(--divider)}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.welc{background:var(--surface);border:1px solid var(--nav-border);border-radius:var(--r-card);box-shadow:var(--shadow);padding:14px 16px;margin:10px 0}
.welc b{display:block;font-size:15px;font-weight:700}
.welc span{font-size:13px;color:var(--text-2)}
.err{color:var(--error);font-size:13px;margin-top:8px}
.info-msg{color:var(--info);font-size:13px;margin-top:8px}
.logo{font-size:38px;text-align:center;display:block}
.otp{display:flex;gap:8px;justify-content:center;direction:ltr;margin:4px 0}
.otp-b{width:52px;height:60px;text-align:center;font-size:24px;font-weight:700;
  border:1.5px solid var(--field-border);border-radius:14px;background:var(--field-bg);
  color:var(--text-1);outline:none;padding:0}
.otp-b:focus{border-color:var(--accent-2);background:var(--surface)}
</style>

};
try{
  const saved = JSON.parse(localStorage.getItem('rafiq_web_cfg')||'null');
  if(saved && saved.url && saved.key){ CFG.url = saved.url; CFG.key = saved.key; }
}catch(e){}
function saveCfg(){ localStorage.setItem('rafiq_web_cfg', JSON.stringify({url:CFG.url,key:CFG.key})); }

/* ================= طبقة Supabase REST (بدون أي مكتبات خارجية) ================= */
let session = null;
try{ session = JSON.parse(localStorage.getItem('rafiq_web_session')||'null'); }catch(e){ session=null; }
function saveSession(){ if(session) localStorage.setItem('rafiq_web_session', JSON.stringify(session)); else localStorage.removeItem('rafiq_web_session'); }

async function sb(path, opts={}, auth=true){
  const headers = Object.assign({'apikey': CFG.key, 'Content-Type':'application/json'}, opts.headers||{});
  if(auth){
    if(!session || !session.access_token) throw new Error('NO_SESSION');
    headers['Authorization'] = 'Bearer ' + session.access_token;
  }
  let res = await fetch(CFG.url + path, Object.assign({}, opts, {headers}));
  if(res.status === 401 && auth && session && session.refresh_token){
    const ok = await refreshSession();
    if(ok){
      headers['Authorization'] = 'Bearer ' + session.access_token;
      res = await fetch(CFG.url + path, Object.assign({}, opts, {headers}));
    }
  }
  return res;
}
async function refreshSession(){
  try{
    const res = await fetch(CFG.url + '/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{'apikey':CFG.key,'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: session.refresh_token})
    });
    if(!res.ok) return false;
    const d = await res.json();
    session = {access_token:d.access_token, refresh_token:d.refresh_token, expires_at:Date.now()+(d.expires_in||3600)*1000, user:d.user};
    saveSession(); return true;
  }catch(e){ return false; }
}
async function rest(method, table, a3, a4, a5){
  let query='', body=null, prefer=null;
  for(const a of [a3,a4,a5]){
    if(a===null||a===undefined) continue;
    if(typeof a==='string'){
      if(a.startsWith('return=')||a.startsWith('resolution=')) prefer=a; else query=a;
    } else body=a;
  }
  const headers={};
  if(prefer) headers['Prefer']=prefer;
  else if(method==='POST') headers['Prefer']='return=minimal';
  const res = await sb('/rest/v1/'+table+(query?('?'+query):''), {method, headers, body: body?JSON.stringify(body):undefined});
  const text = await res.text();
  let json = null; try{ json = text?JSON.parse(text):null; }catch(e){}
  if(!res.ok){
    const msg = json && (json.message||json.msg) ? (json.message||json.msg) : ('HTTP '+res.status);
    throw new Error(msg);
  }
  return json;
}
const nowIso = () => new Date().toISOString();
function daysAgoIso(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString(); }
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c=='x'?r:(r&0x3|0x8)).toString(16);}));

<script>
'use strict';
/* ================= مولّد QR داخلي (byte mode, EC M, v1-10) — بلا مكتبات خارجية ================= */
const QR = (()=>{
  const EXP=new Uint8Array(512), LOG=new Uint8Array(256);
  (function(){ let x=1; for(let i=0;i<255;i++){ EXP[i]=x; LOG[x]=i; x<<=1; if(x&256) x^=0x11D; } for(let i=255;i<512;i++) EXP[i]=EXP[i-255]; })();
  const mul=(a,b)=> (a&&b)? EXP[LOG[a]+LOG[b]] : 0;
  function genPoly(deg){ let p=[1]; for(let i=0;i<deg;i++){ const r=EXP[i], n=new Array(p.length+1).fill(0);
    for(let j=0;j<p.length;j++){ n[j]^=p[j]; n[j+1]^=mul(p[j],r); } p=n; } return p; }
  function rsEnc(data,deg){ const g=genPoly(deg), out=new Array(data.length+deg).fill(0);
    for(let i=0;i<data.length;i++){ out[i]=data[i]; }
    for(let i=0;i<data.length;i++){ const f=out[i]; if(f) for(let j=1;j<g.length;j++) out[i+j]^=mul(g[j],f); }
    return out.slice(data.length); }
  const ECC=[-1,10,16,26,18,24,16,18,22,22,26], BLK=[-1,1,1,1,2,2,4,4,4,5,5];
  function rawModules(ver){ let r=(16*ver+128)*ver+64;
    if(ver>=2){ const na=Math.floor(ver/7)+2; r-=(25*na-10)*na-55; if(ver>=7) r-=36; } return Math.floor(r/8); }
  function maskBit(k,r,c){ switch(k){
    case 0: return (r+c)%2===0; case 1: return r%2===0; case 2: return c%3===0;
    case 3: return (r+c)%3===0; case 4: return (Math.floor(r/2)+Math.floor(c/3))%2===0;
    case 5: return ((r*c)%2+(r*c)%3)===0; case 6: return (((r*c)%2)+((r*c)%3))%2===0;
    default: return (((r+c)%2)+((r*c)%3))%2===0; } }
  function build(text){
    const bytes=new TextEncoder().encode(text);
    let ver=0;
    for(let v=1;v<=10;v++){ const cap=(rawModules(v)-BLK[v]*ECC[v])*8; const need=4+ (v<10?8:16) + bytes.length*8;
      if(need<=cap){ ver=v; break; } }
    if(!ver) throw new Error('طويل جدًا');
    const cap=(rawModules(ver)-BLK[ver]*ECC[ver])*8;
    const bits=[];
    const push=(val,n)=>{ for(let i=n-1;i>=0;i--) bits.push((val>>>i)&1); };
    push(4,4); push(bytes.length, ver<10?8:16);
    bytes.forEach(b=>push(b,8));
    const capData=Math.floor(cap/8)- (4+ (ver<10?8:16))/8 - bytes.length; // bytes of padding room
    let term=Math.min(4, cap-bits.length); push(0,term);
    while(bits.length%8!==0) bits.push(0);
    const pads=[0xEC,0x11]; let pi=0;
    while(bits.length < cap){ const b=pads[pi++%2]; push(b,8); }
    // بتات → بايتات
    const cw=[]; for(let i=0;i<bits.length;i+=8){ let b=0; for(let j=0;j<8;j++) b=(b<<1)|bits[i+j]; cw.push(b); }
    // تقسيم الكتل + إكمان-سالومون
    const nBlocks=BLK[ver], eccLen=ECC[ver];
    const shortLen=Math.floor(cw.length/nBlocks), numLong=cw.length%nBlocks;
    const blocks=[], eccs=[];
    let off=0;
    for(let b=0;b<nBlocks;b++){ const len=shortLen+(b < (cw.length%nBlocks)?1:0);
      blocks.push(cw.slice(off,off+len)); off+=len; }
    // تصحيح: numLong بايتات طويلة = cw.length % nBlocks … لكن الترتيب الرسمي: الكتل الأولى قصيرة
    blocks.length=0; off=0;
    const numShort=nBlocks-(cw.length%nBlocks), numFull=cw.length%nBlocks;
    let idx=0;
    for(let b=0;b<nBlocks;b++){ const isLong = b < numFull ? false : true; }
    // إعادة حساب صحيحة: nBlocks - numFull كتل قصيرة أولًا ثم كتل طويلة
    blocks.length=0;
    const shortBlockLen=Math.floor(cw.length/nBlocks), numLongBlocks=cw.length%shortBlockLen===0?0:cw.length%Math.max(1,shortBlockLen+1);
    // نهج أبسط وموثوق (نمط نايوكي): result = data split as [short+1 repeated numLong][short repeated rest]
    const shortB=Math.floor(cw.length/nBlocks); const numL=cw.length-shortB*nBlocks;
    blocks.length=0; idx=0;
    for(let b=0;b<nBlocks;b++){ const len=shortB+(b<numL?1:0); blocks.push(cw.slice(idx,idx+len)); idx+=len; }
    for(let b=0;b<nBlocks;b++) eccs.push(rsEnc(blocks[b],eccLen));
    // تشابك
    const interleaved=[];
    const maxLen=shortB+ (numL?1:0);
    for(let i=0;i<maxLen;i++) for(let b=0;b<nBlocks;b++) if(i<blocks[b].length) interleaved.push(blocks[b][i]);
    for(let i=0;i<eccLen;i++) for(let b=0;b<nBlocks;b++) interleaved.push(eccs[b][i]);
    // مصفوفة
    const size=ver*4+17;
    const m=Array.from({length:size},()=>new Array(size).fill(null));
    const setF=(x,y,d)=>{ m[y][x]=d; };
    function finder(r,c){ for(let dr=-1;dr<=7;dr++) for(let dc=-1;dc<=7;dc++){ const rr=r+dr,cc=c+dc;
      if(rr<0||rr>=size||cc<0||cc>=size) continue;
      const dark=(dr>=0&&dr<=6&&dc>=0&&dc<=6)&&(dr===0||dr===6||dc===0||dc===6||(dr>=2&&dr<=4&&dc>=2&&dc<=4));
      m[rr][cc]=dark; } }
    finder(0,0); finder(0,size-7); finder(size-7,0);
    for(let i=8;i<size-8;i++){ m[6][i]=(i%2===0); m[i][6]=(i%2===0); }
    if(ver>=2){ const na=Math.floor(ver/7)+2;
      const step=Math.trunc((ver*4+na*2+1)/(na*2-2))*2;
      const pos=[]; for(let p=size-7; pos.length<na; p-=step) pos.splice(0,0,p); pos[0]=6;
      for(const rr of pos) for(const cc of pos){ if(m[rr][cc]===null)
        for(let dr=-2;dr<=2;dr++) for(let dc=-2;dc<=2;dc++) m[rr+dr][cc+dc]=(Math.max(Math.abs(dr),Math.abs(dc))!==1); } }
    m[size-8][8]=true;
    // حجز مناطق التنسيق والإصدار
    for(let i=0;i<9;i++){ if(m[8][i]===null)m[8][i]=false; if(m[i][8]===null)m[i][8]=false; }
    for(let i=0;i<8;i++){ if(m[8][size-1-i]===null)m[8][size-1-i]=false; if(m[size-1-i][8]===null)m[size-1-i][8]=false; }
    if(ver>=7){ let rem=ver; for(let i=0;i<12;i++) rem=(rem<<1)^((rem>>>11)*0x1F25);
      const vbits=(ver<<12)|rem;
      for(let i=0;i<18;i++){ const bit=((vbits>>>i)&1)===1;
        const a=size-11+i%3, b=Math.floor(i/3);
        setF(a,b,bit); setF(b,a,bit); } }
    // وضع البيانات
    let bi=0;
    for(let right=size-1; right>=1; right-=2){
      if(right===6) right=5;
      for(let vert=0; vert<size; vert++){
        for(let j=0;j<2;j++){
          const c=right-j;
          const upward=((right+1)&2)===0;
          const r= upward? size-1-vert : vert;
          if(m[r][c]===null){
            let dark=false;
            if(bi<interleaved.length*8) dark=(((interleaved[Math.floor(bi/8)]>>>(7-(bi%8)))&1)===1);
            dark = maskBit(0,r,c) ? !dark : dark; // mask 0: dark ^= maskBit
            dark = !dark === false ? dark : dark; // keep
            m[r][c]=dark; bi++;
          }
        }
      }
    }
    // معلومات التنسيق (EC M → formatBits=0)
    let d=0<<3|0, rem2=d;
    for(let i=0;i<10;i++) rem2=(rem2<<1)^((rem2>>>9)*0x537);
    const fbits=((d<<10)|rem2)^0x5412;
    const gb=i=>((fbits>>>i)&1)===1;
    for(let i=0;i<=5;i++) setF(8,i,gb(i));
    setF(8,7,gb(6)); setF(8,8,gb(7)); setF(7,8,gb(8));
    for(let i=9;i<15;i++) setF(14-i,8,gb(i));
    for(let i=0;i<8;i++) setF(size-1-i,8,gb(i));
    for(let i=8;i<15;i++) setF(8,size-15+i,gb(i));
    setF(size-8,8,true);
    // SVG
    let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" width="180" height="180">`;
    svg+=`<rect width="${size}" height="${size}" fill="#FFFFFF"/>`;
    for(let r=0;r<size;r++) for(let c=0;c<size;c++) if(m[r][c]) svg+=`<rect x="${c}" y="${r}" width="1" height="1" fill="#111111"/>`;
    svg+='</svg>';
    return svg;
  }
  return {build};
})();

async function refreshAll(){
  const me=meId();
  // جولة 1: الملف + العضويات بالتوازي
  const [profileArr, memberships]=await Promise.all([
    rest('GET','profiles','id=eq.'+me+'&select=*'),
    rest('GET','circle_members','user_id=eq.'+me+'&select=*'),
  ]);
  const profile=profileArr[0]||null;
  const myCircleIds=memberships.map(m=>m.circle_id);
  if(!myCircleIds.length){ data={profile,circles:[],items:[],recipients:[],entries:[],tasks:[],sharedLists:[],shopping:[],activity:[],reactions:[],invites:[]}; saveSnap(); return; }
  const inC='circle_id=in.('+myCircleIds.join(',')+')';
  const inC2='id=in.('+myCircleIds.join(',')+')';
  const owned=[]; // تُحسب بعد جلب الدوائر
  // جولة 2: كل الجداول الرئيسية بالتوازي (لا تعتمد على بعضها)
  const [circles,allMembers,items,tasks,sharedLists,activity]=await Promise.all([
    rest('GET','circles',inC2+'&select=*'),
    rest('GET','circle_members',inC+'&select=*'),
    rest('GET','items',inC+'&order=created_at.desc&select=*'),
    rest('GET','tasks',inC+'&order=created_at.desc&select=*'),
    rest('GET','shared_lists',inC+'&select=*'),
    rest('GET','activity_events',inC+'&order=created_at.desc&limit=40&select=*'),
  ]);
  const memberIds=[...new Set(allMembers.map(m=>m.user_id).filter(u=>u!==me))];
  const itemIds=items.map(i=>i.id), listIds=sharedLists.map(l=>l.id), evIds=activity.map(a=>a.id);
  const ownedIds=circles.filter(c=>c.owner_id===me).map(c=>c.id);
  // جولة 3: التوابع بالتوازي
  const [peerProfiles,recipients,entries,shopping,reactions,invitesRaw]=await Promise.all([
    memberIds.length?rest('GET','profiles','id=in.('+memberIds.join(',')+')&select=*'):[],
    itemIds.length?rest('GET','item_recipients','item_id=in.('+itemIds.join(',')+')&select=*'):[],
    itemIds.length?rest('GET','progress_entries','item_id=in.('+itemIds.join(',')+')&recorded_at=gte.'+daysAgoIso(30)+'&select=*'):[],
    listIds.length?rest('GET','shared_list_items','list_id=in.('+listIds.join(',')+')&order=position.asc&select=*'):[],
    evIds.length?rest('GET','reactions','event_id=in.('+evIds.join(',')+')&select=*'):[],
    ownedIds.length?rest('GET','circle_invites','circle_id=in.('+ownedIds.join(',')+')&revoked=eq.false&order=created_at.desc&select=*'):[],
  ]);
  const pById={}; peerProfiles.forEach(p=>pById[p.id]=p); pById[me]=profile;
  // ترحيل تلقائي: رموز منتهية أو بصيغة قديمة → تجديد
  let invites=invitesRaw||[];
  const staleInv=invites.filter(i=>!/^[0-9]{6}$/.test(i.code) || (new Date(i.expires_at) < new Date()));
  if(staleInv.length){
    for(const st of staleInv){
      try{
        await rest('PATCH','circle_invites',{revoked:true},'id=eq.'+st.id);
        await rest('POST','circle_invites',{id:uuid(),circle_id:st.circle_id,code:genCode(),created_by:me,expires_at:daysAgoIso(-7),revoked:false},'return=minimal');
      }catch(e){}
    }
    try{ invites=await rest('GET','circle_invites','circle_id=in.('+ownedIds.join(',')+')&revoked=eq.false&order=created_at.desc&select=*'); }catch(e){}
  }
  if(!profile){ const prev=loadSnap(); if(prev&&prev.profile) profile=prev.profile; }
  data={profile,circles:circles.map(c=>({circle:c,members:allMembers.filter(m=>m.circle_id===c.id).map(m=>({m,p:pById[m.user_id]||{id:m.user_id,display_name:'عضو',accent_theme:'green'}}))})),
    items,recipients,entries,tasks,sharedLists,shopping,activity,reactions,invites};
  saveSnap();
}
let dataSig='';
function dataSignature(){ try{ return JSON.stringify(data).length + '|' + (data.items?data.items.length:0) + '|' + (data.tasks?data.tasks.length:0) + '|' + (data.shopping?data.shopping.length:0) + '|' + (data.entries?data.entries.length:0) + '|' + (data.activity?data.activity.length:0); }catch(e){ return String(Math.random()); } }
function saveSnap(){ try{ localStorage.setItem('rafiq_snap', JSON.stringify({t:Date.now(),d:data})); }catch(e){} }
function loadSnap(){ try{ const s=JSON.parse(localStorage.getItem('rafiq_snap')||'null'); if(s&&s.d) return s.d; }catch(e){} return null; }
const circlesOf=()=>data?data.circles:[];
const sharedFirst=()=>circlesOf().find(c=>c.circle.type==='SHARED')||null;
const companionOf=()=>{ const s=sharedFirst(); return s? (s.members.find(x=>x.m.user_id!==meId())||{}).p : null; };
function isSpecialItem(it){ const f=it.frequency||''; return f.startsWith('MED|')||f.startsWith('MOOD|'); }
function habitsFor(uid){ return data?data.items.filter(i=>i.owner_id===uid&&['HABIT','QURAN','BOOK','LEARNING','GOAL'].includes(i.type)&&!isSpecialItem(i)):[]; }
function habitProg(uid,item){
  const today=new Date().toDateString();
  const v=data.entries.filter(e=>e.item_id===item.id&&e.user_id===uid&&new Date(e.recorded_at).toDateString()===today).reduce((s,e)=>s+(+e.value||0),0);
  const bin=item.target_value==null;
  return {v,bin,done: bin? v>0 : v>=(+item.target_value||0), pct: bin? (v>0?100:0) : Math.min(100,Math.round(v/(+item.target_value||1)*100))};
}
function dailyPct(uid){
  const hs=habitsFor(uid).filter(i=>i.visibility==='CIRCLE'||i.owner_id===uid);
  if(!hs.length) return 0;
  const done=hs.filter(i=>habitProg(uid,i).done).length;
  return Math.round(done/hs.length*100);
}
function visibleTasks(){
  const me=meId();
  return (data?data.tasks:[]).filter(t=>{
    if(t.owner_id===me) return true;
    if(t.circle_id==='personal') return false;
    if(t.visibility==='PRIVATE') return false;
    if(t.visibility==='CIRCLE') return true;
    if(t.visibility==='SELECTED_MEMBERS') return t.owner_id===me||(t.recipients||[]).includes(me);
    return false;
  });
}

/* ================= الحساب: signUp / signIn / signOut ================= */
async function signUp(email,password,displayName,accent){
  try{
    const res=await fetch(CFG.url+'/auth/v1/signup',{method:'POST',
      headers:{'apikey':CFG.key,'Content-Type':'application/json'},
      body:JSON.stringify({email,password,data:{display_name:displayName,accent_theme:accent}})});
    const d=await res.json();
    if(!res.ok) return {ok:false,msg:d.msg||d.error_description||('HTTP '+res.status)};
    if(d.access_token){ session={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||3600)*1000,user:d.user}; saveSession(); return {ok:true}; }
    return {ok:false,mode:'confirm_email',msg:''};
  }catch(e){ return {ok:false,msg:'تعذر الاتصال — تحقق من الإنترنت'}; }
}
async function signIn(email,password){
  try{
    const res=await fetch(CFG.url+'/auth/v1/token?grant_type=password',{method:'POST',
      headers:{'apikey':CFG.key,'Content-Type':'application/json'},
      body:JSON.stringify({email,password})});
    const d=await res.json();
    if(!res.ok) return {ok:false,msg:d.error_description||d.msg||('HTTP '+res.status)};
    session={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||3600)*1000,user:d.user};
    saveSession(); return {ok:true};
  }catch(e){ return {ok:false,msg:'تعذر الاتصال — تحقق من الإنترنت'}; }
}
async function signOut(){ try{ await sb('/auth/v1/logout',{method:'POST'},true); }catch(e){}
  session=null; saveSession(); data=null; stopPolling(); renderAuth(); }

/* ================= إشعارات المتصفح ================= */
function askNotify(){
  try{ if(('Notification' in window) && Notification.permission==='default') Notification.requestPermission(); }catch(e){}
}
let lastNotified=0;
try{ lastNotified=parseInt(localStorage.getItem('rafiq_last_notified')||'0',10)||0; }catch(e){}
function checkNotify(){
  try{
    if(!('Notification' in window) || Notification.permission!=='granted' || !data) return;
    const reminders=(data.tasks||[]).filter(t=>t.priority==='REMINDER'&&t.assigned_to===meId()&&t.status!=='DONE');
    const now=Date.now();
    for(const r of reminders){
      const ts=new Date(r.created_at||0).getTime()||0;
      if(ts>lastNotified){ try{ new Notification('🔔 '+(r.title||'تذكير'),{body:'تذكير من رفيقك',tag:'rem-'+r.id}); }catch(e){} }
    }
    for(const e of eventsOf()){
      const d=e.due_at? new Date(e.due_at).getTime():0;
      if(d>now && d-now<2*3600*1000 && d>lastNotified){ try{ new Notification('📅 '+(e.title||'موعد'),{body:'موعدك بعد قليل',tag:'ev-'+e.id}); }catch(e2){} }
    }
    // أدوية لم تكتمل جرعاتها اليوم
    try{
      for(const m of medsOf()){
        if(!m.activeToday()) continue;
        const lg=medLogged(m); if(Math.round(lg)>=m.perDay) continue;
        const key='med_notified_'+m.item.id;
        const last=parseInt(localStorage.getItem(key)||'0',10)||0;
        if(now-last>2*3600*1000){
          try{ new Notification('💊 دواء: '+m.item.title,{body:'بقي '+(m.perDay-Math.round(lg))+' من '+m.perDay+' جرعة اليوم',tag:key}); }catch(e){}
          try{ localStorage.setItem(key,String(now)); }catch(e){}
        }
      }
    }catch(e){}
    lastNotified=now; try{ localStorage.setItem('rafiq_last_notified',String(now)); }catch(e){}
  }catch(e){}
}

function askGeo(){
  try{ if(navigator.geolocation) navigator.geolocation.getCurrentPosition(function(){}, function(){}, {timeout:6000}); }catch(e){}
}

let pollTimer=null;
function startPolling(){ if(pollTimer) return; pollTimer=setInterval(()=>{
  if(document.visibilityState==='visible'&&session&&data&&!document.querySelector('.overlay')){ refreshAll().then(()=>{
    const sig=dataSignature();
    if(sig!==dataSig){ dataSig=sig; renderApp(); }
    checkNotify();
  }).catch(()=>{}); } },8000); }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

function parseMed(it){
  const f=it.frequency||''; if(!f.startsWith('MED|')) return null;
  const desc=(it.description||'').split('|');
  const g=k=>{ const p=desc.find(x=>x.startsWith(k+'=')); return p? p.slice(k.length+1):''; };
  return {item:it, schedule:f.slice(4),
    start:g('start'), end:g('end'), ongoing:g('ongoing')==='1', patient:g('patient'),
    perDay:Math.max(1,Math.round((it.target_value||1))),
    scheduleAr(){ if(this.schedule.endsWith('x')) return this.schedule.slice(0,-1)+' مرات يوميًا';
      if(this.schedule.startsWith('weekly:')) return 'أيام: '+this.schedule.slice(7); return this.schedule; },
    statusAr(){ if(this.ongoing) return 'مستمر مدى الحياة';
      if(!this.end) return ''; const d=Math.ceil((new Date(this.end)-new Date())/86400000);
      return d<0?'انتهى':(d===0?'آخر يوم':('ينتهي بعد '+d+' يومًا')); },
    activeToday(){ const t=new Date().toISOString().slice(0,10);
      if(this.start&&t<this.start) return false;
      if(!this.ongoing&&this.end&&t>this.end) return false; return true; } };
}

function ytThumb(u){ if(!u) return null; u=String(u); let id=null;
  if(u.indexOf('youtu.be/')>=0) id=u.split('youtu.be/')[1];
  else if(u.indexOf('shorts/')>=0) id=u.split('shorts/')[1];
  else if(u.indexOf('v=')>=0) id=u.split('v=')[1];
  if(!id) return null;
  id=id.split('&')[0].split('?')[0].slice(0,11);
  return id.length>=11? ('https://img.youtube.com/vi/'+id+'/mqdefault.jpg') : null;
}

function recurrenceOf(t){ try{ const m=(t.description||'').match(/RECUR:([a-z:0-9]+)/); return m?m[1]:null; }catch(e){ return null; } }
function cleanDesc(t){ try{ return (t.description||'').replace(/\s*\|?RECUR:[a-z:0-9]+/,'').trim()||null; }catch(e){ return t.description; } }
function recurrenceAr(r){ if(r==='daily') return 'يوميًا';
  if(r.startsWith('weekly:')) return 'كل '+['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'][+r.slice(7)];
  if(r.startsWith('monthly:')) return 'يوم '+r.slice(8)+' من كل شهر'; return r; }
function nextOccurrence(iso,recur){ try{
  let d=new Date(iso||Date.now()); const today=new Date(); today.setHours(0,0,0,0); let g=0;
  while(d<=today && g<400){ if(recur==='daily') d.setDate(d.getDate()+1);
    else if(recur.startsWith('weekly:')) d.setDate(d.getDate()+7);
    else if(recur.startsWith('monthly:')) d.setMonth(d.getMonth()+1); else d.setDate(d.getDate()+1); g++; }
  d.setHours(9,0,0,0); return d.toISOString(); }catch(e){ return null; } }
function overdueTasks(){ const now=Date.now();
  return visibleTasks().filter(t=>t.priority!=='EVENT'&&t.status!=='DONE'&&t.due_at&&new Date(t.due_at).getTime()<now); }
async function completeRecurring(t){
  try{ const recur=recurrenceOf(t); if(!recur) return; const next=nextOccurrence(t.due_at,recur);
    await rest('PATCH','tasks',{status:'DONE',completed_at:new Date().toISOString(),completed_by:meId()},'id=eq.'+t.id);
    const copy=Object.assign({},t,{id:uuid(),status:'TODO',started_at:null,completed_at:null,completed_by:null,due_at:next,created_at:new Date().toISOString()});
    await rest('POST','tasks',copy,'return=minimal');
    try{ await rest('POST','activity_events',{id:uuid(),circle_id:t.circle_id,user_id:meId(),kind:'TASK_DONE',payload:t.title}); }catch(e){}
    await refreshAll(); renderApp(); toast('أُنجزت الدورة — وجهّزت التالية 🔁');
  }catch(e){ toast('تعذر: '+(e&&e.message?e.message:'')); } }

  let streak=0; const today=new Date();
  let cur=daysWith.has(today.toDateString())?today:new Date(today.getTime()-86400000);
  if(daysWith.has(cur.toDateString())){ while(daysWith.has(cur.toDateString())){ streak++; cur=new Date(cur.getTime()-86400000); } }
  const week=last7();

    const done=habits.filter(item=>{ const v=myEntries.filter(e=>e.item_id===item.id&&new Date(e.recorded_at).toDateString()===d.toDateString()).reduce((s,e)=>s+(+e.value||0),0);

  const sumU=(u,from)=>myEntries.filter(e=>new Date(e.recorded_at)>=from&&(e.unit||'').includes(u)).reduce((s,e)=>s+(+e.value||0),0);
  const pagesW=sumU('صفح',weekStart), pagesM=(()=>{ const f=new Date(); f.setDate(f.getDate()-29); return sumU('صفح',f); })();
  const minW=sumU('دقيق',weekStart)+sumU('دقيقة',weekStart)+sumU('دقائق',weekStart);

      <div class="bars">${week.map(d=>{ const p=dayPct(d);
        return `<div class="bcol ${d.toDateString()===new Date().toDateString()?'t':''}"><div class="be" style="height:${Math.max(4,p)}%"></div><span class="bl">${dayShort(d)}</span></div>`;}).join('')}</div></div>

    <div class="card"><h2 style="margin-bottom:8px">إجمالياتي</h2>
      <div class="mini-stats">
        <div class="mini-stat"><b>${Math.round(pagesW)}</b><span>صفحات هذا الأسبوع</span></div>
        <div class="mini-stat"><b>${Math.round(pagesM)}</b><span>صفحات هذا الشهر</span></div>
        <div class="mini-stat"><b>${Math.floor(minW/60)}س ${Math.round(minW%60)}د</b><span>وقت التعلم</span></div>

function setupOtp(){
  const boxes=[...document.querySelectorAll('.otp-b')];
  boxes.forEach((b,i)=>{
    b.addEventListener('input',()=>{ b.value=b.value.replace(/[^0-9]/g,'').slice(-1);
      if(b.value&&i<5) boxes[i+1].focus();
      if(boxes.every(x=>x.value)) doJoin(); });
    b.addEventListener('keydown',e=>{ if(e.key==='Backspace'&&!b.value&&i>0) boxes[i-1].focus(); });
    b.addEventListener('paste',e=>{ e.preventDefault();
      const d=(e.clipboardData.getData('text')||'').replace(/[^0-9]/g,'').slice(0,6);
      d.split('').forEach((ch,j)=>{ if(boxes[j]) boxes[j].value=ch; });
      boxes[Math.min(d.length,5)].focus();
      if(d.length===6) doJoin(); });
  });
  boxes[0].focus();
}

async function doJoin(){
  const legacy=$('#jCode');
  const code=(otpValue() || (legacy?legacy.value:'') || '').replace(/[^0-9]/g,'').slice(0,6);
  if(code.length<6){ toast('أكمل الرمز المكوَّن من 6 أرقام'); return; }
  // المسار الأول: دالة خادمية
  try{
    const rows=await rest('POST','rpc/join_circle_by_code',{p_code:code});
    const row=(rows&&rows[0])||null;
    if(row){ pendingJoin=null; try{ history.replaceState(null,'',location.pathname); }catch(e){}
      await refreshAll(); closeSheet(); view='home'; renderApp();
      toast('أصبحت عضوًا في «'+(row.circle_name||'الدائرة')+'» 🎉'); return; }
    toast('رمز الدعوة غير صحيح'); return;
  }catch(e){
    if((e&&e.message||'').includes('does not exist')||(e&&e.message||'').includes('Could not find')){ /* نكمل للمسار الاحتياطي */ }
    else if((e&&e.message||'').includes('AUTH_REQUIRED')){ toast('سجّل الدخول أولًا'); return; }
  }
  try{
    const invList=await rest('GET','circle_invites','code=eq.'+code+'&select=*');
    const inv=(invList||[]).filter(i=>!i.revoked)[0];
    if(!inv){ toast('رمز الدعوة غير صحيح (تأكد من الرمز الظاهر في شاشة الدائرة)'); return; }
    if(new Date(inv.expires_at)<new Date()){ toast('انتهت صلاحية رمز الدعوة'); return; }
    const mine=await rest('GET','circle_members','circle_id=eq.'+inv.circle_id+'&user_id=eq.'+meId()+'&select=*');
    if(!mine||!mine.length) await rest('POST','circle_members',{id:uuid(),circle_id:inv.circle_id,user_id:meId(),role:'MEMBER'});
    const c=(await rest('GET','circles','id=eq.'+inv.circle_id+'&select=*'))[0];
    try{ await rest('POST','activity_events',{id:uuid(),circle_id:inv.circle_id,user_id:meId(),kind:'JOINED',payload:'انضم عضو جديد إلى الدائرة 🎉'}); }catch(e){}
    pendingJoin=null; try{ history.replaceState(null,'',location.pathname); }catch(e){}
    await refreshAll(); closeSheet(); view='home'; renderApp();
    toast('أصبحت عضوًا في «'+(c&&c.name?c.name:'الدائرة')+'» 🎉');
  }catch(e){ toast('تعذر الانضمام: '+(e&&e.message?e.message:'خطأ غير معروف')); }
}

function doDownloadBackup(){
  try{

      profile:data.profile,circles:(data.circles||[]).map(c=>c.circle),members:(data.circles||[]).flatMap(c=>c.members.map(x=>x.m)),

      sharedLists:data.sharedLists,shopping:data.shopping,activity:data.activity,reactions:data.reactions,invites:data.invites};
    const blob=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='rafiq-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    toast('نُزّلت النسخة الاحتياطية ✓');

async function restoreBackup(text){
  try{
    const b=JSON.parse(text); if(!b||b.app!=='rafiq'){ toast('ملف غير صالح'); return; }
    let ok=0,fail=0;
    async function up(table,rows){
      for(const r of (rows||[])){
        try{ await rest('POST',table,r,'resolution=merge-duplicates,return=minimal'); ok++; }catch(e){ fail++; }
      }
    }
    await up('profiles', b.profile?[b.profile]:[]);
    await up('circles', b.circles); await up('circle_members', b.members);
    await up('items', b.items); await up('item_recipients', b.recipients);
    await up('progress_entries', b.entries); await up('tasks', b.tasks);
    await up('shared_lists', b.sharedLists); await up('shared_list_items', b.shopping);
    await up('activity_events', b.activity);
    await refreshAll(); closeSheet(); renderApp();
    toast('استُرد: '+ok+' عنصرًا'+(fail?(' • فشل '+fail):''));
  }catch(e){ toast('تعذر الاسترداد: '+(e&&e.message?e.message:'')); }
}

  const dto={id:uuid(),owner_id:meId(),circle_id:cid,title,visibility:'CIRCLE'};
  await rest('POST','shared_lists',dto,'return=minimal');
  await refreshAll();
  return (data.sharedLists||[]).find(x=>x.title===title)||dto;
}

function openSchedDay(iso){
  const day=new Date(iso+'T12:00:00');
  const list=eventsOf().filter(t=>evDate(t)&&evDate(t).toDateString()===day.toDateString());
  openSheet(sheetHead('مواعيد '+day.toLocaleDateString('ar'))+(list.length?list.sort((a,b)=>new Date(a.due_at)-new Date(b.due_at)).map(t=>`
    <div class="row"><b style="min-width:52px;color:var(--accent-dark)">${evTimeText(t)}</b>
      <div style="flex:1;min-width:0"><div class="htitle">${esc(t.title)}</div>
      <div class="shop-meta">${esc(nameOf(t.owner_id))} • ${t.visibility==='PRIVATE'?'🔒 خاص':t.visibility==='CIRCLE'?'👥 الدائرة':'@ محددون'}</div></div>
      ${t.owner_id===meId()?`<button class="link" style="color:var(--error)" data-act="delEvent" data-id="${t.id}">حذف</button>`:''}</div>`).join('')
   :'<div class="empty"><span class="e">📅</span>لا مواعيد في هذا اليوم.</div>')+
   `<div style="height:12px"></div><button class="btn" data-act="addEvent" data-day="${iso}">+ إضافة موعد في هذا اليوم</button>`);
}

async function sendEvent(dayIso,title,time,circleId,visibility,recipients){
  try{
    let cid=circleId;
    if(cid==='personal'){ const p=(data.circles||[]).find(c=>c.circle.type==='PERSONAL'); cid=p?p.circle.id:null; }
    if(!cid){ toast('لا توجد دائرة متاحة'); return; }
    const iso=new Date(dayIso+'T'+(time||'21:00')+':00').toISOString();
    await rest('POST','tasks',{id:uuid(),owner_id:meId(),circle_id:cid,title,description:null,
      visibility:visibility,assigned_to:null,priority:'EVENT',status:'TODO',due_at:iso,
      recipients:visibility==='SELECTED_MEMBERS'?(recipients&&recipients.length?recipients:[otherId()]):null},'return=minimal');
    await refreshAll(); closeSheet(); view='schedule'; renderApp(); toast('أُضيف الموعد 📅');
  }catch(e){ toast('تعذر الحفظ: '+(e&&e.message?e.message:'')); }
}
/* ---------- ذكّرني ---------- */
async function sendReminder(text,due){
  try{
    const sh=sharedFirst(); if(!sh){ toast('أنشئ دائرة مشتركة أولًا'); return; }
    const other=(sh.members.find(x=>x.m.user_id!==meId())||{}).m;
    if(!other){ toast('لا يوجد رفيق في الدائرة بعد'); return; }
    const row={id:uuid(),owner_id:meId(),circle_id:sh.circle.id,title:text,description:null,
      visibility:'CIRCLE',assigned_to:other.user_id,priority:'REMINDER',status:'TODO',
      due_at:due||null,recipients:null};
    await rest('POST','tasks',row,'return=minimal');
    try{ await rest('POST','activity_events',{id:uuid(),circle_id:sh.circle.id,user_id:meId(),kind:'REMINDER',payload:text}); }catch(e){}
    await refreshAll(); renderApp(); toast('أُرسل التذكير 🔔');
  }catch(e){ toast('تعذر الإرسال: '+(e&&e.message?e.message:'')); }
}

function friendly(e){ const m=String(e.message||e);
  if(m==='NO_SESSION') return 'انتهت الجلسة — سجّل الدخول من جديد';
  if(m.includes('Failed to fetch')||m.includes('NetworkError')) return 'تعذر الاتصال — تحقق من الإنترنت';
  if(m.includes('row-level security')||m.includes('42501')) return 'لا تملك صلاحية لهذه العملية';
  if(m.includes('JWT')||m.includes('401')) return 'انتهت الجلسة — حدّث الصفحة وسجّل الدخول';
  if(!/Cannot read|undefined|null|is not a function|TypeError/i.test(m)) return 'تعذرت العملية: '+m;
  return 'تعذر إتمام العملية — سنحاول مجددًا';
}

<script>

/* ---------- الأحداث + الإقلاع ---------- */
document.addEventListener('click', async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, v=el.dataset.v;
  try{
    switch(act){
      case 'tab': view=v; renderApp(); break;
      case 'authMode': window._authMode=parseInt(v,10); window._authErr=''; renderAuthForms(); break;
      case 'acc': window._acc=v; renderAuthForms(); break;
      case 'openAddTask': openAddTask(); break;
      case 'openAddHabit': openAddHabit(); break;
      case 'saveTask': await saveTask(); break;
      case 'saveHabit': await saveHabit(); break;
      case 'incHabit': await incHabit(el.dataset.id); break;
      case 'binHabit': {
        const on=el.dataset.on==='1';
        if(on){ await (async()=>{ const item=data.items.find(i=>i.id===el.dataset.id);
          await rest('POST','progress_entries',{id:uuid(),item_id:el.dataset.id,user_id:meId(),value:item.target_value||1,unit:item.unit,recorded_at:nowIso()},'return=minimal');
          logAct(item.circle_id,'ITEM_COMPLETED',item.title); })(); }
        else await deleteTodayEntries(el.dataset.id);
        await refreshAll(); renderApp(); break; }
      case 'delItem': if(confirm('حذف هذا العنصر؟')){ await rest('DELETE','items','id=eq.'+el.dataset.id); await refreshAll(); renderApp(); } break;
      case 'shopAll': openShopAllSheet(); break;
      case 'addShop': await addShop(); break;
      case 'toggleShop': await toggleShop(el.dataset.id); break;
      case 'taskFilter': window._taskFilter=v; renderTasks(); break;
      case 'cycleTask': { const t=data.tasks.find(x=>x.id===el.dataset.id); const ns=nextSt(t.status);
        const patch={status:ns,updated_at:nowIso()};
        if(ns==='IN_PROGRESS') patch.started_at=nowIso();
        if(ns==='DONE'){ patch.completed_at=nowIso(); patch.completed_by=meId(); }
        if(ns==='TODO'){ patch.started_at=null; patch.completed_at=null; patch.completed_by=null; }
        await rest('PATCH','tasks',patch,'id=eq.'+t.id);
        if(ns==='DONE'&&t.status!=='DONE') logAct(t.circle_id,'TASK_DONE',t.title);
        await refreshAll(); renderTasks(); break; }
      case 'react': await rest('POST','reactions',{id:uuid(),event_id:el.dataset.id,user_id:meId(),emoji:v},'return=minimal').catch(async ex=>{
          const mine=data.reactions.filter(r=>r.event_id===el.dataset.id&&r.user_id===meId()&&r.emoji===v);
          if(mine.length) await rest('DELETE','reactions','id=eq.'+mine[0].id); else throw ex; });
        await refreshAll(); renderStats(); break;
      case 'openNotifs': openNotifs(); break;
      case 'openReport': openReport(); break;
      case 'askNotify': askNotify(); toast('إن وافق المتصفح ستصل التنبيهات 🔔'); break;
      case 'printReport': doPrintReport(); break;
      case 'openBackup': openBackup(); break;
      case 'downloadBackup': doDownloadBackup(); break;
      case 'openSchedule': view='schedule'; renderApp(); break;
      case 'openFood': view='food'; renderApp(); break;
      case 'quickDue': { const d=parseInt(el.dataset.d,10); const dt=new Date(); dt.setDate(dt.getDate()+d);
        const iso=dt.toISOString().slice(0,10); const f=$('#tDue'); if(f) f.value=iso; break; }
      case 'addMenu': openAddMenu(); break;
      case 'openAddMed': openAddMed(); break;
      case 'openAddMood': openAddMood(); break;
      case 'saveMood': await saveMood(); break;
      case 'openReview': openReview(); break;
      case 'saveReview': await saveReview(); break;
      case 'completeRecurring': { const t=(data.tasks||[]).find(x=>x.id===el.dataset.id); if(t) await completeRecurring(t); break; }
      case 'addMedia': openAddMedia(); break;
      case 'saveMedia': await saveMedia(); break;
      case 'renameItem': openRename(el.dataset.id, el.dataset.t); break;
      case 'saveRename': { const t=($('#rnTitle')||{}).value||''; if(!t.trim()){ toast('اكتب الاسم'); break; }
        await rest('PATCH','shared_list_items',{title:t.trim()},'id=eq.'+el.dataset.id); await refreshAll(); closeSheet(); renderApp(); toast('حُفظت التسمية ✓'); break; }
      case 'delMedia': { if(!confirm('حذف هذا الرابط؟')) break;
        await rest('DELETE','shared_list_items','id=eq.'+el.dataset.id); await refreshAll(); closeSheet(); renderApp(); toast('حُذف'); break; }
      case 'delShop': { if(!confirm('حذف هذا العنصر؟')) break;
        await rest('DELETE','shared_list_items','id=eq.'+el.dataset.id); await refreshAll(); closeSheet(); renderApp(); toast('حُذف العنصر ✓'); break; }
      case 'delPlace': { if(!confirm('حذف هذا المكان؟')) break;
        await rest('DELETE','shared_list_items','id=eq.'+el.dataset.id); await refreshAll(); renderApp(); toast('حُذف المكان ✓'); break; }
      case 'toggleMedsView': { medsTable=(el.dataset.v==='table'); renderApp(); break; }
      case 'renameCircle': { const n=($('#crName')||{}).value||''; if(!n.trim()){ toast('اكتب الاسم'); break; }
        await rest('PATCH','circles',{name:n.trim()},'id=eq.'+el.dataset.id); await refreshAll(); closeSheet(); view='more'; renderApp(); toast('تم تعديل الاسم ✓'); break; }
      case 'manageCircle': { const cid=el.dataset.id, k=el.dataset.k; const box=$('#crManage'); if(!box) break;
        let html='';
        if(k==='items'){ html=(data.items||[]).filter(i=>i.circle_id===cid).map(i=>`<div class="row" style="min-height:40px"><span class="htitle" style="flex:1">${esc(i.title)}</span><button class="link" style="color:var(--error)" data-act="delAnyItem" data-id="${i.id}">حذف</button></div>`).join('')||'<div class="shop-meta">لا عناصر</div>'; }
        else if(k==='tasks'){ html=(data.tasks||[]).filter(t=>t.circle_id===cid).map(t=>`<div class="row" style="min-height:40px"><span class="htitle" style="flex:1">${esc(t.title)}</span><button class="link" style="color:var(--error)" data-act="delAnyTask" data-id="${t.id}">حذف</button></div>`).join('')||'<div class="shop-meta">لا مهام</div>'; }
        else { const ls=(data.sharedLists||[]).filter(l=>l.circle_id===cid);

            ((data.shopping||[]).filter(si=>si.list_id===l.id).map(si=>`<div class="row" style="min-height:36px"><span class="htitle" style="flex:1">${esc(si.title)}</span><button class="link" style="color:var(--error)" data-act="delAnyItem2" data-id="${si.id}">حذف</button></div>`).join('')||'<div class="shop-meta">فارغة</div>')+`</div>`).join('')||'<div class="shop-meta">لا قوائم</div>'; }
        box.innerHTML=html; break; }
      case 'delAnyItem': { if(!confirm('حذف؟')) break; await rest('DELETE','items','id=eq.'+el.dataset.id); await refreshAll(); openCircleDetail(el.dataset.cid||''); break; }
      case 'delAnyTask': { if(!confirm('حذف؟')) break; await rest('DELETE','tasks','id=eq.'+el.dataset.id); await refreshAll(); closeSheet(); view='more'; renderApp(); break; }
      case 'delAnyItem2': { if(!confirm('حذف؟')) break; await rest('DELETE','shared_list_items','id=eq.'+el.dataset.id); await refreshAll(); closeSheet(); view='more'; renderApp(); break; }
      case 'saveMed': await saveMed(); break;
      case 'logDose': await logDose(el.dataset.id); break;
      case 'medDetail': openMedDetail(el.dataset.id); break;
      case 'delMed': { if(!confirm('حذف هذا الدواء؟')) break;
        await rest('DELETE','items','id=eq.'+el.dataset.id); await refreshAll(); closeSheet(); view='home'; renderApp(); toast('حُذف الدواء'); break; }
      case 'openMealSheet': openMealSheet(); break;
      case 'saveMeal': { const t=($('#qmText')||{}).value||''; if(!t.trim()){ toast('اكتب ما تناولتم'); break; }
        const m=window._qmMeal||'فطور'; closeSheet(); await logMeal(m,t.trim()); break; }
      case 'relogMeal': await relogMeal(el.dataset.meal, el.dataset.title); break;
      case 'delDish': await rest('DELETE','shared_list_items','id=eq.'+el.dataset.id); await refreshAll(); closeSheet(); renderFood(); break;
      case 'addCurrentPlace': openAddCurrentPlace(); break;
      case 'saveCurrentPlace': { const n=($('#cpName')||{}).value||''; if(!n.trim()){ toast('اكتب اسم المكان'); break; }
        closeSheet(); await addPlace(n.trim(), el.dataset.link||''); break; }
      case 'goHome': view='home'; renderApp(); break;
      case 'prevMonth': { schedMonth=new Date(schedMonth.getFullYear(),schedMonth.getMonth()-1,1); renderSchedule(); break; }
      case 'nextMonth': { schedMonth=new Date(schedMonth.getFullYear(),schedMonth.getMonth()+1,1); renderSchedule(); break; }
      case 'schedDay': openSchedDay(el.dataset.day); break;
      case 'addEvent': openAddEvent(el.dataset.day); break;
      case 'saveEvent': { const t=($('#evTitle')||{}).value||''; if(!t.trim()){ toast('اكتب عنوان الموعد'); break; }
        const custom=($('#evTimeCustom')||{}).value||''; const time=/^\d{1,2}:\d{2}$/.test(custom)?custom:(window._evTime||'21:00');
        const recips=[...document.querySelectorAll('.memcb:checked')].map(c=>c.value);

      case 'toggleDark': { const cur=localStorage.getItem('rafiq_web_dark')||'auto';
        localStorage.setItem('rafiq_web_dark', cur==='on'?'auto':'on');
        document.documentElement.dataset.theme=localStorage.getItem('rafiq_web_dark')==='on'?'dark':'light'; renderMore(); break; }
      case 'openCfg': openCfg(); break;
      case 'saveCfg': { const u=$('#cUrl').value.trim().replace(/\/+$/,''), k=$('#cKey').value.trim();
        if(!u.startsWith('https://')||!k){ toast('تحقق من القيم'); return; }
        CFG.url=u; CFG.key=k; saveCfg(); session=null; saveSession(); location.reload(); break; }
      case 'signOut': await signOut(); break;
      case 'closeSheet': closeSheet(); break;
    }
  }catch(err){ toast(friendly(err)); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='shopIn'){ e.preventDefault(); addShop(); }
  if(e.key==='Escape') closeSheet();
});
function openShopAllSheet(){
  const shop=shoppingFor();
  openSheet(sheetHead('قائمة التسوق المشتركة')+(shop?
    shop.items.map(si=>shopRow(si)).join('')+
    `<div class="add-item"><input id="shopIn" placeholder="أضف عنصرًا..." data-list="${shop.list.id}"><button data-act="addShop">＋</button></div>`
    :`<div class="empty"><span class="e">🛒</span>لا توجد قائمة بعد.</div>`));
}
/* ---------- boot ---------- */
window.addEventListener('error',e=>{
  console.error(e.message);
  bootFailed(e.message, e.filename);
});
window.addEventListener('unhandledrejection',e=>{
  bootFailed((e.reason&&e.reason.message)||'promise', '');
});
let __bootOk=false, __bootFailShown=false;
function bootFailed(msg, src){
  try{
    // نتجاهل أخطاء الإضافات أو أي مصدر خارجي، وأي خطأ بعد نجاح الإقلاع
    if(__bootOk) { console.warn('تجاهل خطأ خارجي:', msg); return; }
    if(src && src.indexOf('chrome-extension')>=0) return;
    if(src && /^https?:/.test(src) && location.host && src.indexOf(location.host)<0) return;
    if(src==='' && __bootOk) return;
    if(__bootFailShown) return; __bootFailShown=true;
    const v=document.getElementById('view'); if(!v) return;
    v.innerHTML='<div class="screen" style="padding-top:60px;text-align:center"><span style="font-size:38px">🌱</span>'+
      '<h1 style="margin:10px 0">تعذر فتح التطبيق</h1>'+
      '<p style="font-size:13px;color:var(--text-2);margin-bottom:14px">حدث خطأ غير متوقع — أعد التحميل وسيعمل.</p>'+
      '<button class="btn" style="max-width:240px;margin:0 auto" onclick="location.reload()">إعادة التحميل</button>'+
      '<p style="font-size:11px;color:var(--text-3);margin-top:12px">تفصيل: '+String(msg||'').slice(0,120)+'</p></div>';
  }catch(e){}
}
/* ---------- طي/توسيع أقسام الرئيسية ---------- */
function collapsedSet(){ try{ return new Set((localStorage.getItem('rafiq_collapsed')||'').split(',').filter(Boolean)); }catch(e){ return new Set(); } }
function saveCollapsed(set){ try{ localStorage.setItem('rafiq_collapsed',[...set].join(',')); }catch(e){} }
function toggleSec(k){ const set=collapsedSet(); if(set.has(k)) set.delete(k); else set.add(k); saveCollapsed(set); applyCollapse(); }
function collapseAllSec(){ const keys=['food','schedule','remind','habits','reminders','shopping','review','mood','meds','places','media']; saveCollapsed(new Set(keys)); applyCollapse(); }
function expandAllSec(){ saveCollapsed(new Set()); applyCollapse(); }
function applyCollapse(){
  const view=document.getElementById('view'); if(!view) return;
  const set=collapsedSet();
  const secs=[...view.querySelectorAll('[data-sec]')];
  secs.forEach(el=>{
    const k=el.dataset.sec, isCol=set.has(k), isCard=el.classList.contains('card');
    let targets=[];
    if(isCard){ targets=[...el.children].slice(1); }
    else { let n=el.nextElementSibling; while(n && !n.hasAttribute('data-sec')){ targets.push(n); n=n.nextElementSibling; } }
    targets.forEach(t=>{ t.style.display=isCol?'none':''; });
    // السهم
    const host=isCard? el.firstElementChild : el;
    if(!host) return;
    let ch=host.querySelector('.rafiq-chev');
    if(!ch){ ch=document.createElement('span'); ch.className='rafiq-chev'; ch.onclick=(e)=>{e.stopPropagation();toggleSec(k);}; host.appendChild(ch); }
    ch.textContent=isCol?'▸':'▾';
    ch.title=isCol?'توسيع':'طي';
  });
  // شريط التحكم
  const bar=document.getElementById('collapseBar');
  if(bar){ const any=[...secs].some(el=>!set.has(el.dataset.sec)); bar.textContent=any?'طي الكل ▴':'توسيع الكل ▾';
    bar.onclick=()=>{ if(any) collapseAllSec(); else expandAllSec(); }; }
}
(new MutationObserver(()=>applyCollapse())).observe(document.getElementById('view')||document.body,{childList:true});

(async function boot(){
  if(!session){ renderAuth(); return; }
  try{
    // 1) عرض فوري من آخر لقطة (بلا أي انتظار شبكة)
    const snap=loadSnap();
    if(snap && snap.profile){ data=snap; renderApp(); __bootOk=true; }
    // 2) الشبكة في الخلفية
    if(session.expires_at&&session.expires_at-Date.now()<120000) await refreshSession();
    await ensureProfile();
    await refreshAll(); renderApp(); __bootOk=true; startPolling();
    if(pendingJoin){ setTimeout(()=>openJoinSheet(pendingJoin),400); }
  }catch(e){
    // الجلسة غير صالحة (مثلًا مفتاح متغير) — عودة للدخول
    session=null; saveSession(); renderAuth();
    window._authErr='انتهت الجلسة — سجّل الدخول من جديد';
    renderAuthForms();
  }
})();
// التنقل بالسحب داخل النوافذ يعمل تلقائيًا عبر overflow-y:auto
</script>
