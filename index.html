            const segStart = Math.max(rowStartMin, Math.min(rowEndMin, sMin));
            const segEnd = Math.max(rowStartMin, Math.min(rowEndMin, sMin + durMin));

            if(segEnd > segStart || (isInstant && sMin >= rowStartMin && sMin <= rowEndMin)){
              const segStartInRow = segStart - rowStartMin;
              const segDurInRow = isInstant ? 15 : Math.max(10, segEnd - segStart);
              const endInRow = segStartInRow + segDurInRow;

              const overlaps0 = segStartInRow < lastLane0End;
              const overlaps1 = segStartInRow < lastLane1End;

              let lane = 0;
              if(overlaps0 && !overlaps1) lane = 1;
              else if(!overlaps0 && overlaps1) lane = 0;
              else if(overlaps0 && overlaps1) lane = (lastLane0End <= lastLane1End) ? 0 : 1;
              else {
                lane = preferLane;
                preferLane = 1 - preferLane;
              }

              if(lane === 0) lastLane0End = Math.max(lastLane0End, endInRow);
              else lastLane1End = Math.max(lastLane1End, endInRow);

              const zoom = window._trackerTimelineZoom || 1;
              const leftPct = (segStartInRow / totalSpanMin) * 100;
              const widthPct = Math.max(isInstant ? 2.5 : 2, (segDurInRow / totalSpanMin) * 100);
              const timeDesc = hasRange
                ? `${formatArabicTime(entry.startedAt)} - ${formatArabicTime(entry.endedAt)} (${Math.round(segDurInRow)}د)`
                : `${formatArabicTime(entry.loggedAt)} (تسجيل فوري)`;

              const pastelBg = hexToPastelRgba(cat.colorHex, isInstant ? 0.85 : 0.65);
              const laneClass = lane === 0 ? 'lane-top' : 'lane-bottom';
              const showTitle = (widthPct * zoom) >= 8;
              const showTime = (widthPct * zoom) >= 16;

              return `
                <div class="trk-timeline-slice ${laneClass}" 
                     data-act="openEntryDetails" data-id="${entry.id}" 
                     style="left:${leftPct}%;width:${widthPct}%;background:${pastelBg};border:1px solid ${cat.colorHex}55;min-width:${isInstant ? '26px' : '22px'}" 
                     title="${esc(cat.name)}: ${timeDesc}">
                  <span class="trk-timeline-slice-icon">${cat.icon}</span>
                  ${showTitle ? `<span class="trk-timeline-slice-title" style="max-width:${showTime?'80px':'50px'};overflow:hidden;text-overflow:ellipsis">${esc(entry.note || cat.name).slice(0, 10)}</span>` : ''}
                  ${showTime ? `<span style="font-size:7.5px;color:var(--text-2);margin-inline-start:3px;white-space:nowrap">${hasRange ? `${Math.round(segDurInRow)}د` : ''}</span>` : ''}
                </div>
              `;
            }
            return '';
          }).join('');

          const zoom = window._trackerTimelineZoom || 1;
          const barWidthPct = zoom * 100;
          const activeTicksHours = (zoom >= 1.6 && spanHours <= 24)
            ? Array.from({length: spanHours + 1}, (_, i) => startHour + i)
            : labelHours;

          const ticksHtml = activeTicksHours.map(h => {
            const pct = ((h - startHour) / spanHours) * 100;
            return `
              <div class="trk-timeline-tick" style="left:${pct}%"></div>
              <span class="trk-timeline-hour-badge" style="left:${pct}%">${String(h).padStart(2,'0')}:00</span>
            `;
          }).join('');

          return `
            <!-- عرض الخط الزمني المخصص لليوم بالمحور المركزي والتداخل الباستيلي -->
            <div class="card" style="margin-bottom:12px;padding:14px">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px">
                <div>
                  <b style="font-size:13.5px;color:var(--text-1)">📊 الخط الزمني لليوم (${String(startHour).padStart(2,'0')}:00 - ${String(endHour).padStart(2,'0')}:00)</b>
                  <div style="font-size:11px;color:var(--text-3);margin-top:2px">${spanHours} ساعة • اضغط على أي شريحة للتعديل ✍️</div>
                </div>
                <div style="display:flex;align-items:center;gap:6px">
                  <div style="display:inline-flex;align-items:center;background:var(--surface-2);border-radius:8px;padding:2px;border:1px solid var(--border)">
                    <button type="button" class="mini" data-act="setTimelineZoom" data-z="1" style="border:none;border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer;${zoom === 1 ? 'background:var(--surface);color:var(--accent-dark);font-weight:700' : 'background:transparent;color:var(--text-2)'}">1x</button>
                    <button type="button" class="mini" data-act="setTimelineZoom" data-z="1.8" style="border:none;border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer;${zoom === 1.8 ? 'background:var(--surface);color:var(--accent-dark);font-weight:700' : 'background:transparent;color:var(--text-2)'}">1.8x</button>
                    <button type="button" class="mini" data-act="setTimelineZoom" data-z="2.8" style="border:none;border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer;${zoom === 2.8 ? 'background:var(--surface);color:var(--accent-dark);font-weight:700' : 'background:transparent;color:var(--text-2)'}">2.8x</button>
                  </div>
                  <button type="button" class="mini" data-act="openTimelineSettings" style="background:var(--accent-soft);color:var(--accent-dark);border:1px solid var(--accent);padding:4px 8px;font-size:11.5px">⚙️ ضبط</button>
                </div>
              </div>

              <div class="trk-timeline-wrap" style="overflow-x:auto;-webkit-overflow-scrolling:touch">
                <div class="trk-timeline-bar-24" style="width:${barWidthPct}%;min-width:100%">
                  <div class="trk-timeline-spine"></div>
                  <!-- شرائح الأنشطة والكبسولات الباستيلية -->
                  ${slicesHtml}
                  <!-- خطوط وتسميات الساعات في المنتصف -->
                  <div class="trk-timeline-ticks">
                    ${ticksHtml}
                  </div>
                </div>
              </div>
            </div>
          `;
        })() : `

          <!-- قائمة تفاصيل سجلات اليوم أسفل الخط الزمني -->
          <div class="card" style="min-height:140px;padding:12px">
            <b style="font-size:13.5px;color:var(--text-1);display:block;margin-bottom:10px">سجلات اليوم (${dayEntries.length})</b>
            ${dayEntries.length ? `
              <div style="display:flex;flex-direction:column;gap:8px">
                ${dayEntries.map(entry => {
                  const cat = catMap[entry.categoryId] || { icon:'📌', colorHex:'#3B82F6', name:'' };
                  const hasRange = !!(entry.startedAt && entry.endedAt);
                  const timeLabel = hasRange
                    ? `من ${formatArabicTime(entry.startedAt)} إلى ${formatArabicTime(entry.endedAt)}`
                    : `${formatArabicTime(entry.loggedAt)}`;
                  return `
                    <div class="row" style="cursor:pointer;padding:8px 10px;background:var(--surface-2);border-radius:10px;border-inline-start:4px solid ${cat.colorHex}" data-act="openEntryDetails" data-id="${entry.id}">
                      <span style="font-size:20px">${cat.icon}</span>
                      <div style="flex:1;min-width:0">
                        <div style="display:flex;align-items:center;gap:6px">
                          <b style="font-size:13px;color:var(--text-1)">${esc(cat.name)}</b>
                          ${entry.subcategory ? `<span style="font-size:11.5px;color:var(--text-2)">(${esc(entry.subcategory)})</span>` : ''}
                          ${hasRange ? '<span class="badge mini" style="font-size:9.5px">⏱️ فترة</span>' : '<span class="badge mini" style="font-size:9.5px;background:var(--accent-soft);color:var(--accent-dark)">📍 فوري</span>'}
                        </div>
                        <div style="font-size:11px;color:var(--text-3);margin-top:2px">
                          <span>${timeLabel}</span>
                          ${entry.quantity ? ` • <b>${esc(entry.quantity)}</b>` : ''}
                          ${entry.note ? ` • <i>${esc(entry.note)}</i>` : ''}
                        </div>
                      </div>
                      <span style="font-size:13px;color:var(--text-3)">✏️</span>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : `
              <div class="empty" style="padding:20px 0">
                <span class="e">🎯</span>
                <b>لا توجد تسجيلات على الخط الزمني لهذا اليوم</b>
              </div>
            `}
          </div>
        ` : `
          <!-- عرض البلوكات الكلاسيكي -->
          <div class="card" style="min-height:180px;padding:12px">
            ${dayEntries.length ? `
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px">
                <b style="font-size:13.5px;color:var(--text-1)">سجلات اليوم (${dayEntries.length})</b>
                <span style="font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:4px">اضغط على أي نشاط للتعديل أو الحذف ✍️🗑️</span>
              </div>
              <div class="trk-act-rows-wrap">
                ${catGroups.map(group => {
                  const chunks = [];
                  for(let i = 0; i < group.entries.length; i += 5){
                    chunks.push(group.entries.slice(i, i + 5));
                  }
                  const cat = group.cat;

                  return chunks.map(chunk => {
                    const colCount = chunk.length;
                    const isWide = colCount <= 2;
                    const isMedium = colCount === 3;
                    const isDense = colCount >= 4;
                    const densityClass = isDense ? 'dense' : (isMedium ? 'medium' : 'wide');

                    return `
                      <div class="trk-act-row">
                        <div class="trk-entries-grid" style="--trk-cols: ${colCount}">
                          ${chunk.map(entry => {
                            const hasRange = !!(entry.startedAt && entry.endedAt);
                            const timeLabel = isDense
                              ? formatArabicTime(entry.startedAt || entry.loggedAt)
                              : (hasRange
                                  ? `من ${formatArabicTime(entry.startedAt)} إلى ${formatArabicTime(entry.endedAt)}`
                                  : formatArabicTime(entry.loggedAt));

                            const subLabel = formatSub(entry.subcategory, isDense, cat.name);

                            return `
                              <div class="trk-entry-card ${densityClass}" data-act="openEntryDetails" data-id="${entry.id}" style="background:${cat.colorHex}" title="اضغط للتعديل أو الحذف ✍️">
                                <div class="ico">${cat.icon}</div>
                                <div class="trk-card-content">
                                  <div class="trk-line-top">
                                    <span class="trk-tit">${esc(cat.name)}</span>

                                    ${entry.quantity ? `<span class="trk-qty-tag">${esc(entry.quantity)}</span>` : ''}
                                  </div>
                                  <div class="trk-line-bot">
                                    <span class="trk-tim">⏱️ ${timeLabel}</span>
                                    ${(!isDense && entry.note) ? `<span class="trk-note-tag" title="${esc(entry.note)}">📝 ${esc(entry.note)}</span>` : ''}
                                  </div>
                                </div>
                                <div class="trk-btn-edit" title="تعديل أو حذف">✏️</div>
                              </div>
                            `;
                          }).join('')}
                        </div>
                      </div>
                    `;
                  }).join('');
                }).join('')}
              </div>
            ` : `
              <div class="empty">
                <span class="e">🎯</span>
                <b>لا توجد تسجيلات لهذا اليوم</b><br>
                <span style="font-size:12px;color:var(--text-3)">اضغط على أي فئة في الأعلى للتسجيل بلمسة واحدة</span>
              </div>
            `}
          </div>
        `}
      ` : mode === 'weekly' ? `
        ${layoutStyle === 'timeline' ? renderTrackerWeekTimeline(selDate, trk.entries, catMap) : `
          ${renderTrackerWeekHorizontal(selDate, trk.entries)}
          <div class="card">
            <b style="font-size:15px;display:block;margin-bottom:10px">📊 ملخص الأيام السبعة الماضية</b>
            ${(()=>{
              const past7 = [];
              for(let i=6; i>=0; i--){
                const d = new Date(selDate + 'T12:00:00');
                d.setDate(d.getDate() - i);
                const iso = d.toISOString().slice(0,10);
                const count = trk.entries.filter(e => (e.loggedAt||'').startsWith(iso)).length;
                past7.push({ iso, count, label: d.toLocaleDateString('ar-EG', { weekday:'short', day:'numeric' }) });
              }
              return `
                <div style="display:flex;flex-direction:column;gap:8px">
                  ${past7.map(day => `
                    <div class="row" style="cursor:pointer;padding:4px 0" data-act="setTrackerDayAndSwitch" data-d="${day.iso}">
                      <span style="width:90px;font-size:13px;font-weight:600">${day.label}</span>
                      <div class="bar"><i style="width:${Math.min(100, day.count * 16)}%"></i></div>
                      <span class="badge" style="min-width:40px;text-align:center">${day.count} نشاط</span>
                    </div>
                  `).join('')}
                </div>
              `;
            })()}
          </div>
        `}
      ` : `
        ${renderTrackerMonthCalendar(selDate, trk.entries)}
        <div class="card">
          <b style="font-size:15px;display:block;margin-bottom:10px">🗓️ إحصائيات الشهر (${selDate.slice(0,7)})</b>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            ${cats.map(cat => {
              const count = trk.entries.filter(e => (e.loggedAt||'').startsWith(selDate.slice(0,7)) && e.categoryId === cat.id).length;
              return `
                <div class="mini-stat" style="border-right:3px solid ${cat.colorHex}">
                  <div style="display:flex;align-items:center;gap:6px">
                    <span style="font-size:18px">${cat.icon}</span>
                    <span style="font-size:12px;font-weight:600;flex:1">${esc(cat.name)}</span>
                  </div>
                  <b style="font-size:18px;margin-top:4px;color:${cat.colorHex}">${count} مرة</b>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `}

      <button class="fab-voice-tracker" id="trkVoiceMicBtn" data-act="startTrackerVoiceInput" title="تسجيل صوتي ذكي 🎙️" aria-label="تسجيل صوتي">
        🎙️
      </button>

      <button class="fab-pdf" data-act="openPdfExport">
        <span>📄</span>
        <span>تصدير PDF</span>
      </button>
    </div>
  `;

  const dateInp = document.getElementById('trkDirectDate');
  if(dateInp){
    dateInp.onchange = () => {
      if(dateInp.value){
        window._trackerDate = dateInp.value;
        renderLifeTracker();
      }
    };
  }
}

    cat_food: ['وجبة كاملة', 'وجبة خفيفة', 'سناك صحي', 'مشروب'],
    cat_meds: ['جرعة واحدة', 'حبة واحدة', 'حبتان', '500 ملغ', '1000 ملغ'],
    cat_illness: ['ألم خفيف', 'ألم متوسط', 'شديد', 'حرارة مرتفعة']
  };
  const presets = presetsMap[cat.id] || ['15 دقيقة', '30 دقيقة', '45 دقيقة', '1 مرة', '2 مرة'];

      <button class="chip ${initMode==='instant'?'on':''}" id="btnSlInstant" data-act="switchSlMode" data-m="instant" style="flex:1;justify-content:center">📍 فوري لحظي</button>

        ${presets.map(p => `

      </div>
      <div class="field"><label>أو حدد كمية/مدة يدويًا</label><input id="slCustomQty" placeholder="مثال: 45 دقيقة، 15 صفحة، 500 مل..."></div>

    <div id="slInstantContainer" style="display:${initMode==='instant'?'block':'none'};margin-bottom:12px">

    ${(cat.subcategories && cat.subcategories.length) ? `

          `).join('')}

    <div class="field"><label>ملاحظة إضافية (اختياري)</label><textarea id="slNote" rows="2" placeholder="أي تفاصيل أو ملاحظات حول هذا النشاط..."></textarea></div>

    <button class="btn" data-act="saveSmartLog">حفظ النشاط ✓</button>
  `);

  window._slSelectedSubcat = (cat.subcategories && cat.subcategories.length) ? cat.subcategories[0] : '';
  
  const recalc = () => {
    const sDate = $('#slStartDate') ? $('#slStartDate').value : todayIso;
    const sTime = $('#slStartTime') ? $('#slStartTime').value : '08:00';
    const eDate = $('#slEndDate') ? $('#slEndDate').value : todayIso;
    const eTime = $('#slEndTime') ? $('#slEndTime').value : '08:30';
    const s = new Date(`${sDate}T${sTime}:00`);
    const e = new Date(`${eDate}T${eTime}:00`);
    const diffMin = Math.round((e - s) / 60000);
    const prev = $('#slDurationPreview');
    if(!prev) return;
    if(diffMin > 0){
      prev.style.color = 'var(--accent-dark)';
      prev.textContent = '⏳ المدة المحسوبة: ' + formatMinutesToArabic(diffMin);
    } else if(diffMin === 0){
      prev.style.color = 'var(--text-2)';
      prev.textContent = '⏳ نفس وقت البداية والنهاية';
    } else {
      prev.style.color = 'var(--error)';
      prev.textContent = '⚠️ وقت النهاية يسبق وقت البداية';
    }
  };

  ['slStartDate','slStartTime','slEndDate','slEndTime'].forEach(id => {
    const el = document.getElementById(id);
    if(el) { el.oninput = recalc; el.onchange = recalc; }
  });
  recalc();
}

async function saveSmartLog(){
  const trk = getTrackerData();
  const cat = trk.categories.find(c => c.id === window._smartLogCatId);
  if(!cat){ toast('تعذر العثور على الفئة'); return; }

  const isRange = window._smartLogMode === 'range';
  const isQuick = window._smartLogMode === 'quick';
  let startedAt = null;
  let endedAt = null;
  let quantity = null;
  let loggedAt = new Date().toISOString();

  if(isRange){
    const sDate = ($('#slStartDate')||{}).value || window._trackerDate;
    const sTime = ($('#slStartTime')||{}).value || '08:00';
    const eDate = ($('#slEndDate')||{}).value || window._trackerDate;
    const eTime = ($('#slEndTime')||{}).value || '08:30';
    startedAt = `${sDate}T${sTime}:00`;
    endedAt = `${eDate}T${eTime}:00`;
    loggedAt = startedAt;
    const s = new Date(startedAt);
    const e = new Date(endedAt);
    const diffMin = Math.round((e - s) / 60000);
    if(diffMin > 0) quantity = formatMinutesToArabic(diffMin);
  } else if(isQuick){
    const actTime = ($('#slActivityTime')||{}).value || '12:00';
    loggedAt = `${window._trackerDate}T${actTime}:00`;
    quantity = ($('#slCustomQty')||{}).value || null;
  } else {
    // Instant
    const iDate = ($('#slInstantDate')||{}).value || window._trackerDate;
    const iTime = ($('#slInstantTime')||{}).value || '12:00';
    loggedAt = `${iDate}T${iTime}:00`;
    quantity = ($('#slInstantQty')||{}).value || null;
  }

  const note = ($('#slNote')||{}).value || null;
  const subcat = window._slSelectedSubcat || null;

  const entry = {
    id: 'ent_' + (crypto.randomUUID ? crypto.randomUUID().slice(0,10) : String(Date.now())),
    categoryId: cat.id,
    subcategory: subcat && subcat.trim() ? subcat.trim() : null,
    quantity: quantity && quantity.trim() ? quantity.trim() : null,
    startedAt: startedAt,
    endedAt: endedAt,
    loggedAt: loggedAt,
    note: note && note.trim() ? note.trim() : null,
    syncIntent: 'local_only'
  };

  trk.entries.push(entry);
  saveTrackerData(trk);
  closeSheet();
  renderLifeTracker();
  toast(`تم تسجيل ${cat.name} ${cat.icon} ✓`);
  insertTrackerEntryCloud(entry);
}

function saveTrackerCategory(){
  const nameInp = $('#ceName');
  const name = ((nameInp && nameInp.value) || '').trim();
  if(!name){ toast('يرجى كتابة اسم الفئة'); return; }

  const trk = getTrackerData();
  const subcatsText = ($('#ceSubcats')||{}).value || '';
  const subcats = subcatsText.split(/[,،]/).map(s => s.trim()).filter(Boolean);
  const goal = parseInt(($('#ceGoal')||{}).value, 10) || null;
  const remTime = ($('#ceReminderTime')||{}).value || '08:00';
  const parts = remTime.split(':');
  const rHour = parseInt(parts[0], 10) || 8;
  const rMin = parseInt(parts[1], 10) || 0;

  let savedCat = null;
  if(window._catEditId){
    const idx = trk.categories.findIndex(c => c.id === window._catEditId);
    if(idx >= 0){
      savedCat = Object.assign({}, trk.categories[idx], {
        name,
        icon: window._catIcon || '💊',
        colorHex: window._catColor || '#3B82F6',
        subcategories: subcats,
        dailyGoal: goal,
        reminderEnabled: window._catReminderEnabled,
        reminderHour: rHour,
        reminderMinute: rMin,
        reminderFrequency: window._catReminderFreq || 'DAILY',
        visibility: window._catVisibility || 'PRIVATE',
        trackingType: window._catTrackingType || 'TIME_RANGE'
      });
      trk.categories[idx] = savedCat;
    }
  } else {
    savedCat = {
      id: 'cat_' + (crypto.randomUUID ? crypto.randomUUID().slice(0,8) : String(Date.now())),
      name,
      icon: window._catIcon || '💊',
      colorHex: window._catColor || '#3B82F6',
      sortOrder: trk.categories.length + 1,
      subcategories: subcats,
      dailyGoal: goal,
      reminderEnabled: window._catReminderEnabled,
      reminderHour: rHour,
      reminderMinute: rMin,
      reminderFrequency: window._catReminderFreq || 'DAILY',
      visibility: window._catVisibility || 'PRIVATE',
      trackingType: window._catTrackingType || 'TIME_RANGE'
    };
    trk.categories.push(savedCat);
  }

  saveTrackerData(trk);
  closeSheet();
  renderLifeTracker();
  toast('حُفظت الفئة ✓');
  if(savedCat) upsertTrackerCategoryCloud(savedCat);
}

async function saveFullEntryEdit(entryId){
  const trk = getTrackerData();
  const idx = trk.entries.findIndex(e => e.id === entryId);
  if(idx < 0){ toast('لم يتم العثور على السجل'); return; }

  const entry = trk.entries[idx];
  const hasRange = !!(entry.startedAt && entry.endedAt);
  const edDate = ($('#edDate')||{}).value || window._trackerDate || new Date().toISOString().slice(0, 10);
  const qty = ($('#edQuantity')||{}).value || null;
  const note = ($('#edNote')||{}).value || null;
  const subcatInp = ($('#edSubcatInput')||{}).value;
  const subcat = (subcatInp !== undefined && subcatInp !== null) ? subcatInp : (window._editEntrySubcat || null);

  let startedAt = null;
  let endedAt = null;
  let loggedAt = `${edDate}T12:00:00`;

  if(hasRange){
    const sTime = ($('#edStartTime')||{}).value || '08:00';
    const eTime = ($('#edEndTime')||{}).value || '08:30';
    startedAt = `${edDate}T${sTime}:00`;
    endedAt = `${edDate}T${eTime}:00`;
    loggedAt = startedAt;
  } else {
    const prevTime = (entry.loggedAt && entry.loggedAt.length >= 16) ? entry.loggedAt.slice(11, 16) : '12:00';
    loggedAt = `${edDate}T${prevTime}:00`;
  }

  trk.entries[idx] = Object.assign({}, trk.entries[idx], {
    subcategory: subcat && subcat.trim() ? subcat.trim() : null,
    quantity: qty && qty.trim() ? qty.trim() : null,
    startedAt: startedAt,
    endedAt: endedAt,
    loggedAt: loggedAt,
    note: note && note.trim() ? note.trim() : null
  });

  saveTrackerData(trk);
  closeSheet();
  renderLifeTracker();
  toast('تم حفظ التعديلات بنجاح ✓');
  updateTrackerEntryCloud(trk.entries[idx]);
}

function normalizeArabicDigitsJs(str){
  const map = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
  return String(str||'').replace(/[٠-٩]/g, d => map[d] || d);
}

function normalizeArabicTextJs(input){
  let text = normalizeArabicDigitsJs(String(input||''));
  text = text.replace(/\bالساعه\b/g, 'الساعة')
             .replace(/\bساعه\b/g, 'ساعة')
             .replace(/\bالى\b/g, 'إلى')
             .replace(/\bلمده\b/g, 'لمدة');
  return text;
}

function parseTimeTokenJs(token){
  let clean = String(token||'').replace(/(?:الساعة|الساعه)/g, '').replace(/[،,]/g, '').trim();

  const isAm = /صباح|فجر/.test(clean);
  const isPm = /مساء|عصر|ليل/.test(clean);

  const hasHalf = /ونصف|ونص/.test(clean);
  const hasQuarter = /وربع/.test(clean);
  const hasThird = /وثلث/.test(clean);
  const isMinusQuarter = /إلا\s+ربع|الا\s+ربع/.test(clean);

  clean = clean.replace(/صباحاً|صباحا|مساءً|مساء|عصراً|عصر|ظهراً|ظهر|ليلاً|ليلا/g, '')
               .replace(/ونصف|ونص|وربع|وثلث|إلا\s+ربع|الا\s+ربع/g, '')
               .replace(/دقيقة|دقائق/g, '')
               .trim();

  // نمط مركب مثل "11 و 45"
  const compMatch = clean.match(/^(\d{1,2})\s*و\s*(\d{1,2})$/);
  if(compMatch){
    let h = parseInt(compMatch[1], 10);
    let m = parseInt(compMatch[2], 10) || 0;
    if(!isNaN(h) && h >= 0 && h <= 24 && m >= 0 && m <= 59){
      let adjH = (h === 24) ? 0 : h;
      if(isPm && adjH < 12) adjH += 12;
      if(isAm && adjH === 12) adjH = 0;
      return { hour: adjH, minute: m };
    }
  }

  // نمط رقمي مباشر "11:45" أو "11.45"
  const colonOrDot = clean.split(/[:.]/).filter(Boolean);
  if(colonOrDot.length === 2){
    let h = parseInt(colonOrDot[0].trim(), 10);
    let m = parseInt(colonOrDot[1].trim(), 10);
    if(!isNaN(h) && !isNaN(m) && h >= 0 && h <= 24 && m >= 0 && m <= 59){
      let adjH = (h === 24) ? 0 : h;
      if(isPm && adjH < 12) adjH += 12;
      if(isAm && adjH === 12) adjH = 0;
      return { hour: adjH, minute: m };
    }
  }

  const directNum = parseInt(clean, 10);
  let hour = !isNaN(directNum) ? directNum : (ARABIC_WORD_HOURS_JS[clean] || null);
  if(hour === null || hour > 24) return null;
  if(hour === 24) hour = 0;

  let minute = 0;
  if(hasHalf) minute = 30;
  else if(hasQuarter) minute = 15;
  else if(hasThird) minute = 20;
  else if(isMinusQuarter){
    hour = (hour === 0) ? 23 : (hour - 1);
    minute = 45;
  }

  if(isPm && hour < 12) hour += 12;
  if(isAm && hour === 12) hour = 0;

  return { hour, minute };
}

function parseVoiceActivityText(rawText, categories){
  const normalized = normalizeArabicTextJs(rawText.trim());
  let remaining = normalized;

  // 1. فحص الفترات الزمنية: من [X] إلى [Y]
  let startedAt = null;
  let endedAt = null;
  let isTimeRange = false;

  const timeTokenRegex = /(?:\d{1,2}(?:[:.]\d{2})?(?:\s*و\s*\d{1,2}(?:\s*دقيقة)?)?|(?:ال)?(?:حادية\s+عشر(?:ة)?|ثانية\s+عشر(?:ة)?|إحدى\s+عشر(?:ة)?|احدى\s+عشر(?:ة)?|اثنا\s+عشر|واحدة|ثانية|ثالثة|رابعة|خامسة|سادسة|سابعة|ثامنة|تاسعة|عاشرة|واحد|اثنين|اثنتين|ثلاث|ثلاثة|أربع|أربعة|اربع|اربعة|خمس|خمسة|ست|ستة|سبع|سبعة|ثمان|ثمانية|تسع|تسعة|عشر|عشرة))(?:\s+(?:ونصف|ونص|وربع|وثلث|إلا\s+ربع|الا\s+ربع))?(?:\s*(?:صباحاً|صباحا|مساءً|مساء|عصراً|عصر|ظهراً|ظهر|ليلاً|ليلا))?/;

  const rangeRegex = new RegExp('من\\s+(?:(?:الساعة|الساعه)\\s+)?(' + timeTokenRegex.source + ')\\s+(?:إلى|الى|حتى|وحتى|لغاية|لـ|ل)\\s+(?:(?:الساعة|الساعه)\\s+)?(' + timeTokenRegex.source + ')', 'i');
  const match = remaining.match(rangeRegex);
  if(match){
    const tStart = parseTimeTokenJs(match[1].trim());
    const tEnd = parseTimeTokenJs(match[2].trim());
    if(tStart && tEnd){
      let sH = tStart.hour;
      const sM = tStart.minute;
      let eH = tEnd.hour;
      const eM = tEnd.minute;

      const isExplicitPm = /مساء|عصر|ليلا|ليلاً|عشاء/.test(normalized);
      const isExplicitAm = /صباح|فجر/.test(normalized);

      if(isExplicitPm){
        if(sH < 12) sH += 12;
        if(eH < 12) eH += 12;
      } else if(!isExplicitAm){
        if(eH < sH && eH >= 1 && eH <= 6){
          eH += 12;
        } else if(sH >= 1 && sH <= 6 && eH >= 1 && eH <= 7 && new Date().getHours() >= 12){
          sH += 12;
          eH += 12;
        }
      }

      const now = new Date();
      const sDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), sH % 24, sM, 0);
      let eDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), eH % 24, eM, 0);
      if(eDate <= sDate){
        eDate.setDate(eDate.getDate() + 1);
      }
      startedAt = sDate;
      endedAt = eDate;
      isTimeRange = true;
      remaining = remaining.replace(match[0], ' ').trim();
    }
  }

  // 2. استخراج الكميات أو الشدة أو المدة
  let extractedQty = null;
  let durationMins = null;
  const phrases = [
    ["ساعتان", "ساعتان", 120], ["ساعتين", "ساعتان", 120],
    ["ساعة ونصف", "ساعة ونصف", 90], ["ساعة ونص", "ساعة ونصف", 90],
    ["ساعة وربع", "ساعة وربع", 75], ["ساعة", "1 ساعة", 60],
    ["نصف ساعة", "30 دقيقة", 30], ["نص ساعة", "30 دقيقة", 30],
    ["ثلث ساعة", "20 دقيقة", 20], ["ربع ساعة", "15 دقيقة", 15],
    ["كوبين", "2 كوب", null], ["كأسين", "2 كأس", null],
    ["حبتين", "2 حبة", null], ["حبة واحدة", "1 حبة", null],
    ["جرعة واحدة", "جرعة واحدة", null], ["وجبة كاملة", "وجبة كاملة", null],
    ["خفيف", "خفيف", null], ["متوسط", "متوسط", null], ["شديد", "شديد", null]
  ];

  for(const [phrase, std, mins] of phrases){
    if(remaining.includes(phrase)){
      extractedQty = std;
      durationMins = mins;
      remaining = remaining.replace(phrase, ' ').trim();
      break;
    }
  }

  if(!extractedQty){
    const numUnitMatch = remaining.match(/(?:لمدة\s+)?(\d+)\s*(دقيقة|دقائق|ساعة|ساعات|كم|كيلو|صفحة|صفحات|كوب|أكواب|حبة|حبات|جرعة)/);
    if(numUnitMatch){
      extractedQty = numUnitMatch[1] + ' ' + numUnitMatch[2];
      const val = parseInt(numUnitMatch[1], 10) || 0;
      if(numUnitMatch[2].startsWith('دقيق')) durationMins = val;
      else if(numUnitMatch[2].startsWith('ساع')) durationMins = val * 60;
      remaining = remaining.replace(numUnitMatch[0], ' ').trim();
    }
  }

  // إذا تم نطق مدة (مثل: "30 دقيقة") دون تحديد نطاق من.. إلى
  if(!isTimeRange && durationMins && durationMins > 0){
    const now = new Date();
    endedAt = now;
    startedAt = new Date(now.getTime() - durationMins * 60000);
    isTimeRange = true;
  }

  // 3. استخراج العنوان النظيف والملاحظات
  const stopWords = new Set([
    "سجل", "تسجيل", "أضف", "اضف", "حط", "تم", "عملت", "سويت",
    "أخذت", "اخذت", "شربت", "أكلت", "اكلت", "اليوم", "أمس",
    "من", "إلى", "الى", "حتى", "الساعة", "الساعه", "ساعة", "ساعه",
    "في", "على", "مع", "كان", "كانت", "لمدة", "لمده"
  ]);

  const cleanWords = remaining.split(/[\s,،.]+/).filter(w => w && !stopWords.has(w));
  const cleanActivity = cleanWords.join(' ').trim();

  // 4. مطابقة الفئة والفئة الفرعية بشكل ذكي
  let matchedCat = null;
  let matchedSubcat = null;

  for(const cat of categories){
    for(const sub of (cat.subcategories || [])){
      if(cleanActivity.toLowerCase().includes(sub.toLowerCase()) || sub.toLowerCase().includes(cleanActivity.toLowerCase())){
        matchedCat = cat;
        matchedSubcat = sub;
        break;
      }
    }
    if(matchedCat) break;
  }

  if(!matchedCat){
    for(const cat of categories){
      if(cleanActivity.toLowerCase().includes(cat.name.toLowerCase()) || cat.name.toLowerCase().includes(cleanActivity.toLowerCase())){
        matchedCat = cat;
        break;
      }
    }
  }

  if(!matchedCat){
    for(const cat of categories){
      for(const [groupKey, synList] of Object.entries(CONCEPT_SYNONYMS_JS)){
        const actHas = synList.some(s => cleanActivity.toLowerCase().includes(s.toLowerCase()));
        const catHas = synList.some(s => cat.name.toLowerCase().includes(s.toLowerCase()) || (cat.id||'').toLowerCase().includes(s.toLowerCase()));
        if(actHas && catHas){
          matchedCat = cat;
          if(cleanActivity && cleanActivity !== cat.name){
            matchedSubcat = cleanActivity;
          }
          break;
        }
      }
      if(matchedCat) break;
    }
  }

  // 5. هل هذه فئة جديدة غير موجودة؟
  const isNewCategory = !matchedCat;
  const suggestedCategoryName = isNewCategory ? (cleanActivity || 'نشاط جديد') : null;
  const suggestedIcon = suggestTrackerIconJs(cleanActivity);
  const suggestedColor = suggestTrackerColorJs(cleanActivity);
  const finalTitle = cleanActivity || (matchedSubcat || (matchedCat ? matchedCat.name : 'نشاط'));

  let finalQty = extractedQty;
  if(isTimeRange && startedAt && endedAt){
    const diffMins = Math.round((endedAt - startedAt) / 60000);
    if(diffMins > 0) finalQty = formatMinutesToArabic(diffMins);
  }

  const isSeverity = ['خفيف', 'متوسط', 'شديد'].includes(extractedQty);
  let combinedNote = isSeverity ? extractedQty : null;

  return {
    rawText,
    activityTitle: finalTitle,
    category: matchedCat,
    isNewCategory,
    suggestedCategoryName,
    suggestedIcon,
    suggestedColor,
    subcategory: matchedSubcat || (!isNewCategory && matchedCat && finalTitle !== matchedCat.name ? finalTitle : null),
    quantityOrDuration: finalQty,
    note: combinedNote,
    startedAt,
    endedAt,
    isTimeRange
  };
}

function startTrackerVoiceInput(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    toast('المتصفح لا يدعم التسجيل الصوتي المباشر. يمكنك استخدام متصفح Chrome أو الإدخال اليدوي.');
    return;
  }

  const micBtn = document.getElementById('trkVoiceMicBtn');
  if(micBtn) micBtn.classList.add('listening');

  const recognition = new SpeechRecognition();
  recognition.lang = 'ar-SA';
  recognition.continuous = false;
  recognition.interimResults = false;

  toast('🎙️ استمع الآن... تحدث بنشاطك والوقت');

  recognition.onresult = (e) => {
    if(micBtn) micBtn.classList.remove('listening');
    if(e.results && e.results[0] && e.results[0][0]){
      const text = e.results[0][0].transcript;
      if(text && text.trim()){
        const trk = getTrackerData();
        const parsed = parseVoiceActivityText(text.trim(), trk.categories);
        openVoiceReviewSheet(parsed);
      }
    }
  };

  recognition.onerror = (err) => {
    if(micBtn) micBtn.classList.remove('listening');
    toast('تعذر التقاط الصوت أو تم إلغاؤه');
  };

  recognition.onend = () => {
    if(micBtn) micBtn.classList.remove('listening');
  };

  try{
    recognition.start();
  }catch(err){
    if(micBtn) micBtn.classList.remove('listening');
    toast('حدث خطأ في بدء التسجيل الصوتي');
  }
}

async function saveVoiceReview(){
  const trk = getTrackerData();
  const isNew = !!window._vrIsNewCat;
  let catId = window._vrCatId;
  let catName = '';

  const isRange = window._vrIsRange;
  const todayIso = window._trackerDate || new Date().toISOString().slice(0, 10);
  let startedAt = null;
  let endedAt = null;
  let loggedAt = `${todayIso}T12:00:00`;
  let quantity = ($('#vrQuantity')||{}).value || null;

  if(isRange){
    const sTime = ($('#vrStartTime')||{}).value || '08:00';
    const eTime = ($('#vrEndTime')||{}).value || '09:00';
    startedAt = `${todayIso}T${sTime}:00`;
    endedAt = `${todayIso}T${eTime}:00`;
    loggedAt = startedAt;
    const s = new Date(startedAt);
    const e = new Date(endedAt);
    const diffMin = Math.round((e - s) / 60000);
    if(diffMin > 0 && !quantity) quantity = formatMinutesToArabic(diffMin);
  } else {
    const iTime = ($('#vrInstantTime')||{}).value || '12:00';
    loggedAt = `${todayIso}T${iTime}:00`;
  }

  const nameIn = document.getElementById('vrNewCatNameInput');
  if(nameIn && nameIn.value.trim()) window._vrNewCatName = nameIn.value.trim();

  if(isNew && window._vrNewCatName){
    catName = window._vrNewCatName.trim();
    const newCat = {
      id: 'cat_' + Date.now(),
      name: catName,
      icon: window._vrNewCatIcon || '⭐',
      colorHex: window._vrNewCatColor || '#F59E0B',
      sortOrder: trk.categories.length + 1,
      subcategories: [],
      dailyGoal: null,
      reminderEnabled: false,
      trackingType: isRange ? 'TIME_RANGE' : 'POINT_IN_TIME',
      syncIntent: 'local_only'
    };
    trk.categories.push(newCat);
    catId = newCat.id;
    upsertTrackerCategoryCloud(newCat);
  } else {
    const existing = trk.categories.find(c => c.id === catId) || trk.categories[0];
    if(!existing){ toast('تعذر العثور على الفئة'); return; }
    catId = existing.id;
    catName = existing.name;
  }

  const subcat = isNew ? null : (($('#vrSubcat')||{}).value || null);
  const note = ($('#vrNote')||{}).value || null;

  const entry = {
    id: 'ent_' + (crypto.randomUUID ? crypto.randomUUID().slice(0,10) : String(Date.now())),
    categoryId: catId,
    subcategory: subcat && subcat.trim() ? subcat.trim() : null,
    quantity: quantity && quantity.trim() ? quantity.trim() : null,
    startedAt: startedAt,
    endedAt: endedAt,
    loggedAt: loggedAt,
    note: note && note.trim() ? note.trim() : null,
    syncIntent: 'local_only'
  };

  trk.entries.push(entry);
  saveTrackerData(trk);
  closeSheet();
  renderLifeTracker();
  toast(`تم حفظ النشاط: ${catName} ✓`);
  insertTrackerEntryCloud(entry);
}

function generateTrackerReportHtml(startDate, endDate, selectedCategoryIds, includeNotes, periodTitle, exportMode = (window._pdfExportMode || 'BOTH')){
  const trk = getTrackerData();
  const catMap = {};
  trk.categories.forEach(c => { catMap[c.id] = c; });
  
  const entries = trk.entries.filter(e => {
    const catOk = !selectedCategoryIds.length || selectedCategoryIds.includes(e.categoryId);
    const dateStr = (e.loggedAt || '').slice(0,10);
    const dateOk = dateStr >= startDate && dateStr <= endDate;
    return catOk && dateOk;
  }).sort((a,b) => (b.loggedAt||'').localeCompare(a.loggedAt||''));

  const counts = {};
  let totalMinutes = 0;
  const catMinutes = {};
  entries.forEach(e => {
    counts[e.categoryId] = (counts[e.categoryId] || 0) + 1;
    let dur = 15;
    if(e.startedAt && e.endedAt){
      const diff = Math.round((new Date(e.endedAt) - new Date(e.startedAt))/60000);
      if(diff > 0) dur = diff;
    } else if(e.quantity) {
      const m = e.quantity.match(/\d+/);
      if(m && (e.quantity.includes('ساعة') || e.quantity.includes('ساعات'))) dur = parseInt(m[0],10)*60;
      else if(m && (e.quantity.includes('دقيقة') || e.quantity.includes('دقائق'))) dur = parseInt(m[0],10);
    }
    catMinutes[e.categoryId] = (catMinutes[e.categoryId] || 0) + dur;
    totalMinutes += dur;
  });

  const periodText = startDate === endDate ? formatArabicDate(startDate) : (startDate + ' إلى ' + endDate);

  let statsHtml = '';
  trk.categories.forEach(cat => {
    if(!selectedCategoryIds.length || selectedCategoryIds.includes(cat.id)){
      const count = counts[cat.id] || 0;
      statsHtml += `
        <div style="background:#F9FAFB;border:1px solid #E5E7EB;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;border-right:4px solid ${cat.colorHex}">
          <div style="font-size:20px">${cat.icon}</div>
          <div style="display:flex;flex-direction:column">
            <span style="font-size:12px;color:#6B7280;font-weight:500">${esc(cat.name)}</span>
            <span style="font-size:14px;font-weight:700;color:#111827">${count} مرة</span>
          </div>
        </div>
      `;
    }
  });

  const showTimeline = exportMode === 'BOTH' || exportMode === 'TIMELINE';
  const showActivities = exportMode === 'BOTH' || exportMode === 'ACTIVITIES';

  // الخط الزمني البصري لليوم وتوزيع الأوقات
  let timelineHtml = '';
  if (showTimeline) {
    const isSingleDay = startDate === endDate;
    const startHour = getTimelineStartHour();
    const endHour = getTimelineEndHour();
    const spanHours = Math.max(1, endHour - startHour);
    const totalSpanMin = spanHours * 60;
    const rowStartMin = startHour * 60;
    const rowEndMin = endHour * 60;

    if (isSingleDay) {
      const sortedDayEntries = [...entries].sort((a,b) => (a.startedAt||a.loggedAt||'').localeCompare(b.startedAt||b.loggedAt||''));
      let slicesHtml = '';
      let rLane0End = -1, rLane1End = -1, rPref = 0;
      sortedDayEntries.forEach(entry => {
        const cat = catMap[entry.categoryId] || { icon:'📌', colorHex:'#3B82F6', name:'' };
        const hasRange = !!(entry.startedAt && entry.endedAt);
        let sMin, durMin;
        if (hasRange) {
          sMin = parseIsoToMinutes(entry.startedAt);
          const eMin = parseIsoToMinutes(entry.endedAt);
          durMin = eMin > sMin ? eMin - sMin : 30;
        } else {
          const lMin = parseIsoToMinutes(entry.loggedAt);
          sMin = Math.max(0, lMin - 7);
          durMin = 15;
        }
        const segStart = Math.max(rowStartMin, Math.min(rowEndMin, sMin));
        const segEnd = Math.max(rowStartMin, Math.min(rowEndMin, sMin + durMin));
        if (segEnd > segStart || (!hasRange && sMin >= rowStartMin && sMin <= rowEndMin)) {
          const startInRow = segStart - rowStartMin;
          const durInRow = Math.max(10, segEnd - segStart);
          const endInRow = startInRow + durInRow;

          const overlaps0 = startInRow < rLane0End;
          const overlaps1 = startInRow < rLane1End;
          let lane = 0;
          if(overlaps0 && !overlaps1) lane = 1;
          else if(!overlaps0 && overlaps1) lane = 0;
          else if(overlaps0 && overlaps1) lane = (rLane0End <= rLane1End) ? 0 : 1;
          else { lane = rPref; rPref = 1 - rPref; }

          if(lane === 0) rLane0End = Math.max(rLane0End, endInRow);
          else rLane1End = Math.max(rLane1End, endInRow);

          const leftPct = (startInRow / totalSpanMin) * 100;
          const widthPct = Math.max(2.5, (durInRow / totalSpanMin) * 100);
          const pastelBg = hexToPastelRgba(cat.colorHex, 0.65);
          const isTop = lane === 0;
          const topCss = isTop ? 'top:4px;height:40px;border-radius:4px 4px 1px 1px;align-items:flex-start;padding-top:3px' : 'top:30px;height:40px;border-radius:1px 1px 4px 4px;align-items:flex-end;padding-bottom:3px';

          slicesHtml += `<div style="position:absolute;${topCss};left:${leftPct.toFixed(2)}%;width:${widthPct.toFixed(2)}%;background:${pastelBg};border:1px solid ${cat.colorHex}55;display:flex;justify-content:center;color:#111;font-size:11px;box-sizing:border-box;z-index:2" title="${esc(cat.name)}">${cat.icon}</div>`;
        }
      });

      let ticksHtml = '';
      const step = spanHours <= 8 ? 1 : (spanHours <= 16 ? 2 : 3);
      for (let h = startHour; h <= endHour; h += step) {
        const pct = ((h - startHour) / spanHours) * 100;
        ticksHtml += `<div style="position:absolute;top:33px;height:9px;left:${pct.toFixed(2)}%;width:1px;background:#9CA3AF"></div>`;
        ticksHtml += `<span style="position:absolute;top:28px;left:${pct.toFixed(2)}%;transform:translateX(-50%);font-size:8.5px;font-weight:bold;color:#4B5563;background:rgba(255,255,255,0.9);padding:1px 3px;border-radius:3px;border:1px solid #E5E7EB;white-space:nowrap">${String(h).padStart(2,'0')}:00</span>`;
      }

      timelineHtml += `
        <div style="border:1px solid #E5E7EB;border-radius:12px;padding:14px;background:#fff;margin-bottom:20px;page-break-inside:avoid">
          <h3 style="font-size:15px;margin:0 0 10px 0;color:#111827">📊 التمثيل البصري للخط الزمني (${String(startHour).padStart(2,'0')}:00 - ${String(endHour).padStart(2,'0')}:00)</h3>
          <div style="direction:ltr;width:100%;position:relative">
            <div style="position:relative;width:100%;height:74px;background:#F9FAFB;border-radius:8px;border:1px solid #E5E7EB;overflow:hidden">
              <div style="position:absolute;top:37px;left:0;right:0;height:1px;background:#D1D5DB;z-index:5"></div>
              ${slicesHtml}
              <div style="position:absolute;inset:0;pointer-events:none;z-index:6">${ticksHtml}</div>
            </div>
          </div>
        </div>
      `;
    }

    if (totalMinutes > 0) {
      const sortedCats = Object.entries(catMinutes).sort((a,b) => b[1] - a[1]);
      let distRows = sortedCats.map(([cid, mins]) => {
        const cat = catMap[cid];
        if(!cat) return '';
        const pct = ((mins / totalMinutes) * 100).toFixed(1);
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        const durStr = h > 0 ? (m > 0 ? `${h} س و ${m} د` : `${h} س`) : `${m} د`;
        return `
          <div style="margin-bottom:8px">
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
              <span>${cat.icon} <b>${esc(cat.name)}</b></span>
              <span style="color:#4B5563">${durStr} (${pct}%)</span>
            </div>
            <div style="width:100%;height:8px;background:#E5E7EB;border-radius:4px;overflow:hidden">
              <div style="width:${pct}%;height:100%;background:${cat.colorHex};border-radius:4px"></div>
            </div>
          </div>
        `;
      }).join('');

      const totalH = Math.floor(totalMinutes / 60);
      const totalM = totalMinutes % 60;
      const totalDurStr = totalH > 0 ? (totalM > 0 ? `${totalH} ساعة و ${totalM} دقيقة` : `${totalH} ساعة`) : `${totalM} دقيقة`;

      timelineHtml += `
        <div style="border:1px solid #E5E7EB;border-radius:12px;padding:14px;background:#fff;margin-bottom:20px;page-break-inside:avoid">
          <h3 style="font-size:15px;margin:0 0 10px 0;color:#111827">⏱️ توزيع الوقت حسب الفئات (إجمالي: ${totalDurStr})</h3>
          ${distRows}
        </div>
      `;
    }
  }

  let tableHtml = '';
  if (showActivities) {
    let rowsHtml = '';
    for(const entry of entries){
      const cat = catMap[entry.categoryId] || { name:'أخرى', icon:'📌', colorHex:'#3B82F6' };
      const subcat = entry.subcategory ? `<span style="font-size:11px;color:#6B7280;margin-right:4px">(${esc(entry.subcategory)})</span>` : '';
      const qty = entry.quantity ? `<span style="background:#E0E7FF;color:#3730A3;padding:2px 6px;border-radius:4px;font-size:11px;margin-right:4px">⏱️ ${esc(entry.quantity)}</span>` : '';
      const note = (includeNotes && entry.note) ? `<div style="font-size:11px;color:#4B5563;margin-top:4px">📝 ${esc(entry.note)}</div>` : '';
      const timeStr = (entry.startedAt && entry.endedAt) 
        ? `من ${formatArabicTime(entry.startedAt)} إلى ${formatArabicTime(entry.endedAt)}`
        : formatArabicTime(entry.loggedAt);

      rowsHtml += `
        <tr style="border-bottom:1px solid #E5E7EB">
          <td style="padding:10px 12px;width:45%">
            <span style="background-color:${cat.colorHex}20;color:${cat.colorHex};border:1px solid ${cat.colorHex}60;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:bold;display:inline-block">
              ${cat.icon} ${esc(cat.name)}
            </span>
            ${subcat} ${qty} ${note}
          </td>
          <td style="padding:10px 12px;width:25%;direction:ltr;text-align:right;color:#4B5563">${(entry.loggedAt||'').slice(0,10)}</td>
          <td style="padding:10px 12px;width:30%;font-weight:bold;color:#374151">${timeStr}</td>
        </tr>
      `;
    }

    tableHtml = `
      <div style="border:1px solid #E5E7EB;border-radius:12px;padding:14px;background:#fff;page-break-inside:avoid">
        <h3 style="font-size:15px;margin:0 0 10px 0;color:#111827">📋 سجل الأنشطة المسجلة بالتفصيل</h3>
        <table>
          <thead>
            <tr>
              <th>النشاط / الفئة</th>
              <th>التاريخ</th>
              <th>الوقت / المدة</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml || '<tr><td colspan="3" style="text-align:center;color:#9CA3AF;padding:20px">لا توجد تسجيلات</td></tr>'}
          </tbody>
        </table>
      </div>
    `;
  }

  const reportSubtitle = exportMode === 'TIMELINE' ? 'تقرير الخط الزمني وتوزيع الأوقات' : (exportMode === 'ACTIVITIES' ? 'تقرير سجل الأنشطة والتفاصيل' : 'التقرير الشامل • خط زمني وسجل الأنشطة');

function printTrackerPdf(html){
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:999;background:#fff';
  document.body.appendChild(f);
  const close = document.createElement('button');
  close.textContent = '✕ إغلاق التقرير';
  close.style.cssText = 'position:fixed;top:14px;inset-inline-end:14px;z-index:1000;background:#1D1D1F;color:#fff;border:0;border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer';
  close.onclick = () => { f.remove(); close.remove(); };
  document.body.appendChild(close);
  f.srcdoc = html;
  setTimeout(() => {
    try {
      f.contentWindow.focus();
      f.contentWindow.print();
    } catch(e) {
      toast('تعذر فتح نافذة الطباعة');
    }
  }, 500);
}

/* ---------- الأدوية ---------- */
function parseMed(it){
  const f=it.frequency||''; if(!f.startsWith('MED|')) return null;
  const desc=(it.description||'').split('|');
  const g=k=>{ const p=desc.find(x=>x.startsWith(k+'=')); return p? p.slice(k.length+1):''; };
  return {item:it, schedule:f.slice(4),
    start:g('start'), end:g('end'), ongoing:g('ongoing')==='1', patient:g('patient'),
    perDay:Math.max(1,Math.round((it.target_value||1))),
    scheduleAr(){ if(this.schedule.endsWith('x')) return this.schedule.slice(0,-1)+' مرات يوميًا';
      if(this.schedule.startsWith('weekly:')) return 'أيام: '+this.schedule.slice(7); return this.schedule; },
    statusAr(){ if(this.ongoing) return 'مستمر مدى الحياة';
      if(!this.end) return ''; const d=Math.ceil((new Date(this.end)-new Date())/86400000);
      return d<0?'انتهى':(d===0?'آخر يوم':('ينتهي بعد '+d+' يومًا')); },
    activeToday(){ const t=new Date().toISOString().slice(0,10);
      if(this.start&&t<this.start) return false;
      if(!this.ongoing&&this.end&&t>this.end) return false; return true; } };
}

function ytThumb(u){ if(!u) return null; u=String(u).trim();
  let id=null;
  if(u.indexOf('youtu.be/')>=0) id=u.split('youtu.be/')[1];
  else if(u.indexOf('shorts/')>=0) id=u.split('shorts/')[1];
  else if(u.indexOf('v=')>=0) id=u.split('v=')[1];
  else if(u.indexOf('embed/')>=0) id=u.split('embed/')[1];
  if(id){ id=id.split('&')[0].split('?')[0].slice(0,11); if(id.length>=11) return 'https://img.youtube.com/vi/'+id+'/mqdefault.jpg'; }
  if(u.includes('twitter.com') || u.includes('x.com') || u.includes('fxtwitter.com') || u.includes('vxtwitter.com')){
    const m = u.match(/(?:status|statuses)\/(\d+)/);
    if(m) return 'https://d.fxtwitter.com/i/status/' + m[1] + '.jpg';
  }
  if(u.includes('vimeo.com/')){
    const m = u.match(/vimeo\.com\/(?:channels\/(?:\w+\/)?|groups\/[^\/]*\/videos\/|album\/(?:\d+\/)?video\/|video\/|)(\d+)/);
    if(m) return 'https://vumbnail.com/' + m[1] + '.jpg';
  }
  return null;
}

/* --- مساعدات مصفوفة الأسبوع والجرعات (Meds Matrix Helpers) --- */
const WEEK_DAYS_SHORT = ['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'];
const WEEK_DAYS_FULL = ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
window._medsWeekOffset = 0;

function getWeekSaturday(refDate, offset){
  const d = new Date(refDate);
  d.setDate(d.getDate() + (offset * 7));
  const daysSinceSat = (d.getDay() + 1) % 7;
  d.setDate(d.getDate() - daysSinceSat);
  d.setHours(0,0,0,0);
  return d;
}

function getWeekDays(refDate, offset){
  const sat = getWeekSaturday(refDate, offset);
  const days = [];
  for(let i = 0; i < 7; i++){
    const day = new Date(sat);
    day.setDate(sat.getDate() + i);
    days.push(day);
  }
  return days;
}

function parseDosesForMed(itemId, entries){
  return (entries || []).filter(e => e.item_id === itemId).map(e => {
    try {
      const dt = new Date(e.recorded_at);
      const isoDate = dt.toISOString().slice(0, 10);
      const h = dt.getHours(), m = dt.getMinutes();
      const ampm = h < 12 ? 'ص' : 'م';
      const h12 = (h % 12) || 12;
      const timeStr = h12 + ':' + String(m).padStart(2, '0') + ' ' + ampm;
      return { id: e.id, date: isoDate, timeStr, dt };
    } catch(ex){ return null; }
  }).filter(Boolean).sort((a,b) => a.dt - b.dt);
}

function lastDoseFormatted(doses, todayIso){
  if(!doses.length) return 'لم يُسجّل هذا الأسبوع';
  const last = doses[doses.length - 1];
  if(last.date === todayIso) return 'اليوم • ' + last.timeStr;
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  if(last.date === yest.toISOString().slice(0, 10)) return 'أمس • ' + last.timeStr;
  return last.date + ' • ' + last.timeStr;
}

async function undoLastDose(itemId){
  try {
    const todayIso = new Date().toISOString().slice(0, 10);
    const myEntries = (data.entries || []).filter(e => e.item_id === itemId && (e.recorded_at || '').startsWith(todayIso) && e.user_id === meId());
    if(!myEntries.length){ toast('لا توجد جرعة مسجلة اليوم للتراجع عنها'); return; }
    myEntries.sort((a,b) => (b.recorded_at||'').localeCompare(a.recorded_at||''));
    await rest('DELETE', 'progress_entries', 'id=eq.' + myEntries[0].id);
    await refreshAll();
    renderApp();
    toast('تم التراجع عن الجرعة ↩︎');
  } catch(e) {
    toast('تعذر التراجع: ' + (e && e.message ? e.message : ''));
  }
}

function recurrenceOf(t){ try{ const m=(t.description||'').match(/RECUR:([a-z:0-9]+)/); return m?m[1]:null; }catch(e){ return null; } }
function cleanDesc(t){ try{ return (t.description||'').replace(/\s*\|?RECUR:[a-z:0-9]+/,'').trim()||null; }catch(e){ return t.description; } }
function recurrenceAr(r){ if(r==='daily') return 'يوميًا';
  if(r.startsWith('weekly:')) return 'كل '+['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'][+r.slice(7)];
  if(r.startsWith('monthly:')) return 'يوم '+r.slice(8)+' من كل شهر'; return r; }
function nextOccurrence(iso,recur){ try{
  let d=new Date(iso||Date.now()); const today=new Date(); today.setHours(0,0,0,0); let g=0;
  while(d<=today && g<400){ if(recur==='daily') d.setDate(d.getDate()+1);
    else if(recur.startsWith('weekly:')) d.setDate(d.getDate()+7);
    else if(recur.startsWith('monthly:')) d.setMonth(d.getMonth()+1); else d.setDate(d.getDate()+1); g++; }
  d.setHours(9,0,0,0); return d.toISOString(); }catch(e){ return null; } }
function overdueTasks(){ const now=Date.now();
  return visibleTasks().filter(t=>t.priority!=='EVENT'&&t.status!=='DONE'&&t.due_at&&new Date(t.due_at).getTime()<now); }
async function completeRecurring(t){
  try{ const recur=recurrenceOf(t); if(!recur) return; const next=nextOccurrence(t.due_at,recur);
    await rest('PATCH','tasks',{status:'DONE',completed_at:new Date().toISOString(),completed_by:meId()},'id=eq.'+t.id);
    const copy=Object.assign({},t,{id:uuid(),status:'TODO',started_at:null,completed_at:null,completed_by:null,due_at:next,created_at:new Date().toISOString()});
    await rest('POST','tasks',copy,'return=minimal');
    try{ await rest('POST','activity_events',{id:uuid(),circle_id:t.circle_id,user_id:meId(),kind:'TASK_DONE',payload:t.title}); }catch(e){}
    await refreshAll(); renderApp(); toast('أُنجزت الدورة — وجهّزت التالية 🔁');
  }catch(e){ toast('تعذر: '+(e&&e.message?e.message:'')); } }

  const daysWith=new Set(myEntries.map(e=>new Date(e.recorded_at).toDateString()));
  let streak=0; const today=new Date();
  let cur=daysWith.has(today.toDateString())?today:new Date(today.getTime()-86400000);
  if(daysWith.has(cur.toDateString())){ while(daysWith.has(cur.toDateString())){ streak++; cur=new Date(cur.getTime()-86400000); } }

  const sumU=(u,from)=>myEntries.filter(e=>new Date(e.recorded_at)>=from&&(e.unit||'').includes(u)).reduce((s,e)=>s+(+e.value||0),0);
  const pagesW=sumU('صفح',weekStart), pagesM=(()=>{ const f=new Date(); f.setDate(f.getDate()-29); return sumU('صفح',f); })();
  const minW=sumU('دقيق',weekStart)+sumU('دقيقة',weekStart)+sumU('دقائق',weekStart);

function spaceRingSVG(pct, spaceKey){
  const r = 24, c = +(2 * Math.PI * r).toFixed(1);
  const safePct = Math.min(100, Math.max(0, Math.round(pct || 0)));
  const off = +(c * (1 - safePct / 100)).toFixed(1);
  let strokeColor = 'var(--space-me)';
  let trackColor = 'var(--space-me-soft)';
  if(spaceKey === 'shared'){
    strokeColor = 'var(--space-shared)';
    trackColor = 'var(--space-shared-soft)';
  } else if(spaceKey === 'companion'){
    strokeColor = 'var(--space-comp)';
    trackColor = 'var(--space-comp-soft)';
  }
  const isHundred = safePct >= 100;
  return `<div class="space-ring-wrap" title="نسبة الإنجاز: ${safePct}%">
    <svg width="58" height="58" viewBox="0 0 58 58">
      <circle cx="29" cy="29" r="${r}" fill="none" stroke="${trackColor}" stroke-width="5"/>
      <circle cx="29" cy="29" r="${r}" fill="none" stroke="${strokeColor}" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    </svg>
    <div class="space-ring-lbl">
      <span style="font-size:${isHundred ? '12.5px' : '14px'};font-weight:800;color:${strokeColor}">${safePct}%</span>
      <small>إنجاز</small>
    </div>
  </div>`;
}

function spaceMetricChip(icon, count, label, spaceKey){
  let bg = 'var(--space-me-soft)', color = 'var(--space-me)', border = 'rgba(36,80,69,0.18)';
  if(spaceKey === 'shared'){
    bg = 'var(--space-shared-soft)'; color = 'var(--space-shared)'; border = 'rgba(29,78,216,0.18)';
  } else if(spaceKey === 'companion'){
    bg = 'var(--space-comp-soft)'; color = 'var(--space-comp)'; border = 'rgba(217,119,6,0.18)';
  }
  return `<span class="space-stat-chip" style="background:${bg};color:${color};border-color:${border}">
    <span class="chip-ic">${icon}</span>
    <span class="chip-val">${count}</span>
    <span>${label}</span>
  </span>`;
}

<script>
'use strict';
/* ---------- النوافذ ---------- */
function setDisplay(id,val){ const el=document.getElementById(id); if(el&&el.style) el.style.display=val; }
function openSheet(html){ $('#sheet-root').innerHTML=`<div class="overlay" data-ov="1"><div class="sheet">${html}</div></div>`;
  $('#sheet-root .overlay').addEventListener('click',e=>{ if(e.target.dataset.ov) closeSheet(); }); }
function closeSheet(){ $('#sheet-root').innerHTML=''; }
function openPopup(html){
  $('#popup-root').innerHTML=`<div class="popup-backdrop" data-pclose="1"><div class="popup-box">${html}</div></div>`;
  const bd=$('#popup-root .popup-backdrop');
  if(bd) bd.addEventListener('click',e=>{ if(e.target.dataset.pclose) closePopup(); });
}
function closePopup(){ $('#popup-root').innerHTML=''; }
function sheetHead(t){ return `<div class="sheet-head"><h3>${esc(t)}</h3><button class="sheet-x" data-act="closeSheet">✕</button></div>`; }
function visOptions(sel,circle){
  const opts=[['PRIVATE','🔒 خاص بي','يراه صاحبه فقط'],['CIRCLE','👥 كل الدائرة',circle?'يراه جميع أعضاء «'+circle.circle.name+'»':'يراه الجميع في دائرتك'],['SELECTED_MEMBERS','@ أشخاص محددون','يراه من تختاره فقط']];
  return opts.map(([v,t,d])=>`<button class="vis-opt ${sel===v?'on':''}" data-act="pickVis" data-v="${v}">
    <span style="flex:1"><span class="vt">${t}</span><br><span class="vd">${d}</span></span>${sel===v?'<span style="color:var(--accent)">✓</span>':''}</button>`).join('');
}
window._visSel='PRIVATE'; window._visMembers=[];
function memberPick(circle){ return `<div style="border:1px solid var(--divider);border-radius:14px;padding:4px 12px;margin-bottom:12px">
  ${circle.members.filter(x=>x.m.user_id!==meId()).map(x=>`<label style="display:flex;align-items:center;gap:8px;min-height:42px">
    <input type="checkbox" class="memcb" value="${x.m.user_id}"> ${esc(x.p.display_name||'عضو')}</label>`).join('')}</div>`; }

function openItemSpaceMenu(type, itemId){
  let rawItem = null, title = '', curSpace = 'shared';
  const me = meId();
  const comps = allCompanions();
  const compName = comps.length ? (comps[0].display_name || 'رفيقي') : 'رفيقي';

  if(type === 'task'){
    rawItem = (data.tasks||[]).find(t => t.id === itemId);
    if(rawItem){ title = rawItem.title; curSpace = getItemSpace('task', rawItem); }
  } else if(type === 'habit' || type === 'item'){
    rawItem = (data.items||[]).find(i => i.id === itemId);
    if(rawItem){ title = rawItem.title; curSpace = getItemSpace('habit', rawItem); }
  } else if(type === 'med'){
    const m = (medsOf()||[]).find(x => x.item.id === itemId);
    if(m){ rawItem = m.item; title = m.item.title; curSpace = getItemSpace('med', m); }
  } else {
    rawItem = (data.shopping||[]).find(s => s.id === itemId);
    if(rawItem){ title = rawItem.title; curSpace = getItemSpace(type, rawItem); }
  }

  if(!rawItem){ toast('تعذر العثور على العنصر'); return; }

  const curMeta = spaceMeta(curSpace);
  const typeIcons = { task:'✅', habit:'🌱', med:'💊', shopping:'🛒', food:'🍽️', dish:'🍲', place:'📍', media:'🎬' };
  const typeLabels = { task:'مهمة', habit:'عادة / هدف', med:'دواء', shopping:'سلعة تسوق', food:'وجبة طعام', dish:'طبق مفضل', place:'مكان محفوظ', media:'مقطع / رابط' };
  const icon = typeIcons[type] || '📌';
  const typeLbl = typeLabels[type] || 'عنصر';

  openSheet(sheetHead('⋯ تخصيص المساحة والملكية') + `
    <div class="card" style="margin-bottom:12px;background:var(--surface-2);border:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:24px">${icon}</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:15px;font-weight:700;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(title)}</div>
          <div style="font-size:11.5px;color:var(--text-2);margin-top:2px">${typeLbl} • المساحة الحالية: <span class="${curMeta.badgeCls}">${curMeta.emoji} ${curMeta.label}</span></div>
        </div>
      </div>
    </div>

    <div style="font-size:13px;font-weight:700;color:var(--text-1);margin-bottom:8px">حدد أين يظهر هذا العنصر ومن يشاركه معك:</div>

    <!-- الخيار 1: خاص بي (أنا 🟢) -->
    <button class="space-choice-btn space-choice-me ${curSpace==='me'?'selected':''}" data-act="setItemSpace" data-type="${type}" data-id="${itemId}" data-space="me">
      <span class="space-choice-icon">🟢</span>
      <div class="space-choice-text">
        <div class="space-choice-title">خاص بي (أنا) ${curSpace==='me'?'<span style="color:var(--space-me);font-weight:800"> ✓ الحالي</span>':''}</div>
        <div class="space-choice-desc">في مساحتك الشخصية فقط، لا يراه رفيقك ولا يظهر في القوائم المشتركة</div>
      </div>
    </button>

    <!-- الخيار 2: مشترك بيننا (كلانا 🔵) -->
    <button class="space-choice-btn space-choice-shared ${curSpace==='shared'?'selected':''}" data-act="setItemSpace" data-type="${type}" data-id="${itemId}" data-space="shared">
      <span class="space-choice-icon">🔵</span>
      <div class="space-choice-text">
        <div class="space-choice-title">مشترك بيننا (كلانا) ${curSpace==='shared'?'<span style="color:var(--space-shared);font-weight:800"> ✓ الحالي</span>':''}</div>
        <div class="space-choice-desc">متاح لكليكما في الدائرة المشتركة للمتابعة والتعاون معاً</div>
      </div>
    </button>

    <!-- الخيار 3: خاص برفيقي (رفيقي 🟠) -->
    ${comps.length > 1 ? `
      <button class="space-choice-btn space-choice-comp ${curSpace==='companion'?'selected':''}" data-act="openCompPicker" data-type="${type}" data-id="${itemId}">
        <span class="space-choice-icon">🟠</span>
        <div class="space-choice-text">
          <div class="space-choice-title">خاص برفيقي (اختر الرفيق) ${curSpace==='companion'?'<span style="color:var(--space-comp);font-weight:800"> ✓ الحالي</span>':''}</div>
          <div class="space-choice-desc">تحديد رفيق مخصص من دائرتك لإسناد هذا الموضوع إليه</div>
        </div>
      </button>
    ` : `
      <button class="space-choice-btn space-choice-comp ${curSpace==='companion'?'selected':''}" data-act="setItemSpace" data-type="${type}" data-id="${itemId}" data-space="companion" data-compid="${comps[0]?comps[0].id:''}">
        <span class="space-choice-icon">🟠</span>
        <div class="space-choice-text">
          <div class="space-choice-title">خاص برفيقي (${esc(compName)}) ${curSpace==='companion'?'<span style="color:var(--space-comp);font-weight:800"> ✓ الحالي</span>':''}</div>
          <div class="space-choice-desc">مُسند ومخصص لرفيقك ليتابعه وينجزه في مساحته</div>
        </div>
      </button>
    `}

    <div style="border-top:1px solid var(--border);margin:14px 0 10px"></div>

    <div style="display:flex;gap:8px">
      <button class="btn ghost" style="flex:1" data-act="editItemFromSpace" data-type="${type}" data-id="${itemId}">✏️ تعديل</button>
      <button class="btn danger" style="flex:1" data-act="delItemFromSpace" data-type="${type}" data-id="${itemId}">🗑️ حذف</button>
    </div>
  `);
}

function openCompanionPickerSheet(type, itemId){
  const comps = allCompanions();
  openSheet(sheetHead('🟠 اختر الرفيق') + `
    <p style="font-size:12.5px;color:var(--text-2);margin-bottom:12px">اختر الرفيق الذي تريد تخصيص هذا العنصر له:</p>
    ${comps.map(c => `
      <button class="space-choice-btn space-choice-comp" data-act="setItemSpace" data-type="${type}" data-id="${itemId}" data-space="companion" data-compid="${c.id}">
        <div class="avatar sm comp">${esc((c.display_name||'؟')[0])}</div>
        <div class="space-choice-text">
          <div class="space-choice-title">${esc(c.display_name||'رفيق')}</div>
          <div class="space-choice-desc">إسناد وتخصيص في مساحة هذا الرفيق</div>
        </div>
      </button>

    <button class="btn ghost" style="margin-top:8px" data-act="openSpaceMenu" data-type="${type}" data-id="${itemId}">رجوع</button>
  `);

async function setItemSpaceAction(type, id, space, chosenCompId){
  try{
    const me = meId();
    const comps = allCompanions();
    const targetCompId = chosenCompId || (comps[0] ? comps[0].id : null);
    const sh = sharedFirst();
    const pers = circlesOf().find(c => c.circle.type === 'PERSONAL');

    if(type === 'task'){
      if(space === 'me'){
        const pCid = pers ? pers.circle.id : (data.tasks.find(t=>t.id===id)||{}).circle_id;
        await rest('PATCH', 'tasks', { visibility: 'PRIVATE', assigned_to: me, circle_id: pCid || undefined, updated_at: nowIso() }, 'id=eq.' + id);
      } else if(space === 'shared'){
        const sCid = sh ? sh.circle.id : (data.tasks.find(t=>t.id===id)||{}).circle_id;
        await rest('PATCH', 'tasks', { visibility: 'CIRCLE', assigned_to: null, circle_id: sCid || undefined, updated_at: nowIso() }, 'id=eq.' + id);
      } else if(space === 'companion'){
        const sCid = sh ? sh.circle.id : (data.tasks.find(t=>t.id===id)||{}).circle_id;
        await rest('PATCH', 'tasks', { visibility: 'CIRCLE', assigned_to: targetCompId, circle_id: sCid || undefined, updated_at: nowIso() }, 'id=eq.' + id);
      }
    } else if(type === 'habit' || type === 'item'){
      if(space === 'me'){
        const pCid = pers ? pers.circle.id : (data.items.find(i=>i.id===id)||{}).circle_id;
        await rest('PATCH', 'items', { visibility: 'PRIVATE', circle_id: pCid || undefined }, 'id=eq.' + id);
      } else if(space === 'shared'){
        const sCid = sh ? sh.circle.id : (data.items.find(i=>i.id===id)||{}).circle_id;
        await rest('PATCH', 'items', { visibility: 'CIRCLE', circle_id: sCid || undefined }, 'id=eq.' + id);
      } else if(space === 'companion'){
        const sCid = sh ? sh.circle.id : (data.items.find(i=>i.id===id)||{}).circle_id;
        await rest('PATCH', 'items', { visibility: 'SELECTED_MEMBERS', circle_id: sCid || undefined }, 'id=eq.' + id);
        if(targetCompId){
          try{ await rest('POST', 'item_recipients', { id: uuid(), item_id: id, user_id: targetCompId }, 'return=minimal'); }catch(e){}
        }
      }
    } else if(type === 'med'){
      const m = (medsOf()||[]).find(x => x.item.id === id);
      const raw = m ? m.item : (data.items||[]).find(i=>i.id===id);
      if(raw){
        let desc = raw.description || '';
        const patVal = space === 'companion' ? 'companion' : (space === 'shared' ? 'both' : 'me');
        if(desc.includes('patient=')){
          desc = desc.replace(/patient=[a-zA-Z0-9_]+/g, 'patient=' + patVal);
        } else {
          desc = desc ? (desc + '|patient=' + patVal) : ('patient=' + patVal);
        }
        const visVal = space === 'me' ? 'PRIVATE' : 'CIRCLE';
        await rest('PATCH', 'items', { description: desc, visibility: visVal }, 'id=eq.' + id);
      }
    } else {

function setupOtp(){
  const boxes=[...document.querySelectorAll('.otp-b')];
  boxes.forEach((b,i)=>{
    b.addEventListener('input',()=>{ b.value=b.value.replace(/[^0-9]/g,'').slice(-1);
      if(b.value&&i<5) boxes[i+1].focus();
      if(boxes.every(x=>x.value)) doJoin(); });
    b.addEventListener('keydown',e=>{ if(e.key==='Backspace'&&!b.value&&i>0) boxes[i-1].focus(); });
    b.addEventListener('paste',e=>{ e.preventDefault();
      const d=(e.clipboardData.getData('text')||'').replace(/[^0-9]/g,'').slice(0,6);
      d.split('').forEach((ch,j)=>{ if(boxes[j]) boxes[j].value=ch; });
      boxes[Math.min(d.length,5)].focus();
      if(d.length===6) doJoin(); });
  });
  boxes[0].focus();
}

async function doJoin(){

  if(code.length<6){ toast('أكمل الرمز المكوَّن من 6 أرقام'); return; }
  // المسار الأول: دالة خادمية
  try{
    const rows=await rest('POST','rpc/join_circle_by_code',{p_code:code});
    const row=(rows&&rows[0])||null;
    if(row){ pendingJoin=null; try{ history.replaceState(null,'',location.pathname); }catch(e){}
      await refreshAll(); closeSheet(); view='home'; renderApp();
      toast('أصبحت عضوًا في «'+(row.circle_name||'الدائرة')+'» 🎉'); return; }
    toast('رمز الدعوة غير صحيح'); return;

    if((e&&e.message||'').includes('does not exist')||(e&&e.message||'').includes('Could not find')){ /* نكمل للمسار الاحتياطي */ }

    pendingJoin=null; try{ history.replaceState(null,'',location.pathname); }catch(e){}
    await refreshAll(); closeSheet(); view='home'; renderApp();
    toast('أصبحت عضوًا في «'+(c&&c.name?c.name:'الدائرة')+'» 🎉');

async function restoreBackup(text){
  try{
    const b=JSON.parse(text); if(!b||b.app!=='rafiq'){ toast('ملف غير صالح'); return; }
    let ok=0,fail=0;
    async function up(table,rows){
      for(const r of (rows||[])){
        try{ await rest('POST',table,r,'resolution=merge-duplicates,return=minimal'); ok++; }catch(e){ fail++; }
      }
    }
    await up('profiles', b.profile?[b.profile]:[]);
    await up('circles', b.circles); await up('circle_members', b.members);
    await up('items', b.items); await up('item_recipients', b.recipients);
    await up('progress_entries', b.entries); await up('tasks', b.tasks);
    await up('shared_lists', b.sharedLists); await up('shared_list_items', b.shopping);
    await up('activity_events', b.activity);
    await refreshAll(); closeSheet(); renderApp();
    toast('استُرد: '+ok+' عنصرًا'+(fail?(' • فشل '+fail):''));
  }catch(e){ toast('تعذر الاسترداد: '+(e&&e.message?e.message:'')); }
}

function smartLinkName(url){
  const u=(url||'').toLowerCase();
  if(u.indexOf('instagram.com/')>=0){ const seg=url.substringAfter? '':''; }
  try{
    if(u.includes('instagram.com/')){
      let seg=url.split('instagram.com/')[1].split('/')[0].split('?')[0];
      if(seg && !['p','reel','reels','tv','stories','explore'].includes(seg)) return 'إنستغرام — '+seg;
      return 'مقطع إنستغرام';
    }
  }catch(e){}
  if(u.includes('youtube')||u.includes('youtu.be')) return 'مقطع يوتيوب';
  if(u.includes('tiktok.com')) return 'مقطع تيك توك';
  if(u.includes('twitter.com')||u.includes('x.com')) return 'منشور من X';
  if(u.includes('facebook.com')) return 'منشور فيسبوك';
  if(u.includes('spotify.com')) return 'مقطع صوتي — سبوتيفاي';
  if(u.includes('soundcloud.com')) return 'مقطع صوتي — ساوندكلاود';
  try{ const h=url.split('://')[1].split('/')[0].replace('www.',''); if(h) return 'رابط من '+h; }catch(e){}
  return 'رابط';
}
function smartPlaceName(link, fallback){
  try{ const q=(link.split('q=')[1]||'').split('&')[0]; if(!q) return fallback;

}

function extractWebUrl(text){
  const t = (text || '').trim();
  if(!t) return null;
  const m = t.match(/(https?:\/\/[^\s]+|www\.[^\s]+|[a-zA-Z0-9-]+\.[a-zA-Z]{2,}(\/[^\s]*)?)/);
  if(!m) return null;
  let url = m[0].replace(/[\)\]\.,;'"\>]+$/, '');
  if(!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
  try {
    const u = new URL(url);
    if(u.hostname && u.hostname.includes('.')) return url;
  } catch(e){}
  return null;
}

function getWebDomain(url){
  try {
    const u = new URL(url.startsWith('http') ? url : ('https://' + url));
    return u.hostname.replace(/^www\./, '') || url.slice(0, 25);
  } catch(e){
    return url.replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0].slice(0, 25);
  }
}

async function smartAddBookmark(){
  let clip = '';
  try {
    if(navigator.clipboard && navigator.clipboard.readText){
      clip = await navigator.clipboard.readText();
    }
  } catch(e){}
  const detected = extractWebUrl(clip);
  if(detected){
    const d = getWebDomain(detected);
    const t = d.charAt(0).toUpperCase() + d.slice(1);
    await addBookmarkItem(t, detected);
    toast('تم حفظ الرابط من الحافظة تلقائيًا: ' + d + ' 🔖');
  } else {
    openAddBookmarkModal();
  }
}

function openAddMenu(anchorBtn, targetSpace){
  window._addMenuTargetSpace = targetSpace || null;
  const old=document.getElementById('addPop'); if(old){ old.remove(); return; }
  const today=new Date().toISOString().slice(0,10);
  const items=[
    ['✅','مهمة جديدة','openAddTask',''],
    ['🌱','عادة / هدف','openAddHabit',''],
    ['🛒','عنصر تسوق','shopAll',''],
    ['📍','مكاني الحالي','addCurrentPlace',''],
    ['📅','موعد في جدولي','addEvent',today],
    ['🔔','ذكّر رفيقي','openRemind',''],
    ['🍽','وجبة اليوم','openMealSheet',''],
    ['🌤','شعور اليوم','openAddMood',''],
    ['🎬','رابط جميل','addMedia',''],
    ['🔖','إشارة مرجعية','smartAddBookmark',''],
    ['💊','دواء','openAddMed',''],
    ['👥','دائرة جديدة','openCreateCircle','']
  ];
  const pop=document.createElement('div'); pop.id='addPop'; pop.className='add-pop';
  pop.innerHTML=items.map(it=>`<button class="add-row" data-act="${it[2]}" ${it[3]?`data-day="${it[3]}"`:''}><span class="add-ic">${it[0]}</span><span>${it[1]}</span></button>`).join('');
  document.body.appendChild(pop);
  
  const btn = anchorBtn || document.querySelector('[data-act="addMenu"]');
  if(btn){
    const r=btn.getBoundingClientRect();
    const popW = 210;
    let left = r.left;
    if(left + popW > window.innerWidth - 12){
      left = window.innerWidth - popW - 12;
    }
    if(left < 12) left = 12;
    pop.style.position = 'fixed';
    pop.style.left = left + 'px';
    pop.style.right = 'auto';
    const fitsBelow = (r.bottom + 420 <= window.innerHeight);
    if(fitsBelow){
      pop.style.top = (r.bottom + 6) + 'px';
    } else {
      pop.style.top = Math.max(12, r.top - 420) + 'px';
    }
  }
  pop.addEventListener('click',()=>setTimeout(()=>{const p=document.getElementById('addPop'); if(p) p.remove();},60));
  setTimeout(()=>{
    document.addEventListener('click',function h(ev){
      const p=document.getElementById('addPop');
      if(p && !p.contains(ev.target) && (!btn || !btn.contains(ev.target))){
        p.remove();
        document.removeEventListener('click',h);
      }
    },true);
  },60);
}

function friendly(e){ const m=String(e.message||e);
  if(m==='NO_SESSION') return 'انتهت الجلسة — سجّل الدخول من جديد';
  if(m.includes('Failed to fetch')||m.includes('NetworkError')) return 'تعذر الاتصال — تحقق من الإنترنت';
  if(m.includes('row-level security')||m.includes('42501')) return 'لا تملك صلاحية لهذه العملية';
  if(m.includes('JWT')||m.includes('401')) return 'انتهت الجلسة — حدّث الصفحة وسجّل الدخول';
  if(!/Cannot read|undefined|null|is not a function|TypeError/i.test(m)) return 'تعذرت العملية: '+m;
  return 'تعذر إتمام العملية — سنحاول مجددًا';
}

let __bootOk=false, __bootFailShown=false;
function bootFailed(msg, src){
  try{
    // نتجاهل أخطاء الإضافات أو أي مصدر خارجي، وأي خطأ بعد نجاح الإقلاع
    if(__bootOk) { console.warn('تجاهل خطأ خارجي:', msg); return; }
    if(src && src.indexOf('chrome-extension')>=0) return;
    if(src && /^https?:/.test(src) && location.host && src.indexOf(location.host)<0) return;
    if(src==='' && __bootOk) return;
    if(__bootFailShown) return; __bootFailShown=true;
    const v=document.getElementById('view'); if(!v) return;
    v.innerHTML='<div class="screen" style="padding-top:60px;text-align:center"><span style="font-size:38px">🌱</span>'+
      '<h1 style="margin:10px 0">تعذر فتح التطبيق</h1>'+
      '<p style="font-size:13px;color:var(--text-2);margin-bottom:14px">حدث خطأ غير متوقع — أعد التحميل وسيعمل.</p>'+
      '<button class="btn" style="max-width:240px;margin:0 auto" onclick="location.reload()">إعادة التحميل</button>'+
      '<p style="font-size:11px;color:var(--text-3);margin-top:12px">تفصيل: '+String(msg||'').slice(0,120)+'</p></div>';
  }catch(e){}
}

    if(k==='habits'){ const n=habitsFor(me).length; return n? n+' عادة':'لا عادات'; }
