    if(k==='reminders'){ const n=(data&&data.tasks||[]).filter(t=>t.priority==='REMINDER'&&t.assigned_to===me&&t.status!=='DONE').length; return n? n+' تذكير':'لا تذكيرات'; }
    if(k==='shopping'){
      const stores = getStoreLists();
      const totalUnc = stores.reduce((sum, s) => sum + getStoreUncompletedCount(s.id), 0);
      return totalUnc ? (totalUnc + ' عنصر مطلوب') : 'مكتملة';
    }
    if(k==='review') return 'ملخّص الأسبوع';
    if(k==='mood'){ const n=moodsOf().length; return n? n+' تسجيل':'لم يُسجّل'; }
    if(k==='meds'){
      const a = medsOf().filter(m => m.activeToday());
      return a.length ? (a.length + ' دواء نشط اليوم') : 'لا أدوية نشطة';
    }
    if(k==='places'){ const n=lc('أماكننا المحفوظة'); return n? n+' مكان':'لا أماكن'; }
    if(k==='media'){ const n=lc('مقاطعنا الجميلة'); return n? n+' مقطع':'لا مقاطع'; }
    if(k==='bookmarks'){ const n=lc('الإشارات المرجعية'); return n? n+' إشارة محفوظة':'لا إشارات'; }
    if(k==='urgent'){ const n=(data&&data.tasks||[]).filter(t=>t.priority==='URGENT'&&t.status!=='DONE').length; return n? n+' مستعجلة':'لا رسائل'; }
  }catch(e){}
  return '';
}
let activeSec=null;
function pickSec(k){
  if(k==='lifetracker'){ view='lifetracker'; renderApp(); return; }
  if(k==='shopping'){ view='shopping'; renderApp(); return; }
  if(k==='food'){ view='food'; renderApp(); return; }
  if(k==='meds'){ view='meds'; renderApp(); return; }
  if(k==='schedule'){ view='schedule'; renderApp(); return; }
  const wasOn=activeSec===k;
  activeSec = wasOn ? null : k;
  applyCollapse();
  if(activeSec){
    const el=document.querySelector('[data-sec="'+activeSec+'"]');
    if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),60);
  }
}
function applyCollapse(){
  try{
    const viewEl=document.getElementById('view'); if(!viewEl) return;
    const isFiltered=Boolean(activeSec);
    const set=isFiltered? new Set(SEC_META.map(m=>m[0]).filter(k=>k!==activeSec)) : collapsedSet();
    const secs=[...viewEl.querySelectorAll('[data-sec]')];
    secs.forEach(el=>{
      const k=el.dataset.sec, isCol=set.has(k), isCard=el.classList.contains('card');
      if(isCard){ el.style.display=isCol?'none':''; }
      else {
        el.style.display=isCol?'none':'';
        let n=el.nextElementSibling;
        while(n && !n.hasAttribute('data-sec')){ n.style.display=isCol?'none':''; n=n.nextElementSibling; }
      }
      const host=isCard? el.firstElementChild : el;
      if(!host) return;
      let ch=host.querySelector('.rafiq-chev');
      if(!ch){
        ch=document.createElement('span');
        ch.className='rafiq-chev';
        ch.onclick=(e)=>{e.stopPropagation();toggleSec(k);};
        host.appendChild(ch);
      }
      ch.textContent=isCol?'▸':'▾';
      ch.title=isCol?'توسيع':'طي';
    });
    // شريط الأقسام الثابت: صفان متوازنان تفاعليان
    const pills=document.getElementById('secPills');
    if(pills){
      const meta=SEC_META;
      const total=meta.length;
      const topCount=Math.ceil(total / 2);
      const row1=meta.slice(0, topCount);
      const row2=meta.slice(topCount);
      pills.className='sec-pills-balanced';
      pills.innerHTML=`
        <div class="sec-pills-row">${row1.map(m=>`<button class="pill ${activeSec===m[0]?'on':''}" data-pill="${m[0]}" type="button"><span style="font-size:14px;line-height:1.2">${m[1]}</span><span style="font-size:9.5px;font-weight:600;margin-top:1px">${m[2]}</span></button>`).join('')}</div>
        <div class="sec-pills-row">${row2.map(m=>`<button class="pill ${activeSec===m[0]?'on':''}" data-pill="${m[0]}" type="button"><span style="font-size:14px;line-height:1.2">${m[1]}</span><span style="font-size:9.5px;font-weight:600;margin-top:1px">${m[2]}</span></button>`).join('')}</div>
      `;
      pills.querySelectorAll('[data-pill]').forEach(b=>b.onclick=()=>pickSec(b.dataset.pill));
      const note=document.getElementById('secNote');
      if(note){
        const m=SEC_META.find(x=>x[0]===activeSec);
        note.textContent = m? (m[1]+' '+m[2]+' — '+secSummary(m[0])) : 'اضغط قسمًا ليفتح أمامك مباشرة ⇣';
        note.style.display = 'block';
      }
    }
    // لوحة الأيقونات (الداشبورد)
    const grid=document.getElementById('collapseGrid');
    if(grid){
      grid.innerHTML=''; grid.style.display='none';
    }
    // شريط التحكم
    const bar=document.getElementById('collapseBar');
    if(bar){
      const any=[...secs].some(el=>!set.has(el.dataset.sec));
      bar.textContent=any?'طي الكل ▴':'توسيع الكل ▾';
      bar.onclick=()=>{ if(any) collapseAllSec(); else expandAllSec(); };
    }
  }catch(err){
    console.error('applyCollapse error:', err);
  }
}
(new MutationObserver(()=>applyCollapse())).observe(document.getElementById('view')||document.body,{childList:true});

const RMP={el:null,video:null,id:null,url:null,title:null,openedAt:0,lastFocus:null,scrollY:0};
function rmpLog(e){ try{ const a=JSON.parse(localStorage.getItem('rafiq_play_log')||'[]'); a.unshift(e); localStorage.setItem('rafiq_play_log',JSON.stringify(a.slice(0,200))); }catch(x){} }
function rmpLast(id){ try{ const a=JSON.parse(localStorage.getItem('rafiq_play_log')||'[]'); return a.filter(x=>x.id===id)[0]||null; }catch(x){ return null; } }
function ytIdOf(u){ try{ if(u.includes('youtu.be/')) return u.split('youtu.be/')[1].split(/[?&]/)[0].slice(0,11);
  if(u.includes('shorts/')) return u.split('shorts/')[1].split(/[?&]/)[0].slice(0,11);
  if(u.includes('v=')) return u.split('v=')[1].split('&')[0].slice(0,11);
  if(u.includes('embed/')) return u.split('embed/')[1].split(/[?&]/)[0].slice(0,11); }catch(e){} return null; }
function twIdOf(u){
  try{
    if(!u) return null;
    const s = String(u).trim();
    if(!s.includes('twitter.com') && !s.includes('x.com') && !s.includes('fxtwitter.com') && !s.includes('vxtwitter.com')) return null;
    const m = s.match(/(?:status|statuses)\/(\d+)/);
    return m ? m[1] : null;
  }catch(e){ return null; }
}
function vimeoIdOf(u){
  try{
    if(!u || !u.includes('vimeo.com/')) return null;
    const m = String(u).match(/vimeo\.com\/(?:channels\/(?:\w+\/)?|groups\/[^\/]*\/videos\/|album\/(?:\d+\/)?video\/|video\/|)(\d+)/);
    return m ? m[1] : null;
  }catch(e){ return null; }
}
function isDirectMedia(u){ return /\.(mp4|webm|mov|m4v|mkv|ogv|ogg|mp3|m4a|wav|aac|flac)(\?|#|$)/i.test(u||''); }
function rmpFmt(s){ s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

function openPlayer(url,title,id){
  if(RMP.el) closePlayer(true);
  RMP.url=url||''; RMP.title=title||'مقطع'; RMP.id=id||String(Date.now()); RMP.openedAt=Date.now();
  RMP.lastFocus=document.activeElement; RMP.scrollY=window.scrollY;
  const prev=rmpLast(RMP.id); const startAt=(prev&&prev.position>3)?Math.floor(prev.position):0;
  const yt=ytIdOf(url), tw=twIdOf(url), vm=vimeoIdOf(url), direct=isDirectMedia(url);
  const isAudio=/\.(mp3|m4a|wav|aac|ogg|flac)(\?|#|$)/i.test(url);
  const back=document.createElement('div'); back.className='rmp-backdrop';
  back.setAttribute('role','dialog'); back.setAttribute('aria-modal','true');
  back.setAttribute('aria-label','مشغّل المقطع: '+(title||'مقطع'));

  let stage = '';
  let noteText = '';
  if (yt) {
    stage = `<iframe src="https://www.youtube-nocookie.com/embed/${yt}?autoplay=1&enablejsapi=1&start=${startAt}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="${esc(title||'مقطع')}"></iframe>`;
    noteText = 'تحكّم يوتيوب • الإغلاق: ✕ / Esc / النقر خارجها';
  } else if (tw) {
    stage = `<iframe src="https://platform.twitter.com/embed/Tweet.html?id=${tw}&theme=dark" allowfullscreen style="width:100%;height:100%;border:none;background:#000" title="${esc(title||'مقطع')}"></iframe>`;
    noteText = 'مقطع من X (تويتر) • الإغلاق: ✕ / Esc / النقر خارجها';
  } else if (vm) {
    stage = `<iframe src="https://player.vimeo.com/video/${vm}?autoplay=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="width:100%;height:100%;border:none;background:#000" title="${esc(title||'مقطع')}"></iframe>`;
    noteText = 'تحكّم فيميو • الإغلاق: ✕ / Esc / النقر خارجها';
  } else if (direct && !isAudio) {
    stage = `<video src="${esc(url)}" playsinline preload="metadata" data-start="${startAt}"></video>`;
    noteText = 'النافذة ٦٠٪ من مساحة العرض • الإغلاق: ✕ / Esc / النقر خارجها';
  } else if (direct && isAudio) {
    stage = `<div style="display:flex;align-items:center;justify-content:center;height:100%;background:#0B0C0D;padding:24px;flex-direction:column;gap:16px"><span style="font-size:46px">🎧</span><div style="font-weight:600;font-size:15px">${esc(title||'ملف صوتي')}</div><audio src="${esc(url)}" controls autoplay style="width:90%;max-width:440px"></audio></div>`;
    noteText = 'مشغّل صوتي • الإغلاق: ✕ / Esc / النقر خارجها';
  } else {
    stage = `<div class="rmp-err">
      <div style="font-size:38px;margin-bottom:4px">🎬</div>
      <b style="font-size:16px;color:#F2F2F0">${esc(title||'مقطع محفوظ')}</b>
      <span style="color:#A1A1AA;font-size:12.5px;max-width:85%;word-break:break-all;direction:ltr;unicode-bidi:embed">${esc((url||'').slice(0,100))}</span>
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center">
        <a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="rmp-btn" style="text-decoration:none;background:var(--accent);color:#0F172A;font-weight:700;padding:10px 20px;border-radius:10px;display:inline-flex;align-items:center;gap:6px">
          <span>🌐</span> فتح الرابط في نافذة جديدة
        </a>
        <button class="rmp-btn" data-rmp="copy" style="padding:10px 16px;border-radius:10px">📋 نسخ الرابط</button>
      </div>
    </div>`;
    noteText = 'رابط خارجي • يمكنك فتحه في نافذة جديدة أو نسخه';
  }

  const hasControls = direct && !isAudio;
  back.innerHTML=`<div class="rmp-panel">
    <div class="rmp-head">
      <span class="rmp-title">🎬 ${esc(title||'مقطع')}</span>
      <a href="${esc(url)}" target="_blank" rel="noopener noreferrer" title="فتح الرابط في نافذة جديدة" style="color:#A1A1AA;text-decoration:none;font-size:12px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.06);display:inline-flex;align-items:center;gap:4px"><span>↗</span> فتح أصلي</a>
      <button class="rmp-x" data-rmp="close" aria-label="إغلاق المشغّل (Esc)">✕</button>
    </div>
    <div class="rmp-stage">${stage}</div>
    ${hasControls?`<div class="rmp-controls">
      <button class="rmp-btn" data-rmp="play" aria-label="تشغيل/إيقاف (مسافة)">▶︎</button>
      <input class="rmp-seek" type="range" min="0" max="1000" value="0" data-rmp="seek" aria-label="شريط التقدم">
      <span class="rmp-time" data-rmp="time" aria-live="off">0:00 / 0:00</span>
      <button class="rmp-btn" data-rmp="mute" aria-label="كتم الصوت (M)" aria-pressed="false">🔊</button>
      <input class="rmp-vol" type="range" min="0" max="100" value="100" data-rmp="vol" aria-label="مستوى الصوت">
      <button class="rmp-btn" data-rmp="fs" aria-label="ملء الشاشة">⛶</button></div>`:''}
    <div class="rmp-note">${noteText}</div></div>`;
  document.body.appendChild(back); document.body.style.overflow='hidden'; RMP.el=back;
  rmpLog({id:RMP.id,url:RMP.url,title:RMP.title,opened:new Date().toISOString(),position:startAt,event:'open'});
  if(hasControls) rmpWire(back.querySelector('video'), back);
  else if(yt||tw||vm){
    RMP.video=null;
  }
  back.addEventListener('click',ev=>{ if(ev.target===back) closePlayer(); });
  back.addEventListener('click',ev=>{ const b=ev.target.closest('[data-rmp]'); if(!b) return;
    const act=b.getAttribute('data-rmp');
    if(act==='close') closePlayer();
    else if(act==='play'||act==='mute'||act==='fs'||act==='retry'||act==='copy') rmpAct(act,b);
  });
  const focusables=back.querySelectorAll('button,input,iframe,a');
  if(focusables.length) focusables[0].focus();
  setTimeout(()=>{ if(RMP.video){ const v=RMP.video; v.play().catch(()=>{}); } },60);
}

function rmpAct(act,btn){
  const v=RMP.video;
  if(act==='copy'){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(RMP.url).then(()=>{ toast('تم نسخ الرابط ✓'); }).catch(()=>{ toast('الرابط: '+RMP.url); });
    } else {
      toast('الرابط: '+RMP.url);
    }
    return;
  }
  if(!v && act!=='retry') { if(act==='retry') openPlayer(RMP.url,RMP.title,RMP.id); return; }
  if(act==='play'){ if(v.paused){ v.play().catch(()=>{}); } else { v.pause(); } }
  if(act==='mute'){ v.muted=!v.muted; btn.setAttribute('aria-pressed', v.muted?'true':'false'); btn.textContent = v.muted?'🔇':'🔊'; }
  if(act==='fs'){ const p=RMP.el.querySelector('.rmp-panel'); if(document.fullscreenElement){ document.exitFullscreen(); } else if(p.requestFullscreen){ p.requestFullscreen().catch(()=>{}); } }
  if(act==='retry'){ openPlayer(RMP.url,RMP.title,RMP.id); }
}

function rmpWire(v,panel){
  RMP.video=v;
  const play=panel.querySelector('[data-rmp="play"]'), seek=panel.querySelector('[data-rmp="seek"]'),
        time=panel.querySelector('[data-rmp="time"]'), vol=panel.querySelector('[data-rmp="vol"]'), mute=panel.querySelector('[data-rmp="mute"]');
  const sync=()=>{ if(v.duration){ seek.value=String(Math.round(v.currentTime/v.duration*1000)); time.textContent=rmpFmt(v.currentTime)+' / '+rmpFmt(v.duration); } };
  v.addEventListener('loadedmetadata',()=>{ const st=parseInt(v.getAttribute('data-start')||'0',10); if(st>0) v.currentTime=st; sync(); });
  v.addEventListener('timeupdate',sync);
  v.addEventListener('play',()=>{ play.textContent='⏸'; });
  v.addEventListener('pause',()=>{ play.textContent='▶︎'; });
  v.addEventListener('error',()=>{ const st=panel.querySelector('.rmp-stage'); st.innerHTML='<div class="rmp-err"><b>تعذّر تحميل المقطع</b><span>تحقق من الرابط أو الاتصال ثم أعد المحاولة.</span><button class="rmp-btn" data-rmp="retry">إعادة المحاولة</button></div>'; });
  seek.addEventListener('input',()=>{ if(v.duration) v.currentTime=(+seek.value/1000)*v.duration; });
  vol && vol.addEventListener('input',()=>{ v.volume=(+vol.value)/100; v.muted=(+vol.value===0); if(mute){ mute.setAttribute('aria-pressed', v.muted?'true':'false'); mute.textContent=v.muted?'🔇':'🔊'; } });
}

function closePlayer(silent){
  const v=RMP.video;
  if(v){ v.pause(); try{ v.removeAttribute('src'); v.load(); }catch(e){} }
  if(RMP.el){ RMP.el.remove(); RMP.el=null; RMP.video=null; document.body.style.overflow=''; }
  if(!silent){
    rmpLog({id:RMP.id,url:RMP.url,title:RMP.title,opened:new Date(RMP.openedAt).toISOString(),closed:new Date().toISOString(),position:(v&&v.currentTime)||0,event:'close'});
    window.scrollTo(0,RMP.scrollY||0);
    try{ if(RMP.lastFocus&&RMP.lastFocus.focus) RMP.lastFocus.focus(); }catch(e){}
  }
}

document.addEventListener('keydown',ev=>{
  if(!RMP.el) return;
  if(ev.key==='Escape'){ ev.preventDefault(); closePlayer(); return; }
  const v=RMP.video;
  if(ev.key===' '||ev.code==='Space'){ ev.preventDefault(); if(v){ v.paused? v.play().catch(()=>{}) : v.pause(); } return; }
  if(v && (ev.key==='ArrowRight'||ev.key==='ArrowLeft')){ ev.preventDefault(); v.currentTime=Math.max(0,v.currentTime+(ev.key==='ArrowRight'?5:-5)); return; }
  if(v && (ev.key==='m'||ev.key==='M')){ const b=RMP.el.querySelector('[data-rmp="mute"]'); rmpAct('mute',b); return; }
  if(ev.key==='Tab'){ // حصر التركيز داخل النافذة
    const f=[...RMP.el.querySelectorAll('button,input,iframe,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled);
    if(!f.length) return; const first=f[0],last=f[f.length-1];
    if(ev.shiftKey && document.activeElement===first){ ev.preventDefault(); last.focus(); }
    else if(!ev.shiftKey && document.activeElement===last){ ev.preventDefault(); first.focus(); }
  }
});

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then((reg) => {
      console.log('[PWA] Service Worker registered:', reg.scope);
    }).catch((err) => {
      console.warn('[PWA] Service Worker registration failed:', err);

(async function boot(){
  if(!session){ renderAuth(); return; }
  try{
    // 1) عرض فوري من آخر لقطة (بلا أي انتظار شبكة)
    const snap=loadSnap();
    if(snap && snap.profile){ data=snap; renderApp(); __bootOk=true; }
    // 2) الشبكة في الخلفية
    if(session.expires_at&&session.expires_at-Date.now()<120000) await refreshSession();
    await ensureProfile();
    await refreshAll(); renderApp(); __bootOk=true; startPolling();
    if(pendingJoin){ setTimeout(()=>openJoinSheet(pendingJoin),400); }
  }catch(e){
    // الجلسة غير صالحة (مثلًا مفتاح متغير) — عودة للدخول
    session=null; saveSession(); renderAuth();
    window._authErr='انتهت الجلسة — سجّل الدخول من جديد';
    renderAuthForms();
  }
})();
// التنقل بالسحب داخل النوافذ يعمل تلقائيًا عبر overflow-y:auto
</script>
