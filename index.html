<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF1E8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="رفيق">
<meta name="application-name" content="رفيق">
<meta name="description" content="تطبيق ذكي لإدارة المهام، العادات، الأدوية، والأنشطة المشتركة مع رفيقك">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Readex+Pro:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<title>رفيق — الويب</title>
<style>
:root{
  --app-font:-apple-system,'SF Arabic','Segoe UI','Geeza Pro','Noto Kufi Arabic',Tahoma,sans-serif;
  --bg-app:#FAF1E8; --surface:#FFFFFF; --surface-2:#F9F9F9; --surface-warm:#FBF5EE;
  --divider:#F2EEEA; --border:#E8E3DE; --nav-border:#EEEAE6;
  --text-1:#1D1D1F; --text-2:#7F7F78; --text-3:#A2A19C;
  --accent-dark:#245045; --accent:#308A65; --accent-2:#6AB597; --accent-progress:#7BAD4B;
  --accent-soft:#E8F4EE; --accent-verysoft:#F2F8F5;
  --companion:#E7A261; --companion-light:#F0C691;
  --success:#308A65; --warning:#E7A261; --error:#D94A4A; --info:#4C82B8;
  --ring-track:#EDF0EC; --shadow:0 2px 12px rgba(0,0,0,.055);
  --r-card:18px; --r-chip:12px; --r-btn:14px; --nav-h:64px;
  --field-bg:#F3EBE1; --field-border:#CFC7BC;
  --space-me:#308A65; --space-me-soft:#E8F4EE;
  --space-shared:#3B82F6; --space-shared-soft:#EBF3FA;
  --space-comp:#E7A261; --space-comp-soft:#FDF3E7;
}
html[data-accent="rose"]{
  --accent-dark:#AE3C60; --accent:#E05789; --accent-2:#E896B5;
  --accent-progress:#E05789; --accent-soft:#FDEAF1; --accent-verysoft:#FFF4F7;
}
html[data-theme="dark"]{
  --bg-app:#121312; --surface:#1B1C1B; --surface-2:#1F201F; --surface-warm:#202220;
  --divider:#2A2C2A; --border:#30322F; --nav-border:#30322F;
  --text-1:#F6F6F4; --text-2:#AAA9A5; --text-3:#8A8984;
  --ring-track:#2C2E2C; --shadow:0 2px 12px rgba(0,0,0,.45);
  --field-bg:#232523; --field-border:#4A4C4A;
  --space-me:#4EAA83; --space-me-soft:#1B2E24;
  --space-shared:#60A5FA; --space-shared-soft:#1E293B;
  --space-comp:#F0B37A; --space-comp-soft:#352516;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--app-font);
  background:#EDE7E0;color:var(--text-1);touch-action:manipulation}
html[data-theme="dark"] body{background:#0C0D0C}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;font-size:14px}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text-1)}
a{color:var(--accent)}
.hidden{display:none!important}
#shell{width:100%;max-width:540px;margin:0 auto;min-height:100dvh;background:var(--bg-app);position:relative;box-sizing:border-box}
@media(min-width:680px){
  #shell{max-width:760px;box-shadow:0 0 0 1px var(--border),0 12px 36px rgba(0,0,0,.06)}
  .screen{padding:18px 24px calc(var(--nav-h) + 36px)}
  .card{padding:18px 20px;border-radius:18px}
  .greet-side .g h1{font-size:18px}
  .greet-side .g p{font-size:13px}
  .tile-grid{gap:12px}
  .tile{padding:16px 10px}
  .tile .tl{font-size:12.5px}
  .btn{font-size:15.5px;min-height:50px}
  .mini{font-size:13px;padding:7px 14px}
  .chip{min-height:42px;font-size:13.5px;padding:0 14px}
}
@media(min-width:920px){
  #shell{max-width:880px;box-shadow:0 0 0 1px var(--border),0 16px 44px rgba(0,0,0,.08)}
  .screen{padding:22px 28px calc(var(--nav-h) + 40px)}
}
@media(min-width:1150px){
  #shell{max-width:980px}
}
.screen{padding:14px 16px calc(var(--nav-h) + 32px);animation:fadeIn .18s ease;box-sizing:border-box;width:100%}
@keyframes fadeIn{from{opacity:.35}to{opacity:1}}
h1{font-size:21px;font-weight:700}
h2{font-size:16px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--nav-border);border-radius:var(--r-card);
  box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-head h2{flex:1}
.link{font-size:13px;font-weight:500;color:var(--accent);min-height:32px;padding:0 4px}
.sec{display:flex;align-items:center;gap:8px;margin:18px 2px 10px}
.sec h2{font-size:18px;font-weight:700;flex:1}
.sec > button, .sec > .link, .sec > .mini{flex-shrink:0}
.greet{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;width:100%;box-sizing:border-box}
.greet-side{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0}
.greet-side .g{flex:1;min-width:0}
.greet-side .g h1{font-size:16px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.greet-side .g p{font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.greet .g{flex:1;min-width:0}
.greet .g p{font-size:13px;color:var(--text-2)}
.hicon-btn{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 44px;background:none}
.hicon-btn.sm{width:32px;height:32px;border-radius:10px;font-size:15px;flex:0 0 32px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--accent-dark);flex:0 0 auto}
.avatar.comp{background:var(--companion-light);color:#7A4A1E}
.avatar.sm{width:28px;height:28px;font-size:12px}
.week{display:flex;gap:6px;margin-bottom:16px}
.day{flex:1;height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-2)}
.day.today{background:var(--accent-soft);color:var(--accent-dark)}
.day .dn{font-size:11px}.day .dd{font-size:14px;font-weight:600}
.progress-row{display:flex;gap:12px;margin-bottom:16px}
@media(min-width:640px){.progress-row{max-width:520px}}
.pcard{flex:1;background:var(--surface);border:1px solid var(--nav-border);border-radius:var(--r-card);
  box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pcard .who{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text-2);align-self:flex-start}
.ring{position:relative;width:80px;height:80px}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.bar{height:7px;border-radius:8px;background:var(--ring-track);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:8px;background:var(--accent-progress);transition:width .35s ease}
.bar.solo{width:80px;flex:0 0 auto}
.row{display:flex;align-items:center;gap:10px;min-height:48px}
.row+.row{border-top:1px solid var(--divider)}
.row > button, .row > span.badge, .row > .check, .row > a.badge, .row > .link, .row > .mini{flex-shrink:0}
.hicon{width:34px;height:34px;border-radius:var(--r-chip);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.htitle{flex:1;min-width:0;font-size:15px;font-weight:500;word-break:break-word;overflow-wrap:break-word;line-height:1.35}
.hval{font-size:12px;color:var(--text-2);font-weight:500;white-space:nowrap}
.hval.ok{color:var(--accent);font-weight:600}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:transparent;background:transparent;transition:all .18s ease}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.add-pop{position:fixed;z-index:99;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:6px;display:flex;flex-direction:column;gap:2px}
.add-row{display:flex;align-items:center;gap:10px;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:var(--text-1);padding:10px 12px;border-radius:12px;cursor:pointer;text-align:start;width:100%}
.add-ic{width:26px;height:26px;border-radius:8px;background:var(--accent-verysoft);display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto}
.sec-strip{position:-webkit-sticky;position:sticky;top:6px;z-index:45;background:var(--surface);border:1px solid var(--nav-border);border-radius:var(--r-card);box-shadow:0 4px 16px rgba(0,0,0,.08);padding:8px 8px 4px;margin-bottom:12px}
[data-sec],.card[data-sec]{scroll-margin-top:130px}
.sec-pills-scroll{display:flex;width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;border:1px solid var(--border);border-radius:14px;background:var(--surface);height:66px}
.sec-pills-scroll::-webkit-scrollbar{display:none}
.sec-pills-scroll .pill{flex:0 0 76px;min-width:76px;height:66px;border:0;border-radius:0;background:var(--surface);color:var(--text-1);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;white-space:nowrap;transition:background .15s ease;-webkit-tap-highlight-color:transparent;padding:4px 2px}
.sec-pills-scroll .pill:not(:first-child){border-inline-start:1px solid var(--border)}
.sec-pills-scroll .pill.on{background:var(--accent);color:#fff;font-weight:700}
.sec-pills-scroll.stretch .pill{flex:1;min-width:0}
.sec-pills{display:grid;grid-template-rows:repeat(2,44px);grid-auto-flow:column;grid-auto-columns:92px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
.sec-pills::-webkit-scrollbar{display:none}
.sec-pills-balanced{display:flex;flex-direction:column;width:100%;border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden}
.sec-pills-row{display:flex;width:100%}
.sec-pills-row:not(:first-child){border-top:1px solid var(--border)}
.sec-pills-row .pill{flex:1;min-width:0;height:48px;border:0;border-radius:0;background:var(--surface);color:var(--text-1);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;white-space:nowrap;transition:background .15s ease;-webkit-tap-highlight-color:transparent;padding:2px 1px}
.sec-pills-row .pill:not(:first-child){border-inline-start:1px solid var(--border)}
.sec-pills-row .pill.on{background:var(--accent);color:#fff;font-weight:700}
.pill{border:0;border-inline-start:1px solid var(--border);border-top:1px solid var(--border);border-radius:0;background:var(--surface);color:var(--text-1);font:inherit;font-size:11px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;white-space:nowrap;font-family:inherit;transition:background .15s ease;-webkit-tap-highlight-color:transparent}
.pill:hover:not(.on){background:var(--accent-verysoft)}
.pill.on{background:var(--accent);color:#fff;font-weight:700}
.sec-note{font-size:11.5px;color:var(--text-3);padding:6px 4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-weight:500}
.tile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:inherit}
.tile .tl{font-size:11.5px;color:var(--text-2)}
.tile .ts{font-size:10px;color:var(--text-3)}
.rafiq-chev{cursor:pointer;color:var(--text-3);font-size:13px;padding:2px 6px;user-select:none}
.mini{font-size:12.5px;font-weight:700;color:var(--accent-dark);background:var(--accent-soft);border-radius:10px;padding:6px 12px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px;flex-shrink:0;min-height:32px;box-sizing:border-box}
.shop-meta{font-size:11px;color:var(--text-3)}
.done-t{font-size:12px;font-weight:600;color:var(--text-3);padding:10px 0 2px}
.add-item{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--divider)}
.add-item input{flex:1;min-height:44px;border:1px solid var(--field-border);border-radius:var(--r-btn);background:var(--field-bg);padding:0 14px;outline:none}
.add-item input:focus{border-color:var(--accent-2)}
.add-item button{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-size:22px;flex:0 0 auto}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:55;display:flex;justify-content:center;pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .in{pointer-events:auto;width:100%;max-width:540px;height:var(--nav-h);background:var(--surface);
  border-top:1px solid var(--nav-border);display:flex;box-shadow:0 -4px 16px rgba(0,0,0,.04);box-sizing:border-box}
@media(min-width:680px){#nav .in{max-width:760px}}
@media(min-width:920px){#nav .in{max-width:880px}}
@media(min-width:1150px){#nav .in{max-width:960px}}
#nav .in > button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#777873;font-size:12px;font-weight:600;padding:6px 2px;position:relative;transition:color .12s;white-space:nowrap}
#nav button.on{color:var(--accent);font-weight:700}
#nav button span:not(.ic){font-size:11.5px;line-height:1.2;white-space:nowrap;overflow:visible}
@media(min-width:680px){
  #nav button span:not(.ic){font-size:13px}
  #nav button{gap:4px;padding:8px 4px}
}
#nav .ic{font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{width:100%;max-width:540px;background:var(--surface);border-radius:22px 22px 0 0;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:slideUp .22s ease;box-sizing:border-box}
@media(min-width:680px){
  .overlay{align-items:center;padding:24px}
  .sheet{max-width:640px;border-radius:24px;max-height:84dvh;box-shadow:0 24px 60px rgba(0,0,0,.22)}
}
@media(min-width:920px){
  .sheet{max-width:720px}
}
.sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sheet-head h3{flex:1;font-size:17px;font-weight:700}
.sheet-x{width:36px;height:36px;border-radius:12px;background:var(--surface-2);font-size:15px;color:var(--text-2)}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;min-height:48px;border:1.5px solid var(--field-border);
  border-radius:var(--r-btn);background:var(--field-bg);padding:10px 14px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent-2);background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:40px;display:inline-flex;align-items:center;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);padding:0 12px;font-size:13px;font-weight:500;color:var(--text-2)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-2);color:var(--accent-dark);font-weight:600}
.vis-opt{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border:1px solid var(--border);
  border-radius:var(--r-btn);margin-bottom:8px;width:100%;text-align:start}
.vis-opt.on{border-color:var(--accent);background:var(--accent-verysoft)}
.vis-opt .vt{font-size:14px;font-weight:600}
.vis-opt .vd{font-size:12px;color:var(--text-3)}
.btn{width:100%;min-height:48px;border-radius:var(--r-btn);background:var(--accent);color:#fff;font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;white-space:normal;text-align:center;line-height:1.35;box-sizing:border-box}
.btn:active{opacity:.85}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--text-2);font-weight:600;font-size:13.5px;min-height:44px}
.btn.danger{color:var(--error);background:none;border:1px solid var(--border)}
.badge{font-size:11px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--divider);border-radius:999px;padding:2px 8px;display:inline-block}
.status{min-width:60px;height:28px;border-radius:999px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.s-TODO{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.s-IN_PROGRESS{background:#E7F0F9;color:var(--info)}
.s-DONE{background:var(--accent-soft);color:var(--accent-dark)}
.empty{padding:26px 12px;text-align:center;color:var(--text-2);font-size:14px}
.empty .e{font-size:28px;display:block;margin-bottom:8px}
.foot{text-align:center;color:var(--text-3);font-size:11px;padding:16px 0 6px}
#toast{position:fixed;bottom:calc(var(--nav-h) + 24px);left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text-1);color:var(--bg-app);font-size:13px;font-weight:500;padding:10px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:all .2s ease;z-index:90;white-space:nowrap;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bcol .be{width:100%;max-width:26px;border-radius:8px 8px 4px 4px;background:var(--accent-2);opacity:.55}
.bcol.t .be{background:var(--accent);opacity:1}
.bcol .bl{font-size:10px;color:var(--text-3)}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini-stat{background:var(--surface-2);border-radius:var(--r-chip);padding:10px}
.mini-stat b{display:block;font-size:16px;font-weight:700}
.mini-stat span{font-size:11px;color:var(--text-3)}
.qr{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;display:inline-block}
.switch{width:46px;height:28px;border-radius:999px;background:var(--ring-track);position:relative;flex:0 0 auto}
.switch i{position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .18s ease}
.switch.on{background:var(--accent)}
html[dir="rtl"] .switch.on i{transform:translateX(-18px)}
.setrow{display:flex;align-items:center;gap:10px;min-height:52px}
.setrow+.setrow{border-top:1px solid var(--divider)}
.setrow .st{flex:1;font-size:15px;font-weight:500}
.circlerow{display:flex;align-items:center;gap:12px;min-height:58px;width:100%;text-align:start}
.circlerow+.circlerow{border-top:1px solid var(--divider)}
.cico{width:40px;height:40px;border-radius:var(--r-chip);display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;background:var(--companion-light)}
.cico.personal{background:var(--accent-soft)}
.notif-row{display:flex;align-items:center;gap:10px;min-height:54px}
.notif-row+.notif-row{border-top:1px solid var(--divider)}
.nico{width:36px;height:36px;border-radius:50%;background:var(--accent-verysoft);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.task-title{font-size:15px;font-weight:500;flex:1;min-width:0}
.task-title.dn{color:var(--text-3);text-decoration:line-through}
.task-row{display:flex;gap:10px;padding:10px 0;align-items:flex-start}
.task-row+.task-row{border-top:1px solid var(--divider)}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.welc{background:var(--surface);border:1px solid var(--nav-border);border-radius:var(--r-card);box-shadow:var(--shadow);padding:14px 16px;margin:10px 0}
.welc b{display:block;font-size:15px;font-weight:700}
.welc span{font-size:13px;color:var(--text-2)}
.err{color:var(--error);font-size:13px;margin-top:8px}
.info-msg{color:var(--info);font-size:13px;margin-top:8px}
.logo{font-size:38px;text-align:center;display:block}
.otp{display:flex;gap:8px;justify-content:center;direction:ltr;margin:4px 0}
.otp-b{width:52px;height:60px;text-align:center;font-size:24px;font-weight:700;
  border:1.5px solid var(--field-border);border-radius:14px;background:var(--field-bg);
  color:var(--text-1);outline:none;padding:0}
.otp-b:focus{border-color:var(--accent-2);background:var(--surface)}

/* ===== مشغّل المقاطع المنبثق — سينمائي داكن (Preset 05 Locomotive) 50% ===== */

/* ─────────── منتقي الوقت المدمج الأنيق (Compact Box Picker) ─────────── */
.tp-wrap{display:flex;align-items:center;justify-content:center;gap:8px;direction:ltr;margin:6px 0 10px}
.tp-col{display:flex;flex-direction:column;align-items:center;gap:3px}
.tp-label{font-size:10.5px;font-weight:700;color:var(--text-3);text-align:center;letter-spacing:0.5px}
.tp-box{width:64px;height:50px;background:var(--accent-verysoft);border:2px solid var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,.04);transition:transform .12s,border-color .12s}
.tp-box:active{transform:scale(0.96)}
.tp-num{font-size:25px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.tp-btn{width:64px;height:24px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;cursor:pointer;transition:all .1s;user-select:none}
.tp-btn:active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tp-colon{font-size:24px;font-weight:900;color:var(--accent);margin-top:16px;user-select:none}
.tp-period-col{display:flex;flex-direction:column;gap:5px;justify-content:center;margin-top:16px;margin-right:4px}
.tp-period-btn{padding:5px 11px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text-2);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.tp-period-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tp-quick-row{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;scrollbar-width:none;justify-content:center}
.tp-quick-btn{flex-shrink:0;padding:4px 8px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s}
.tp-quick-btn:hover{border-color:var(--accent);color:var(--accent)}
.rmp-backdrop{position:fixed;inset:0;z-index:900;background:rgba(4,5,6,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:24px;animation:rmpFade .18s ease}
@keyframes rmpFade{from{opacity:0}to{opacity:1}}
.rmp-panel{width:60vw;max-width:1200px;background:#0B0C0D;border:1px solid rgba(255,255,255,.12);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(48,138,101,.15);overflow:hidden;color:#F2F2F0;display:flex;flex-direction:column}
.rmp-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.rmp-title{flex:1;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmp-x{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#F2F2F0;font-size:18px;cursor:pointer;line-height:1}
.rmp-x:focus-visible,.rmp-btn:focus-visible,.rmp-seek:focus-visible{outline:2px solid #4FA57E;outline-offset:2px}
.rmp-stage{width:100%;aspect-ratio:16/9;background:#000;position:relative}
.rmp-stage iframe,.rmp-stage video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.rmp-controls{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
.rmp-btn{min-width:40px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#F2F2F0;cursor:pointer;font-size:14px}
.rmp-btn[aria-pressed="true"]{background:rgba(48,138,101,.35);border-color:#4FA57E}
.rmp-seek{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:999px;background:rgba(255,255,255,.18);cursor:pointer}
.rmp-seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#4FA57E;box-shadow:0 0 12px rgba(79,165,126,.8)}
.rmp-seek::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#4FA57E}
.rmp-time{font-size:11.5px;color:#AAA9A5;min-width:86px;text-align:center;font-variant-numeric:tabular-nums}
.rmp-err{position:absolute;inset:0;width:100%;height:100%;padding:22px 16px;text-align:center;font-size:13.5px;color:#F2F2F0;background:#0B0C0D;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
.rmp-note{padding:8px 14px;font-size:11.5px;color:#8A8984;border-top:1px solid rgba(255,255,255,.06)}
@media (max-width:640px){
  .rmp-backdrop{padding:10px}
  .rmp-panel{width:94vw;max-width:none;border-radius:14px}
  .rmp-time{min-width:70px;font-size:11px}
  .rmp-vol{width:60px}
}
/* 50% = متغيّر للتعديل السريع */
/* ===== نوافذ منبثقة مستقلة فوق الـ Sheets ===== */
.popup-backdrop{position:fixed;inset:0;z-index:950;background:rgba(0,0,0,.68);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .18s ease}
.popup-box{background:var(--surface);border:1px solid var(--border);border-radius:22px;max-width:440px;width:100%;max-height:82vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.4);padding:18px;display:flex;flex-direction:column;gap:12px;animation:scaleIn .2s cubic-bezier(.16,1,.3,1)}
@keyframes scaleIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.popup-head{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--divider);padding-bottom:10px}
.popup-head h3{font-size:16px;font-weight:700}
.popup-x{width:32px;height:32px;border-radius:10px;background:var(--surface-2);font-size:14px;color:var(--text-2);cursor:pointer}

/* ===== متتبع الحياة (Life Tracker) ===== */
.trk-cats-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;padding-top:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.trk-cats-bar::-webkit-scrollbar{display:none}
.trk-cat-pill{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--border);flex:0 0 auto;font-weight:600;font-size:13px;cursor:pointer;transition:transform .12s}
.trk-cat-pill:active{transform:scale(.95)}
.trk-cat-pill .cnt{font-size:11px;padding:1px 6px;border-radius:8px;background:rgba(0,0,0,.08)}
.trk-mode-switch{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.trk-mode-btn{flex:1;padding:8px;border-radius:10px;text-align:center;font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer}
.trk-mode-btn.on{background:var(--surface);color:var(--accent-dark);box-shadow:var(--shadow)}
.trk-act-rows-wrap{display:flex;flex-direction:column;gap:10px;width:100%}
.trk-act-row{width:100%}
.trk-entries-grid{display:grid;grid-template-columns:repeat(var(--trk-cols, 1), minmax(0, 1fr));gap:8px;width:100%}
@media(max-width:580px){.trk-entries-grid{grid-template-columns:repeat(auto-fit, minmax(110px, 1fr))}}
.trk-entry-card{border-radius:14px;padding:6px 10px;display:flex;align-items:center;gap:8px;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;transition:transform .12s, box-shadow .12s, filter .12s;height:54px;min-height:54px;max-height:54px;box-sizing:border-box;min-width:0;overflow:hidden;position:relative;user-select:none}
.trk-entry-card:hover{filter:brightness(1.04);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.trk-entry-card:active{transform:scale(.98)}

/* Card Icon: Soft translucent glass badge (same color with high transparency) */
.trk-entry-card .ico{font-size:18px;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;flex:0 0 36px;min-width:36px;max-width:36px;min-height:36px;max-height:36px;box-shadow:0 1px 4px rgba(0,0,0,.06)}

/* Content Column: Two stacked lines (NEVER overlap) */
.trk-entry-card .trk-card-content{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden}

/* Line 1: Title + Subtitle + Subtle Tag */
.trk-entry-card .trk-line-top{display:flex;align-items:center;gap:5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk-entry-card .trk-tit{font-size:13.5px;font-weight:800;color:#ffffff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk-entry-card .trk-sub{font-size:11.5px;color:rgba(255,255,255,.9);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk-entry-card .trk-qty-tag{background:none;border:none;backdrop-filter:none;color:#ffffff;padding:0;font-size:11.5px;font-weight:700;white-space:nowrap;flex-shrink:0}

/* Line 2: Time + Note */
.trk-entry-card .trk-line-bot{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.9);font-weight:500;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk-entry-card .trk-tim{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk-entry-card .trk-note-tag{background:none;padding:0;font-size:10.5px;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}

/* Edit Button: Subtle translucent circle */
.trk-entry-card .trk-btn-edit{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(4px);color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 28px;transition:transform .15s, background .15s}
.trk-entry-card:hover .trk-btn-edit{transform:scale(1.1);background:rgba(255,255,255,.28)}

/* Wide card (1 or 2 items per row): Spacious layout with subtle tag aligned */
.trk-entry-card.wide{padding:6px 14px;gap:10px}
.trk-entry-card.wide .trk-tit{font-size:14px}
.trk-entry-card.wide .trk-line-top .trk-qty-tag{margin-inline-start:auto}

/* Medium card (3 items per row) */
.trk-entry-card.medium{padding:6px 9px;gap:7px}
.trk-entry-card.medium .ico{width:32px;height:32px;flex:0 0 32px;min-width:32px;max-width:32px;min-height:32px;max-height:32px;font-size:16px;border-radius:10px}
.trk-entry-card.medium .trk-tit{font-size:12.5px}
.trk-entry-card.medium .trk-sub{font-size:10.5px}
.trk-entry-card.medium .trk-line-bot{font-size:10.5px}
.trk-entry-card.medium .trk-qty-tag{font-size:10px;padding:1px 6px}
.trk-entry-card.medium .trk-btn-edit{width:24px;height:24px;flex:0 0 24px;font-size:11px}

/* Dense card (4 or 5 items per row, e.g. Water) */
.trk-entry-card.dense{padding:5px 7px;gap:6px}
.trk-entry-card.dense .ico{width:28px;height:28px;flex:0 0 28px;min-width:28px;max-width:28px;min-height:28px;max-height:28px;font-size:14px;border-radius:8px}
.trk-entry-card.dense .trk-tit{font-size:11.5px}
.trk-entry-card.dense .trk-sub{font-size:9.5px}
.trk-entry-card.dense .trk-line-bot{font-size:9.5px}
.trk-entry-card.dense .trk-qty-tag{font-size:8.5px;padding:0 5px}
.trk-entry-card.dense .trk-btn-edit{display:none}
.trk-color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:6px 0}
.trk-color-dot{width:42px;height:42px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:16px}
.trk-color-dot.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.trk-icon-cat{margin-bottom:12px}
.trk-icon-cat-title{font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.trk-icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.trk-icon-btn{height:42px;border-radius:10px;background:var(--surface-2);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.trk-icon-btn:hover,.trk-icon-btn:active{background:var(--accent-soft)}
.trk-range-box{background:var(--surface-2);border-radius:14px;padding:12px;margin:10px 0;border:1px solid var(--border)}
.trk-range-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.trk-range-row:last-child{margin-bottom:0}
.fab-pdf{position:fixed;bottom:calc(var(--nav-h) + 16px);inset-inline-end:16px;z-index:50;display:flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
.trk-layout-switch{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px;border:1px solid var(--border)}
.trk-layout-btn{padding:5px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text-2);transition:all .15s;border:none;background:transparent}
.trk-layout-btn.on{background:var(--surface);color:var(--accent-dark);box-shadow:var(--shadow-sm)}
.trk-timeline-wrap{width:100%;direction:ltr;text-align:left}
.trk-timeline-bar-24{position:relative;width:100%;height:76px;background:var(--surface-2);border-radius:8px;border:1px solid var(--border);overflow:hidden;box-sizing:border-box}
.trk-timeline-spine{position:absolute;top:38px;left:0;right:0;height:1px;background:var(--border);opacity:0.85;z-index:5;pointer-events:none}
.trk-timeline-ticks{position:absolute;inset:0;pointer-events:none;z-index:6}
.trk-timeline-tick{position:absolute;top:34px;width:1px;height:9px;background:var(--border);opacity:0.95}
.trk-timeline-hour-badge{position:absolute;top:30px;transform:translateX(-50%);font-size:8px;font-weight:600;color:var(--text-3);background:var(--surface);padding:1px 3px;border-radius:3px;border:1px solid var(--border);z-index:7;pointer-events:none;white-space:nowrap}
.trk-timeline-slice{position:absolute;display:flex;justify-content:center;cursor:pointer;transition:transform .12s,filter .12s;z-index:2;box-sizing:border-box}
.trk-timeline-slice:hover{filter:brightness(1.08);z-index:10}
.trk-timeline-slice.lane-top{top:4px;height:41px;border-radius:4px 4px 1px 1px;align-items:flex-start;padding-top:3px}
.trk-timeline-slice.lane-bottom{top:31px;height:41px;border-radius:1px 1px 4px 4px;align-items:flex-end;padding-bottom:3px}
.trk-timeline-slice-icon{font-size:12px;line-height:1;pointer-events:none}
.trk-timeline-slice-title{font-size:8.5px;font-weight:600;margin-inline-start:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55px;color:var(--text-1);pointer-events:none}
.trk-week-timeline-rows{display:flex;flex-direction:column;gap:8px;width:100%}
.trk-week-timeline-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 12px;cursor:pointer;transition:background .12s}
.trk-week-timeline-row:hover{background:var(--surface-2)}
.trk-week-timeline-row.selected{border-color:var(--accent);background:var(--accent-soft)}
.trk-week-timeline-meta{width:80px;flex:0 0 80px;display:flex;flex-direction:column}
.trk-week-timeline-dayname{font-size:12.5px;font-weight:700;color:var(--text-1)}
.trk-week-timeline-daydate{font-size:10.5px;color:var(--text-3)}
.trk-week-timeline-bar{flex:1;position:relative;height:34px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--border);direction:ltr}
.trk-week-timeline-spine{position:absolute;top:17px;left:0;right:0;height:1px;background:var(--border);opacity:0.6;z-index:5;pointer-events:none}
.trk-week-timeline-slice{position:absolute;display:flex;align-items:center;justify-content:center;font-size:8.5px;min-width:14px;z-index:2;box-sizing:border-box;border-radius:2px}
.trk-week-timeline-slice.lane-top{top:2px;height:18px}
.trk-week-timeline-slice.lane-bottom{top:14px;height:18px}
.fab-voice-tracker{position:fixed;bottom:calc(var(--nav-h) + 16px);inset-inline-start:16px;z-index:50;display:flex;align-items:center;justify-content:center;width:48px;height:48px;background:var(--accent);color:#fff;border-radius:50%;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;font-size:20px;border:none;transition:transform .15s}
.fab-voice-tracker:active{transform:scale(.92)}
.fab-voice-tracker.listening{background:#EF4444;animation:pulseMic 1.2s infinite}
@keyframes pulseMic{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(239,68,68,0.7)}70%{transform:scale(1.08);box-shadow:0 0 0 14px rgba(239,68,68,0)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(239,68,68,0)}}
/* --- Food, Shopping, Meds Twinning Styles --- */
.meal-cols-row{display:flex;gap:8px;margin:10px 0}
.meal-col-btn{flex:1;border-radius:16px;padding:11px 4px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s;user-select:none;border:1px solid transparent}
.meal-col-btn:active{transform:scale(0.96)}
.meal-futoor{background:#FFF4E0;color:#92400E;border-color:#FDE68A}
[data-theme="dark"] .meal-futoor{background:rgba(217,119,6,0.18);color:#FDE68A;border-color:rgba(217,119,6,0.35)}
.meal-ghadaa{background:var(--accent-soft);color:var(--accent-dark);border-color:var(--accent-2)}
.meal-ashaa{background:#EAF1FA;color:#1E40AF;border-color:#BFDBFE}
[data-theme="dark"] .meal-ashaa{background:rgba(37,99,235,0.18);color:#BFDBFE;border-color:rgba(37,99,235,0.35)}
.meal-snack{background:#FBEDF3;color:#9D174D;border-color:#FBCFE8}
[data-theme="dark"] .meal-snack{background:rgba(219,39,119,0.18);color:#FBCFE8;border-color:rgba(219,39,119,0.35)}
.dish-pick-box{background:var(--accent-soft);border-radius:14px;padding:14px;text-align:center;margin-top:10px;border:1.5px dashed var(--accent)}
.dish-pick-title{font-size:12px;color:var(--text-3);margin-bottom:4px}
.dish-pick-name{font-size:20px;font-weight:800;color:var(--accent-dark);margin-bottom:8px}
.dish-pick-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.store-tabs-bar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px 0;scrollbar-width:none;align-items:center}
.store-tab-pill{padding:7px 13px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;background:var(--surface-2);color:var(--text-1);border:1px solid var(--border);transition:all .15s}
.store-tab-pill.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.store-add-btn{padding:7px 13px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;background:var(--accent-soft);color:var(--accent-dark);border:1px dashed var(--accent)}
.past-readd-bar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px 0;scrollbar-width:none;align-items:center}
.past-readd-pill{padding:5px 11px;border-radius:8px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;background:var(--accent-soft);color:var(--accent-dark);border:1px solid var(--accent-2);transition:transform .1s}
.past-readd-pill:active{transform:scale(0.95)}
.med-shelf-card{border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--surface);transition:box-shadow .15s}
.med-shelf-card:hover{box-shadow:var(--shadow-sm)}
.med-pat-stripe{width:4px;border-radius:2px;flex:0 0 auto;margin-inline-end:10px}
.meds-matrix-wrap{overflow-x:auto;scrollbar-width:thin;margin-top:8px;-webkit-overflow-scrolling:touch}
.meds-matrix-table{width:100%;min-width:440px;border-collapse:separate;border-spacing:0}
.meds-matrix-table th{background:var(--surface-2);color:var(--text-2);font-size:11px;font-weight:700;padding:8px 4px;text-align:center;border-bottom:1px solid var(--border)}
.meds-matrix-table th.today{background:var(--accent-soft);color:var(--accent-dark);border-radius:8px 8px 0 0}
.meds-matrix-table td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--border);vertical-align:middle}
.meds-matrix-table td.today{background:var(--accent-soft)}
.meds-matrix-table td.med-name-cell{text-align:start;padding:8px 8px;white-space:nowrap}
.med-dose-pill{display:inline-block;padding:3px 6px;border-radius:6px;font-size:10px;font-weight:700;background:var(--accent-soft);color:var(--accent-dark);border:1px solid var(--accent-2)}
.med-log-btn{display:inline-block;padding:4px 8px;border-radius:6px;font-size:10px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer;border:none}

/* --- Ruled Lined Notebook / Dictation Styles --- */
.dictation-modal-overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.65);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box}
.dictation-notebook{width:100%;max-width:620px;height:90vh;max-height:800px;background:#FFFDF8;border:2.5px solid #C58A1B;border-radius:22px;box-shadow:0 20px 48px rgba(0,0,0,0.35);display:flex;flex-direction:column;overflow:hidden;position:relative;box-sizing:border-box}
[data-theme="dark"] .dictation-notebook{background:#1E1C18;border-color:#B57F24}
.dictation-notebook-head{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid #E9DFC6;background:#FAF5EB;flex-shrink:0}
[data-theme="dark"] .dictation-notebook-head{background:#26231E;border-bottom-color:#3D372E}
.dictation-rec-dot{width:14px;height:14px;border-radius:50%;background:#EF4444;display:inline-block;cursor:pointer;animation:dictationPulse 1.4s infinite ease-in-out}
.dictation-rec-dot.paused{background:#9CA3AF;animation:none}
@keyframes dictationPulse{0%{transform:scale(0.92);opacity:0.7}50%{transform:scale(1.18);opacity:1;box-shadow:0 0 12px rgba(239,68,68,0.85)}100%{transform:scale(0.92);opacity:0.7}}
.dictation-notebook-lines{flex:1;width:100%;padding:16px 20px;box-sizing:border-box;background-color:#FFFDF8;background-image:repeating-linear-gradient(transparent,transparent 34px,#E9DFC6 34px,#E9DFC6 36px);background-attachment:local;line-height:36px;font-size:17px;color:#2C2416;border:none;outline:none;resize:none;overflow-y:auto;direction:rtl;text-align:right;font-family:inherit}
[data-theme="dark"] .dictation-notebook-lines{background-color:#1E1C18;background-image:repeating-linear-gradient(transparent,transparent 34px,#3A342A 34px,#3A342A 36px);color:#EDE4D3}
.dictation-bottom-bar{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-top:1.5px solid #E9DFC6;background:#FAF5EB;flex-shrink:0;gap:10px}
[data-theme="dark"] .dictation-bottom-bar{background:#26231E;border-top-color:#3D372E}
.dictation-btn-circle{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;width:44px;height:44px;font-size:18px;font-weight:700;transition:transform .12s,background .12s;box-sizing:border-box}
.dictation-btn-circle:active{transform:scale(0.92)}
.dictation-btn-cancel{background:#FEE2E2;color:#DC2626;border:1.5px solid #FCA5A5}
[data-theme="dark"] .dictation-btn-cancel{background:rgba(220,38,38,0.2);color:#F87171;border-color:rgba(220,38,38,0.4)}
.dictation-btn-mic{background:#FEF3C7;color:#D97706;border:1.5px solid #FCD34D;width:52px;height:52px;font-size:24px}
.dictation-btn-mic.listening{background:#FEE2E2;color:#DC2626;border-color:#F87171;animation:pulseMic 1.4s infinite}
[data-theme="dark"] .dictation-btn-mic{background:rgba(217,119,6,0.2);color:#FBBF24;border-color:rgba(217,119,6,0.4)}
.dictation-btn-save{background:var(--accent);color:#fff;border:none;padding:0 18px;border-radius:26px;height:44px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer}
.dictation-btn-save:active{transform:scale(0.96)}
.dictation-interim-box{padding:6px 14px;background:rgba(254,243,199,0.85);color:#92400E;font-size:12.5px;font-weight:600;border-top:1px dashed #FCD34D;display:flex;align-items:center;gap:6px;flex-shrink:0;direction:rtl;text-align:right}
[data-theme="dark"] .dictation-interim-box{background:rgba(217,119,6,0.18);color:#FDE68A;border-top-color:rgba(217,119,6,0.35)}
.dictation-lang-select{font-size:11.5px;padding:4px 8px;border-radius:10px;border:1px solid #E9DFC6;background:#FFFDF8;color:#2C2416;font-weight:700;cursor:pointer;outline:none;font-family:inherit}
[data-theme="dark"] .dictation-lang-select{background:#26231E;border-color:#3D372E;color:#EDE4D3}
/* --- Notes (Keep Style) Styles --- */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;width:100%;box-sizing:border-box}
.notes-list{display:flex;flex-direction:column;gap:10px;width:100%;box-sizing:border-box}
.note-card{border-radius:16px;padding:12px 14px;box-sizing:border-box;cursor:pointer;border:1.5px solid rgba(0,0,0,0.08);box-shadow:0 2px 8px rgba(0,0,0,0.04);transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;position:relative;min-height:100px}
[data-theme="dark"] .note-card{border-color:rgba(255,255,255,0.1);box-shadow:0 2px 8px rgba(0,0,0,0.25)}
.note-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,0.08)}
.note-card-title{font-size:14.5px;font-weight:700;color:inherit;margin-bottom:6px;line-height:1.35}
.note-card-body{font-size:13px;color:inherit;opacity:0.9;line-height:1.5;white-space:pre-wrap;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;flex:1}
.note-card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:10.5px;opacity:0.75}
.note-card-pin{all:unset;cursor:pointer;padding:4px;font-size:14px;opacity:0.5;transition:opacity .12s,transform .12s}
.note-card-pin:hover,.note-card-pin.pinned{opacity:1;transform:scale(1.15)}
.note-color-chip{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;box-sizing:border-box;transition:transform .12s;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.note-color-chip.active{border-color:#245045;transform:scale(1.15)}
[data-theme="dark"] .note-color-chip.active{border-color:#fff}

/* --- Universal Spaces, Badges, Stripes & 3-Dots Menu Styles --- */
.space-stripe-me{border-inline-start:5px solid var(--space-me) !important}
.space-stripe-shared{border-inline-start:5px solid var(--space-shared) !important}
.space-stripe-comp{border-inline-start:5px solid var(--space-comp) !important}

.space-badge-me{display:inline-flex;align-items:center;gap:4px;background:var(--space-me-soft);color:var(--space-me);font-weight:700;font-size:11.5px;padding:3px 9px;border-radius:8px;flex:0 0 auto}
.space-badge-shared{display:inline-flex;align-items:center;gap:4px;background:var(--space-shared-soft);color:var(--space-shared);font-weight:700;font-size:11.5px;padding:3px 9px;border-radius:8px;flex:0 0 auto}
.space-badge-comp{display:inline-flex;align-items:center;gap:4px;background:var(--space-comp-soft);color:var(--space-comp);font-weight:700;font-size:11.5px;padding:3px 9px;border-radius:8px;flex:0 0 auto}

.dots-btn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--text-2);line-height:1;cursor:pointer;flex:0 0 auto;transition:all .12s ease;user-select:none;background:none;border:none}
.dots-btn:hover,.dots-btn:active{background:var(--surface-2);color:var(--text-1)}

/* Quick Home Space Filter Bar */
.space-filter-bar{display:flex;align-items:center;gap:5px;overflow-x:auto;padding:2px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:1 1 0;min-width:0;justify-content:center}
.space-filter-bar::-webkit-scrollbar{display:none}
.space-pill{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:20px;font-size:11.5px;font-weight:700;border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;white-space:nowrap;transition:all .15s ease;user-select:none;flex-shrink:0}
.space-pill:hover{border-color:var(--text-3);color:var(--text-1)}
.space-pill.active{border-color:currentColor;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.space-pill.all.active{background:var(--accent-soft);color:var(--accent-dark);border-color:var(--accent)}
.space-pill.me.active{background:var(--space-me-soft);color:var(--space-me);border-color:var(--space-me)}
.space-pill.shared.active{background:var(--space-shared-soft);color:var(--space-shared);border-color:var(--space-shared)}
.space-pill.companion.active{background:var(--space-comp-soft);color:var(--space-comp);border-color:var(--space-comp)}
@media(max-width:680px){
  .pill-full{display:none}
  .greet-side .g p{display:none}
  .greet-side .g h1{font-size:14.5px}
  .space-pill{padding:4px 8px;font-size:11px}
}
@media(max-width:520px){
  .greet{flex-wrap:wrap;gap:6px}
  .greet-side{flex:1}
  .space-filter-bar{order:3;width:100%;justify-content:flex-start}
}

/* Spaces Single Add Button */
.space-btn-add{width:100%;height:42px;border-radius:12px;background:var(--surface);border:1.5px dashed var(--border);font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:all .15s ease;margin-top:8px}
.space-btn-add.me{color:var(--space-me);border-color:rgba(48,138,101,.35);background:var(--space-me-soft)}
.space-btn-add.shared{color:var(--space-shared);border-color:rgba(59,130,246,.35);background:var(--space-shared-soft)}
.space-btn-add.comp{color:var(--space-comp);border-color:rgba(231,162,97,.35);background:var(--space-comp-soft)}
.space-btn-add:hover{filter:brightness(.96);transform:translateY(-1px)}
.space-mini-add-btn{width:32px;height:32px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);font-size:16px;font-weight:700;color:var(--text-1);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s}
.space-mini-add-btn:hover{background:var(--accent-soft);color:var(--accent-dark);border-color:var(--accent)}

/* Month and Week Calendars in Life Tracker */
.trk-month-cal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:14px}
.trk-cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.trk-cal-grid{width:100%}
.trk-cal-weekhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:6px}
.trk-cal-th{font-size:11.5px;font-weight:700;color:var(--text-3);padding:4px 0}
.trk-cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.trk-cal-day{aspect-ratio:1;border-radius:10px;background:var(--surface-2);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text-1);cursor:pointer;position:relative;transition:all .12s}
.trk-cal-day.empty{background:transparent;cursor:default;border:none}
.trk-cal-day:hover:not(.empty){background:var(--accent-soft);border-color:var(--accent-2)}
.trk-cal-day.today{border-color:var(--accent);font-weight:700}
.trk-cal-day.selected{background:var(--accent);color:#fff;font-weight:700}
.trk-cal-day.selected .trk-day-badge{background:#fff;color:var(--accent)}
.trk-day-badge{font-size:9.5px;font-weight:700;background:var(--accent);color:#fff;border-radius:6px;padding:1px 4px;margin-top:2px;line-height:1}
.trk-cal-day.has-data:not(.selected){background:var(--accent-verysoft);border-color:rgba(48,138,101,.2)}
.day-dot{width:4px;height:4px;border-radius:50%;margin-top:4px}

/* Horizontal Week Calendar */
.trk-week-wrap{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:14px}
.trk-week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;overflow-x:auto;padding-bottom:2px}
.trk-week-day-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;transition:all .12s}
.trk-week-day-btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.trk-week-day-btn.today{border-color:var(--accent);font-weight:700}
.trk-week-day-btn.selected{background:var(--accent);color:#fff;border-color:var(--accent)}
.trk-week-day-btn .w-name{font-size:11px;color:inherit;opacity:.85}
.trk-week-day-btn .w-num{font-size:14px;font-weight:700;color:inherit}
.trk-week-day-btn .w-badge{font-size:9.5px;padding:1px 5px;border-radius:6px;background:rgba(0,0,0,.08);color:inherit}
.trk-week-day-btn .w-badge.active{background:var(--accent-soft);color:var(--accent-dark);font-weight:700}
.trk-week-day-btn.selected .w-badge.active{background:#fff;color:var(--accent)}

/* Activity Screen Tabs */
.activity-subtabs{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;margin-bottom:14px;border:1px solid var(--border)}
.activity-subtab-btn{flex:1;padding:9px;border-radius:10px;font-size:13.5px;font-weight:700;text-align:center;cursor:pointer;color:var(--text-2);transition:all .15s}
.activity-subtab-btn.on{background:var(--surface);color:var(--text-1);box-shadow:0 2px 8px rgba(0,0,0,.08)}

/* Spaces Screen Grand Cards & Enhanced UI */
.space-realm-card{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:16px 16px 14px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.03);transition:transform .12s, box-shadow .12s}
.space-realm-card:hover{box-shadow:var(--shadow)}
.space-realm-me{border-inline-start:6px solid var(--space-me)}
.space-realm-shared{border-inline-start:6px solid var(--space-shared)}
.space-realm-comp{border-inline-start:6px solid var(--space-comp)}

.space-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.space-card-title-group{display:flex;align-items:center;gap:12px;min-width:0}
.space-card-avatar{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex:0 0 auto}
.space-card-name{font-size:16px;font-weight:800;color:var(--text-1);display:flex;align-items:center;gap:8px;line-height:1.2}
.space-card-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;display:inline-block}
.space-card-sub{font-size:11.5px;color:var(--text-3);margin-top:3px}

/* Space Gauge / Ring */
.space-ring-wrap{position:relative;width:58px;height:58px;flex:0 0 auto}
.space-ring-wrap svg{transform:rotate(-90deg)}
.space-ring-wrap .space-ring-lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.space-ring-wrap .space-ring-lbl small{font-size:9.5px;font-weight:600;color:var(--text-3);margin-top:2px}

/* Space Metric Chips */
.space-chips-wrap{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.space-stat-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:10px;font-size:12.5px;font-weight:600;border:1px solid transparent;user-select:none;white-space:nowrap;line-height:1.2}
.space-stat-chip .chip-ic{font-size:14px;line-height:1}
.space-stat-chip .chip-val{font-weight:800;font-size:13px}

/* Space Card Action Buttons */
.space-card-actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.space-btn-main{width:100%;height:44px;border-radius:12px;font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;padding:0 14px;cursor:pointer;border:1.5px solid;transition:all .15s;white-space:nowrap;box-sizing:border-box}
.space-btn-main:active{transform:scale(.99)}
.space-btn-main .btn-label{display:inline-flex;align-items:center;gap:7px}
.space-btn-main .btn-count{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px}
.space-btn-main .btn-arrow{font-size:16px;line-height:1;transition:transform .15s}
[dir="rtl"] .space-btn-main:hover .btn-arrow{transform:translateX(-3px)}

.space-quick-row{display:flex;gap:7px;width:100%;box-sizing:border-box}
.space-quick-btn{flex:1;min-width:0;height:38px;border-radius:10px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;border:1.2px solid;padding:0 8px;white-space:nowrap;transition:all .15s;box-sizing:border-box}
.space-quick-btn:active{opacity:.85;transform:scale(.98)}

/* Space Ownership Sheet Choices */
.space-choice-btn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);text-align:start;cursor:pointer;margin-bottom:8px;transition:all .15s}
.space-choice-btn.selected{border-width:2px}
.space-choice-me.selected{border-color:var(--space-me);background:var(--space-me-soft)}
.space-choice-shared.selected{border-color:var(--space-shared);background:var(--space-shared-soft)}
.space-choice-comp.selected{border-color:var(--space-comp);background:var(--space-comp-soft)}
.space-choice-icon{font-size:24px;flex:0 0 auto}
.space-choice-text{flex:1;min-width:0}
.space-choice-title{font-size:14.5px;font-weight:700;color:var(--text-1);margin-bottom:2px}
.space-choice-desc{font-size:11.5px;color:var(--text-2)}

/* Dashboard Grid & Tiles System */
.home-dash-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}
@media(min-width: 880px){
  .home-dash-grid {
    gap: 12px;
  }
}
.dash-card {
  border-radius: 20px;
  padding: 13px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 168px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  position: relative;
  box-sizing: border-box;
}
.dash-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0,0,0,0.06);
}
.dash-card:active {
  transform: scale(0.985);
}
.dash-card.dash-dragging {
  opacity: 0.55;
  transform: scale(1.03);
  box-shadow: 0 12px 30px rgba(0,0,0,0.18);
  border-style: dashed !important;
  cursor: grabbing !important;
}
.dash-card[draggable="true"] {
  cursor: grab;
}
.dash-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.dash-card-title {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}
.dash-card-emoji {
  font-size: 24px;
  line-height: 1;
  flex-shrink: 0;
}
.dash-card-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dash-unpin-btn {

/* ================= مولّد QR داخلي (byte mode, EC M, v1-10) — بلا مكتبات خارجية ================= */
const QR = (()=>{
  const EXP=new Uint8Array(512), LOG=new Uint8Array(256);
  (function(){ let x=1; for(let i=0;i<255;i++){ EXP[i]=x; LOG[x]=i; x<<=1; if(x&256) x^=0x11D; } for(let i=255;i<512;i++) EXP[i]=EXP[i-255]; })();

    for(let j=0;j<p.length;j++){ n[j]^=p[j]; n[j+1]^=mul(p[j],r); } p=n; } return p; }
  function rsEnc(data,deg){ const g=genPoly(deg), out=new Array(data.length+deg).fill(0);
    for(let i=0;i<data.length;i++){ out[i]=data[i]; }

    case 0: return (r+c)%2===0; case 1: return r%2===0; case 2: return c%3===0;
    case 3: return (r+c)%3===0; case 4: return (Math.floor(r/2)+Math.floor(c/3))%2===0;
    case 5: return ((r*c)%2+(r*c)%3)===0; case 6: return (((r*c)%2)+((r*c)%3))%2===0;
    default: return (((r+c)%2)+((r*c)%3))%2===0; } }
  function build(text){
    const bytes=new TextEncoder().encode(text);
    let ver=0;
    for(let v=1;v<=10;v++){ const cap=(rawModules(v)-BLK[v]*ECC[v])*8; const need=4+ (v<10?8:16) + bytes.length*8;

    const blocks=[], eccs=[];

    for(let b=0;b<nBlocks;b++){ const len=shortLen+(b < (cw.length%nBlocks)?1:0);

  }

    rest('GET','circles','owner_id=eq.'+me+'&select=*').catch(()=>[]),
  ]);
  const profile=profileArr[0]||null;
  const myCircleIds=[...new Set([...memberships.map(m=>m.circle_id), ...(myOwnedCircles||[]).map(c=>c.id)])];
  // المعالجة الذاتية: تسجيل المالك في circle_members فورًا إذا كان مفقودًا
  if(myOwnedCircles && myOwnedCircles.length){
    for(const oc of myOwnedCircles){
      if(!memberships.some(m=>m.circle_id===oc.id)){
        rest('POST','circle_members',{circle_id:oc.id,user_id:me,role:'OWNER'},'return=minimal').catch(()=>{});
      }
    }
  }
  if(!myCircleIds.length){ data={profile,circles:[],items:[],recipients:[],entries:[],tasks:[],sharedLists:[],shopping:[],activity:[],reactions:[],invites:[],comments:[]}; saveSnap(); return; }
  const inC='circle_id=in.('+myCircleIds.join(',')+')';
  const inC2='id=in.('+myCircleIds.join(',')+')';
  const owned=[]; // تُحسب بعد جلب الدوائر
  // جولة 2: كل الجداول الرئيسية بالتوازي (لا تعتمد على بعضها)
  const [circles,allMembers,items,tasks,sharedLists,activity,recycleBin,comments]=await Promise.all([
    rest('GET','circles',inC2+'&select=*'),
    rest('GET','circle_members',inC+'&select=*'),
    rest('GET','items',inC+'&order=created_at.desc&select=*'),
    rest('GET','tasks',inC+'&order=created_at.desc&select=*'),
    rest('GET','shared_lists',inC+'&select=*'),
    rest('GET','activity_events',inC+'&order=created_at.desc&limit=40&select=*'),
    rest('GET','recycle_bin',inC+'&order=deleted_at.desc&select=*').catch(()=>[]),
    rest('GET','comments',inC+'&order=created_at.asc&limit=300&select=*').catch(()=>[]),
  ]);
  const memberIds=[...new Set(allMembers.map(m=>m.user_id).filter(u=>u!==me))];
  const itemIds=items.map(i=>i.id), listIds=sharedLists.map(l=>l.id), evIds=activity.map(a=>a.id);
  const ownedIds=circles.filter(c=>c.owner_id===me).map(c=>c.id);
  // جولة 3: التوابع بالتوازي
  const [peerProfiles,recipients,entries,shopping,reactions,invitesRaw]=await Promise.all([
    memberIds.length?rest('GET','profiles','id=in.('+memberIds.join(',')+')&select=*'):[],
    itemIds.length?rest('GET','item_recipients','item_id=in.('+itemIds.join(',')+')&select=*'):[],
    itemIds.length?rest('GET','progress_entries','item_id=in.('+itemIds.join(',')+')&recorded_at=gte.'+daysAgoIso(30)+'&select=*'):[],
    listIds.length?rest('GET','shared_list_items','list_id=in.('+listIds.join(',')+')&order=position.asc&select=*'):[],
    evIds.length?rest('GET','reactions','event_id=in.('+evIds.join(',')+')&select=*'):[],
    ownedIds.length?rest('GET','circle_invites','circle_id=in.('+ownedIds.join(',')+')&revoked=eq.false&order=created_at.desc&select=*'):[],
  ]);
  const pById={}; peerProfiles.forEach(p=>pById[p.id]=p); pById[me]=profile;
  // ترحيل تلقائي: رموز منتهية أو بصيغة قديمة → تجديد
  let invites=invitesRaw||[];
  const staleInv=invites.filter(i=>!/^[0-9]{6}$/.test(i.code) || (new Date(i.expires_at) < new Date()));
  if(staleInv.length){
    for(const st of staleInv){
      try{
        await rest('PATCH','circle_invites',{revoked:true},'id=eq.'+st.id);
        await rest('POST','circle_invites',{id:uuid(),circle_id:st.circle_id,code:genCode(),created_by:me,expires_at:daysAgoIso(-7),revoked:false},'return=minimal');
      }catch(e){}
    }
    try{ invites=await rest('GET','circle_invites','circle_id=in.('+ownedIds.join(',')+')&revoked=eq.false&order=created_at.desc&select=*'); }catch(e){}
  }
  if(!profile){ const prev=loadSnap(); if(prev&&prev.profile) profile=prev.profile; }
  data={profile,circles:circles.map(c=>({circle:c,members:allMembers.filter(m=>m.circle_id===c.id).map(m=>({m,p:pById[m.user_id]||{id:m.user_id,display_name:'عضو',accent_theme:'green'}}))})),
    items,recipients,entries,tasks,sharedLists,shopping,activity,reactions,invites,recycleBin:recycleBin||[],comments:comments||[]};

  // تنظيف تلقائي للرسائل المستعجلة المنتهية (قاعدة الـ 3 أيام)
  const expiredUrgent = (tasks||[]).filter(t => t.priority === 'URGENT' && t.status !== 'DONE' && t.created_at && (Date.now() - new Date(t.created_at).getTime() >= URGENT_EXPIRY_MS));
  for(const eu of expiredUrgent){
    rest('PATCH','tasks',{status:'DONE'},'id=eq.'+eu.id).catch(()=>{});
  }

  saveSnap();
  try{ syncTrackerFromCloud(); }catch(e){}
  try{ checkWebIncomingArrivals(); }catch(e){}
  try{ syncNotes(); }catch(e){}
}

const URGENT_EXPIRY_MS = 3 * 24 * 60 * 60 * 1000;
function isUrgentActive(t){
  if(!t || t.priority !== 'URGENT' || t.status === 'DONE') return false;
  if(!t.created_at) return true;
  const age = Date.now() - new Date(t.created_at).getTime();
  return age < URGENT_EXPIRY_MS;
}

function getWebIncomingArrivals(){
  if(!data) return [];
  const me = meId();
  const lastSeen = localStorage.getItem('rafiq_last_seen_incoming') || '';
  const twoDaysAgo = new Date(Date.now() - 48*3600*1000).toISOString();
  const cutoff = (!lastSeen) ? new Date(Date.now() - 24*3600*1000).toISOString() : (lastSeen > twoDaysAgo ? lastSeen : twoDaysAgo);

  const list = [];
  // 1) رسائل مستعجلة من الرفيق
  (data.tasks || []).filter(t => t.priority === 'URGENT' && t.owner_id !== me && isUrgentActive(t) && (t.created_at || '') > cutoff)
    .forEach(t => {
      list.push({ id: t.id, type: 'urgent', emoji: '🚨', title: t.title, subtitle: 'رسالة مستعجلة من ' + (nameOf(t.owner_id)||'رفيقك'), time: relAr(t.created_at), act: 'openUrgent' });
    });

  // 2) تذكيرات موجهة لي
  (data.tasks || []).filter(t => t.priority === 'REMINDER' && (t.assigned_to === me || t.visibility === 'CIRCLE') && t.owner_id !== me && t.status !== 'DONE' && (t.created_at || '') > cutoff)
    .forEach(t => {
      list.push({ id: t.id, type: 'remind', emoji: '🔔', title: t.title, subtitle: 'تذكير موجه إليك من ' + (nameOf(t.owner_id)||'رفيقك'), time: relAr(t.created_at), act: 'openReminders' });
    });

  // 3) أماكن جديدة محفوظة
  const pl = (typeof placesOf === 'function') ? placesOf() : {items:[]};
  (pl.items || []).filter(p => (p.owner_id && p.owner_id !== me) && (p.created_at || '') > cutoff)
    .forEach(p => {
      list.push({ id: p.id, type: 'places', emoji: '📍', title: p.title, subtitle: 'مكان محفوظ جديد', time: relAr(p.created_at), act: 'openPlaces' });
    });

  // 4) مقاطع جديدة
  const med = (typeof mediaOf === 'function') ? mediaOf() : {items:[]};
  (med.items || []).filter(m => (m.owner_id && m.owner_id !== me) && (m.created_at || '') > cutoff)
    .forEach(m => {
      list.push({ id: m.id, type: 'media', emoji: '🎬', title: m.title, subtitle: 'مقطع أو رابط جديد', time: relAr(m.created_at), act: 'openMedia' });
    });

  // 5) إشارات مرجعية جديدة
  const bm = (typeof bookmarksOf === 'function') ? bookmarksOf() : {items:[]};
  (bm.items || []).filter(b => (b.owner_id && b.owner_id !== me) && (b.created_at || '') > cutoff)
    .forEach(b => {
      list.push({ id: b.id, type: 'bookmarks', emoji: '🔖', title: b.title, subtitle: 'إشارة مرجعية جديدة', time: relAr(b.created_at), act: 'openBookmarks' });
    });

  // 6) عناصر تسوق جديدة
  const shop = (typeof shoppingFor === 'function') ? shoppingFor() : null;
  (shop ? shop.items : []).filter(s => (s.owner_id && s.owner_id !== me) && !s.completed && (s.created_at || '') > cutoff)
    .slice(0, 3)
    .forEach(s => {
      list.push({ id: s.id, type: 'shopping', emoji: '🛒', title: s.title, subtitle: 'عنصر تسوق جديد', time: relAr(s.created_at), act: 'openShopping' });
    });

  return list;
}

function getWebTrashItems(){
  const base = (data && data.recycleBin) ? [...data.recycleBin] : [];
  const baseOrigIds = new Set(base.map(x => x.original_id));
  const trashList = (data && data.sharedLists || []).find(l => l.title === '__سلة المحذوفات__');
  if(trashList){
    const legacyShop = (data.shopping || []).filter(s => s.list_id === trashList.id);
    for(const ls of legacyShop){
      if(!baseOrigIds.has(ls.id)){
        const note = ls.note || '';
        const parts = note.split('|');
        const origListId = parts[0] === 'TRASH' ? parts[1] : null;
        const actualNote = parts[0] === 'TRASH' ? parts.slice(2).join('|') : note;
        const origList = origListId ? (data.sharedLists || []).find(l => l.id === origListId) : null;
        const isPlace = origList && origList.title === 'أماكننا المحفوظة';
        const isFood = origList && (origList.title === 'طعامنا اليومي' || origList.title === 'أطباق نحبها');
        const itemType = isPlace ? 'place' : (isFood ? 'food' : 'shopping');
        base.push({
          id: ls.id,
          circle_id: trashList.circle_id,
          user_id: null,
          item_type: itemType,
          original_id: ls.id,
          title: ls.title,
          subtitle: origList ? origList.title : (isPlace ? 'أماكننا المحفوظة' : 'عنصر تسوق'),
          payload: { legacy_trash: true, id: ls.id, list_id: origListId, note: actualNote, title: ls.title },
          deleted_at: ls.created_at || new Date().toISOString()
        });
      }
    }
  }
  return base.sort((a,b) => new Date(b.deleted_at||0) - new Date(a.deleted_at||0));
}

async function moveToTrash(itemType, originalId, title, subtitle, payload){

    circle_id: cid,
    user_id: me,
    item_type: itemType,
    original_id: originalId,
    title: (title || '').trim(),
    subtitle: subtitle || null,
    payload: payload || {},
    deleted_at: new Date().toISOString()
  }).catch(e => console.warn('moveToTrash failed', e));
}

async function restoreTrashItem(trashId){
  const items = getWebTrashItems();
  const item = items.find(x => x.id === trashId || x.original_id === trashId);
  if(!item) return;

  const payload = item.payload || {};
  if(payload.legacy_trash){
    const origListId = payload.list_id;
    const actualNote = payload.note || null;
    let targetListId = origListId;
    if(!targetListId && item.item_type === 'place'){
      const pl = placesOf();
      targetListId = pl ? pl.id : null;
    }
    if(targetListId){
      await rest('PATCH', 'shared_list_items', { list_id: targetListId, note: actualNote }, 'id=eq.'+item.id);
    }
    await refreshAll();
    openTrashSheet();
    toast('تمت استعادة «' + esc(item.title) + '» بنجاح ✓');
    return;
  }

  const type = (item.item_type || '').toLowerCase();
  if(type === 'place'){
    const pl = placesOf();
    const listId = pl ? pl.id : (payload.list_id || curCircleId());
    await rest('POST', 'shared_list_items', {
      id: item.original_id || uuid(),
      list_id: listId,
      title: item.title,
      note: payload.note || item.subtitle || '',
      completed: false,
      position: 0
    });
  } else if(type === 'shopping' || type === 'food'){
    let targetListId = payload.list_id;
    if(!targetListId){
      const l = (data.sharedLists || []).find(x => x.title === (type === 'food' ? 'طعامنا اليومي' : 'التسوق'));
      targetListId = l ? l.id : (data.sharedLists[0] ? data.sharedLists[0].id : null);
    }
    await rest('POST', 'shared_list_items', {
      id: item.original_id || uuid(),
      list_id: targetListId,
      title: item.title,
      note: payload.note || null,
      completed: false,
      position: 0
    });
  } else if(type === 'task'){
    await rest('POST', 'tasks', {
      id: item.original_id || uuid(),
      circle_id: item.circle_id || curCircleId(),
      owner_id: payload.owner_id || meId(),
      title: item.title,
      description: payload.description || null,
      due_at: payload.due_at || null,
      priority: payload.priority || 'NORMAL',
      status: payload.status || 'TODO',
      visibility: payload.visibility || 'PRIVATE',
      assigned_to: payload.assigned_to || null
    });
  } else if(['habit', 'medication', 'media', 'mood'].includes(type)){
    await rest('POST', 'items', {
      id: item.original_id || uuid(),
      circle_id: item.circle_id || curCircleId(),
      owner_id: payload.owner_id || meId(),
      type: payload.type || type.toUpperCase(),
      title: item.title,
      description: payload.description || null,
      frequency: payload.frequency || 'DAILY',
      unit: payload.unit || null,
      target_value: payload.target_value || null,
      status: 'ACTIVE',
      visibility: payload.visibility || 'CIRCLE'
    });
  } else if(type === 'tracker_entry'){
    await rest('POST', 'tracker_entries', {
      id: item.original_id || uuid(),
      user_id: meId(),
      category_id: payload.category_id,
      note: payload.note || null,
      started_at: payload.started_at || null,
      ended_at: payload.ended_at || null,
      logged_at: payload.logged_at || new Date().toISOString()
    });
  }

  await rest('DELETE', 'recycle_bin', 'id=eq.'+item.id).catch(()=>{});
  await refreshAll();
  openTrashSheet();
  toast('تمت استعادة «' + esc(item.title) + '» بنجاح ✓');
}

async function purgeTrashItem(trashId){
  const items = getWebTrashItems();
  const item = items.find(x => x.id === trashId || x.original_id === trashId);
  if(!item) return;
  if(item.payload && item.payload.legacy_trash){
    await rest('DELETE', 'shared_list_items', 'id=eq.'+item.id).catch(()=>{});
  } else {
    await rest('DELETE', 'recycle_bin', 'id=eq.'+item.id).catch(()=>{});
  }
  await refreshAll();
  openTrashSheet();
  toast('حُذف نهائياً');
}

function isSpecialItem(it){ const f=it.frequency||''; return f.startsWith('MED|')||f.startsWith('MOOD|'); }
function habitsFor(uid){ return data?data.items.filter(i=>i.owner_id===uid&&['HABIT','QURAN','BOOK','LEARNING','GOAL'].includes(i.type)&&!isSpecialItem(i)):[]; }
function habitProg(uid,item){
  const today=new Date().toDateString();
  const v=data.entries.filter(e=>e.item_id===item.id&&e.user_id===uid&&new Date(e.recorded_at).toDateString()===today).reduce((s,e)=>s+(+e.value||0),0);
  const bin=item.target_value==null;
  return {v,bin,done: bin? v>0 : v>=(+item.target_value||0), pct: bin? (v>0?100:0) : Math.min(100,Math.round(v/(+item.target_value||1)*100))};
}
function dailyPct(uid){
  const hs=habitsFor(uid).filter(i=>i.visibility==='CIRCLE'||i.owner_id===uid);
  if(!hs.length) return 0;
  const done=hs.filter(i=>habitProg(uid,i).done).length;
  return Math.round(done/hs.length*100);
}
function isHabitDoneToday(itemId){
  try{
    if(!data || !data.items || !data.entries) return false;
    const it = data.items.find(x => x.id === itemId);
    if(!it) return false;
    return habitProg(meId(), it).done;
  }catch(e){ return false; }
}
window.isHabitDoneToday = isHabitDoneToday;
function commentCount(itemId){
  try{
    if(!data || !data.comments) return 0;
    return data.comments.filter(c => c.parent_id === itemId).length;
  }catch(e){ return 0; }
}
window.commentCount = commentCount;
function visibleTasks(){
  const me=meId();
  return (data?data.tasks:[]).filter(t=>{
    if(t.owner_id===me) return true;
    if(t.circle_id==='personal') return false;
    if(t.visibility==='PRIVATE') return false;
    if(t.visibility==='CIRCLE') return true;
    if(t.visibility==='SELECTED_MEMBERS') return t.owner_id===me||(t.recipients||[]).includes(me);
    return false;
  });
}

async function signUp(email,password,displayName,accent){
  try{
    const res=await fetch(CFG.url+'/auth/v1/signup',{method:'POST',
      headers:{'apikey':CFG.key,'Content-Type':'application/json'},
      body:JSON.stringify({email,password,data:{display_name:displayName,accent_theme:accent}})});
    const d=await res.json();
    if(!res.ok) return {ok:false,msg:d.msg||d.error_description||('HTTP '+res.status)};
    if(d.access_token){ session={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||3600)*1000,user:d.user}; saveSession(); return {ok:true}; }
    return {ok:false,mode:'confirm_email',msg:''};
  }catch(e){ return {ok:false,msg:'تعذر الاتصال — تحقق من الإنترنت'}; }
}
async function signIn(email,password){
  try{
    const res=await fetch(CFG.url+'/auth/v1/token?grant_type=password',{method:'POST',
      headers:{'apikey':CFG.key,'Content-Type':'application/json'},
      body:JSON.stringify({email,password})});
    const d=await res.json();
    if(!res.ok) return {ok:false,msg:d.error_description||d.msg||('HTTP '+res.status)};
    session={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||3600)*1000,user:d.user};
    saveSession(); return {ok:true};
  }catch(e){ return {ok:false,msg:'تعذر الاتصال — تحقق من الإنترنت'}; }
}
async function signOut(){ try{ await sb('/auth/v1/logout',{method:'POST'},true); }catch(e){}

function askNotify(){
  try{ if(('Notification' in window) && Notification.permission==='default') Notification.requestPermission(); }catch(e){}
}
let lastNotified=0;
try{ lastNotified=parseInt(localStorage.getItem('rafiq_last_notified')||'0',10)||0; }catch(e){}
function checkNotify(){
  try{
    if(!('Notification' in window) || Notification.permission!=='granted' || !data) return;
    const reminders=(data.tasks||[]).filter(t=>t.priority==='REMINDER'&&t.assigned_to===meId()&&t.status!=='DONE');
    const now=Date.now();
    for(const r of reminders){
      const ts=new Date(r.created_at||0).getTime()||0;
      if(ts>lastNotified){ try{ new Notification('🔔 '+(r.title||'تذكير'),{body:'تذكير من رفيقك',tag:'rem-'+r.id}); }catch(e){} }
    }
    for(const e of eventsOf()){
      const d=e.due_at? new Date(e.due_at).getTime():0;
      if(d>now && d-now<2*3600*1000 && d>lastNotified){ try{ new Notification('📅 '+(e.title||'موعد'),{body:'موعدك بعد قليل',tag:'ev-'+e.id}); }catch(e2){} }
    }
    // أدوية لم تكتمل جرعاتها اليوم
    try{
      for(const m of medsOf()){
        if(!m.activeToday()) continue;
        const lg=medLogged(m); if(Math.round(lg)>=m.perDay) continue;
        const key='med_notified_'+m.item.id;
        const last=parseInt(localStorage.getItem(key)||'0',10)||0;
        if(now-last>2*3600*1000){
          try{ new Notification('💊 دواء: '+m.item.title,{body:'بقي '+(m.perDay-Math.round(lg))+' من '+m.perDay+' جرعة اليوم',tag:key}); }catch(e){}
          try{ localStorage.setItem(key,String(now)); }catch(e){}
        }
      }
    }catch(e){}
    lastNotified=now; try{ localStorage.setItem('rafiq_last_notified',String(now)); }catch(e){}
  }catch(e){}
}

function askGeo(){
  try{ if(navigator.geolocation) navigator.geolocation.getCurrentPosition(function(){}, function(){}, {timeout:6000}); }catch(e){}
}
